<div class="speech-record" data-speech-recorder>
  <div class="speech-actions">
    <button type="button" class="btn btn-quiet btn-small" data-speech-record>Записать себя</button>
    <button type="button" class="btn btn-quiet btn-small" data-speech-stop hidden>Остановить</button>
    <button type="button" class="btn btn-quiet btn-small" data-speech-delete hidden>Удалить запись</button>
  </div>
  <p class="drill-hint">Запись не отправляется на сервер.</p>
  <audio controls data-speech-playback hidden aria-label="Запись вашей речи"></audio>
  <p data-speech-record-status role="status" aria-live="polite"></p>
</div>
