# Среда разработки: Python 3.13 + uv, Node 24 + pnpm, PostgreSQL 16 для тестов на «боевом» движке.
# Сайт локально по-прежнему работает на SQLite (db.sqlite3); PostgreSQL нужен для
# TEST_DATABASE_URL — тех же тестов, что задача postgres в CI.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.13
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/ee_test
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ee_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - devcontainer-pg:/var/lib/postgresql/data

volumes:
  devcontainer-pg:
