name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -q
      - run: node --test tests/js/audio-player.test.cjs tests/js/cafe-lab.test.cjs tests/js/a1-active.test.cjs tests/js/a1-active-browser.test.cjs tests/js/speech-studio.test.cjs tests/js/speech-studio-browser.test.cjs tests/js/speech-review.test.cjs tests/js/speech-review-browser.test.cjs tests/js/speech-shadowing.test.cjs tests/js/speech-stress.test.cjs tests/js/a1-learning-route.test.cjs
      - run: |
          uv run python manage.py migrate -v0
          uv run python manage.py load_content
          uv run python manage.py audit_course
