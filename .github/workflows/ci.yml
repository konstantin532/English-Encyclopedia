name: CI
on: [push, pull_request]
permissions:
  contents: read
# Pushing many rapid commits should not leave dozens of obsolete pipelines
# competing with the newest one. Preserve the definitive main check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --frozen
      - run: uv run python -m compileall -q apps config tests
      - run: uv run python manage.py check
      # Exercise static asset discovery and provide the WhiteNoise directory
      # before any Django test client request initializes middleware.
      - run: uv run python manage.py collectstatic --noinput --verbosity 0
      # Diagnostic only: missing voices do not become a false human approval.
      - run: uv run python scripts/audio_readiness.py
      - run: uv run python scripts/audit_cefr_evidence.py --strict
      - run: uv run python manage.py makemigrations --check --dry-run
      # Validate every authored delayed-review card before running the slower suite.
      - run: |
          uv run python manage.py shell -c "from apps.learning.mistake_review import question_bank; b=question_bank(); assert len(b)==28; assert sum(len(v) for v in b.values())==163; assert sum(len(q) for v in b.values() for q in v.values())==815; print('A1 review bank: 28 lessons, 163 exercises, 815 questions')"
      # Fail before the slower suite when a beginner explanation or open
      # independent task violates one of the 15 educational data contracts.
      - run: |
          uv run python manage.py shell -c "from apps.learning.understanding import understanding_bank; b=understanding_bank(); assert len(b)==28; assert sum(len(x['tasks']) for x in b.values())==112; print('A1 clarity: 28 guides, 112 no-options tasks, 15 structural checks')"
      - run: uv run pytest -q
      - run: node --test tests/js/*.test.cjs
      - run: |
          uv run python manage.py migrate -v0
          uv run python manage.py load_content
          uv run python manage.py audit_course
