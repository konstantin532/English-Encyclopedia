name: Visual review
# Скриншоты ключевых страниц до/после PR, разница по пикселям и проверка,
# что главное содержание не уехало с первых экранов. Отчёт — комментарий в PR
# и артефакт visual-review (index.html со всеми сравнениями).
on:
  pull_request:
    paths: ['static/**', 'templates/**', 'apps/**', 'content/**', 'config/**',
            'scripts/visual_review*', 'tests/js/visual-review.test.cjs', '.github/workflows/visual-review.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: uv sync --frozen
      - name: Prepare browser and the "before" checkout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/vr-browser" --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/vr-browser/node_modules/.bin/playwright" install --with-deps chromium
          BASE="$BASE_SHA"
          if [ -z "$BASE" ]; then
            git fetch --no-tags origin main
            BASE="$(git rev-parse FETCH_HEAD)"
          fi
          git worktree add --detach "$RUNNER_TEMP/vr-before" "$BASE"
      - name: Seed the before database from the base checkout
        working-directory: ${{ runner.temp }}/vr-before
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/vr-before.sqlite3
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" manage.py migrate --noinput
          "$GITHUB_WORKSPACE/.venv/bin/python" manage.py load_content
      - name: Seed the after database from the PR checkout
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/vr-after.sqlite3
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py load_content
      - name: Screenshots and comparison
        env:
          ATLAS_BEFORE_DATABASE_URL: sqlite:///${{ runner.temp }}/vr-before.sqlite3
          ATLAS_AFTER_DATABASE_URL: sqlite:///${{ runner.temp }}/vr-after.sqlite3
        run: |
          ATLAS_PYTHON="$PWD/.venv/bin/python" ATLAS_BEFORE_DIR="$RUNNER_TEMP/vr-before" NODE_PATH="$RUNNER_TEMP/vr-browser/node_modules" node scripts/visual_review.cjs
      - name: Job summary
        if: ${{ !cancelled() && hashFiles('visual-review/summary.md') != '' }}
        run: cat visual-review/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('visual-review/summary.md') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-review -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@visual-review/summary.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@visual-review/summary.md > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-review
          path: visual-review/
          retention-days: 14
