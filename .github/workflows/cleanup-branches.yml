name: Cleanup merged branches
# Удаляет ветки, которые целиком уже есть в main (0 своих коммитов) и не имеют открытого PR.
# Ничего не теряется: всё содержимое таких веток уже в main. main и situation-weeks не трогаются.
on:
  schedule:
    - cron: "41 4 * * 1"   # понедельник, 07:41 по Москве
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, что будет удалено"
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Delete fully merged branches
        run: |
          set -euo pipefail
          open_heads=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          deleted=0; kept=0
          while read -r branch; do
            case "$branch" in main|situation-weeks|"") continue ;; esac
            if printf '%s\n' "$open_heads" | grep -qxF "$branch"; then kept=$((kept+1)); continue; fi
            enc=$(printf '%s' "$branch" | jq -sRr @uri)
            ahead=$(gh api "repos/$REPO/compare/main...$enc" --jq '.ahead_by')
            if [ "$ahead" = "0" ]; then
              if [ "$DRY_RUN" = "true" ]; then echo "would delete: $branch"
              else gh api -X DELETE "repos/$REPO/git/refs/heads/$enc" && echo "deleted: $branch"; fi
              deleted=$((deleted+1))
            else
              kept=$((kept+1))
            fi
          done < <(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name')
          echo "Удалено (или к удалению): $deleted, оставлено: $kept" | tee -a "$GITHUB_STEP_SUMMARY"
