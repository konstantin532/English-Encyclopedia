questions:
- q: Где происходит история?
  a: This is my new house. — В новом доме Анны, среди коробок.
- q: Чья большая коробка?
  a: It is not my box. — Не Анны. И не Тома.
- q: Что в коробке?
  a: It is a cat! — Кот. И он сразу пьёт кофе Анны.
- q: В чём шутка в конце?
  a: Том говорит «It is not your box!», а Анна отвечает «It is my cat. My Box.» Коробка была не её, а кот — теперь её.
