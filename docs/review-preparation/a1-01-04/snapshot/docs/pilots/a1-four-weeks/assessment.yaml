        text: "[O4]Yes[/], [T8]I[/] [D1]am[/]. [T8]I[/] [D1]am[/] [J4]busy[/] [P1]at[/] [S2]home[/]."
        spoken: "[O4]Yes[/], [T8]I[/] [D1]am[/]. [T8]I[/][D1]'m[/] [J4]busy[/] [P1]at[/] [S2]home[/]."
      - speaker: mia
        text: "[D1]Have[/] [T1]a[/] [J3]nice[/] [S7]day[/], [S1]Anna[/]!"
    questions:
      - prompt_ru: "Как зовут девушку, которая здоровается первой?"
        accepted_ru: ["Мия", "Mia"]
      - prompt_ru: "Откуда Анна?"
        accepted_ru: ["из России"]
      - prompt_ru: "Занята ли Анна?"
        accepted_ru: ["да", "да, она занята дома"]
    oral:
      prompt_ru: "Ведущий знакомится с вами. Поздоровайтесь, назовите своё имя, скажите, откуда вы, и спросите его имя."
      cues_ru: ["приветствие", "My name is … / I am from …", "What is your name?"]
