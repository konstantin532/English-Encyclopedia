# Контрольный пакет пилота A1 (четыре недели). Материал ведущего: в базу не загружается.
# Ученик не видит транскрипт и ключи до конца попытки. Слушает дважды, без текста и перевода.
# weekly — после каждой недели; forms — параллельные формы до курса (pre), после (post) и через 7 дней (delayed).
# Во всех разговорах только слова, известные к max_week. Ответы ведущий принимает по смыслу, на русском.
level: A1
weekly:
  - id: w01
    max_week: 1
    script:
      - speaker: mia
        emotion: happy
        text: "[J3]Good[/] [S7]morning[/]! [T3]My[/] [S9]name[/] [D1]is[/] [S1]Mia[/]."
      - speaker: anna
        text: "[J3]Good[/] [S7]morning[/], [S1]Mia[/]! [T8]I[/] [D1]am[/] [S1]Anna[/]. [T8]I[/] [D1]am[/] [P2]from[/] [S4]Russia[/]."
