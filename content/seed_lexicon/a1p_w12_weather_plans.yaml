- uid: LX-00895
  lemma: enough
  meaning: as much as you need
  class: A5
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /ɪˈnʌf/
  translation_ru: достаточно
  example_en: '[T8]It[/] [D1]is[/] [X1]not[/] [J2]warm[/] [A5]enough[/].'
  example_ru: Недостаточно тепло.
  situation: Говорите о погоде
  usage_note: 'С прилагательным enough ставим после него: warm enough — достаточно тёплый. С существительным обычный порядок обратный: enough time — достаточно времени. Сравните: warm enough, но enough water. gh = «ф»: «инАф».'
  typical_error: '«enough warm» — неверно. Нужно: warm enough.'
