- uid: LX-00511
  lemma: must
  meaning: a word that says something is very necessary or is a rule
  class: D7
  grammar_features:
  - modal
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /mʌst/
  translation_ru: должен, нужно (обязательно)
  example_en: '[T8]You[/] [D7]must[/] [X1]not[/] [D1]be[/] [J2]late[/]!'
  example_ru: Ты не должна опаздывать!
  situation: Говорите о правилах на работе
  usage_note: 'После must глагол без to: you must come. must not (mustn''t) — «нельзя».'
  typical_error: '«You must to come» — лишнее to. Нужно: You must come.'
