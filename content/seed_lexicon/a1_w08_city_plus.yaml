- uid: LX-00338
  lemma: between
  meaning: "in the space separating things"
  class: P1
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /bɪˈtwin/
  translation_ru: между
  example_en: '[T1]The[/] [S2]key[/] [S4]shop[/] [D1]is[/] [P1]between[/] [T1]the[/] [S4]bank[/] [C1]and[/] [T1]the[/] [S4]hotel[/].'
  example_ru: Мастерская между банком и гостиницей.
  situation: Объясняете, где что находится
