- uid: LX-00340
  lemma: across from
  meaning: "on the opposite side from someone or something"
  class: P9
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /əˈkrɔs frəm/
  translation_ru: напротив
  example_en: '[T1]The[/] [S4]bank[/] [D1]is[/] [P9]across from[/] [T1]the[/] [S4]school[/].'
  example_ru: Банк напротив школы.
  situation: Объясняете, где что находится
  usage_note: "Across from — естественное американское «напротив», в том числе через дорогу или стол. Opposite тоже употребляется в американском английском; в этом уроке учим across from."
  unit_type: phrase
- uid: LX-00341
