  example_en: '[D7]Can[/] [T8]you[/] [D2]help[/] [T8]him[/]?'
  example_ru: Можете ему помочь?
  situation: Говорите о мужчине после глагола или предлога
  usage_note: 'he → him: «он» → «его, ему». В быстрой речи h часто пропадает: «хэлп им».'
- uid: LX-00342
