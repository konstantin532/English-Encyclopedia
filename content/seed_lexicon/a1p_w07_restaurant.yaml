# Неделя 7 A1+ «Ужин в ресторане»: some / any, исчисляемые и неисчисляемые. CEFR не сверялся.
level: A1+
week: 7
units:
- uid: LX-00733
  lemma: any
  meaning: some, in questions and with not
  class: T4
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /ˈɛni/
  translation_ru: какой-нибудь, сколько-нибудь; никакой (с not)
  example_en: '[D1]Is[/] [T9]there[/] [T4]any[/] [S3]fish[/]?'
  example_ru: Есть рыба?
  situation: Спрашиваете в ресторане
  usage_note: 'Когда количество не названо, some обычно встречается в утверждении, а any — в нейтральном вопросе о наличии и в отрицании: Is there any fish? We do not have any fish. Но в просьбах и предложениях тоже бывает some: Can I have some bread? Выбирайте по смыслу, а не только по вопросительному знаку.'
  typical_error: 'Для смысла «у нас совсем нет рыбы» скажите We do not have any fish. Правило не означает, что some запрещено во всех вопросах или отрицаниях: у других употреблений другой смысл.'
