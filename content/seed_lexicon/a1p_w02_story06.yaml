level: A1+
week: 2
units:
- uid: LX-00501
  lemma: yesterday
  meaning: on the day before today
  class: A2
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /ˈjɛstɚˌdeɪ/
  translation_ru: вчера
  example_en: '[A2]Yesterday[/] [T8]I[/] [D1]was[/] [P1]at[/] [S2]home[/].'
  example_ru: Вчера я был дома.
  situation: Рассказываете, что было вчера
  usage_note: 'Ставится в начало или в конец фразы: Yesterday I was at home. / I was at home yesterday.'
- uid: LX-00502
  lemma: see
  meaning: to notice something with your eyes
  class: D6
  forms:
  - sees
  - saw
  - seeing
  grammar_features:
  - irregular
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /si/
  translation_ru: видеть
  example_en: '[T8]I[/] [D6]saw[/] [T1]a[/] [S1]man[/] [P1]in[/] [T1]the[/] [S2]window[/].'
