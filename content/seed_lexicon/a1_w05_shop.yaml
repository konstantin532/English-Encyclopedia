  situation: Покупаете продукты
  usage_note: Перед egg — an — an egg.
- uid: LX-00111
  lemma: food
  meaning: things that people and animals eat
  class: S3
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /fud/
  translation_ru: еда; корм
  example_en: '[D1]Is[/] [T9]there[/] [S6]cat[/] [S3]food[/]?'
  example_ru: Есть корм для кошек?
  situation: Покупаете корм для питомца
  usage_note: 'cat food — «кошачья еда», корм. Первое слово говорит, для кого или из чего.'
- uid: LX-00112
  lemma: there
  meaning: used with be to say that something exists
  class: T9
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /ðɛr/
  translation_ru: (есть, имеется — в оборотах there is, there are)
  example_en: '[T9]There[/] [D1]is[/] [S3]milk[/].'
  example_ru: Есть молоко.
  situation: Говорите, что где-то что-то есть
  usage_note: 'В there is слово there не переводят как «там»: оно только открывает фразу «есть, имеется».'
- uid: LX-00113
  lemma: some
  meaning: a number of, an amount of
  class: T4
  cefr: unverified
  verification_status: pending
  frequency_source: NGSL — требует проверки
  ipa_us: /sʌm/
  ipa_ru: сам
  translation_ru: "некоторое количество; несколько (точное число не названо)"
  example_en: '[D7]Can[/] [T8]I[/] [D1]have[/] [T4]some[/] [S3]apples[/], [O8]please[/]?'
  example_ru: Можно мне яблок?
  situation: Просите продукт, не уточняя точное количество
  usage_note: 'Без ударения — /səm/. Some не сообщает точное количество и само по себе не означает обязательно маленькую порцию.'
- uid: LX-00114
