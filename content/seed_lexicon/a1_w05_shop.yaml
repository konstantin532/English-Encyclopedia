- uid: LX-00118
  lemma: Can I help you?
  meaning: A shop worker offers help
  class: D7
  unit_type: phrase
  cefr: unverified
  verification_status: pending
  ipa_us: /kən aɪ ˈhɛlp ju/
  translation_ru: Чем могу помочь?
  example_en: Can I help you?
  example_ru: Чем могу помочь?
  situation: Магазин у дома
  usage_note: Так встречают покупателя. Ответ — Yes, please или No, thank you.
- uid: LX-00119
  lemma: Is there milk?
