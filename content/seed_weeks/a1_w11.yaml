can_do_ru: "Я смогу объяснить врачу, что у меня болит (I have a headache, my back hurts), сказать, чего не могу (I can't sleep), и понять простой совет."
mission_ru: "Представьте, что вы у врача. Скажите вслух по-английски три фразы: I have a… My … hurts. I can't… Потом спросите кого-нибудь: How are you?"
