story_beat:
  intro_ru: "В понедельник утром у Тома болит голова. Анна отправляет его к врачу."
  outcome_ru: "Голова болит не каждый день, зато болит спина, и Том плохо спит. Врач советует гулять каждый день, пить воду и не сидеть ночью за компьютером."
  next_hook_ru: "Вечером Том заглядывает в старый почтовый ящик. Там что-то белое."
