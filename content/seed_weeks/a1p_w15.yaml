story_beat:
  intro_ru: Вечер пятницы. Завтра в семь утра у Анны и Тома рейс к океану — они снимают домик на неделю.
  outcome_ru: Если пойдёт дождь — будут читать в домике, если солнце — пойдут на пляж. Чемодан Тома слишком тяжёлый, а гитара остаётся дома, к радости Лео. Лео присмотрит за квартирой.
  next_hook_ru: Отпуск закончился. Анна, Том и друзья собираются на пикник — если не будет дождя. История 11.
