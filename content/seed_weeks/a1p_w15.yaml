# A1+, неделя 15 «Сборы в путешествие». Сфера travel, if + will.
level: A1+
week: 15
can_do_ru: 'Я смогу говорить о планах при условии: If it rains, we''ll stay in the cabin. If it''s sunny, we''ll go to the beach. — и собраться в поездку: passport, boarding pass, suitcase.'
mission_ru: 'Составьте по-английски план на выходные с двумя условиями: If it''s sunny, I''ll… If it rains, I''ll… — и добавьте, что вы обязательно возьмёте с собой.'
