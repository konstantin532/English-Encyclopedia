twister:
  number: 14
  series: sounds
  text: '[T1]A[/] [J2]black[/] [S2]bag[/] [P3]on[/] [T1]the[/] [S4]bus[/], [T1]a[/] [J2]black[/] [S2]hat[/] [P3]on[/] [T1]the[/] [S4]bus[/]. [D4]Stop[/] [T1]the[/] [S4]bus[/]!'
  ru: Чёрная сумка в автобусе, чёрная шляпа в автобусе. Остановите автобус!
  ipa: /ə ˈblæk ˈbæɡ ɑn ðə ˈbʌs | ə ˈblæk ˈhæt ɑn ðə ˈbʌs | ˈstɑp ðə ˈbʌs/
  focus_sounds:
  - ae
  source: original
  goal_ru: 'Три разные «а», которые русскому уху кажутся одной: /æ/ (black, bag, hat), /ʌ/ (bus), /ɑ/ (on, stop).'
  tip_ru: 'Сравните гласные по IPA: /æ/ в black — передний почти открытый звук; /ʌ/ в bus — центральный, без округления губ; /ɑ/ в stop — открытый задний. Русские «а» и «э» дают лишь приблизительную опору. Длительность зависит от ударения и соседних звуков; не различайте эти гласные только по длине.'
  warmup:
  - '[J2]black[/], [S4]bus[/], [S4]stop[/]'
  - '[T1]a[/] [J2]black[/] [S2]bag[/] [P3]on[/] [T1]the[/] [S4]bus[/]'
  - '[T1]A[/] [J2]black[/] [S2]bag[/] [P3]on[/] [T1]the[/] [S4]bus[/], [T1]a[/] [J2]black[/] [S2]hat[/] [P3]on[/] [T1]the[/] [S4]bus[/].'
  - '[D1]Does[/] [T2]this[/] [S4]bus[/] [D4]go[/] [P2]to[/] [S4]Park[/] [S4]Street[/]?'
  target_line: Does this bus go to Park Street?
  own_ru: 'Спросите, идёт ли автобус до вашей остановки: Does this bus go to…?'
