level: A1
week: 14
can_do_ru: "Я смогу сам проехать на автобусе: спросить, идёт ли он до нужной остановки, купить билет, узнать цену и время обратного автобуса, описать погоду и выбрать вещи для поездки. И собрать вместе всё, что умею на A1."
mission_ru: "Представьте поездку по своему городу. Скажите вслух по-английски: Does this bus go to…? How much is a ticket? What time is the next bus? Потом расскажите о себе пятью фразами из разных недель."
chunks: [LX-00255, LX-00256, LX-00257, LX-00258, LX-00176]
story_beat:
  intro_ru: "После урока русского Анна и Том садятся в автобус до Park Street — это слова с обратной стороны старого фото."
  outcome_ru: "Билет стоит два доллара, обратный автобус — в шесть. На Park Street правда есть маленькое фотоателье. Но сегодня суббота, и дверь закрыта."
  next_hook_ru: "На двери ателье табличка: Open Monday. Продолжение — на уровне A1+."
