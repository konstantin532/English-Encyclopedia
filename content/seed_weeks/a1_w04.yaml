twister:
  number: 4
  series: sounds
  text: '[T3]His[/] [J4]happy[/] [S1]mother[/], [T3]her[/] [J4]happy[/] [S1]father[/], [T3]his[/] [J4]happy[/] [S1]brother[/]. [A6]How[/] [J2]old[/]? [T1]A[/] [N1]hundred[/]!'
  ru: Его счастливая мама, её счастливый папа, его счастливый брат. Сколько лет? Сто!
  ipa: /hɪz ˈhæpi ˈmʌðɚ | hɚ ˈhæpi ˈfɑðɚ | hɪz ˈhæpi ˈbrʌðɚ | ˈhaʊ ˈoʊld | ə ˈhʌndrəd/
  focus_sounds:
  - h
  - dh
  source: original
  goal_ru: Лёгкое /h/ девять раз (his, her, happy, how, hundred) и звонкое th в mother, father, brother.
  tip_ru: h — тихий выдох, как будто греете стекло дыханием. Не «х» с хрипом. В mother — язык между зубами, с голосом.
  warmup:
  - '[T3]his[/], [T3]her[/], [J4]happy[/]'
  - '[T3]his[/] [J4]happy[/] [S1]mother[/], [T3]her[/] [J4]happy[/] [S1]father[/]'
  - '[T3]His[/] [J4]happy[/] [S1]mother[/], [T3]her[/] [J4]happy[/] [S1]father[/], [T3]his[/] [J4]happy[/] [S1]brother[/].'
  - '[T2]This[/] [D1]is[/] [T3]my[/] [S1]brother[/].'
  target_line: This is my brother.
  own_ru: 'Покажите семейное фото и назовите двоих: This is my mother. This is my father.'
