can_do_ru: "Я смогу показать семейное фото, сказать, кто есть кто, и спросить: Who is this?"
mission_ru: "Возьмите семейное фото и назовите по-английски трёх людей: This is my mother… Спросите кого-нибудь: Who is this?"
