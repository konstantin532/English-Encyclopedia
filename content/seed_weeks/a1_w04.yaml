level: A1
week: 4
can_do_ru: "Я смогу показать семейное фото, сказать, кто есть кто и сколько кому лет, и спросить: Who is this? How old are you?"
mission_ru: "Возьмите семейное фото и назовите по-английски трёх людей и их возраст: This is my mom. She is forty… Спросите кого-нибудь: How old are you?"
chunks: [LX-00101, LX-00102, LX-00103, LX-00104, LX-00105, LX-00106, LX-00278, LX-00279]
story_beat:
  intro_ru: "На следующий день Анна и Том приходят к Мие с фотографией из кафе. Вдруг она знает эту семью?"
  outcome_ru: "Это семья Мии: маме сорок, папе пятьдесят, брату десять. Анна возвращает фото, и Мия очень рада."
  next_hook_ru: "Впереди новая неделя — и новые места в городке."
