story_beat:
  intro_ru: "На следующий день Анна и Том приходят к Мие с фотографией из кафе. Вдруг она знает эту семью?"
  outcome_ru: "Это семья Мии: мама, папа и младший брат. Мия обронила фото в кафе на углу. Анна возвращает его, и Мия очень рада."
  next_hook_ru: "Дома Анна думает: в её новом доме тоже, наверное, жила большая семья. Кто были эти люди?"
