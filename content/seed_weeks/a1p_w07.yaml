story_beat:
  intro_ru: Субботний вечер. Анна и Том ужинают в маленьком ресторане после визита к Рут.
  outcome_ru: Рыбы сегодня нет, и Анна берёт курицу с рисом, Том — немного острую пасту. На десерт — свежий яблочный пирог. Том платит и оставляет сдачу официантке.
  next_hook_ru: В понедельник у Мии в кафе новый помощник — и много строгих правил. Неделя 8.
