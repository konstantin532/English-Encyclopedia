# A1+, неделя 7 «Ужин в ресторане». Сфера food, some / any.
level: A1+
week: 7
can_do_ru: 'Я смогу заказать ужин в ресторане и спросить, что есть: Is there any fish? — I would like the chicken. Some salad, please. — и попросить счёт: Can we have the check, please?'
mission_ru: 'Закажите по-английски воображаемый ужин в четырёх фразах: спросите, есть ли блюдо (Is there any…?), закажите (I would like…), попросите что-то к нему (some…) и счёт (Can we have the check, please?).'
