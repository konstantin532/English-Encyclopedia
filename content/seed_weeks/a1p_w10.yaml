# A1+, неделя 10 «Соседи: шум, просьба, доброта». Сфера meet, Could you…? и наречия на -ly. История 9 выходит на этой неделе.
level: A1+
week: 10
can_do_ru: 'Я смогу вежливо попросить соседа: Could you play quietly, please? Could you lend me your hammer? — извиниться Sorry about the noise и ответить Of course! I don''t mind.'
mission_ru: 'Попросите по-английски о трёх вещах вежливо, с Could you…?: одну — сделать что-то тише или медленнее (quietly, slowly), две — о помощи (lend me…, check…).'
