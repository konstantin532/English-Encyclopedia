story_beat:
  intro_ru: Суббота, день. Том громко играет на гитаре, а сверху спускается Лео — ночной медбрат из истории 9. Днём он спит.
  outcome_ru: Том извиняется и делает тише. Анна приглашает Лео на чай с печеньем. Лео одалживает Тому молоток и обещает присмотреть за квартирой, пока они в отпуске.
  next_hook_ru: После бессонной ночи у Анны болит голова. Неделя 11 — в аптеке.
