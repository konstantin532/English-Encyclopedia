story_beat:
  intro_ru: Суббота. Анна выздоровела, и Том зовёт её в поход в горы.
  outcome_ru: Прогноз обещает дождь и всего сорок градусов по Фаренгейту — для гор слишком холодно и далеко. Вместо похода — прогулка у реки, в длинном сером пальто и под большим розовым зонтом.
  next_hook_ru: В понедельник Анна идёт в библиотеку — записаться и найти книгу о старом городе. Неделя 13.
