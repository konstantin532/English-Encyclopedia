# A1+, неделя 12 «Погода и планы на день». Сфера free, прилагательные, too / enough.
level: A1+
week: 12
can_do_ru: 'Я смогу обсудить погоду и поменять план: What''s the weather like? It''s too cold. My jacket isn''t warm enough. How about a walk instead? — и описать вещь двумя прилагательными в правильном порядке: my long gray coat.'
mission_ru: 'Посмотрите прогноз на завтра и скажите по-английски три фразы: какая будет погода, что для вас слишком (too…) или недостаточно (not … enough) и какой план лучше (How about… instead?).'
