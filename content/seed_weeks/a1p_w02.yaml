# A1+, неделя 2 «Где ты был вчера?». Сфера meet, was / were. История 6 выходит на этой неделе.
level: A1+
week: 2
can_do_ru: 'Я смогу рассказать, где я был и каким это было: I was at the museum. It was great! — спросить Where were you? How was your weekend? и описать место через there was / there were.'
mission_ru: 'Расскажите кому-нибудь по-английски о прошлых выходных в трёх фразах: где вы были (I was at…), каким это было (It was…) и что там было (There was… / There were…).'
