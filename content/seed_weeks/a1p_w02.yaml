story_beat:
  intro_ru: Утро понедельника в кафе Мии. Мия спрашивает Анну и Тома про выходные.
  outcome_ru: Анна и Том были в музее и на пляже. В музее висела большая карта их городка — Анне было очень интересно.
  next_hook_ru: А в понедельник в девять вечера Анна одна дома. В окне квартиры наверху горит свет — история 6.
