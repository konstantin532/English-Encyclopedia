# A1+, неделя 5 «Бюро находок». Сфера service, did / didn't.
level: A1+
week: 5
can_do_ru: 'Я смогу задать вопрос о прошлом и ответить на него: Did you take bus twelve? — Yes, I did. / No, I didn''t. Which bus did you take? — и описать потерянную вещь: It''s pink, with a long handle.'
mission_ru: 'Представьте, что вы что-то потеряли. Опишите вещь по-английски в двух фразах (цвет, размер, ручка или карман) и ответьте на два вопроса: Did you…? — Yes, I did. / No, I didn''t.'
