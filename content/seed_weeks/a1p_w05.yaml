story_beat:
  intro_ru: Анна забыла в автобусе розовый зонт — подарок Тома. Утром она идёт в бюро находок на автостанции.
  outcome_ru: 'Сотрудник задаёт вопросы: какой автобус, где сидела, какой зонт. Сначала находится чужой зонт с короткой ручкой, а потом — её: его вчера вечером принёс водитель.'
  next_hook_ru: Зонт нашёлся. А через неделю Анна потеряет кое-что поважнее — телефон. История 7.
