can_do_ru: "Я смогу представиться, сказать, откуда я, и спросить имя собеседника."
mission_ru: "1. Без готового образца представьтесь вслух новому соседу и скажите, откуда вы. 2. Представьте знакомство с другим человеком: поздоровайтесь, спросите его имя и ответьте на встречный вопрос. Говорите своими словами, без вариантов ответа."
