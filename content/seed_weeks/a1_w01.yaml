story_beat:
  intro_ru: "Первое утро Анны в новом доме. На крыльце её встречает сосед."
  outcome_ru: "Анна и Том познакомились: Том — сосед, Анна — из России. Анна очень занята переездом, и Том желает ей хорошего дня."
  next_hook_ru: "Скоро у Анны будут первые гости."
