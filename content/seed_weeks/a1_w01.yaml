level: A1
week: 1
can_do_ru: "Я смогу представиться, сказать, откуда я, и спросить имя собеседника."
mission_ru: "1. Без готового образца представьтесь вслух новому соседу и скажите, откуда вы. 2. Представьте знакомство с другим человеком: поздоровайтесь, спросите его имя и ответьте на встречный вопрос. Говорите своими словами, без вариантов ответа."
ambience: morning_home
chunks: [LX-00042, LX-00043, LX-00044, LX-00045, LX-00046, LX-00047, LX-00048]
story_beat:
  intro_ru: "Первое утро Анны в новом доме. На крыльце её встречает сосед."
  outcome_ru: "Анна и Том познакомились: Том — сосед, Анна — из России. Анна приглашает его на кофе. Том сначала занят, но для хорошего кофе время находится."
  next_hook_ru: "Скоро у Анны будут первые гости."
