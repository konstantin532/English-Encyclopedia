level: A1
week: 5
can_do_ru: "Я смогу спросить в магазине, есть ли нужный товар, выбрать по цвету, узнать цену (How much is it?) и сказать, дёшево это или дорого."
mission_ru: "Назовите три продукта дома или в магазине: There's milk. There are red apples… Назначьте цены в долларах. Спросите цены и ответьте за продавца: How much is the milk? — It's two dollars. How much are the apples? — They're three dollars. Оцените цену: That's cheap! или That's expensive!"
chunks: [LX-00118, LX-00119, LX-00120, LX-00121, LX-00122, LX-00123, LX-00301, LX-00302]
story_beat:
  intro_ru: "Утро. Анна и Том идут в маленький магазин у дома. Нужно молоко, яблоки и корм для кота Box."
  outcome_ru: "Корма для кошек нет, зато Box любит молоко. Анна и Том покупают молоко и шесть яблок."
  next_hook_ru: "Дома Анна наливает молоко в миску. Но где же Box?"
