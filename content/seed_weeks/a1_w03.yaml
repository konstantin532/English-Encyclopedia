level: A1
week: 3
can_do_ru: "Я смогу вежливо заказать в кафе напиток и еду (I'd like…), назвать количество от 1 до 20 и попросить повторить, если не расслышал."
mission_ru: "Закажите вслух по-английски два напитка и одно печенье, начиная с I'd like… Потом попросите повторить: Sorry? Can you say it again, please?"
chunks: [LX-00082, LX-00083, LX-00084, LX-00085, LX-00086, LX-00087, LX-00284, LX-00285]
story_beat:
  intro_ru: "Утро в небольшом кафе. Анна и Том заказывают завтрак. Кофемашина шумит, и бариста не всё слышит с первого раза."
  outcome_ru: "Заказ принят: кофе, чай и большое печенье. На столе лежит маленькая семейная фотография — она не Анны и не Тома. Анна берёт фото с собой."
  next_hook_ru: "Чья это семья?"
