story_beat:
  intro_ru: Субботнее утро. Под раковиной у Анны и Тома течёт вода. Анна звонит хозяину дома, и он присылает мастера.
  outcome_ru: Мастер меняет старую трубу и лампочку в ванной. Платить Анне и Тому не нужно — ремонт оплачивает хозяин.
  next_hook_ru: Пора наконец познакомиться с соседом сверху. История 9 — «Человек сверху», неделя 10.
