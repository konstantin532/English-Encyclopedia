# A1+, неделя 9 «Аренда квартиры и мелкий ремонт». Сфера home, have to / don't have to.
level: A1+
week: 9
can_do_ru: 'Я смогу сказать, что нужно сделать, а что не обязательно: I have to call the landlord. You don''t have to pay. — и объяснить мастеру поломку: The pipe is leaking. It''s an emergency!'
mission_ru: 'Напишите по-английски три дела по дому на эту неделю: два с have to (I have to…) и одно, которое делать не обязательно (I don''t have to…).'
