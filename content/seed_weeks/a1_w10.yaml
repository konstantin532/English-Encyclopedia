  source: original
  goal_ru: Носовой ŋ в -ing против обычного n (never, in). Не добавляйте в конце «г».
  tip_ru: 'ŋ: спинка языка прижата к нёбу сзади, звук идёт в нос, кончик языка внизу. n: кончик языка у верхних зубов. Проверка: на ŋ кончик языка свободен.'
