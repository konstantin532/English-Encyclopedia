can_do_ru: "Я смогу рассказать, что люблю делать в выходные и как часто: I always read on Saturdays, I never walk — и спросить: What do you do on the weekend?"
mission_ru: "Расскажите вслух по-английски о своих выходных тремя фразами со словами always, sometimes, never. Спросите кого-нибудь: What do you do on the weekend? Do you like…?"
chunks: [LX-00206, LX-00207, LX-00208, LX-00209, LX-00210, LX-00211]
story_beat:
  intro_ru: "Субботнее утро в кафе на углу. Мия спрашивает Анну и Тома, как они проводят выходные."
  outcome_ru: "Анна по субботам читает, а в октябре по воскресеньям гуляет в парке в куртке. Том никогда не гуляет, зато играет на гитаре — и Box это нравится. Мия работает даже в воскресенье, с пяти утра."
  next_hook_ru: "В понедельник утром Том просыпается с больной головой."
