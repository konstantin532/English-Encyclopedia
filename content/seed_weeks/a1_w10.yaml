twister:
  number: 10
  series: sounds
  text: '[D2]Reading[/], [D4]walking[/], [D2]playing[/] — [A1]never[/] [P1]in[/] [T1]the[/] [S7]morning[/]!'
  ipa: /ˈridɪŋ ˈwɔkɪŋ ˈpleɪɪŋ ˈnɛvɚ ɪn ðə ˈmɔrnɪŋ/
  focus_sounds:
