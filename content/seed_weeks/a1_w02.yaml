level: A1
week: 2
can_do_ru: Я смогу показать свой дом, назвать комнаты и предметы, сказать, чьи они, и вежливо попросить воды или нужную вещь.
mission_ru: 'Покажите комнату и два предмета дома. Скажите, чьи они: This is my… Спросите у гостя: Do you like my…?
  Попросите полотенце: Can I have a towel, please?'
