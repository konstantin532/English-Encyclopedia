twister:
  number: 2
  series: sounds
  text: '[T2]That[/] [S6]cat[/] [D1]has[/] [T3]my[/] [S2]desk[/], [T2]that[/] [S6]cat[/] [D1]has[/] [T3]my[/] [S2]lamp[/], [T2]that[/] [S6]cat[/] [D1]has[/] [T3]my[/] [S2]shelf[/]!'
  ru: Этот кот занял мой стол, этот кот занял мою лампу, этот кот занял мою полку!
  ipa: /ˈðæt ˈkæt həz maɪ ˈdɛsk | ˈðæt ˈkæt həz maɪ ˈlæmp | ˈðæt ˈkæt həz maɪ ˈʃɛlf/
  focus_sounds:
  - ae
  source: original
  goal_ru: Широкое /æ/ (that, cat, has, lamp) против узкого /ɛ/ (desk, shelf). Для американца bad и bed — разные слова.
  tip_ru: 'В cat рот открыт широко, челюсть опущена — звук между «э» и «а». В desk рот почти закрыт, обычное «э». Чередуйте: cat — desk, lamp — shelf.'
  warmup:
