level: A1
week: 9
can_do_ru: "Я смогу представиться по телефону, продиктовать фамилию по буквам и номер телефона по цифрам и спросить: What time does the shop open?"
mission_ru: "Продиктуйте вслух по-английски свою фамилию по буквам и номер телефона по одной цифре. Потом спросите кого-нибудь: What time does … open?"
chunks: [LX-00188, LX-00189, LX-00190, LX-00191, LX-00192, LX-00367, LX-00368]
story_beat:
  intro_ru: "Копия ключа почти готова. Анна звонит в мастерскую, чтобы оставить имя и номер для заказа."
  outcome_ru: "Мастер записывает фамилию Анны по буквам — Belova — и её номер. Мастерская открывается в девять."
  next_hook_ru: "Утром в девять Анна забирает ключи. Мастер вертит старый ключ в руках: «Этому ключу лет сто»."
