twister:
  number: 6
  series: sounds
  text: '[T8]We[/] [D2]work[/] [T5]every[/] [S7]week[/]. [T8]We[/] [D6]watch[/] [S2]TV[/] [T5]every[/] [S7]evening[/]. [T5]Every[/] [S7]week[/], [T5]every[/] [S7]evening[/], [T8]we[/] [D2]work[/]!'
  ru: Мы работаем каждую неделю. Мы смотрим телевизор каждый вечер. Каждую неделю, каждый вечер — мы работаем!
  ipa: /wi ˈwɝk ˈɛvri ˈwiːk | wi ˈwɑtʃ ˌtiˈvi ˈɛvri ˈivnɪŋ | ˈɛvri ˈwiːk | ˈɛvri ˈivnɪŋ | wi ˈwɝk/
  focus_sounds:
  - w
  source: original
  goal_ru: w (we, work, week, watch) против v (every, evening, TV) в одной фразе. Русские говорят «вик» вместо week.
  tip_ru: 'w — губы трубочкой, как для «у», и сразу раскрыть; зубы губ не касаются. v — верхние зубы на нижней губе. Чередуйте: we — every, week — evening.'
  warmup:
