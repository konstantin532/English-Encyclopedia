  - '[T8]We[/] [D2]work[/] [T5]every[/] [S7]week[/]. [T8]We[/] [D6]watch[/] [S2]TV[/] [T5]every[/] [S7]evening[/].'
  - '[T8]I[/] [D2]work[/] [A3]here[/] [T5]every[/] [S7]day[/].'
  target_line: I work here every day.
  own_ru: 'Скажите, в какое время вы обычно работаете: I work at…'
