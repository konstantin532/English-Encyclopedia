level: A1
week: 6
can_do_ru: "Я смогу рассказать о своём обычном дне — утро, обед, вечер: во сколько встаю, ем, работаю и ложусь спать — и спросить: What time do you get up?"
mission_ru: "Расскажите вслух по-английски о своём дне пятью фразами: I get up at… I have breakfast at… I have lunch at… In the evening I… I go to bed at… Спросите кого-нибудь: What time do you get up? Если занимаетесь один, задайте вопрос вслух и ответьте за воображаемого собеседника."
chunks: [LX-00135, LX-00136, LX-00137, LX-00138, LX-00139, LX-00140, LX-00318]
story_beat:
  intro_ru: "Box так и не вернулся домой. Утром Анна и Том заходят к Мие на работу — в кафе на углу."
  outcome_ru: "Мия встаёт в пять и работает в кафе каждый день. А ещё каждое утро в семь сюда приходит большой кот и пьёт её молоко."
  next_hook_ru: "Это Box? Анна решает прийти в кафе завтра ровно в семь."
