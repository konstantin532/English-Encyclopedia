story_beat:
  intro_ru: Вечер в кафе. Джейк хочет поступить в кулинарную школу, и Анна — учительница — помогает ему с анкетой.
  outcome_ru: Джейк родился и вырос в этом городе, плохо знал математику, зато любил рисование и историю, год работал в ресторане. Стать шеф-поваром — его мечта. Собеседование в пятницу.
  next_hook_ru: Во вторник Анна идёт в библиотеку за книгой о старом городе — и находит в ней карту. История 10.
