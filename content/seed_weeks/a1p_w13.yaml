# A1+, неделя 13 «Анкета на курсы: расскажи о себе». Сфера study, повторение Past Simple.
level: A1+
week: 13
can_do_ru: 'Я смогу рассказать о себе в прошедшем времени: I was born in… I grew up in… I studied… I worked… — и ответить на вопросы анкеты: date of birth, What did you study? Do you have any experience?'
mission_ru: 'Заполните по-английски маленькую анкету о себе: date of birth, где вы родились и выросли (I was born in…, I grew up in…), что изучали (I studied…) и где работали (I worked…).'
