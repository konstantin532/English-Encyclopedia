level: A1
week: 8
can_do_ru: "Я смогу вежливо остановить прохожего, спросить дорогу (Where is…?) и понять ответ: go straight, turn left, on the right, next to."
mission_ru: "Объясните по-английски дорогу от вашего дома до ближайшего магазина тремя фразами: Go straight… Turn left… It is next to… Потом спросите кого-нибудь: Excuse me, where is…?"
chunks: [LX-00175, LX-00176, LX-00177, LX-00178, LX-00174]
story_beat:
  intro_ru: "Том хочет сделать копию старого ключа для Анны. Но где в городке мастерская по ключам?"
  outcome_ru: "Мастерская — рядом с банком, а банк — справа, рядом с кафе Мии. Мастер берёт старый ключ и обещает сделать копию."
  next_hook_ru: "Ключ очень старый. Кто жил в этом доме раньше?"
