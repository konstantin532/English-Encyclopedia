# A1+, неделя 3 «Как прошли выходные: разговор с коллегой». Сфера work, Past Simple на -ed.
level: A1+
week: 3
can_do_ru: 'Я смогу рассказать, что делал в выходные: I visited my grandparents. I cleaned my apartment. — спросить How was your weekend? What about you? и ответить коротко: Not bad. Me too.'
mission_ru: 'Расскажите коллеге или другу по-английски, что вы делали в прошлые выходные: три глагола на -ed (I cooked…, I watched…, I stayed at home.) и вопрос в ответ: What about you?'
