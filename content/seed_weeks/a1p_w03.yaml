story_beat:
  intro_ru: Утро понедельника в офисе. Коллега Тома Кейт спрашивает, как прошли выходные.
  outcome_ru: Том навестил бабушку с дедушкой, убрал квартиру и починил велосипед. Кейт весь день смотрела фильмы. А отчёт к совещанию Том закончил ещё вечером.
  next_hook_ru: В выходные Анна и Том ходили по магазинам — и купили совсем не то, что хотели. Неделя 4.
