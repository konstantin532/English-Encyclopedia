# A1+, неделя 1 «Видеозвонок: что я делаю сейчас». Сфера connect, Present Continuous.
level: A1+
week: 1
can_do_ru: 'Я смогу сказать, что я делаю прямо сейчас (I''m drinking coffee), спросить What are you doing? и поддержать короткий видеозвонок с близким человеком: Can you hear me? I miss you. Talk to you soon!'
mission_ru: 'Позвоните или напишите близкому человеку и скажите по-английски три фразы о том, что вы делаете прямо сейчас: I''m… Закончите словами Talk to you soon!'
