level: A1
week: 12
can_do_ru: "Я смогу отправить письмо на почте, сказать, чего у меня нет (I don't have a stamp), назвать город и индекс, заполнить анкету и спросить о почте для дома."
mission_ru: "Скажите вслух по-английски три фразы с don't и doesn't о себе и знакомых: I don't… My friend doesn't… Потом спросите кого-нибудь: What's your address?"
chunks: [LX-00232, LX-00233, LX-00234, LX-00235, LX-00236]
story_beat:
  intro_ru: "Анна несёт на почту письмо маме в Россию. Том идёт с ней и заодно хочет спросить про старый почтовый ящик."
  outcome_ru: "Письмо уходит в Россию — марка стоит два доллара. А почтальон удивлён: в старый ящик у их калитки письма никогда не приходят."
  next_hook_ru: "Вечером в старом почтовом ящике что-то белое."
