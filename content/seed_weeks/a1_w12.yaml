twister:
  number: 12
  series: sounds
  text: '[D9]Get[/] [T1]a[/] [S9]letter[/] [P3]at[/] [T1]a[/] [S4]city[/] [S4]post office[/], [D9]get[/] [T1]a[/] [S9]letter[/], [D9]get[/] [T1]a[/] [S9]letter[/], [D9]get[/] [T8]it[/]!'
  ru: Получи письмо на городской почте — получи письмо, получи письмо, получи его!
  ipa: /ˈɡɛt ə ˈlɛt̬ɚ ət ə ˈsɪt̬i ˈpoʊst ˈɔfɪs | ˈɡɛt ə ˈlɛt̬ɚ | ˈɡɛt ə ˈlɛt̬ɚ | ˈɡɛt ɪt/
  focus_sounds:
  - flap
  - ae
  source: original
  goal_ru: 'В связной американской речи /t/ в letter и city, а также на стыке слов get a и get it может звучать как короткое касание языка [ɾ]. Это один вариант произношения, а не обязательный звук в любой ситуации.'
  tip_ru: 'Для [ɾ] кончик языка один раз быстро касается бугорков за верхними зубами. Не смягчайте звук как русское ть. Отчётливое /t/ в аккуратной американской речи тоже возможно; учитывайте ударение и темп.'
  warmup:
