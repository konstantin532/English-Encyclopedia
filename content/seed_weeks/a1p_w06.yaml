# A1+, неделя 6 «Потерянный телефон: в гостях у Рут». Сфера connect, me / him / her / them. История 7 выходит на этой неделе.
level: A1+
week: 6
can_do_ru: 'Я смогу говорить о людях без повторов имени: She called me. Tell us about her. I can show it to you. — поблагодарить Thank you so much! и сказать о телефоне: The battery is dead.'
mission_ru: 'Расскажите по-английски о человеке, который вам недавно помог, в трёх фразах с me / him / her / them: кто это, что он(а) для вас сделал(а) и что вы ему (ей) сказали.'
