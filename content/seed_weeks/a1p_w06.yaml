story_beat:
  intro_ru: Суббота, четыре часа. Анна и Том приходят на Парк-стрит к Рут — она нашла телефон Тома.
  outcome_ru: 'Рут отдаёт телефон и признаётся: Роуз была её подругой, поэтому она так разволновалась. В воскресенье она покажет им старый альбом.'
  next_hook_ru: 'Альбом Рут покажет в воскресенье. А вечером в субботу Анна и Том идут ужинать в ресторан. Неделя 7.'
