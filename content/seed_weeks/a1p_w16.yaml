story_beat:
  intro_ru: Воскресенье, десять утра. После письма под скамейкой (история 11) друзья снова в парке. Рут тоже пришла.
  outcome_ru: Мия принесла лимонад и арбуз, Том — бутерброды. Рут вспоминает Сэма тихим мальчиком. По лужайке медленно идёт старик с белым конвертом — Рут узнаёт его лицо.
  next_hook_ru: Сэм пришёл спустя шестьдесят лет. Что он расскажет о Роуз? Продолжение — на уровне A2.
