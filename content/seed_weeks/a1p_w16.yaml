# A1+, неделя 16 «Пикник под угрозой дождя; итог A1+». Сфера free, повторение уровня. История 11 выходит на этой неделе.
level: A1+
week: 16
can_do_ru: 'Я смогу рассказать и договориться на английском уровня A1+: что было (I brought, I didn''t forget), что нужно (We must be quiet), что будет при условии (If Sam comes, we''ll see him) и вежливо попросить (Could you sit in the shade?).'
mission_ru: 'Итог A1+: расскажите по-английски о своём лучшем дне этого года в пяти фразах — где вы были (was / were), что делали (-ed и неправильные глаголы), чего не делали (didn''t), что вам надо было сделать (had to) и что вы сделаете, если всё повторится (If…, I''ll…).'
