twister:
  number: 13
  series: sounds
  text: '[T8]I[/] [D7]can[/], [T8]you[/] [D7]ca[/][X1]n''t[/]. [T8]You[/] [D7]can[/], [T8]I[/] [D7]ca[/][X1]n''t[/]. [D7]Can[/] [T8]you[/]? [T8]I[/] [D7]can[/]! [D7]Can[/] [T8]I[/]? [T8]You[/] [D7]ca[/][X1]n''t[/]!'
  ru: Я могу, ты не можешь. Ты можешь, я не могу. А ты можешь? Я могу! А я? А ты не можешь!
  ipa: /aɪ ˈkæn | jə ˈkænt | jə ˈkæn | aɪ ˈkænt | kən ˈju | aɪ ˈkæn | kən aɪ | jə ˈkænt/
  focus_sounds:
  - ae
  source: original
  goal_ru: 'Различить can и can''t на слух: в американской речи t в can''t почти не слышно, разница — в гласной и ударении.'
  tip_ru: 'Безударное can в середине фразы — короткое /kən/, «кэн». can''t — под ударением, широкое /æ/: «кэ-энт». Ударное can в конце (I can!) тоже звучит широко.'
  warmup:
  - '[D7]can[/], [D7]ca[/][X1]n''t[/]'
  - '[T8]I[/] [D7]can[/], [T8]you[/] [D7]ca[/][X1]n''t[/].'
  - '[T8]I[/] [D7]can[/], [T8]you[/] [D7]ca[/][X1]n''t[/]. [T8]You[/] [D7]can[/], [T8]I[/] [D7]ca[/][X1]n''t[/].'
  - '[O4]Yes[/], [T8]I[/] [D7]can[/].'
  target_line: Yes, I can.
  own_ru: 'Скажите, что вы умеете и чего не умеете: I can… I can''t…'
