level: A1
week: 13
can_do_ru: "Я смогу сказать, что умею и чего не умею (I can speak English, I can't sing), спросить об умении с Can you…, попросить повторить вопрос и объяснить причину: Why? — Because…"
mission_ru: "Скажите вслух по-английски три фразы о своих умениях: I can… I can't… Спросите кого-нибудь Can you…? и ответьте на Why? фразой с because."
chunks: [LX-00247, LX-00248, LX-00249, LX-00250, LX-00251]
story_beat:
  intro_ru: "Вечер в кафе Мии. Том и Мия узнают, что Анна говорит по-русски."
  outcome_ru: "Анна проведёт первый урок русского для Тома и Мии в субботу в десять. Том хочет понимать русскую музыку, а Мии нравятся русские буквы."
  next_hook_ru: "В субботу утром Анна двигает старый шкаф, чтобы освободить место для урока. За шкафом что-то есть."
