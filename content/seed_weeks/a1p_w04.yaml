story_beat:
  intro_ru: Вечер. Том весь день пропадал в торговом центре — у Мии в пятницу день рождения.
  outcome_ru: Том купил Мии зелёный шарф со скидкой, но Мия терпеть не может зелёный. Чек остался в кошельке — завтра шарф можно обменять на синий. А ещё Том купил Анне розовый зонт и потратил все деньги.
  next_hook_ru: Завтра Анна и Том идут в магазин обменивать шарф. Получится ли? Неделя 5.
