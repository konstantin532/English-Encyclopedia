# A1+, неделя 4 «Подарок для Мии». Сфера shop, неправильные глаголы в прошедшем.
level: A1+
week: 4
can_do_ru: 'Я смогу рассказать о покупке в прошлом: I went to the mall. I bought a gift. I paid by card. — спросить How much was it? и сказать, что я забыл или потратил: I forgot. I spent it all!'
mission_ru: 'Расскажите по-английски о своей последней покупке в четырёх фразах: куда вы ходили (I went to…), что купили (I bought…), как платили (I paid by card / in cash) и сколько это стоило (It was … dollars).'
