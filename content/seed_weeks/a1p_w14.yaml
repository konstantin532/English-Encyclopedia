# A1+, неделя 14 «Прогулка по карте района». Сфера city, предлоги движения и первое if. История 10 выходит на этой неделе.
level: A1+
week: 14
can_do_ru: 'Я смогу спросить и объяснить дорогу: How do I get to Park Street? — Walk along the river, go over the bridge, past the church and across the square. Turn left at the fountain.'
mission_ru: 'Объясните по-английски дорогу от вашего дома до ближайшего магазина или остановки в трёх-четырёх шагах: along…, past…, across…, turn left / right at…'
