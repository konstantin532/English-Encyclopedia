story_beat:
  intro_ru: После находки в саду (история 10) Анна и Том идут к Рут — спросить про Сэма. Но решают срезать через парк.
  outcome_ru: 'Они заблудились у моста и церкви. Прохожий объясняет: вдоль реки, через мост, мимо церкви, через площадь и налево у фонтана. Десять минут пешком.'
  next_hook_ru: Рут знает, кто такой Сэм. А у Анны и Тома скоро отпуск — пора собирать чемоданы. Неделя 15.
