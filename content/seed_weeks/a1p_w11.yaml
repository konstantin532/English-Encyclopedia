story_beat:
  intro_ru: После бессонной ночи у Анны болит горло и кашель. Она идёт в аптеку на углу.
  outcome_ru: Температуры нет, аллергии тоже. Продавщица советует таблетки два раза в день пять дней и чай с мёдом. Анна часто забывает лекарства — значит, таблетки надо положить рядом с чаем.
  next_hook_ru: Анне лучше, а на выходные обещают солнце. Куда пойти? Неделя 12.
