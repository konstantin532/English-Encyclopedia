# A1+, неделя 11 «Аптека и инструкция к лекарству». Сфера health, How often…?, once / twice a day.
level: A1+
week: 11
can_do_ru: 'Я смогу купить лекарство в аптеке и понять инструкцию: How often do I take it? — Twice a day, after dinner. — и рассказать о простой болезни: I have a sore throat and a cough.'
mission_ru: 'Напишите по-английски инструкцию к своему обычному лекарству или витамину: как часто (once / twice a day), когда (after breakfast, at bedtime) и с чем (with water).'
