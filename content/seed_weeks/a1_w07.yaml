can_do_ru: "Я смогу сказать, кем и где работаю, рассказать о работе друга (Tom works at home) и спросить: What do you do?"
mission_ru: "Назовите вслух по-английски работу трёх знакомых: My friend is a doctor. She works at… Спросите кого-нибудь: What do you do?"
chunks: [LX-00151, LX-00152, LX-00153, LX-00154, LX-00155, LX-00156]
story_beat:
  intro_ru: "Вечер в кафе на углу. Мия наконец спрашивает Анну, чем она занимается. А потом разговор заходит о соседе сверху."
  outcome_ru: "Анна — учительница, Том работает дома за компьютером, Мия — бариста. А сосед сверху работает ночью, каждую ночь в десять."
  next_hook_ru: "Утром Том находит под дверью что-то маленькое и старое."
