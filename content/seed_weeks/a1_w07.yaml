twister:
  number: 7
  series: sounds
  text: '[S1]Tom[/] [D2]works[/], [S1]Mia[/] [D2]works[/]. [T9]Who[/] [D2]works[/] [P3]at[/] [S7]night[/]?'
  ipa: /ˈtɑm ˈwɝks ˈmiə ˈwɝks ˈhu ˈwɝks ət ˈnaɪt/
  focus_sounds:
  - w
  - h
  source: original
  goal_ru: 'Окончание -s после k (works — «уёркс») и w в начале. Не теряйте -s: без него выходит ошибка He work.'
  tip_ru: 'В works губы сначала трубочкой (w), в конце — короткое «кс»: язык сзади смыкается и сразу шипит s. who — лёгкий выдох h и долгое «у».'
  warmup:
  - '[D2]work[/] — [D2]works[/]'
  - '[S1]Tom[/] [D2]works[/]'
  - '[S1]Tom[/] [D2]works[/], [S1]Mia[/] [D2]works[/]'
  - '[T8]He[/] [D2]works[/] [P3]at[/] [S7]night[/]!'
  target_line: He works at night!
  own_ru: 'Расскажите о работе знакомого: My friend works at…'
