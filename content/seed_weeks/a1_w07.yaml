twister:
  number: 7
  series: sounds
  text: '[S9]Nurse[/], [S9]teacher[/], [S9]singer[/], [S9]farmer[/], [S9]driver[/], [S9]writer[/]. [A6]Where[/] [D1]do[/] [T8]you[/] [D2]work[/]?'
  ru: Медсестра, учитель, певец, фермер, водитель, писатель. А вы где работаете?
  ipa: /ˈnɝs | ˈtitʃɚ | ˈsɪŋɚ | ˈfɑrmɚ | ˈdraɪvɚ | ˈraɪt̬ɚ | ˈwɛr də jə ˈwɝk/
  focus_sounds:
  - r
  - w
  source: original
  goal_ru: 'Шесть слов с американским r: в nurse оно внутри слова, в teacher, singer, farmer, driver, writer — в окончании -er. Затем w в where и work.'
  tip_ru: 'Для выбранного американского произношения сохраняйте r в этих словах. Кончик языка не дрожит и не ударяет по нёбу; его можно немного поднять либо оставить ниже, приподняв среднюю часть языка. Не требуется единственное положение кончика.'
  warmup:
  - '[S9]teacher[/], [S9]farmer[/]'
  - '[S9]nurse[/], [S9]teacher[/], [S9]singer[/]'
  - '[S9]Nurse[/], [S9]teacher[/], [S9]singer[/], [S9]farmer[/], [S9]driver[/], [S9]writer[/].'
  - '[T8]He[/] [D2]works[/] [P3]at[/] [S7]night[/]!'
  target_line: He works at night!
  own_ru: 'Расскажите о работе знакомого: My friend works at…'
