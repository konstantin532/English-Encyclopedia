story_beat:
  intro_ru: Вторник, шесть утра. В кафе Мии первый рабочий день у нового помощника Джейка. А вчера сама Мия опоздала — история 8.
  outcome_ru: 'Мия объясняет правила: приходить к шести, мыть руки, не сидеть в телефоне у стойки, быть вежливым. Джейк поскальзывается на мокром полу и разбивает чашку, но Мия не сердится.'
  next_hook_ru: А у Анны и Тома в квартире сломался кран — пора звонить хозяину дома. Неделя 9.
