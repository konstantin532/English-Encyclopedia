# A1+, неделя 8 «Первый рабочий день: правила». Сфера work, must / must not. История 8 выходит на этой неделе.
level: A1+
week: 8
can_do_ru: 'Я смогу объяснить и понять правила на работе: You must be here at six. You mustn''t use your phone. — переспросить Can I ask a question? и ответить Got it. No problem.'
mission_ru: 'Напишите по-английски три правила для своей работы, учёбы или дома: два с must и одно с must not. Прочитайте их вслух, как будто объясняете новичку.'
