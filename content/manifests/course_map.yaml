- number: 18
  level: A2+
  week: 4
  title: The House Was Built in 1952
  hook_ru: 'В саду найдена табличка: кем и для кого был построен дом.'
  focus: SDJANTPX
- number: 19
  level: A2+
  week: 8
  title: Tom Gets an Interview
  hook_ru: Тома зовут на собеседование, но в тот же день нужно спасать Box.
