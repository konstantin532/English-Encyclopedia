- number: 23
  level: B1
  week: 2
  title: Have You Ever Seen This Man?
  hook_ru: На фото рядом с Rose мужчина. Его видели все, но никто не знает.
  focus: SDJANT
- number: 24
  level: B1
  week: 4
  title: Mia's New Job
  hook_ru: Мия устраивается на радиостанцию и получает доступ к архиву.
