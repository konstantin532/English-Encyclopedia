# Карта курса: 60 историй и 60 стихотворений (раздел 12–13).
# Сквозные герои: Anna, Tom, Mia. Сюжет: тайна дома и писем Rose.
# week — неделя внутри уровня (пятница второй недели двухнедельного цикла).
stories:
- number: 1
  level: A1
  week: 2
  title: Not My Box
  hook_ru: Утром Том приносит Анне большую коробку. Чья она и что внутри?
  focus: SDJTPXO
- number: 2
  level: A1
  week: 6
  title: The Café on the Corner
  hook_ru: Анна заходит к Мие на работу, в кафе на углу. Кот Box исчезает.
  focus: SDANTPCOF
- number: 3
  level: A1
  week: 8
  title: Whose Key?
  hook_ru: Том находит под дверью старый ключ. Он не подходит ни к одной двери в доме.
  focus: SDJANTXCF
- number: 4
  level: A1
  week: 12
  title: A Letter With No Name
  hook_ru: 'В почтовом ящике письмо без имени. Внутри одно слово: Rose.'
  focus: SDJANPXCOF
- number: 5
  level: A1
  week: 14
  title: The Big Family Photo
  hook_ru: За шкафом Анна находит фото большой семьи. Это не её семья.
  focus: SDANTPCOF
- number: 6
  level: A1+
  week: 2
  title: Yesterday at Nine
  hook_ru: Вчера в девять вечера в пустой квартире наверху горел свет.
  focus: SDJANTP
- number: 7
  level: A1+
  week: 6
  title: The Lost Phone
  hook_ru: Том потерял телефон. Ему звонит незнакомец и называет его по имени.
  focus: SDJXCOF
- number: 8
  level: A1+
  week: 8
  title: Mia's Bad Day
  hook_ru: Мия опоздала на работу, и начальник даёт ей странное поручение.
  focus: SDANTPX
- number: 9
  level: A1+
  week: 10
  title: The Man Upstairs
  hook_ru: Сосед сверху ходит только ночью и ни с кем не здоровается.
  focus: SDJACOF
- number: 10
  level: A1+
  week: 14
  title: A Map in the Book
  hook_ru: В библиотечной книге лежит нарисованная от руки карта района.
  focus: SDNTPXC
- number: 11
  level: A1+
  week: 16
  title: If It Rains
  hook_ru: Пикник под угрозой дождя. На скамейке — второе письмо для Rose.
  focus: SDJANOF
- number: 12
  level: A2
  week: 2
  title: Going to the Station
  hook_ru: Друзья едут по адресу из письма. Что они найдут на вокзале?
  focus: SDJANTP
- number: 13
  level: A2
  week: 6
  title: The Better Pizza
  hook_ru: Спор о лучшей пиццерии города заканчивается неожиданной подсказкой.
  focus: SDJXCOF
- number: 14
  level: A2
  week: 8
  title: Who Was Rose?
  hook_ru: Старая продавщица цветов помнит девушку по имени Rose.
  focus: SDANTPX
- number: 15
  level: A2
  week: 10
  title: The Bus Driver Remembers
  hook_ru: Водитель автобуса сорок лет возит людей по одному маршруту.
  focus: SDJACOF
- number: 16
  level: A2
  week: 14
  title: A Gift for the Wrong Person
  hook_ru: Анна дарит подарок не тому человеку, и это открывает новую дверь.
  focus: SDNTPXC
- number: 17
  level: A2
  week: 16
  title: The Garden Door
  hook_ru: Дверь в сад за домом заперта сорок лет. Ключ Тома подходит.
