# Сквозные герои историй. Их имена не считаются учебной лексикой.
characters:
  - name: Anna
    note: "Главная героиня. Только что переехала в новую квартиру, любит кофе и порядок."
  - name: Tom
    note: "Друг Анны, сосед по дому. Весёлый, вечно что-то теряет."
  - name: Mia
    note: "Знакомая Анны и Тома. Работает в кафе на углу, замечает всё."
