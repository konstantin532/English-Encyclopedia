# Сквозные герои историй. Их имена не считаются учебной лексикой.
characters:
  - name: Anna
    note: "Главная героиня. Из России, только что переехала в новый дом, любит кофе и порядок. Учительница в школе. Её кот — Box."
  - name: Tom
    note: "Друг Анны, сосед по дому. Весёлый, вечно что-то теряет. Работает дома за компьютером."
  - name: Mia
    note: "Знакомая Анны и Тома. Бариста в кафе на углу, замечает всё. Встаёт в пять."
  - name: Belova
    note: "Фамилия Анны (неделя 9: Анна диктует её по буквам)."
