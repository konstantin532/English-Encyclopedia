# Сквозные герои историй. Их имена не считаются учебной лексикой.
characters:
  - name: Anna
    note: "Главная героиня. Из России, только что переехала в новый дом, любит кофе и порядок. Учительница в школе. Её кот — Box."
  - name: Tom
    note: "Друг Анны, сосед по дому. Весёлый, вечно что-то теряет. Работает дома за компьютером."
  - name: Mia
    note: "Знакомая Анны и Тома. Бариста в кафе на углу, замечает всё. Встаёт в пять."
  - name: Belova
    note: "Фамилия Анны (неделя 9: Анна диктует её по буквам)."
  - name: Rose
    note: "Загадка дома. Имя из письма без подписи (история 4). Кто она — раскрывается позже."
  - name: Ruth
    note: "Пожилая хозяйка закрытого фотоателье на Park Street, живёт над ним (история 7). Знала Rose."
  - name: Leo
    note: "Сосед сверху (A1, неделя 7: работает по ночам). Ночной медбрат, тихий и добрый; Rose учила его читать (история 9)."
  - name: Sam
    note: "Младший брат Rose. Уехал шестьдесят лет назад; пишет белые письма без марки (истории 10–11)."
  - name: Linda
    note: "Мама Тома. Живёт в другом штате, звонит сыну по видео и всегда спрашивает, тепло ли он одет (A1+, неделя 1)."
  - name: Kate
    note: "Коллега Тома: они видятся по понедельникам, когда Том приезжает в офис на совещание. Весёлая, любит кино и честно говорит, что ей не понравилось (A1+, неделя 3)."
  - name: Jake
    note: "Новый помощник в кафе Мии. Старательный, задаёт много вопросов и боится что-нибудь разбить (A1+, неделя 8)."
