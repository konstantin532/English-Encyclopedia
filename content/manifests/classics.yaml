# «Классика»: легендарные скороговорки и стихи, которые знает каждый американец.
# Это культурный бонус, а не основа курса: слова здесь сложнее программы A1,
# поэтому у каждой строки есть перевод, а у трудных слов — сноска.
# Права проверяются отдельно для России и США в apps/core/classics.py.
# Скороговорки здесь — распространённые фольклорные устные формулы,
# а не более поздние авторские песни/переработки.
twisters:
  - slug: which-witch
    author: folk
    text: "Which witch is which?"
    ru: "Какая ведьма — какая?"
    sounds: "w и wh"
    ipa: "/ˈwɪtʃ ˈwɪtʃ ɪz ˈwɪtʃ/"
    tip_ru: "Губы трубочкой, как для «у», и сразу раскрыть. Не «вич»: в начале нет зубов на губе — это не русское «в»."
    why_ru: "Русскоязычные часто заменяют w на «в»: west звучит как vest. Здесь w трижды за секунду."
    glossary: {witch: ведьма, which: который}
  - slug: toy-boat
    author: folk
    text: "Toy boat. Toy boat. Toy boat."
    ru: "Игрушечная лодка. Игрушечная лодка. Игрушечная лодка."
    sounds: "oi и oʊ"
    ipa: "/ˈtɔɪ ˈboʊt/"
    tip_ru: "Произнесите пять раз подряд быстро. Toy — «той», boat — «боут», с лёгкой «у» в конце гласной."
    why_ru: "Два коротких слова, но язык путает «ой» и «оу» уже на третьем повторе. Короче её нет, а сложнее мало."
    glossary: {toy: игрушка, boat: лодка}
  - slug: red-leather
    author: folk
    text: "Red leather, yellow leather."
    ru: "Красная кожа, жёлтая кожа."
    sounds: "r и l"
    ipa: "/ˈrɛd ˈlɛðɚ ˈjɛloʊ ˈlɛðɚ/"
    tip_ru: "Американское r: язык не касается нёба и не дрожит, кончик чуть загнут назад. l — кончик языка у верхних зубов."
    why_ru: "Русское «р» дрожит, американское — нет. А r и l рядом заставляют язык прыгать между двумя положениями."
    glossary: {leather: кожа (материал), yellow: жёлтый}
  - slug: big-black-bug
    author: folk
    text: "A big black bug bit a big black bear."
    ru: "Большой чёрный жук укусил большого чёрного медведя."
    sounds: "æ и b"
    ipa: "/ə ˈbɪɡ ˈblæk ˈbʌɡ ˈbɪt ə ˈbɪɡ ˈblæk ˈbɛr/"
    tip_ru: "æ в black — рот открыт широко, звук между «а» и «э». Bug — короткое «а», bear — «бэр»."
    why_ru: "Различать bad и bed — классическая трудность. Здесь три разные гласные в словах, которые начинаются одинаково."
    glossary: {bug: жук, bit: укусил, bear: медведь}
  - slug: she-sells
    author: folk
    # Традиционная скороговорка засвидетельствована до песни Т. Салливана (1908).
    # https://blogs.loc.gov/folklife/2017/07/she-sells-seashells-and-mary-anning-metafolklore-with-a-twist/
    text: "She sells seashells by the seashore."
    ru: "Она продаёт ракушки на морском берегу."
    sounds: "s и sh"
    ipa: "/ʃi ˈsɛlz ˈsiʃɛlz baɪ ðə ˈsiʃɔr/"
    tip_ru: "s — улыбка, язык за нижними зубами. sh — губы вперёд, как для «ш», но мягче."
    why_ru: "Самая известная английская скороговорка в мире. Её знает каждый американец, она звучит в фильмах и мультфильмах."
    glossary: {sells: продаёт, seashells: ракушки, seashore: морской берег}
  - slug: woodchuck
    author: folk
    text: "How much wood would a woodchuck chuck if a woodchuck could chuck wood?"
    ru: "Сколько дерева бросил бы сурок, если бы сурок умел бросать дерево?"
    sounds: "w и ʊ"
    ipa: "/haʊ ˈmʌtʃ ˈwʊd wʊd ə ˈwʊdtʃʌk ˈtʃʌk ɪf ə ˈwʊdtʃʌk kʊd ˈtʃʌk ˈwʊd/"
    tip_ru: "wood и would звучат одинаково: «вуд» с губами-трубочкой. Начните медленно, по половине фразы."
    why_ru: "Американская классика: её учат дети в школе. Тренирует w и короткое «у», которого нет в русском."
    glossary: {wood: дерево (древесина), woodchuck: сурок, chuck: бросать (разг.)}
  - slug: unique-new-york
    author: folk
    text: "Unique New York. Unique New York. Unique New York."
    ru: "Неповторимый Нью-Йорк."
    sounds: "ju и n"
    ipa: "/juˈnik nu ˈjɔrk/"
    tip_ru: "Unique — «юник», New — в американском «ну», а не «нью». Повторите три раза, ускоряясь."
    why_ru: "Три слова, но на скорости язык спотыкается почти у всех. Любимая разминка актёров."
    glossary: {unique: "уникальный, неповторимый"}
  - slug: good-blood
    author: folk
    text: "Good blood, bad blood."
    ru: "Хорошая кровь, плохая кровь."
    sounds: "ʊ, ʌ и æ"
    ipa: "/ˈɡʊd ˈblʌd ˈbæd ˈblʌd/"
    tip_ru: "good — короткое «у», blood — короткое «а», bad — широкое «э». Три разных звука там, где русскому уху слышится один."
    why_ru: "Пишутся похоже (oo в good и blood), звучат по-разному. Хорошо показывает, что английское чтение не равно написанию."
    glossary: {blood: кровь}

poems:
  - slug: who-has-seen-the-wind
    title: "Who Has Seen the Wind?"
    author: "Christina Rossetti"
    author_death_year: 1894
    year: 1893
    source_edition: "Sing-Song: A Nursery Rhyme Book, new and enlarged edition (Macmillan, 1893); originally published 1872"
    source_url: "https://digital.library.upenn.edu/women/rossetti/singsong/singsong.html"
    lines:
      - ["Who has seen the wind?", "Кто видел ветер?"]
      - ["Neither I nor you:", "Ни я, ни ты:"]
      - ["But when the leaves hang trembling", "Но когда листья дрожат на ветках,"]
      - ["The wind is passing thro'.", "Это ветер проходит сквозь них."]
      - ["Who has seen the wind?", "Кто видел ветер?"]
      - ["Neither you nor I:", "Ни ты, ни я:"]
      - ["But when the trees bow down their heads", "Но когда деревья склоняют головы,"]
      - ["The wind is passing by.", "Это ветер проносится мимо."]
    about_ru: "Кристина Россетти — английская поэтесса XIX века. Здесь ветер нельзя увидеть, но его присутствие узнаётся по деревьям. Сохранено написание thro' из прижизненного издания 1893 года."
    learn_ru: "Neither ... nor — «ни ... ни». But when — «но когда». Обратите внимание на Present Simple: the wind is passing относится к моменту наблюдения."
    glossary: {neither: "ни один (из двух)", trembling: дрожащие, "thro'": "сокращённое through (сквозь)", "bow down": наклоняться}

  - slug: im-nobody
    title: "I'm Nobody! Who are you?"
    author: "Emily Dickinson"
    author_death_year: 1886
    year: 1891
    source_edition: "Poems by Emily Dickinson, Second Series (Roberts Brothers, Boston, 1891), Life, poem I (first posthumous publication)"
    source_url: "https://en.wikisource.org/wiki/Page:Emily_Dickinson_Poems_-_second_series_(1891).djvu/33"
    lines:
      - ["I'm nobody! Who are you?", "Я — никто! А ты кто?"]
      - ["Are you nobody, too?", "Ты тоже никто?"]
      - ["Then there's a pair of us—don't tell!", "Тогда нас двое — только не рассказывай!"]
      - ["They'd banish us, you know.", "Нас бы прогнали, знаешь."]
      - ["How dreary to be somebody!", "Как уныло быть знаменитостью!"]
      - ["How public, like a frog", "Как выставляться напоказ, словно лягушка,"]
      - ["To tell your name the livelong day", "Весь долгий день повторять своё имя"]
      - ["To an admiring bog!", "Перед восхищённым болотом!"]
    about_ru: "Эмили Дикинсон — американская поэтесса XIX века. Стихотворение впервые напечатали после её смерти. Здесь автор иронизирует над стремлением быть знаменитым."
    learn_ru: "There's a pair of us — «нас двое». They'd = they would. В оригинальном издании сохранено написание don't и тире."
    glossary: {nobody: никто, pair: пара, banish: изгнать, dreary: унылый, livelong: "весь (день)", bog: болото}

  - slug: annas-map
    title: "A Circle on the Map"
    author: original
    year: 2026
    lines:
      - ["At the corner café, Anna unfolds a map.", "В кафе на углу Анна разворачивает карту."]
      - ["She marks a place she has never been.", "Она отмечает место, где ещё не бывала."]
      - ["The coffee cools beside her pencil.", "Кофе остывает рядом с карандашом."]
      - ["Outside, the morning bus turns east.", "Снаружи утренний автобус поворачивает на восток."]
      - ["One small circle shines in blue ink.", "На карте синими чернилами сияет маленький кружок."]
      - ["Tomorrow has no address yet,", "У завтрашнего дня пока нет адреса,"]
      - ["but today she knows where to begin.", "но сегодня она знает, с чего начать."]
    about_ru: "Новое авторское стихотворение о мечте Анны отправиться в неизведанное. Не перевод и не переработка чужих произведений."
    learn_ru: "She marks — Present Simple с -s; has never been — опыт; where to begin — «с чего начать»."
    glossary: {unfolds: разворачивает, marks: отмечает, east: восток, ink: чернила, begin: начинать}

  - slug: annas-misty-morning
    title: "The Morning Without Edges"
    author: original
    year: 2026
    lines:
      - ["By the bakery, the street signs fade.", "У пекарни дорожные знаки теряют чёткость."]
      - ["Anna waits beneath a yellow awning.", "Анна ждёт под жёлтым навесом."]
      - ["Beyond the glass, the traffic lights glow softly.", "За стеклом мягко светятся светофоры."]
      - ["The town becomes a quiet watercolor.", "Городок превращается в тихую акварель."]
      - ["She hears the first bus before she sees it.", "Она слышит первый автобус прежде, чем видит его."]
      - ["Then a door opens across the square,", "Затем на другой стороне площади открывается дверь,"]
      - ["and warm voices give the morning its shape.", "и тёплые голоса придают утру очертания."]
    about_ru: "Новое авторское стихотворение о туманном утре в городке Анны — без заимствований из чужих стихов."
    learn_ru: "Before she sees it — «до того, как увидит». Beneath — «под»; across the square — «на другой стороне площади»."
    glossary: {bakery: пекарня, fade: тускнеть, awning: навес, glow: светиться, watercolor: акварель, shape: форма}

  - slug: hickory-dickory-dock
    title: "Hickory, Dickory, Dock"
    author: folk
    year: 1744
    lines:
      - ["Hickory, dickory, dock,", "Хикори-дикори-док,"]
      - ["The mouse ran up the clock.", "Мышка взбежала на часы."]
      - ["The clock struck one,", "Часы пробили час,"]
      - ["The mouse ran down,", "Мышка сбежала вниз,"]
      - ["Hickory, dickory, dock.", "Хикори-дикори-док."]
    about_ru: "Песенку поют американским детям почти 300 лет. Первые слова — просто звукоподражание тиканью часов."
    learn_ru: "Слушайте ритм: ТИ-ка-ТИ-ка. Английский — язык ударений, и эта песенка учит его пульсу. Clock и время — как в неделе 6."
    glossary: {mouse: мышь, ran up: взбежала, struck one: пробили час}
  - slug: buckle-my-shoe
    title: "One, Two, Buckle My Shoe"
    author: folk
    year: 1805
    lines:
      - ["One, two, buckle my shoe;", "Раз, два — застегни туфлю;"]
      - ["Three, four, knock at the door;", "Три, четыре — постучи в дверь;"]
      - ["Five, six, pick up sticks;", "Пять, шесть — собери палочки;"]
      - ["Seven, eight, lay them straight;", "Семь, восемь — сложи их ровно;"]
      - ["Nine, ten, a big fat hen.", "Девять, десять — большая толстая курица."]
    about_ru: "Счёт до десяти в рифму: каждое число рифмуется с действием. Так американские дети учат цифры."
    learn_ru: "Числа из недели 3, но в ритме. Произнесите быстро: three — с th, eight — «эйт»."
    glossary: {buckle: застегнуть пряжку, shoe: туфля, knock: стучать, sticks: палочки, straight: ровно, hen: курица}
  - slug: mondays-child
    title: "Monday's Child"
    author: folk
    year: 1838
    lines:
      - ["Monday's child is fair of face,", "Дитя понедельника — красиво лицом,"]
      - ["Tuesday's child is full of grace,", "Дитя вторника — полно изящества,"]
      - ["Wednesday's child is full of woe,", "Дитя среды — полно печали,"]
      - ["Thursday's child has far to go,", "Дитя четверга — далеко пойдёт,"]
      - ["Friday's child is loving and giving,", "Дитя пятницы — любит и дарит,"]
      - ["Saturday's child works hard for a living,", "Дитя субботы — трудится ради хлеба,"]
      - ["But the child who is born on the Sabbath day", "А дитя, рождённое в воскресенье,"]
      - ["Is bonny and blithe, and good and gay.", "Прелестно, беспечно, доброе и весёлое."]
    about_ru: "Старинное гадание по дню рождения. Найдите свой день недели! Язык местами старинный: в последней строке слова значат «прелестный», «беспечный», «весёлый» — так их понимали двести лет назад."
    learn_ru: "Все дни недели с 's (Monday's child) — как притяжательный падеж из недели 4 (Mia's brother). Дни недели — неделя 10."
    glossary: {fair: красивый (старинное), grace: изящество, woe: печаль, "far to go": далеко пойдёт, "for a living": чтобы заработать на жизнь, Sabbath day: день отдыха (здесь — воскресенье), bonny: прелестный, blithe: беспечный, gay: весёлый (старинное значение)}
