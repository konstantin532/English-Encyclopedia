questions:
  - q: "Где Анна находится в семь часов?"
    a: "I am at the corner cafe. — В кафе на углу."
  - q: "Кто пьёт молоко Мии?"
    a: "There is a big cat. It likes Mia's milk. — Большой кот, это Box."
  - q: "Когда кот приходит в кафе?"
    a: "It is here at seven every day. — Каждый день в семь."
  - q: "Куда пропал Box и почему Анна в конце спокойна?"
    a: "Box is at home! — Он сам вернулся домой. Ему нравится и кафе, и дом: утром он ходит к Мие за молоком."
