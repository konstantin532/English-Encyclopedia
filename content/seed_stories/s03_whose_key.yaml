grammar_ru: 'Is it…? — вопрос с be; Anna’s door — принадлежность. For в key for the mailbox показывает, к какому замку подходит ключ. Whose key is it? — «Чей это ключ?». Who has a key? — готовый вопрос «У кого есть ключ?».'
prediction_ru: Посмотрите на название и описания картинок. Чей это ключ? К какой двери он подходит? Again! означает «Опять!» — Том снова удивляется месту, где лежат его ключи.
visual_cues:
- Утро. У двери Тома на коврике лежит маленький старый ключ, тёмный, с круглой головкой.
- У калитки — старый синий почтовый ящик с крошечной замочной скважиной.
