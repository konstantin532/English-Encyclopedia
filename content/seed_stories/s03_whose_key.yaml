questions:
  - q: "Где Том находит ключ?"
    a: "There is an old key next to my door. — У своей двери."
  - q: "Это ключ Анны?"
    a: "No, it is not my key. — Нет, Анна его не узнаёт."
  - q: "К чему подходит ключ?"
    a: "The key is for the mailbox! — К старому почтовому ящику."
  - q: "Почему в конце Анна говорит «our mailbox»?"
    a: "Ящик стоит у их дома, и ключ теперь у них. Старый почтовый ящик стал общим — их."
