questions:
- q: Где Том находит ключ?
  a: There is an old key next to my door. — У своей двери.
- q: Где обычно ключи Тома?
  a: My keys are… in the fridge. Again! — В холодильнике. И так каждый день.
- q: К чему подходит старый ключ?
  a: The key is for the mailbox! — К старому почтовому ящику.
- q: Какой вопрос остаётся в конце?
  a: Who has a key to our mailbox? — У кого ещё есть ключ от их ящика? Это пока загадка.
