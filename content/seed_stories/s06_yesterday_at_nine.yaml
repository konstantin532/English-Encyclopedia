questions:
- q: Почему свет в окне наверху странный?
  a: The man upstairs works at night. — Сосед работает ночью, в девять его никогда нет дома.
- q: Что было у мужчины в руке?
  a: He had a white envelope in his hand. — Белый конверт.
- q: Почему Анна села на пол?
  a: Can he see me? I sat on the floor under my window. — Боялась, что мужчина её увидит.
- q: Почему Анна не позвонила Тому?
  a: 'But what can I say? — Не знала, что сказать: «в окне мужчина»?'
- q: Где была туфля Тома?
  a: In the fridge, Tom. — В холодильнике.
- q: Где был Том вчера в девять?
  a: I was at the cafe. — В кафе, с Мией.
- q: Что Том предлагает?
  a: Today at nine, you and I can watch the window. — Вместе смотреть на окно, а он приготовит ужин (хотя готовить не умеет).
