questions:
- q: Где была Анна вчера в девять вечера?
  a: At nine o'clock in the evening, I was in the kitchen with Box. — На кухне с котом Box.
- q: Почему свет в окне наверху странный?
  a: The man upstairs works at night. — Сосед работает ночью, в девять его никогда нет дома.
- q: Что было у мужчины в руке?
  a: He had a white envelope in his hand. — Белый конверт.
- q: Куда смотрел мужчина?
  a: He looked at our mailbox. — На их почтовый ящик.
- q: Где был Том вчера в девять?
  a: I was at the cafe. — В кафе, с Мией.
- q: Что Том предлагает сделать сегодня в девять?
  a: Today at nine, you and I can watch the window. And I can cook dinner. — Вместе смотреть на окно, а он приготовит ужин (хотя готовить не умеет).
