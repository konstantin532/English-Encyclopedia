questions:
- q: Что будет, если пойдёт дождь (по словам Тома)?
  a: If it rains, we will eat in the kitchen. — Поедят на кухне.
- q: Что удивительного сделал Том?
  a: He did not lose one apple! — Впервые ничего не потерял.
- q: Где был конверт?
  a: Then Tom looked under the bench. There was a white envelope. — Под скамейкой.
- q: Что написано в письме?
  a: Rose, if you find this, come to the park on Sunday at ten. I had a key to our old house. I lost it. Sam. — Сэм зовёт Роуз в парк в воскресенье в десять.
- q: Чей ключ был у двери Тома?
  a: It was his key! — Ключ Сэма.
- q: Кто такой Сэм?
  a: Rose had a young brother. His name was Sam. — Младший брат Роуз; он уехал шестьдесят лет назад.
