questions:
- q: Где Том сначала искал телефон и почему это смешно?
  a: 'Did you look in the fridge? — В холодильнике: вещи Тома всегда оказываются там.'
- q: Куда Том ездил вчера?
  a: I went to Park Street. I took the bus. — На Park Street, на автобусе.
- q: Кто нашёл телефон и где?
  a: I found it at my door on Park Street. My name is Ruth. — Рут нашла его у своей двери.
- q: Почему Рут больше не работает в фотоателье?
  a: I am old, and I do not work now. I live upstairs. — Она старая и живёт над ателье.
- q: Что Рут сказала про дом Анны?
  a: Sixty years ago, Rose lived there. — Шестьдесят лет назад там жила Роуз.
- q: Почему разговор оборвался?
  a: I cannot say. Not on the phone. — Рут не хочет говорить по телефону. Ответ — в 16:00 на Park Street.
