questions:
- q: Кто открыл дверь?
  a: It was the man from the window! — Мужчина из окна, сосед Лео.
- q: Как говорит Лео и почему?
  a: 'Could you speak quietly? My cat is old. — Тихо: у него старая кошка.'
- q: Кем работает Лео?
  a: I am a nurse. I work at the hospital at night. — Ночным медбратом в больнице.
- q: Почему в понедельник он был дома?
  a: But on Monday, I was sick, and I was at home. — Он болел.
- q: Кого он увидел у почтового ящика?
  a: He was old, and he had a black coat and a hat. — Старика в чёрном пальто и шляпе.
- q: Откуда Лео знает Роуз?
  a: She was my teacher. When I was a boy, I could not read. Rose taught me at her kitchen table. — Роуз научила его читать.
