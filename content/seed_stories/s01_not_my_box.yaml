questions:
  - q: "Где происходит история?"
    a: "This is my new house. — В новом доме Анны."
  - q: "Это коробка Анны?"
    a: "No, it is not my box."
  - q: "Что в коробке?"
    a: "It is a cat!"
  - q: "Почему в конце Анна говорит «it is my cat»? Что она решила?"
    a: "Коту нравится её кофе, и он понравился ей самой. Анна решает оставить кота себе и даёт ему имя Box."
phrase_hunt:
  - phrase: "Good morning, Anna!"
    function: "Приветствие утром"
  - phrase: "Is this your box?"
    function: "Вопрос: чья это вещь?"
  - phrase: "No, it is not my box."
    function: "Отрицание с be"
  - phrase: "Is it a book?"
    function: "Угадывание: вопрос с be впереди"
  - phrase: "It has a name: Box."
    function: "Как назвать предмет или питомца"
retell_words: [house, coffee, box, cat, name]
retell_steps:
  - "Восстановите историю по пяти словам: house, coffee, box, cat, name. По одной фразе на слово."
  - "Перескажите без подсказок, 5–6 фраз, от лица Анны: My name is Anna…"
creative_ru: "На следующий день Том приходит снова. Придумайте 2–3 его фразы и ответ Анны из знакомых слов. Например: Is it your cat, Anna?"
