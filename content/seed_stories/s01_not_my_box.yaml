number: 1
characters: [Anna, Tom]
grammar_ru: "be (am, is), have, like в Present Simple; вопросы Is it…?, отрицание is not"
prediction_ru: "Посмотрите на название и описания картинок. Как вы думаете, чья это коробка и что в ней?"
visual_cues:
  - "Утро. На пороге нового дома стоит Том с огромной картонной коробкой в руках."
  - "Из приоткрытой коробки выглядывает рыжий кот. Рядом на столе — чашка кофе."
