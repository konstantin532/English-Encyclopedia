questions:
- q: Что Анна и Том делают в субботу?
  a: Tom and I move the old cupboard. — Двигают тяжёлый старый шкаф.
- q: Что за шкафом?
  a: There is a photo behind the cupboard! — Старое фото.
- q: Кто на фото?
  a: There is a mother, a father, and six children. — Большая семья.
- q: Почему Анна удивлена?
  a: It is not my family. But it is my house! — Семья чужая, а дом на фото — её.
- q: Что написано на обороте и почему это важно?
  a: 'There is a name: Rose. And there is an address: Park Street. — То же имя, что в письме без подписи. Теперь у загадки есть адрес.'
