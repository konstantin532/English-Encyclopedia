questions:
- q: Что Анна нашла в книге?
  a: And in the book, there was a map! Two children drew it. — Карту, которую нарисовали двое детей.
- q: Чьи имена на карте?
  a: 'There were two names on the map: Rose and Sam. — Rose и Sam.'
- q: Куда ведёт линия на карте?
  a: It went across Park Street, past the bus stop, and to a big tree with a red X. — Через Park Street, мимо остановки, к большому дереву.
- q: Кто первым нашёл место под деревом?
  a: Box always finds it first. — Кот Box.
- q: Что было в коробке?
  a: In the box, there were two red pencils, a small blue car, three photos, and a letter. — Карандаши, машинка, фото и записка.
- q: Что написано в записке?
  a: This is our box. Rose and Sam. Nineteen sixty-five. — Это наша коробка. Роуз и Сэм. 1965.
