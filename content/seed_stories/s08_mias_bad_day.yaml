questions:
- q: Почему Мия опоздала?
  a: At the bus stop, there was an old man with a heavy bag. I helped him with the bag. — Помогала старику с тяжёлой сумкой.
- q: Что сказал начальник?
  a: You must not be late! — Опаздывать нельзя.
- q: Что Мия должна сделать в подвале?
  a: You have to open every box and look at every paper. — Открыть каждую коробку и посмотреть каждую бумагу.
- q: Что Мия нашла?
  a: 'There was a girl at a table. On the back of the photo, there was a name: Rose. — Фото девушки, на обороте имя Rose.'
- q: Что Роуз должна была делать в молодости?
  a: She had to help them. She had to work here every day. — Помогать большой семье и работать в кафе каждый день.
- q: Как начальник поблагодарил Мию?
  a: And Mia… thank you for the old man with the bag. You are a good barista. — За доброту к старику.
