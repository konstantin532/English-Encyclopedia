questions:
- q: Когда Анна ходит к старому ящику?
  a: It is eight o'clock. I go to the old mailbox. Every evening. — Каждый вечер в восемь.
- q: Что Том думает о ящике?
  a: The mailbox does not get letters. Never! — Туда письма не приходят. Никогда.
- q: Чего нет на письме?
  a: 'There is no name on the letter. No address. No stamp. — Ни имени, ни адреса, ни марки: письмо принесла не почта.'
- q: Что внутри письма?
  a: 'There is one word: Rose. — Одно слово: имя Rose.'
- q: Кому не нравится письмо?
  a: Box does not like the letter. — Коту. И Анне теперь не по себе.
