    a: "There is a letter in the mailbox! It is white. — Белое письмо."
  - q: "Что написано на конверте?"
    a: "There is no name on the letter. There is no address. — Ничего: ни имени, ни адреса."
  - q: "Почему Том удивлён?"
    a: "But the mailbox does not get letters! — Почтальон говорил, что в этот ящик письма не приходят. Значит, письмо принесла не почта."
  - q: "Что внутри письма?"
    a: "There is one word: Rose. — Одно слово: имя Rose. Кто она, пока неизвестно."
