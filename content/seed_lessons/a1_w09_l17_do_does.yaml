slug: a1-questions-do-does
level: A1
week: 9
order: 17
focus: D
minutes: 40
title: "Вопросы с do и does: What, when, which — Do you…? What time does…?"
summary: "Как задавать вопросы в настоящем простом времени: Do you have my key? What time does the shop open? Когда do, а когда does, и куда девается -s."
units: [LX-00182, LX-00186, LX-00188, LX-00191, LX-00192, LX-00348, LX-00349, LX-00350, LX-00357, LX-00358]
sound_notes:
  - text: "Do you have my key?"
    ipa: "/də jə ˈhæv maɪ ˈki/"
    note_ru: "do you сливаются в «дэ ю», ударение на have и key"
  - text: "What time does the shop open?"
    ipa: "/ˌwʌt ˈtaɪm dəz ðə ˈʃɑp ˈoʊpən/"
    note_ru: "does без ударения — «дэз»; голос опускается в конце, как в любом вопросе с what"
  - text: "It opens at nine."
    ipa: "/ɪt ˈoʊpənz ət ˈnaɪn/"
    note_ru: "-s после n звонкое: «оупэнз»"
contractions:
  - full: "does not"
    short: "doesn't"
    ipa: "/ˈdʌzənt/"
    note_ru: "It doesn't open at eight — «Она не открывается в восемь»."
  - full: "what is"
    short: "what's"
    ipa: "/wʌts/"
    note_ru: "What's your phone number? — так спрашивают почти всегда."
layers:
  - number: 1
    body: |
      На неделях 6 и 7 вы видели вопросы с do и does по отдельности. Теперь соберём их вместе и добавим вопросительные слова.

      > [O1]Hello[/]! [T2]This[/] [D1]is[/] [S1]Anna[/]. [D1]Do[/] [T8]you[/] [D1]have[/] [T3]my[/] [S2]key[/], [O8]please[/]? — Алло! Это Анна. Мой ключ у вас?
      > [T9]What[/] [S7]time[/] [D1]does[/] [T1]the[/] [S4]shop[/] [D2]open[/]? — А во сколько открывается мастерская?

      В **обычных вопросах с have / work / open** помощник **do** или **does** ставят **перед подлежащим**: *Do you have…?*, *Does the shop open…?*. Но не всякий вопрос в английском требует **do**: с **be** и **can** вопросы строятся иначе.
  - number: 2
    body: |
      **do** — одно из древнейших английских слов, родственное немецкому `tun`. Сначала оно значило «класть, ставить», потом «делать». В вопросах do начали использовать около 500 лет назад, во времена Шекспира. Раньше спрашивали, просто переставляя глагол: «Have you my key?».

      **hello** — молодое слово. Широко его стали говорить вместе с изобретением телефона: Эдисон советовал начинать разговор именно с него.
  - number: 3
    body: |
      Схема вопроса:

      > [D1]Do[/] [T8]you[/] [D1]have[/] [T3]my[/] [S2]key[/]? — У вас мой ключ?
      > [T9]What[/] [S7]time[/] [D1]does[/] [T1]the[/] [S4]shop[/] [D2]open[/]? — Во сколько открывается мастерская?

      - **I, you, we, they** — **do**: *Do you…?*
      - he, she, it, одна вещь или человек — **does**: Does the shop…?
      - После do / does глагол без -s: does the shop open.
      - Для вопросов, где спрашиваем **не о подлежащем**, вопросительное выражение ставим **перед помощником**: *What time does…?*, *Where do you…?*. Позже вы встретите вопросы вроде *Who works here?*, в которых **do/does не нужны**.

      Вопросительное слово ставят **перед** do / does. Вот все, что вы уже знаете:

      - [T9]what[/] — что, какой: What time does the shop open?
      - [A6]when[/] — когда: When does the shop close?
      - [A6]where[/] — где, [T9]who[/] — кто, [A6]why[/] — почему, [A6]how[/] — как
      - [T9]which[/] — **который из известных вариантов**: *Which key is your key?* Здесь вопрос уже с **be**, поэтому отдельный *do* не нужен.
      - [T9]whose[/] — **чей**: *Whose key is it?* Это тоже вопрос с *is*. Так вы видите, что разные типы вопросов могут иметь разный каркас.

      > [T8]It[/] [D2]opens[/] [P3]at[/] [N3]nine[/] [C1]and[/] [D2]closes[/] [P3]at[/] [N3]five[/]. — Открываемся в девять, закрываемся в пять.

      [D2]open[/] и [D2]close[/] с he, she, it получают -s: it opens, it closes. Спросить разрешения задать вопрос: [D7]Can[/] [T8]I[/] [D5]ask[/] [T8]you[/]?
  - number: 4
    body: |
      **Почему open без -s после does?** Форму третьего лица уже показывает **does**, поэтому смысловой глагол ставят в начальной форме. Образ «-s переходит к помощнику» полезен как подсказка, но не следует понимать его буквально. Сравните:

      - The shop opens at nine. — The shop **does** open → Does the shop open?
      - Tom works at home. → Does Tom work at home?

      В **этом вопросе** не нужно добавлять второе окончание: *Does the shop open?*, не *Does the shop opens?*. Это правило именно для вопросов и отрицаний с **does**, а не для всех предложений с несколькими глаголами.

      > [T8]It[/] [D2]opens[/] [P3]at[/] [N3]nine[/] [C1]and[/] [D2]closes[/] [P3]at[/] [N3]five[/]. — Открываемся в девять, закрываемся в пять.
  - number: 5
    body: |
      Так звучит деловой звонок в Америке:

      > [O1]Hello[/]! [S2]Key[/] [S4]shop[/]. — Алло! Мастерская ключей.
      > [O1]Hello[/]! [T2]This[/] [D1]is[/] [S1]Anna[/]. [D1]Do[/] [T8]you[/] [D1]have[/] [T3]my[/] [S2]key[/], [O8]please[/]? — Алло! Это Анна. Мой ключ у вас?

      - В магазине или мастерской сразу называют место: Key shop. Hello, cafe on the corner.
      - При представлении по телефону естественнее **This is Anna** или сокращённо *It's Anna*. **I am Anna** грамматически возможно, но не типично как первое представление по телефону; это различие **употребления**, а не правильности формы.
      - Прощаются коротко: See you! See you at nine!
  - number: 6
    body: |
      Три частые ошибки:

      - «Does the shop opens?» — лишнее -s. Правильно: Does the shop open?
      - «What time the shop opens?» — пропущен помощник. Правильно: What time does the shop open?
      - «Do he work?» — с he нужен does: Does he work?

      Вопросы с be (Is it…? Where is…?) живут без do: Where is the bank? — не «Where does the bank is».
  - number: 7
    body: |
      Шесть заданий: выбрать do или does, вставить помощника, собрать вопрос о времени, задать вопрос в новой ситуации, выбрать вопросительное слово и собрать вопрос о закрытии.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Как правильно спросить, во сколько открывается мастерская?"
    options: ["What time does the shop open?", "What time does the shop opens?", "What time the shop opens?"]
    answer: "What time does the shop open?"
    hint_ru: "-s бывает только один раз."
    explanation_ru: "Does уже показывает форму третьего лица с the shop, поэтому основной глагол open остаётся без -s: What time does the shop open?"
    units: [LX-00191]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Вы звоните в мастерскую. Спросите, у них ли ваш ключ."
    prompt_en: "___ you have my key?"
    answer: "Do"
    hint_ru: "С you — do."
    explanation_ru: "Do you have my key? — с you помощник do."
    units: [LX-00188]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Во сколько открывается кафе?»"
    options: [the, open, What, cafe, time, does]
    answer: "What time does the cafe open"
    hint_ru: "What time, потом does, потом кафе и open."
    explanation_ru: "What time does the cafe open? — кафе одно, поэтому does."
    units: [LX-00186, LX-00191]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вы хотите узнать, работает ли Мия каждый день. Спросите Тома."
    prompt_en: "___"
    answer: "Does Mia work every day?"
    accepted: ["Does Mia work every day", "Tom, does Mia work every day?", "Does she work every day?", "Does she work every day"]
    hint_ru: "Mia — один человек: does."
    explanation_ru: "Does Mia work every day? — с Mia помощник does, work без -s."
    units: [LX-00186]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: "Вы хотите узнать, КОГДА закрывается банк. С чего начать вопрос?"
    options: ["When does the bank close?", "Where does the bank close?", "Who does the bank close?"]
    answer: "When does the bank close?"
    hint_ru: "«Когда» по-английски…"
    explanation_ru: "When does the bank close? — when спрашивает о времени. Where — где, who — кто."
    units: [LX-00349, LX-00358]
  - order: 6
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Во сколько закрывается магазин?»"
    options: [shop, What, the, close, does, time]
    answer: "What time does the shop close"
    hint_ru: "What time + does + the shop + глагол без -s."
    explanation_ru: "What time does the shop close? — does забирает -s, поэтому close без -s."
    units: [LX-00348, LX-00358]
