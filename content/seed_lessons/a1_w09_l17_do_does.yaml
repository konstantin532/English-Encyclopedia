    uid: EX-00092
    kind: choice
    stage: recognition
    prompt_ru: "Как правильно спросить, во сколько открывается мастерская?"
    options: ["What time does the shop open?", "What time does the shop opens?", "What time the shop opens?"]
    answer: "What time does the shop open?"
    hint_ru: "С the shop нужен does; после него — open."
    explanation_ru: "Does уже показывает форму третьего лица с the shop, поэтому глагол open остаётся без -s: What time does the shop open?"
    units: [LX-00191]
