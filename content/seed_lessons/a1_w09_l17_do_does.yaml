    answer: "What time does the shop close"
    hint_ru: "What time + does + the shop + глагол без -s."
    explanation_ru: "What time does the shop close? — does показывает третье лицо, а глагол close остаётся как в словаре."
    units: [LX-00348, LX-00358]
