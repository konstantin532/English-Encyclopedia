slug: a1-questions-do-does
level: A1
week: 9
order: 17
focus: D
minutes: 40
title: "Вопросы с do и does: What, when, which — Do you…? What time does…?"
summary: "Как задавать вопросы в настоящем простом времени: Do you have my key? What time does the shop open? Когда do, а когда does, и куда девается -s."
units: [LX-00182, LX-00186, LX-00188, LX-00191, LX-00192, LX-00348, LX-00349, LX-00350, LX-00357, LX-00358, LX-01059, LX-01060, LX-01061]
sound_notes:
  - text: "Do you have my key?"
    ipa: "/də jə ˈhæv maɪ ˈki/"
    note_ru: "do you сливаются в «дэ ю», ударение на have и key"
  - text: "What time does the shop open?"
    ipa: "/ˌwʌt ˈtaɪm dəz ðə ˈʃɑp ˈoʊpən/"
    note_ru: "В этом нейтральном вопросе тон обычно понижается к концу. Безударное does может звучать /dəz/; интонация зависит от ситуации, а не только от слова what."
  - text: "It opens at nine."
    ipa: "/ɪt ˈoʊpənz ət ˈnaɪn/"
    note_ru: "-s после n звонкое: «оупэнз»"
contractions:
  - full: "does not"
    short: "doesn't"
    ipa: "/ˈdʌzənt/"
    note_ru: "It doesn't open at eight — «Она не открывается в восемь»."
  - full: "what is"
    short: "what's"
    ipa: "/wʌts/"
    note_ru: "What's your phone number? — сокращённый вариант What is your phone number? Обе формы правильны."
layers:
  - number: 1
    body: |
      Анна звонит в мастерскую. Ключ готов? Во сколько открываетесь? По телефону не помогут жесты — только правильно построенный вопрос. Сегодня вы соберёте все вопросы с **do** и **does** в одну понятную систему.

      На неделях 6 и 7 вы видели вопросы с do и does по отдельности. Теперь соберём их вместе и добавим вопросительные слова.

      > [O1]Hello[/]! [T2]This[/] [D1]is[/] [S1]Anna[/]. [D1]Do[/] [T8]you[/] [D1]have[/] [T3]my[/] [S2]key[/], [O8]please[/]? — Алло! Это Анна. Мой ключ у вас?
      > [T9]What[/] [S7]time[/] [D1]does[/] [T1]the[/] [S4]shop[/] [D2]open[/]? — А во сколько открывается мастерская?

      В вопросах с **have / work / open** начинаем с **do / does**, затем называем, о ком или о чём спрашиваем: *Do you have…?*, *Does the shop open…?* Но **do** нужен не в каждом вопросе: с **be** и **can** используем другие знакомые образцы.
  - number: 2
    body: |
      Сначала решите, что вы хотите узнать: ответ **да / нет** или конкретную подробность.

      **You have my key. → Do you have my key?** — У вас мой ключ. → Мой ключ у вас? Помощник **do** показывает, что это вопрос; слово you — о ком мы спрашиваем — идёт после него.
      **The shop opens at nine. → Does the shop open at nine?** — Мастерская открывается в девять. → Мастерская открывается в девять? Shop — одна мастерская, поэтому **does**. Глагол остаётся **open**, без -s.

      Если неизвестно само время, вместо at nine спрашиваем **what time** и ставим эти слова в начало: **What time does the shop open?** — Во сколько открывается мастерская? Ответ: **It opens at nine.** В ответе помощника does нет, поэтому снова **opens**.

      Не добавляйте do ко всем вопросам подряд. **Is it your key?** — «Это ваш ключ?» — уже начинается с **is**, формы be. **Do you have my key?** — «Мой ключ у вас?» — содержит глагол have и требует помощника do. **Can you help me?** уже начинается с can, помощник do ему не нужен.
  - number: 3
    body: |
      Схема вопроса:

      > [D1]Do[/] [T8]you[/] [D1]have[/] [T3]my[/] [S2]key[/]? — У вас мой ключ?
      > [T9]What[/] [S7]time[/] [D1]does[/] [T1]the[/] [S4]shop[/] [D2]open[/]? — Во сколько открывается мастерская?

      - **I, you, we, they** — **do**: *Do you…?*
      - **he, she, it**, одна вещь или один человек — **does**: *Does the shop…?*
      - После **do / does** используем **open**, **have**, без добавленного окончания: *does the shop open*, *does she have*. Нужно **have**, а не **has**.
      - Если уточняем время или место, ставим эти слова в самое начало: *What time does…?*, *Where do you…?*

      **Для любопытных:** Вопрос *Who works here?* построен иначе: спрашиваем, **кто** работает. В нём **do / does** не нужны. Такой образец разберём отдельно.

      Сравните вопросительные слова: одни уже знакомы, другие ещё будут возвращаться в курсе. Сначала выберите, **что хотите узнать**, затем каркас вопроса:

      - [T9]what[/] — что, какой: What time does the shop open?
      - [A6]when[/] — когда: When does the shop close?
      - [A6]where[/] — где, [T9]who[/] — кто, [A6]why[/] — почему, [A6]how[/] — как
      - [T9]which[/] — **который из известных вариантов**: *Which key is your key?* Здесь вопрос уже с **be**, поэтому отдельный *do* не нужен.
      - [T9]whose[/] — **чей**: *Whose key is it?* Это тоже вопрос с *is*. Так вы видите, что разные типы вопросов могут иметь разный каркас.

      > [T8]It[/] [D2]opens[/] [P3]at[/] [N3]nine[/] [C1]and[/] [D2]closes[/] [P3]at[/] [N3]five[/]. — Открываемся в девять, закрываемся в пять.

      [D2]open[/] и [D2]close[/] с he, she, it получают -s: it opens, it closes. Спросить разрешения задать вопрос: [D7]Can[/] [T8]I[/] [D5]ask[/] [T8]you[/]?
  - number: 4
    body: |
      **Почему open без -s после does?** Форму третьего лица уже показывает **does**, поэтому глагол ставят как в словаре. Образ «-s переходит к помощнику» полезен как подсказка, но не следует понимать его буквально. Сравните:

      - The shop opens at nine. → Does the shop open?
      - Tom works at home. → Does Tom work at home?

      В **этом вопросе** не нужно добавлять второе окончание: *Does the shop open?*, не *Does the shop opens?*. Это правило именно для вопросов и отрицаний с **does**, а не для всех предложений с несколькими глаголами.

      > [T8]It[/] [D2]opens[/] [P3]at[/] [N3]nine[/] [C1]and[/] [D2]closes[/] [P3]at[/] [N3]five[/]. — Открываемся в девять, закрываемся в пять.

      **Диагностика понимания:** Магазин один. Что верно: *What time does the shop open?* или *What time does the shop opens?*?

      **Разбор:** *What time does the shop open?* Помощник **does** уже показывает форму для **shop**, поэтому после него **open** остаётся без **-s**. В утверждении было бы *The shop opens*.
  - number: 5
    body: |
      Так звучит деловой звонок в Америке:

      > [O1]Hello[/], [S2]Key[/] [S4]Shop[/]! [A6]How[/] [D7]can[/] [T8]I[/] [D2]help[/] [T8]you[/]? — Алло, мастерская ключей! Чем могу помочь?
      > [O1]Hello[/]! [T2]This[/] [D1]is[/] [S1]Anna[/]. [D1]Do[/] [T8]you[/] [D1]have[/] [T3]my[/] [S2]key[/], [O8]please[/]? — Алло! Это Анна. Мой ключ у вас?

      - В магазине или мастерской сразу называют место: Key shop. Hello, cafe on the corner.
      - При представлении по телефону естественнее **This is Anna** или сокращённо *It's Anna*. **I am Anna** грамматически возможно, но не типично как первое представление по телефону; это различие **употребления**, а не правильности формы.
      - Прощаются коротко: See you! See you at nine!
  - number: 6
    body: |
      Три частые ошибки:

      - «Does the shop opens?» — лишнее -s. Правильно: Does the shop open?
      - «What time the shop opens?» — пропущен помощник. Правильно: What time does the shop open?
      - «Do he work?» — с he нужен does: Does he work?

      Вопросы с be (Is it…? Where is…?) живут без do: Where is the bank? — не «Where does the bank is».
  - number: 7
    body: |
      Шесть заданий: выбрать do или does, вставить помощника, собрать вопрос о времени, задать вопрос в новой ситуации, выбрать вопросительное слово и собрать вопрос о закрытии.

      **Проверка маленького шага:** *Who works here?* — мы спрашиваем, **кто выполняет действие**, и **does** не нужен. *Where does Tom work?* — Том уже назван, мы спрашиваем, **где**, поэтому используем **does**. Нельзя строить каждый вопрос с **who/where** по одной схеме.
exercises:
