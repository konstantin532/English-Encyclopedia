layers:
- number: 1
  body: 'В аптеке главный вопрос — как часто принимать лекарство. По-английски это **How often…?**, а ответ — **once, twice, three times a day**.


    > [O4]No[/]. [A6]How[/] [A1]often[/] [D1]do[/] [T8]I[/] [D2]take[/] [T2]this[/] [S5]medicine[/]? — Нет. Как часто принимать это лекарство?

    > [A1]Twice[/] [T1]a[/] [S7]day[/], [P3]after[/] [S3]breakfast[/] [C1]and[/] [P3]after[/] [S3]dinner[/]. [T8]You[/] [D1]do[/] [X1]not[/] [D3]need[/] [T1]a[/] [S5]prescription[/]. — Два раза в день, после завтрака и после ужина. Рецепт не нужен.

    '
- number: 2
  body: '**Once** и **twice** связаны с *one* и *two*. В выражениях частоты это **«один раз»** и **«два раза»**: *once a day* — «раз в день», *twice a day* — «два раза в день». Отдельное *once* может также означать «однажды»; контекст важен. Начиная с трёх, английский уже не придумывает особых слов: **three times, four times** — «три раза, четыре раза». **Often** родственно старому *oft* — «часто», оно до сих пор встречается в стихах.

    '
- number: 3
  body: 'Схема:


    > [P3]For[/] [N1]five[/] [S7]days[/]. [D2]Read[/] [T1]the[/] [S2]label[/] [A4]carefully[/]. [C1]And[/] [D2]drink[/] [S3]tea[/] [P4]with[/] [S3]honey[/] [N1]three[/] [S7]times[/] [T1]a[/] [S7]day[/]. — Пять дней. Внимательно прочитайте инструкцию. И пейте чай с мёдом три раза в день.


    - Вопрос: **How often + do / does + кто + глагол?**

    - Ответ: **once / twice / three times + a day / a week / a month**.

    - Слова частоты: **always** — всегда, **often** — часто, **sometimes** — иногда, **never** — никогда.

    - Обычное место в простом утверждении — **перед смысловым глаголом**: I **often** forget. Но **после be**: I am **always** tired. С модальным глаголом — после него: I can **always** help. Выражение **twice a day** обычно ставят в конце: I take it **twice a day**.

    '
- number: 4
  body: '**Почему «twice a day», а не «twice in a day»?** В сочетаниях частоты и скорости **a** обозначает единицу периода или измерения: *twice a day* — «два раза **в день**», *60 miles an hour* — «60 миль **в час**», *$900 a month* — «900 долларов **в месяц**». Это значение близко к **per** («за один / в расчёте на»), а не буквальный перевод артикля как «каждый». *Twice in one day* тоже грамматически возможно, но подчёркивает два события **в пределах одного дня**, а не обычную частоту по расписанию.


    > [O3]Oh[/], [T8]I[/] [A1]always[/] [D2]drink[/] [S3]tea[/] [P4]with[/] [S3]honey[/]. [C5]But[/] [T8]I[/] [A1]often[/] [D6]forget[/] [T3]my[/] [S5]medicine[/]! — О, чай с мёдом я пью всегда. А вот лекарство часто забываю!


    **Диагностика понимания:** что верно: *I forget often my medicine* или *I often forget my medicine*?


    **Разбор:** *I often forget…* — слово частоты перед глаголом.

    '
- number: 5
  body: 'Так говорят американцы:


    - **How often…?** — как часто?

    - **at bedtime** — перед сном.

    - **Swallow it with water.** — запейте водой.

    - **Read the label.** — прочитайте этикетку.


    Слова: **often, once, twice**, **pill** — таблетка, **label** — этикетка, **bedtime** — время сна, **swallow** — глотать.

    '
- number: 6
  body: 'Ловушки:


    - «two times a day» — понятно, но обычно говорят **twice**.

    - Для регулярного режима: **twice a day**. **Twice in a day** возможно, если речь о двух случаях в пределах одного дня, но это не обычная формулировка расписания.

    - **I often forget my medicine** — удобный нейтральный порядок. **Often** бывает и в конце: *I go there often.* Поэтому положение в конце само по себе не ошибка; не вставляйте often между forget и my medicine.

    - «How much often» — просто **How often**.

    '
- number: 7
  body: 'Шесть заданий: выбрать once или twice, задать вопрос How often, поставить often на место, рассказать о своём режиме, выбрать «три раза в день» и прочитать этикетку.


    **Проверка маленького шага:** How often? — once / twice / three times a day. Often — перед глаголом.

    '
