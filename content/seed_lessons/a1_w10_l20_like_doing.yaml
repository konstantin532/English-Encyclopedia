slug: a1-like-doing
level: A1
week: 10
order: 20
focus: D
minutes: 40
title: "Что я люблю делать: I like reading и I like to read"
summary: "Как сказать, что вам нравится делать: I like reading, I like walking. Что такое -ing, как оно пишется и звучит, и чем like reading отличается от like to read."
units: [LX-00200, LX-00201, LX-00202, LX-00203, LX-00204, LX-00205, LX-00208, LX-00209, LX-00211, LX-00386, LX-00387, LX-00388]
sound_notes:
  - text: "I like reading."
    ipa: "/aɪ ˈlaɪk ˈridɪŋ/"
    note_ru: "В -ing произносим носовой /ŋ/, без отдельного /g/. Это не /n/: работает задняя часть языка, а не его кончик."
  - text: "Do you like walking?"
    ipa: "/də jə ˈlaɪk ˈwɔkɪŋ/"
    note_ru: "like walking — k и w стоят рядом, не вставляйте гласную между ними"
  - text: "I play the guitar."
    ipa: "/aɪ ˈpleɪ ðə ɡɪˈtɑr/"
    note_ru: "the перед согласным — короткое «зэ», ударение в guitar на втором слоге"
contractions:
  - full: "does not"
    short: "doesn't"
    ipa: "/ˈdʌzənt/"
    note_ru: "Tom doesn't like walking — Том не любит гулять."
layers:
  - number: 1
    body: |
      Чем вы любите заниматься в выходные? С этого вопроса часто начинается дружба. Том рассказывает, что играет на гитаре, а Box слушает. Сегодня вы научитесь рассказывать о своих увлечениях.

      Когда нам нравится **занятие**, после **like** часто используют форму глагола на **-ing**: *I like reading*. Но это **не единственный правильный способ**: *I like to read* тоже обычно естественно. Не путайте его с *I like music*, где речь о предмете/явлении, а не о действии.

      > [O4]No[/], [T8]I[/] [A1]never[/] [D4]walk[/]! [T8]I[/] [D3]like[/] [S10]music[/]. [T8]I[/] [D2]play[/] [T1]the[/] [S2]guitar[/] [P3]on[/] [S7]Sundays[/]. — Нет, я никогда не гуляю! Я люблю музыку. По воскресеньям играю на гитаре.

      I like reading — «я люблю чтение», то есть «люблю читать».
  - number: 2
    body: |
      В **I like music** после like названо то, что нравится: музыка. В **I like reading** названо занятие: читать. Связь простая: **read → reading**, **walk → walking**, **play → playing**. Такое употребление формы на -ing называют **герундием**; термин можно запомнить после примеров.

      Сравните рассказ о себе и о другом человеке: **I like reading. → She likes reading.** С she меняется **like → likes**, а reading остаётся той же формой. Вопрос: **Does she like reading?** Does уже показывает форму для she, поэтому дальше **like**, без -s; reading снова не меняется.

      Есть и второй правильный вариант: **I like to read. / She likes to read.** Для рассказа об увлечениях подходят оба: like reading и like to read. Но *I like read* не подходит: когда называем действие после like, здесь нужна форма reading или сочетание to read.

      Не делайте вывод, что любое -ing — обычное существительное или действие прямо сейчас. Смысл определяется всей конструкцией. В этом уроке **like reading** сообщает о любимом занятии.
  - number: 3
    body: |
      Схема:

      > [P3]On[/] [S7]Sunday[/] [T8]I[/] [D4]walk[/] [P1]in[/] [T1]the[/] [S4]park[/] [P1]in[/] [T3]my[/] [S2]jacket[/]. [T8]I[/] [D3]like[/] [D4]walking[/]. — В воскресенье я гуляю в парке в куртке. Люблю гулять.

      - like + действие с -ing: I like reading, I like walking.
      - Вопрос: Do you like walking?
      - О другом человеке: Tom likes music. Box likes it.
      - Нравится вещь — без -ing: I like music, I like the park.
  - number: 4
    body: |
      **Почему I like read — ошибка?** После **like** действие обычно выражают **формой с -ing** или конструкцией **to + глагол**, а не голой формой *read*. Это свойство того, как глагол *like* сочетается с последующим действием, а не универсальное правило для всех английских глаголов:

      - like reading — с -ing;
      - like to read — с to.

      В стандартном американском английском оба варианта **часто** означают почти одно и то же (*I like reading / I like to read*), но в более сложном контексте между ними возможны оттенки. На A1 для рассказа о хобби подходят оба. При этом *I like read* **не подходит**.

      > [S1]Tom[/], [D1]do[/] [T8]you[/] [D3]like[/] [D4]walking[/]? — Том, а ты любишь гулять?

      **Диагностика понимания:** Вы любите **читать как занятие**. Что верно: *I like reading* или *I like read*?

      **Разбор:** *I like reading*. После **like** действие часто представлено формой **-ing**. Также правильно *I like to read*. **Read** без **-ing** и без **to** после *like* в этой конструкции не подходит.
  - number: 5
    body: |
      Так рассказывают о хобби:

      > [A1]Never[/]! [T8]I[/] [D2]play[/] [T1]the[/] [S2]guitar[/], [C1]and[/] [S1]Box[/] [D3]likes[/] [T8]it[/]. — Никогда! Я играю на гитаре, и Box это нравится.

      - Для привычного значения «играть на гитаре» учим **play the guitar**; в американской речи также встречается **play guitar** без *the*. На этом уровне отрабатываем вариант из истории.
      - Названия игр и видов спорта обычно употребляют без *the*: *play chess*, *play football*. Это **американский футбол**, если речь идёт о США; слово *soccer* там обычно означает футбол с круглым мячом.
      - Если очень нравится — I love reading. Love сильнее like.

      **Одежда для выходных.** У Анны для прогулки есть куртка: **jacket**. Ещё два слова: **shirt** — рубашка, **shoes** — обувь, туфли.

      > [T8]I[/] [D3]like[/] [D4]walking[/] [P1]in[/] [T3]my[/] [S2]jacket[/]. — Я люблю гулять в своей куртке.
      > [T8]I[/] [D3]like[/] [T3]my[/] [J2]blue[/] [S2]shirt[/]. — Мне нравится моя синяя рубашка.
      > [T8]I[/] [D3]like[/] [T3]my[/] [J2]black[/] [S2]shoes[/]. — Мне нравятся мои чёрные туфли.

      После like можно назвать вещь (my jacket) или действие (walking). Одна рубашка — a shirt, одна куртка — a jacket. Shoes обычно во множественном числе; одна туфля — a shoe. Здесь in my jacket значит «в куртке», а не место внутри куртки.
  - number: 6
    body: |
      Как пишется -ing:

      - чаще всего просто добавляют: read → reading, walk → walking, play → playing;
      - немое e в конце уходит: write → writing, make → making;
      - У некоторых коротких глаголов с одним конечным согласным **после ударной краткой гласной** согласную удваивают: *swim → swimming*, *get → getting*. Но не все слова с короткой записью работают так: правило зависит от ударения и структуры слова. Сначала узнавайте часто встречающиеся формы.

      И не путайте: I like walking — «люблю гулять» (вообще), I am walking — «я сейчас гуляю». Вторую форму вы узнаете позже.
  - number: 7
    body: |
      Шесть заданий: узнать правильную форму, вставить -ing, собрать вопрос о хобби и рассказать о своём хобби в новой ситуации; узнать одежду для прогулки и сказать, какая одежда вам нравится.

      **Проверка маленького шага:** *I like reading* говорит о **любимом занятии вообще**; *I am reading* сообщает, что человек **читает сейчас**. Обе формы содержат **-ing**, но работу фразы определяет и то, **что стоит перед reading** — *like* или *am*. Вторую конструкцию подробно изучим позже.
exercises:
  - order: 1
    uid: EX-00110
    kind: choice
    stage: recognition
    prompt_ru: "Как правильно сказать «Я люблю читать»?"
    options: ["I like reading.", "I like read.", "I am like reading."]
    answer: "I like reading."
    hint_ru: "Здесь выбираем like + форму на -ing; вариант с to тоже возможен."
    explanation_ru: "I like reading. Можно и I like to read, но не I like read."
    units: [LX-00200, LX-00208]
  - order: 2
    uid: EX-00111
    kind: fill
    stage: substitution
    prompt_ru: "Анна любит гулять. Допишите глагол walk в нужной форме."
    prompt_en: "I like ___."
    answer: "walking"
    accepted: ["to walk"]
    hint_ru: "После like можно использовать walking (-ing) или to walk."
    explanation_ru: "I like walking — walk + -ing. Вариант I like to walk тоже верный."
    units: [LX-00201]
  - order: 3
    uid: EX-00112
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Ты любишь гулять?»"
    options: [walking, Do, like, you]
    answer: "Do you like walking"
    hint_ru: "Do you like + действие с -ing."
    explanation_ru: "Do you like walking? Ответ — Yes, I do или No, I don't."
    units: [LX-00209]
  - order: 4
    uid: EX-00113
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: на встрече вас спрашивают о хобби. Вы любите музыку и играете на гитаре. Скажите одну из фраз."
    prompt_en: "What do you like? — ___"
    answer: "I like music."
    accepted: ["I like music", "I like music. I play the guitar.", "I like playing the guitar.", "I like playing the guitar", "I like to play the guitar.", "I like playing guitar.", "I like to play guitar."]
    hint_ru: "На What do you like? ответьте I like + вещь или I like + действие с -ing."
    explanation_ru: "What do you like? спрашивает именно о том, что нравится. Поэтому I like music или I like playing the guitar — прямые ответы. I play the guitar описывает занятие, но само по себе не говорит, что оно вам нравится."
    units: [LX-00203, LX-00211]
  - order: 5
    uid: EX-00114
    kind: choice
    stage: recognition
    prompt_ru: "Анна говорит: I like walking in my jacket. В чём она гуляет?"
    options: [jacket, shirt, shoes]
    answer: "jacket"
    hint_ru: "Найдите слово «куртка»."
    explanation_ru: "jacket — куртка; shirt — рубашка; shoes — обувь, туфли."
    units: [LX-00386, LX-00387, LX-00388]
  - order: 6
    uid: EX-00115
    kind: build
    stage: transfer
    prompt_ru: "Новая ситуация: друг спрашивает о вашей одежде. Скажите: «Мне нравятся мои синие туфли»."
    options: [shoes, blue, my, like, I]
    answer: "I like my blue shoes"
    hint_ru: "После like — my, затем цвет и название вещи."
    explanation_ru: "I like my blue shoes. Like сочетается и с названием вещи; -ing здесь не нужно."
    units: [LX-00388]
