slug: a1-like-doing
level: A1
week: 10
order: 20
focus: D
minutes: 40
title: "Что я люблю делать: I like reading и I like to read"
summary: "Как сказать, что вам нравится делать: I like reading, I like walking. Что такое -ing, как оно пишется и звучит, и чем like reading отличается от like to read."
units: [LX-00200, LX-00201, LX-00202, LX-00203, LX-00204, LX-00205, LX-00208, LX-00209, LX-00211]
sound_notes:
  - text: "I like reading."
    ipa: "/aɪ ˈlaɪk ˈridɪŋ/"
    note_ru: "-ing — «инг» с носовым звуком, без чёткого «г» в конце"
  - text: "Do you like walking?"
    ipa: "/də jə ˈlaɪk ˈwɔkɪŋ/"
    note_ru: "like walking — k и w стоят рядом, не вставляйте гласную между ними"
  - text: "I play the guitar."
    ipa: "/aɪ ˈpleɪ ðə ɡɪˈtɑr/"
    note_ru: "the перед согласным — короткое «зэ», ударение в guitar на втором слоге"
contractions:
  - full: "does not"
    short: "doesn't"
    ipa: "/ˈdʌzənt/"
    note_ru: "Tom doesn't like walking — Том не любит гулять."
layers:
  - number: 1
    body: |
      Чтобы рассказать о хобби, после like ставят действие. Самый частый способ — глагол с окончанием **-ing**.

      > [O4]No[/], [T8]I[/] [A1]never[/] [D4]walk[/]! [T8]I[/] [D3]like[/] [S10]music[/]. [T8]I[/] [D2]play[/] [T1]the[/] [S2]guitar[/] [P3]on[/] [S7]Sunday[/]. — Нет, я никогда не гуляю! Я люблю музыку. По воскресеньям играю на гитаре.

      I like reading — «я люблю чтение», то есть «люблю читать».
  - number: 2
    body: |
      Окончание **-ing** превращает действие в «вещь», о которой можно сказать «люблю»: reading — чтение, walking — прогулки. Так же в русском: «читать» → «чтение».

      **guitar** пришло через испанский от греческого `kithara` — древнего струнного инструмента. От того же слова — русское «гитара» и «кифара».
  - number: 3
    body: |
      Схема:

      > [P3]On[/] [S7]Sunday[/] [T8]I[/] [D4]walk[/] [P1]in[/] [T1]the[/] [S4]park[/]. [T8]I[/] [D3]like[/] [D4]walking[/]. — В воскресенье я гуляю в парке. Люблю гулять.

      - like + действие с -ing: I like reading, I like walking.
      - Вопрос: Do you like walking?
      - О другом человеке: Tom likes music. Box likes it.
      - Нравится вещь — без -ing: I like music, I like the park.
  - number: 4
    body: |
      Почему -ing, а не просто read? После like нужна «вещь», а не голый глагол. Есть два способа сделать из глагола вещь:

      - like reading — с -ing;
      - like to read — с to.

      В Америке оба звучат естественно и значат почти одно и то же. На A1 выбирайте любой — ошибкой не будет.

      > [S1]Tom[/], [D1]do[/] [T8]you[/] [D3]like[/] [D4]walking[/]? — Том, а ты любишь гулять?
  - number: 5
    body: |
      Так рассказывают о хобби:

      > [A1]Never[/]! [T8]I[/] [D2]play[/] [T1]the[/] [S2]guitar[/], [C1]and[/] [S1]Box[/] [D3]likes[/] [T8]it[/]. — Никогда! Я играю на гитаре, и Box это нравится.

      - На инструментах играют с the: play the guitar.
      - В игры — без the: play chess, play football.
      - Если очень нравится — I love reading. Love сильнее like.
  - number: 6
    body: |
      Как пишется -ing:

      - чаще всего просто добавляют: read → reading, walk → walking, play → playing;
      - немое e в конце уходит: write → writing, make → making;
      - короткий слог с одной гласной удваивает согласную: swim → swimming, get → getting.

      И не путайте: I like walking — «люблю гулять» (вообще), I am walking — «я сейчас гуляю». Вторую форму вы узнаете позже.
  - number: 7
    body: |
      Четыре задания: узнать правильную форму, вставить -ing, собрать вопрос о хобби и рассказать о своём хобби в новой ситуации.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Как правильно сказать «Я люблю читать»?"
    options: ["I like reading.", "I like read.", "I am like reading."]
    answer: "I like reading."
    hint_ru: "После like действие получает -ing."
    explanation_ru: "I like reading. Можно и I like to read, но не I like read."
    units: [LX-00200, LX-00208]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Анна любит гулять. Допишите глагол walk в нужной форме."
    prompt_en: "I like ___."
    answer: "walking"
    accepted: ["to walk"]
    hint_ru: "Добавьте -ing."
    explanation_ru: "I like walking — walk + -ing. Вариант I like to walk тоже верный."
    units: [LX-00201]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Ты любишь гулять?»"
    options: [walking, Do, like, you]
    answer: "Do you like walking"
    hint_ru: "Do you like + действие с -ing."
    explanation_ru: "Do you like walking? Ответ — Yes, I do или No, I don't."
    units: [LX-00209]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: на встрече вас спрашивают о хобби. Вы любите музыку и играете на гитаре. Скажите одну из фраз."
    prompt_en: "What do you like? — ___"
    answer: "I like music."
    accepted: ["I like music", "I play the guitar.", "I play the guitar", "I like music. I play the guitar.", "I like playing the guitar.", "I like playing the guitar"]
    hint_ru: "I like + вещь или I play the guitar."
    explanation_ru: "I like music. I play the guitar. Можно соединить: I like playing the guitar."
    units: [LX-00203, LX-00211]
