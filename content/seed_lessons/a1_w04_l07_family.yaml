title: "Семья на фото: кто это и сколько лет — Who is this? How old are you?"
summary: "Слова о семье, mom и dad, числа до ста и возраст: Who is this? How old are you? My mom is forty."
units: [LX-00088, LX-00089, LX-00090, LX-00091, LX-00092, LX-00093, LX-00094, LX-00099, LX-00101, LX-00102, LX-00103, LX-00266, LX-00267, LX-00268, LX-00269, LX-00270, LX-00271, LX-00272, LX-00273, LX-00274, LX-00275, LX-00276, LX-00277, LX-00278]
sound_notes:
  - text: "Who is this?"
    ipa: "/ˈhu ɪz ˈðɪs/"
    note_ru: "who звучит «ху», w не читается"
  - text: "brother"
    ipa: "/ˈbrʌðɚ/"
    note_ru: "звонкий th в середине и американское r в конце"
  - text: "thirteen — thirty"
    ipa: "/ˌθɝˈtin/ — /ˈθɝt̬i/"
    note_ru: "различайте суффиксы -teen и -ty и ударение; в быстрой речи ударение может меняться"
layers:
  - number: 1
    body: |
      На семейном фото всегда хочется спросить: кто это?

      > [T9]Who[/] [D1]is[/] [T2]this[/]? — Кто это?
      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]brother[/]. — Это мой брат.
      > [D1]Is[/] [T2]this[/] [T3]your[/] [S1]mother[/]? — Это твоя мама?

      Слова о семье подчёркнуты сплошной красной линией: это существительные класса «Люди и семья».
  - number: 2
    body: |
      **brother**, **mother**, **father** — очень древние слова. Сравните с русскими: брат, мать. Это не совпадение: у английского и русского общий далёкий предок, и названия родных сохранились в обоих языках.

      **daughter** родственно русскому «дочь». Буквы gh когда-то читались, но звук давно исчез, а написание осталось.
  - number: 3
    body: |
      Вопрос о человеке строят с **who** и глаголом be:

      > [T9]Who[/] [D1]is[/] [T2]this[/]? — Кто это?
      > [D1]Is[/] [T2]this[/] [T3]your[/] [S1]family[/]? — Это твоя семья?

      - **Who** означает «кто». В вопросе *Who is this?* мы просим **назвать человека**, поэтому начинаем с **who**, затем идут **is** и **this**.
      - *Is this your family?* — вопрос с ответом **да/нет**: форму **be** (*is*) ставят перед **this**. Это не тот же порядок, что у *Who is this?*.
      - Можно ответить **Yes / No**, а можно полнее: *Yes, it is* / *No, it is not*. Более длинный ответ помогает показать, о чём именно вы говорите.
  - number: 4
    body: |
      **Почему this, а не he или she?** Когда мы **показываем** человека на фотографии, удобно сказать *This is my brother*. Дальше, когда уже ясно, о ком речь, вместо повторения *my brother* можно сказать *he*. Это **удобный переход в разговоре**, а не правило, что при первом упоминании нельзя использовать *he* или *she*: всё зависит от контекста.

      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]brother[/]. [T8]He[/] [D1]is[/] [N1]ten[/]. — Это мой брат. Ему десять.

      **Почему He is ten, а не He has ten?** Английский сообщает возраст как **состояние человека** через форму **be**; русскому «ему десять» соответствует *He is ten*. **Has** здесь не употребляют. В английской фразе не нужно говорить *years old* каждый раз, если по контексту речь о возрасте.

      > [A6]How[/] [J2]old[/] [D1]are[/] [T8]you[/]? — Сколько тебе лет?
      > [T3]My[/] [S1]mom[/] [D1]is[/] [N5]forty[/], [C1]and[/] [T3]my[/] [S1]dad[/] [D1]is[/] [N5]fifty[/]. — Маме сорок, а папе пятьдесят.
      > [T8]I[/] [D1]am[/] [N5]thirty[/] [S7]years[/] [J2]old[/]. — Мне тридцать лет.

      **Что означает -ty?** У многих названий десятков есть окончание **-ty**: *sixty* — 60, *seventy* — 70. Но нельзя механически приклеить **-ty** к каждому числу: *thirty*, *forty*, *fifty*, *eighty* имеют исторически сложившееся написание, которое нужно узнавать. А **hundred** (100) вообще не относится к этой группе.

      - [N1]thirty[/] 30, [N1]forty[/] 40, [N1]fifty[/] 50, [N1]sixty[/] 60
      - [N1]seventy[/] 70, [N1]eighty[/] 80, [N1]ninety[/] 90, [N1]hundred[/] 100
      - Между десятками и единицами — дефис: [N1]twenty[/]-[N1]five[/] 25, [N1]forty[/]-[N1]two[/] 42.
      - years old можно не говорить: I am thirty — уже полный ответ.
  - number: 5
    body: |
      В разговоре о фото американцы говорят коротко:

      > [T9]Who[/] [D1]is[/] [T2]this[/]? — Кто это?
      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]sister[/]. — Это моя сестра.
      > [T8]She[/] [D1]is[/] [N1]eleven[/]. — Ей одиннадцать.

      - Who is в быстрой речи звучит как who's: «хуз».
      - Вместо mother и father дома часто говорят mom и dad.
  - number: 6
    body: |
      **Baby brother / baby sister** говорят о **совсем маленьком** брате или сестре, а не о любом младшем ребёнке в семье. Если брату, например, десять, *baby brother* может звучать как семейное прозвище, но не нейтральное обозначение возраста.

      grandmother и grandfather в разговоре обычно сокращают до grandma и grandpa.

      [S1]mom[/] и [S1]dad[/] — так американцы говорят о родителях каждый день, даже взрослые. Британцы пишут mum.

      **Возраст — личная тема.** Незнакомого взрослого лучше не спрашивать без причины; о возрасте ребёнка тоже учитывайте отношения и ситуацию. В учебной сцене *How old is he?* — простой вопрос о человеке на фотографии, но в жизни сначала подумайте, уместен ли он.
  - number: 7
    body: |
      Шесть заданий: узнать вопрос, вставить родственника, собрать ответ, описать новое фото, отличить thirteen от thirty и назвать возраст.

      **Проверка маленького шага:** *Who is this?* спрашивает, **кто на фото**. *How old is she?* спрашивает **возраст** уже названного человека. Поэтому на первый вопрос можно ответить *This is my sister*, а на второй — *She is twelve*: выбираем ответ по **смыслу вопроса**, а не только по знакомому глаголу **is**.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Как спросить «Кто это?» о человеке на фото?"
    options: ["Who is this?", "Who this?", "This is who?"]
    answer: "Who is this?"
    hint_ru: "Нужен глагол be."
    explanation_ru: "Who is this? — who первым, затем is и this. Без is фраза неполная."
    units: [LX-00099, LX-00101]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Покажите на фото брата."
    prompt_en: "This is my ___."
    answer: "brother"
    hint_ru: "Брат по-английски."
    explanation_ru: "This is my brother. — Это мой брат."
    units: [LX-00088]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Это твоя мама?»"
    options: [your, Is, mother, this]
    answer: "Is this your mother"
    hint_ru: "В вопросе is стоит первым."
    explanation_ru: "Is this your mother? — be выходит вперёд, дальше this your mother."
    units: [LX-00103]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новое фото: на нём ваша сестра, ей двенадцать. Скажите это двумя короткими фразами."
    prompt_en: "___"
    answer: "This is my sister. She is twelve."
    accepted: ["This is my sister. She's twelve.", "This is my sister. She is 12.", "This is my sister. She's 12."]
    hint_ru: "Сначала this is…, потом she is…"
    explanation_ru: "This is my sister. She is twelve. — сначала показываем, потом говорим she и возраст через be."
    units: [LX-00089, LX-00096, LX-00073]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: "Дедушке Тома шестьдесят. Как это сказать?"
    options: ["He is sixty.", "He is sixteen.", "He has sixty."]
    answer: "He is sixty."
    hint_ru: "Десятки кончаются на -ty, возраст — через be."
    explanation_ru: "He is sixty — «Ему 60». Sixteen значит 16: смотрите на окончание -teen и -ty. Для возраста здесь нужен is, не has."
    units: [LX-00273]
  - order: 6
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос «Сколько тебе лет?»"
    options: [you, old, How, are]
    answer: "How old are you"
    hint_ru: "Дословно: «как старый ты есть?»"
    explanation_ru: "How old are you? — how old первыми, дальше are you. О другом: How old is he?"
    units: [LX-00278]
