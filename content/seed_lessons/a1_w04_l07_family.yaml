    answer: "This is my sister. She is twelve."
    accepted: ["This is my sister. She's twelve.", "This is my sister. She is 12.", "This is my sister. She's 12.", "This is my sister. She is twelve years old.", "This is my sister. She's twelve years old.", "This is my sister. She is 12 years old.", "This is my sister. She's 12 years old.", "It is my sister. She is twelve.", "It's my sister. She's twelve.", "It's my sister. She is twelve.", "It is my sister. She's twelve."]
    hint_ru: "Сначала this is…, потом she is…"
    explanation_ru: "This is my sister. She is twelve. — сначала показываем, потом говорим she и возраст через be."
    units: [LX-00089, LX-00096, LX-00073]
  - order: 5
    uid: EX-00036
    kind: choice
    stage: recognition
    prompt_ru: "Дедушке Тома шестьдесят. Как это сказать?"
    options: ["He is sixty.", "He is sixteen.", "He has sixty."]
    answer: "He is sixty."
    hint_ru: "Десятки кончаются на -ty, возраст — через be."
    explanation_ru: "He is sixty — «Ему 60». Sixteen значит 16: смотрите на окончание -teen и -ty. Для возраста здесь нужен is, не has."
    units: [LX-00273]
  - order: 6
    uid: EX-00037
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос «Сколько тебе лет?»"
    options: [you, old, How, are]
    answer: "How old are you"
    hint_ru: "Начните с How old; с you используйте are."
    explanation_ru: "How old are you? — устойчивый вопрос о возрасте: How old + are + you. Не нужно дословно переводить его как «насколько старый ты»; речь может идти о человеке любого возраста."
    units: [LX-00278]
