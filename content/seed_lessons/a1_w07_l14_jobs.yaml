slug: a1-jobs-what-do-you-do
level: A1
week: 7
order: 14
focus: S
minutes: 40
title: "Профессии и места: I am a nurse, I work in an office"
summary: "Как назвать свою работу и спросить о чужой. Почему перед профессией нужен a: I am a teacher. Что значит странный вопрос What do you do?"
units: [LX-00142, LX-00143, LX-00144, LX-00145, LX-00146, LX-00151, LX-00152, LX-00319, LX-00320, LX-00321, LX-00322, LX-00323, LX-00324, LX-00325, LX-00326, LX-00327, LX-00328, LX-00329, LX-00330, LX-00331, LX-00335, LX-00336]
sound_notes:
  - text: "What do you do?"
    ipa: "/ˌwʌt də jə ˈdu/"
    note_ru: "В этом примере главное ударение на последнем do; первое do и you звучат слабее."
  - text: "I'm a teacher."
    ipa: "/aɪm ə ˈtitʃɚ/"
    note_ru: "a почти не слышно, но оно есть; teacher — «тИчэр» с американским r"
  - text: "I work at a school."
    ipa: "/aɪ ˈwɝk ət ə ˈskul/"
    note_ru: "at a сливаются: «этэ скул»"
contractions:
  - full: "I am"
    short: "I'm"
    ipa: "/aɪm/"
    note_ru: "О профессии говорят с I'm: I'm a teacher, I'm a barista."
layers:
  - number: 1
    body: |
      Анна — учительница, Мия — бариста, Том что-то делает за компьютером. «Кем ты работаешь?» — один из частых вопросов в разговоре. Сегодня вы научитесь отвечать на него о себе.

      В американском разговоре иногда спрашивают о занятии человека, но **не обязательно сразу после знакомства** — уместность зависит от ситуации. Для нашего учебного диалога разберём два вопроса: о занятии (What do you do?) и о месте работы (Where do you work?).

      > [S1]Anna[/], [T9]what[/] [D1]do[/] [T8]you[/] [D2]do[/]? — Анна, кем ты работаешь?
      > [T8]I[/] [D1]am[/] [T1]a[/] [S9]teacher[/]. [T8]I[/] [D2]work[/] [P1]at[/] [T1]a[/] [S4]school[/]. — Я учительница. Я работаю в школе.

      Первая фраза — профессия, вторая — где вы работаете.
  - number: 2
    body: |
      На вопрос о работе можно дать два разных вида информации. Сравните:

      **What do you do? — I'm a teacher.** — Кем вы работаете? — Я учительница. Здесь мы называем **занятие**.
      **Where do you work? — I work at a school.** — Где вы работаете? — В школе. Здесь называем **место**.

      В первом ответе **am** связывает I с названием профессии. Во втором **work** само называет действие, поэтому *I am work* не нужно. Перед teacher стоит **a**: человек — один из тех, у кого эта профессия. Перед engineer нужен **an**, потому что слово начинается с гласного звука.

      Можно соединить ответы: **I'm a teacher. I work at a school.** Место работы дополняет профессию: в школе работают люди с разными обязанностями, поэтому само слово school ещё не говорит, кем работает человек.
  - number: 3
    body: |
      Схема ответа:

      > [T8]I[/] [D1]am[/] [T1]a[/] [S9]barista[/]! — Я бариста!

      - Профессия: I am a + профессия: I am a doctor.
      - Перед гласным звуком — an: an engineer.
      - Место: I work at a school, at a cafe, at home.
      - О другом человеке: She is a teacher. He works at a school.

      Ещё профессии — запоминайте сразу с a или an:

      - [T1]a[/] [S9]nurse[/] — медсестра, [T1]a[/] [S9]waiter[/] — официант, [T1]a[/] [S9]student[/] — студент
      - [T1]an[/] [S9]engineer[/] — инженер, [T1]a[/] [S9]manager[/] — менеджер, [T1]a[/] [S9]farmer[/] — фермер
      - [T1]a[/] [S9]writer[/] — писатель, [T1]a[/] [S9]singer[/] — певец: глагол + -er = «тот, кто делает»

      **At или in?** *At a school* говорит о месте работы как об учреждении; *in an office* называет офис как рабочую среду и может описывать обычное место работы. Это не обязательно акцент на физическом нахождении внутри здания прямо сейчас. Это **подсказка для контекста**, а не железное правило: *work at a hospital* и *work in a hospital* оба возможны, с разным акцентом.

      > [A6]Where[/] [D1]do[/] [T8]you[/] [D2]work[/]? — Где ты работаешь?
      > [T8]I[/] [D2]work[/] [P1]in[/] [T1]an[/] [S4]office[/]. — Я работаю в офисе.
      > [T8]She[/] [D2]works[/] [P1]at[/] [T1]a[/] [S4]hospital[/]. — Она работает в больнице.

      [S9]job[/] — работа-должность (I like my job), [S9]boss[/] — начальник.
  - number: 4
    body: |
      **Почему I am a teacher?** Когда человек называет **одну профессию** в единственном числе с исчисляемым существительным, нужен подходящий определитель, обычно **a / an**. Поэтому в полной фразе *I am teacher* — ошибка. Можно ответить короче: *A teacher*. Это сокращённый ответ вместо полного *I am a teacher*. Перед гласным звуком, например *engineer*, выбирают **an**.

      **Почему два do в What do you do?** Первое **do** — вспомогательный глагол для вопроса, второе **do** — смысловой «делать / заниматься». Без дополнительного контекста *What do you do?* часто спрашивает о **занятии или работе вообще**, а не о действии прямо сейчас. Не нужно переводить оба do на русский.

      **Диагностика понимания:** Вы хотите сказать «Я учитель». Что верно: *I am a teacher* или *I am teacher*?

      **Разбор:** *I am a teacher*. **Teacher** — название исчисляемой профессии в единственном числе, в таком полном предложении обычно требуется **a**. С гласным звуком в начале было бы **an**: *I am an engineer*.
  - number: 5
    body: |
      Так знакомятся по работе в Америке:

      > [S1]Anna[/], [T9]what[/] [D1]do[/] [T8]you[/] [D2]do[/]? — Анна, кем ты работаешь?
      > [T8]I[/] [D1]am[/] [T1]a[/] [S9]teacher[/]. — Я учительница.

      - Отвечают с I'm: I'm a teacher.
      - What do you do? — распространённый вопрос о занятии при знакомстве. What is your job? тоже возможно, когда прямо уточняют должность или работу; оно не обязательно звучит неестественно. Выбор зависит от разговора.
      - **I work at home** означает «Я работаю дома» и **не подходит**, если вы вообще не работаете. Не обязаны обсуждать работу с незнакомцем: допустим и краткий ответ о том, чем занимаетесь, или вежливая смена темы. Для упражнения достаточно профессии из примера.
  - number: 6
    body: |
      Две ловушки:

      - В нашем разговоре о работе What do you do? — «Кем ты работаешь?». А What are you doing? — «Что ты сейчас делаешь?». Эту форму вы узнаете позже.
      - Профессия без a — частая ошибка: «I am teacher». Правильно: I am a teacher.

      Во множественном числе a исчезает и появляется -s: They are teachers.
  - number: 7
    body: |
      Шесть заданий: понять вопрос о работе, вставить a, собрать ответ, рассказать о своей работе, выбрать an перед engineer и сказать, где работает мама.

      **Проверка маленького шага:** *I am a nurse* сообщает, **какая у человека профессия**. *I work at a hospital* рассказывает, **где он работает**. Ответы могут сочетаться: профессия и место работы дают разную информацию. В нашем упражнении на *What do you do?* сначала назовите **занятие**.
exercises:
  - order: 1
    uid: EX-00074
    kind: choice
    stage: recognition
    prompt_ru: "При знакомстве разговор зашёл о работе. Американец спрашивает: What do you do? Что он хочет узнать?"
    options: ["Кем вы работаете", "Что вы делаете прямо сейчас", "Как у вас дела"]
    answer: "Кем вы работаете"
    hint_ru: "Это вопрос о жизни, а не о минуте."
    explanation_ru: "What do you do? — вопрос о работе: «Чем вы занимаетесь?»."
    units: [LX-00151]
  - order: 2
    uid: EX-00075
    kind: fill
    stage: substitution
    prompt_ru: "Мия рассказывает о себе. Вставьте пропущенное слово."
    prompt_en: "I am ___ barista."
    answer: "a"
    hint_ru: "Перед профессией нужно маленькое слово."
    explanation_ru: "I am a barista — перед профессией ставят a."
    units: [LX-00146]
  - order: 3
    uid: EX-00076
    kind: build
    stage: production
    prompt_ru: "Соберите фразу: «Я работаю в школе»."
    options: [school, work, a, I, at]
    answer: "I work at a school"
    hint_ru: "I work, потом at a и место."
    explanation_ru: "В этой фразе используем at a school. Work in a school тоже возможно; at не единственный предлог для места работы."
    units: [LX-00143]
  - order: 4
    uid: EX-00077
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: на встрече вас спрашивают о работе. Вы врач. Ответьте."
    prompt_en: "What do you do? — ___"
    answer: "I am a doctor."
    accepted: ["I'm a doctor.", "I am a doctor", "I'm a doctor", "A doctor."]
    hint_ru: "I am a + профессия."
    explanation_ru: "I am a doctor — в разговоре I'm a doctor."
    units: [LX-00144, LX-00152]
  - order: 5
    uid: EX-00078
    kind: choice
    stage: recognition
    prompt_ru: "Как сказать «Он инженер»?"
    options: ["He is an engineer.", "He is a engineer.", "He is engineer."]
    answer: "He is an engineer."
    hint_ru: "engineer начинается с гласного звука."
    explanation_ru: "В полном предложении о профессии в единственном числе нужен определитель: He is an engineer. Перед гласным звуком в engineer выбираем an, а не a."
    units: [LX-00322]
  - order: 6
    uid: EX-00079
    kind: fill
    stage: transfer
    prompt_ru: "Ваша мама — медсестра, работает в больнице. Скажите это двумя фразами."
    prompt_en: "___"
    answer: "My mom is a nurse. She works at a hospital."
    accepted: ["My mom is a nurse. She works in a hospital.", "My mother is a nurse. She works at a hospital.", "My mother is a nurse. She works in a hospital.", "My mom's a nurse. She works at a hospital."]
    hint_ru: "a nurse; she works…"
    explanation_ru: "My mom is a nurse. She works at a hospital. — a перед профессией, -s после she. in a hospital тоже верно."
    units: [LX-00319, LX-00329]
