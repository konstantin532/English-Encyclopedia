layers:
- number: 1
  body: 'Том считает, что в музее было скучно, а Анна — что очень интересно. Каждый описывает, что там было, и даёт свою оценку. Для этого нужны две вещи: **there was / there were** и слова-впечатления.


    > [T8]It[/] [D1]was[/] [J7]boring[/]. [T9]There[/] [D1]were[/] [N1]twenty[/] [J2]old[/] [S2]chairs[/] [C1]and[/] [N1]one[/] [J2]old[/] [S2]clock[/]. — Было скучно. Там были двадцать старых стульев и одни старые часы.

    > [C5]But[/] [T9]there[/] [D1]was[/] [T1]a[/] [J1]big[/] [S4]map[/] [P6]of[/] [T3]our[/] [S4]town[/]! [T8]It[/] [D1]was[/] [A5]very[/] [J7]interesting[/]. — Зато там была большая карта нашего города! Было очень интересно.

    '
- number: 2
  body: '**There is / there are** вы знаете с A1: «есть, имеется». Прошлое делается так же, как у be: **is → was**, **are → were**. *There was a map* — «там была карта».


    **Interesting** — от латинского *interest*, «это важно, это касается». Интересное — то, что вас касается.

    '
- number: 3
  body: |
    Схема:

    > [T9]There[/] [D1]was[/] [T1]a[/] [J1]big[/] [S4]map[/]. — Там была большая карта.
    > [T9]There[/] [D1]were[/] [N1]twenty[/] [J2]old[/] [S2]chairs[/]. — Там были двадцать старых стульев.

    - Одна исчисляемая вещь или неисчисляемое количество → **there was**: there was a clock, there was some water.
    - Много вещей → **there were**: there were two clocks.
    - Ничего не было: **there was no sun**, **there were no people**.
    - Впечатление: **It was + слово**: It was great. It was boring.

- number: 4
  body: |
    **Почему «It was boring», а не «Was boring»?** В таком обычном полном сообщении английскому нужно подлежащее. Это правило не означает, что в каждой реплике обязательно есть отдельное подлежащее: вы уже знаете просьбы *Come in!* и короткие ответы *Great!* В русском «было скучно» обходится без него, а в английском его ставят формально: **it**.

    > [T8]We[/] [D1]were[/] [P3]at[/] [T1]the[/] [S6]beach[/]. [T1]The[/] [S6]sun[/] [D1]was[/] [J2]hot[/], [C5]but[/] [T1]the[/] [S6]wind[/] [D1]was[/] [J2]cold[/]. — Мы были на пляже. Солнце было жаркое, а ветер холодный.

    **Boring** — о том, что скучное: фильм, урок. Сказать «мне скучно» — *I am bored*, это другое слово, оно будет позже.

    **Диагностика понимания:** в кафе было много людей. Что верно: *There was many people* или *There were many people*?

    **Разбор:** *There were…* — people это много людей, значит **were**.

- number: 5
  body: 'Так говорят американцы:


    > [J3]Good[/] [S7]morning[/]! [A6]How[/] [D1]was[/] [T3]your[/] [S7]weekend[/]? — Доброе утро! Как прошли выходные?


    - **How was…?** — «Как прошёл/прошла…?»: How was the movie? How was the party?

    - Ответ одной фразой: **It was great! It was fun. It was terrible.**

    - **very** усиливает: very interesting, very cold.


    Слова-впечатления: **great** — отличный, **fun** — весело, **interesting** — интересный, **boring** — скучный, **terrible** — ужасный. Место: **empty** — пустой, **full** — полный, **quiet** — тихий, **loud** — громкий, **dark** — тёмный. Погода: **sun** — солнце, **wind** — ветер, **sky** — небо, **sea** — море.

    '
- number: 6
  body: 'Ловушки:


    - «There was twenty chairs» — много вещей → **there were**.

    - «Was very interesting» — нужно **it**: It was very interesting.

    - «It was fun» — весело; «It was funny» — смешно. Разные слова.

    - quiet («тихий», два слога) и quite — разные слова.

    '
- number: 7
  body: |
    Шесть заданий: выбрать there was или there were, оценить место, собрать вопрос How was…?, описать новое место, отличить fun от funny и сказать, чего не было.

    **Проверка маленького шага:** одна вещь или неисчисляемое количество — there was; несколько исчисляемых вещей — there were. Впечатление — It was + слово.

