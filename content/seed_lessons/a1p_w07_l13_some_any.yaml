title: 'Some и any: есть ли рыба?'
summary: 'Some и any в сообщениях о наличии, просьбах и предложениях: выбор зависит от смысла. Исчисляемое (a pie, two pies) и неисчисляемое (rice, water, bread): как обозначать количество.'
