layers:
- number: 1
  body: 'В ресторане Анна спрашивает, есть ли рыба, а официантка предлагает салат. Чтобы сказать «немного» и «какой-нибудь», нужны два маленьких слова: **some** и **any**.


    > [O4]Yes[/], [O2]thank[/] [T8]you[/]. [D1]Is[/] [T9]there[/] [T4]any[/] [S3]fish[/] [A2]today[/]? — Да, спасибо. Сегодня есть рыба?

    > [O2]Sorry[/], [T8]we[/] [D1]do[/] [X1]not[/] [D1]have[/] [T4]any[/] [S3]fish[/] [A2]tonight[/]. [C5]But[/] [T1]the[/] [S3]chicken[/] [D1]is[/] [A5]very[/] [J3]good[/]. — Простите, сегодня рыбы нет. Но курица очень хорошая.

    '
- number: 2
  body: '**Some** и **any** — очень старые слова. *Any* родственно слову *one*: «хоть один, хоть сколько-нибудь». Поэтому any так любит вопросы («есть хоть сколько-нибудь?») и отрицание («нет ни одного»).

    '
- number: 3
  body: |
    Схема:

    > [T1]A[/] [J1]little[/]. [D1]Do[/] [T8]you[/] [D3]want[/] [T4]some[/] [S3]salad[/] [P4]with[/] [T8]it[/]? — Немного. Хотите к ней салат?

    - Утверждение: **some** — We have some fresh apple pie.
    - Просьба и предложение: тоже **some** — Some bread, please. Do you want some salad?
    - Обычный вопрос: **any** — Is there any fish?
    - Полное отсутствие продукта: **not … any** — We don't have any fish.
    - Считаем: **a pie, two pies, a potato, potatoes**.
    - В обычном значении продукта **rice, bread, water, meat, fruit, sugar, salt** употребляются как неисчисляемые: **some rice, some bread**. Нельзя механически переносить это на все значения слова: отдельные порции и виды продукта могут обозначаться иначе.

- number: 4
  body: |
    **Почему в предложении «Do you want some salad?» стоит some, хотя это вопрос?** В предложении угощения **some** естественно: говорящий предлагает имеющийся салат. В просьбе **Can I have some bread?** это обычный способ попросить немного хлеба. **Some** также бывает в вопросе, если говорящий предполагает наличие чего-то.

    **Any** удобно для нейтрального вопроса о наличии: **Is there any fish?** Это различие в ситуации, а не между «настоящим» и «ненастоящим» вопросом: в обоих случаях собеседник может ответить «нет».

    **Почему для порции риса здесь не «a rice»?** Слово **rice** в значении продукта неисчисляемое; дело в английском употреблении, а не в возможности физически посчитать зёрна. Так же и хлеб, вода, мясо. Если нужно сосчитать — берут ёмкость: **a glass of water**, **two glasses of water**.

    **Диагностика понимания:** рыбы совсем нет. Как передать этот смысл: *We don't have some fish* или *We don't have any fish*?

    **Разбор:** *We don't have any fish* — рыбы нет совсем. Здесь any передаёт отсутствие любого количества.

- number: 5
  body: 'Так говорят американцы:


    > [O4]Yes[/], [T8]we[/] [D1]have[/] [T4]some[/] [J2]fresh[/] [S3]apple[/] [S3]pie[/]. [T9]Anything[/] [A7]else[/]? — Да, есть свежий яблочный пирог. Что-нибудь ещё?


    - **Is there any…?** — есть ли…?

    - **a little** — немного: a little salt, a little spicy.

    - **more** — ещё: Can I have more bread?


    Еда: **chicken** — курица, **fish** — рыба, **meat** — мясо, **rice** — рис, **pasta** — паста, **potato** — картофель, **vegetable** — овощ, **fruit** — фрукты, **salad** — салат, **pie** — пирог, **salt** — соль, **sugar** — сахар.

    '
- number: 6
  body: |
    Ловушки:

    - Для смысла «рыбы нет совсем» выбирайте **We don't have any fish**. Это не запрет на some во всех отрицательных фразах.
    - «a rice», «breads» — неисчисляемые: **some rice, some bread**.
    - Для обычной просьбы немного хлеба выбирайте **Can I have some bread?** Вопрос с **any** тоже возможен, например если сомневаетесь, можно ли получить хоть какой-нибудь хлеб. Не считайте его ошибкой во всех ситуациях.
    - **Two glasses of water** прямо называет две порции. В кафе можно услышать **two waters** — «две воды», то есть две порции или бутылки. Это контекстное счётное употребление, а не отмена обычного неисчисляемого water.

- number: 7
  body: |
    Шесть заданий: выбрать some или any, сказать, чего нет, собрать просьбу, заказать ужин другу, отличить исчисляемое и попросить ещё.

    **Проверка маленького шага:** в изучаемых нейтральных фразах: утверждение — some, отсутствие — not … any, вопрос о наличии — any. В обычной просьбе и предложении угощения часто some. Это стартовая схема с учётом смысла, а не запрет других употреблений.

