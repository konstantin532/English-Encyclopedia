layers:
- number: 1
  body: 'Том весь день был в торговом центре. Чтобы рассказать об этом, ему нужны глаголы go, buy, choose, pay — и ни один из них не берёт -ed. У них свои формы прошлого.


    > [T8]I[/] [D4]went[/] [P2]to[/] [T1]the[/] [S4]mall[/]. [T8]I[/] [D2]bought[/] [T1]a[/] [S2]gift[/] [P5]for[/] [S1]Mia[/]. — Я ездил в торговый центр. Купил подарок для Мии.

    '
- number: 2
  body: 'Почему они «неправильные»? Это древнейшие глаголы языка. Когда тысячу лет назад -ed стало общим правилом, самые частые слова уже жили своей жизнью — их произносили так часто, что старые формы не забылись. **went** вообще взято от другого глагола, *wend* — «брести». Поэтому go и went совсем не похожи.

    '
- number: 3
  body: 'Схема:


    > [T8]I[/] [D6]chose[/] [T1]a[/] [S2]scarf[/]. — Я выбрал шарф.

    > [T8]I[/] [D2]paid[/] [N1]twenty[/] [N6]dollars[/] [P4]by[/] [S2]card[/]. — Я заплатил двадцать долларов картой.


    - Форма одна для всех лиц: I went, she went, they went.

    - Учите парами: **go — went, come — came, take — took, buy — bought, bring — brought**.

    - **pay — paid, spend — spent, sell — sold, choose — chose, forget — forgot**.

    - Уже знакомые: **have — had, eat — ate, see — saw, get — got, make — made**.

    - Иногда форма не меняется: **cost — cost**: It cost twenty dollars.

    '
- number: 4
  body: '**Почему «I went», а не «I goed»?** Дети-американцы тоже сначала говорят *goed* и *buyed* — мозг тянется к правилу. Но взрослые формы другие, и их нужно просто запомнить. Хорошо, что таких глаголов немного, а самые нужные — в этом уроке.


    > [T8]I[/] [D2]spent[/] [T8]it[/] [T6]all[/]! — Я всё потратил!


    **Диагностика понимания:** как сказать «Я забыл»: *I forgetted* или *I forgot*?


    **Разбор:** *I forgot.* Forget — неправильный глагол.

    '
- number: 5
  body: 'Так говорят американцы:


    > [A3]Here[/] [T8]you[/] [D4]go[/]. [T8]I[/] [D6]chose[/] [T1]a[/] [S2]scarf[/]. [T8]It[/] [D1]was[/] [P3]on[/] [N6]sale[/]! — Вот, держи. Я выбрал шарф. Он был со скидкой!


    - **Here you go** — «вот, держи», когда протягиваете вещь.

    - **Oh no! I forgot.** — «Ой, нет! Я забыл».

    - **I spent it all** — «потратил всё», о деньгах.


    Слова недели: **pay** — платить, **spend** — тратить, **sell** — продавать, **choose** — выбирать, **forget** — забывать, **bring** — приносить, **cost** — стоить, **gift** — подарок, **scarf** — шарф, **mall** — торговый центр, **money** — деньги, **birthday** — день рождения.

    '
- number: 6
  body: 'Ловушки:


    - «I goed», «I buyed» — нужно **went, bought**.

    - «I payed» — пишется **paid**.

    - bought (купил) и brought (принёс) — разные слова: слушайте r.

    - «I was went» — was с глаголом не ставят: **I went**.

    '
- number: 7
  body: 'Шесть заданий: узнать went, вспомнить bought, собрать фразу с chose, рассказать о своей покупке, отличить bought от brought и сказать «я забыл».


    **Проверка маленького шага:** неправильные глаголы учим парами — go/went, buy/bought, pay/paid. Форма одна для всех лиц.

    '
