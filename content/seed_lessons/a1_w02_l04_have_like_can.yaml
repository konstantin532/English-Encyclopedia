slug: a1-have-like-can-do
level: A1
week: 2
order: 4
focus: D
minutes: 45
title: "have, like, can и вопросы с do"
summary: "Как сказать «у меня есть», «мне нравится» и «можно мне», и зачем английским вопросам маленький помощник do."
units: [LX-00033, LX-00034, LX-00035, LX-00036, LX-00029, LX-00031, LX-00032]
sound_notes:
  - text: "Do you like it?"
    ipa: "/də jə ˈlaɪk‿ɪt/, быстро /dʒə ˈlaɪk‿ɪt/"
    note_ru: "do you сжимается до «джа»"
  - text: "Can I have water, please?"
    ipa: "/kən‿aɪ hæv ˈwɑt̬ɚ ˈpliz/"
    note_ru: "can без ударения: /kən/"
  - text: "No, I don't."
    ipa: "/ˈnoʊ aɪ ˈdoʊnt/"
    note_ru: "don't всегда ударное и чёткое"
contractions:
  - full: "do not"
    short: "don't"
    ipa: "/doʊnt/"
    note_ru: "Не теряйте дифтонг /oʊ/ и конечное /nt/."
  - full: "can not"
    short: "can't"
    ipa: "/kænt/"
    note_ru: "Отрицательная форма обычно под ударением; ясно произносите /æ/."
layers:
  - number: 1
    body: |
      > [O4]Yes[/], [T8]you[/] [D7]can[/]. [T8]I[/] [D1]have[/] [S3]water[/]. [D1]Do[/] [T8]you[/] [D3]like[/] [T1]the[/] [S2]house[/]? — Да, конечно. У меня есть вода. Вам нравится дом?

      Три глагола, без которых не обойтись в первый же день:

      > [T8]I[/] [D1]have[/] [T1]a[/] [S2]phone[/]. — У меня есть телефон.
      > [T8]I[/] [D3]like[/] [S3]coffee[/]. — Я люблю кофе.
      > [D7]Can[/] [T8]I[/] [D1]have[/] [S3]water[/], [O8]please[/]? — Можно мне воды, пожалуйста?

      **have** — «иметь», **like** — «нравиться», **can** — «мочь, можно». Обратите внимание: в русском во всех трёх фразах главное слово не «я», а «у меня», «мне», «можно мне». В английском — всегда I.
  - number: 2
    body: |
      У **like** удивительная история. Тысячу лет назад в древнеанглийском говорили примерно как по-русски: «мне нравится» — глагол `līcian` значил «быть приятным», а человек стоял в дательном падеже. Постепенно английский потерял падежи, человек переехал в начало фразы, и получилось I like.

      **can** происходит от древнеанглийского `cunnan`, «знать, уметь». Его дальний родственник — английское know, и даже русское «знать» восходит к тому же древнему корню. Изначально «I can» значило «я знаю, как».

      **have** — от древнеанглийского `habban`, «держать, иметь».
  - number: 3
    body: |
      Схема у всех трёх одна: **кто — глагол — что**.

      > [T8]I[/] [D1]have[/] [T1]a[/] [J1]big[/] [S1]family[/]. — У меня большая семья.
      > [T8]I[/] [D3]like[/] [T2]this[/] [S2]room[/]. — Мне нравится эта комната.
      > [T8]You[/] [D7]can[/] [D1]have[/] [T3]my[/] [S2]book[/]. — Можешь взять мою книгу.

      - [D1]have[/] — владелец становится первым словом: не «у меня», а I.
      - [D3]like[/] — тот, кому нравится, тоже встаёт первым.
      - [D7]can[/] — после него глагол идёт в чистом виде, без to: can have.
  - number: 4
    body: |
      Вопрос с be строится просто: be выходит вперёд. А как спросить с have или like? Их вперёд не переставляют. Вместо этого в начало ставят глагол-помощник **do**. Он ничего не значит, а только сообщает: «сейчас будет вопрос».

      > [D1]Do[/] [T8]you[/] [D3]like[/] [S3]coffee[/]? — Ты любишь кофе?
      > [O4]Yes[/], [T8]I[/] [D1]do[/]. — Да.
      > [D1]Do[/] [T8]you[/] [D1]have[/] [T1]a[/] [S2]phone[/]? — У тебя есть телефон?
      > [O4]No[/], [T8]I[/] [D1]do[/][X1]n't[/]. — Нет.

      can — сам себе помощник, ему do не нужен: он сам выходит вперёд, как be.

      > [D7]Can[/] [T8]I[/] [D1]have[/] [S3]coffee[/]? — Можно мне кофе?
  - number: 5
    body: |
      Самая полезная фраза для поездки в США — вежливая просьба с can:

      > [D7]Can[/] [T8]I[/] [D1]have[/] [T1]a[/] [S3]coffee[/], [O8]please[/]? — Можно мне кофе, пожалуйста?
      > [T8]I[/] [D3]like[/] [T8]it[/]! — Мне нравится!
      > [D1]Do[/] [T8]you[/] [D3]like[/] [T8]it[/]? — Тебе нравится?

      - В заказе a coffee — это «чашка кофе». В общем смысле — просто coffee.
      - can в утверждении звучит слабо, /kən/. А can't произносят ударно и чётко /kænt/, поэтому отрицание легко расслышать.
      - Отвечают коротким хвостом с do: Yes, I do. No, I don't.
  - number: 6
    body: |
      Когда речь о нём, о ней или о ком-то одном, у глаголов появляется окончание -s: `Anna likes coffee`, а have превращается в has: `Tom has a phone`. Подробно это будет в уроке о Present Simple. Пока запомните, что с I и you окончания нет.

      «Мне нравится» и «я люблю» о еде и вещах переводятся одинаково: like. Глагол love («любить») сильнее, о нём позже.

      В британском английском часто говорят I have got. В американском обычное I have.
  - number: 7
    body: |
      Четыре задания: узнать правильную фразу, вставить do, выбрать вежливую просьбу и собрать вопрос.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Как правильно сказать «Мне нравится кофе»?"
    options: ["I like coffee.", "Me like coffee.", "Coffee likes me."]
    answer: "I like coffee."
    hint_ru: "Кто первым словом — тот, кому нравится."
    explanation_ru: "По-английски «мне нравится» строится от человека: I like coffee. Me like — ошибка, Coffee likes me — «кофе любит меня»."
    units: [LX-00034]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Вас спросили: «У тебя есть телефон?» Ответьте «Да» коротким хвостом."
    prompt_en: "Do you have a phone? — Yes, I ___."
    answer: do
    hint_ru: "Повторите глагол-помощник из вопроса."
    explanation_ru: "В коротком ответе повторяют помощника из вопроса: Do you…? — Yes, I do."
    units: [LX-00036, LX-00031]
  - order: 3
    kind: choice
    stage: substitution
    prompt_ru: "Вы в кафе и хотите вежливо попросить воды."
    options: ["Can I have water, please?", "I can water, please?", "Do I water, please?"]
    answer: "Can I have water, please?"
    hint_ru: "Нужны can и глагол have."
    explanation_ru: "Can I have …, please? — стандартная вежливая просьба. После can нужен глагол: have."
    units: [LX-00035, LX-00033, LX-00029]
  - order: 4
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «У тебя есть книга?»"
    options: [have, a, Do, book, you]
    answer: Do you have a book
    hint_ru: "Вопрос начинается с помощника."
    explanation_ru: "Do в начале сообщает о вопросе, дальше обычный порядок: you have a book."
    units: [LX-00036, LX-00033]
  - order: 5
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: спросите друга, есть ли у него кот."
    prompt_en: "___"
    answer: "Do you have a cat?"
    accepted: ["Do you have a cat"]
    hint_ru: "Вопрос с have начинается с do."
    explanation_ru: "Do you have a cat? — do в начале, дальше обычный порядок."
    units: [LX-00036, LX-00033, LX-00041]
