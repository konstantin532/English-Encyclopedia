layers:
- number: 1
  body: 'Звонок близкому человеку — это не только «что ты делаешь». Это ещё «ты меня слышишь?», «скучаю», «люблю» и «скоро созвонимся». Мама Тома говорит всё это за одну минуту — и вы после урока сможете так же.


    > [D7]Can[/] [T8]you[/] [D6]hear[/] [T8]me[/]? — Ты меня слышишь?

    > [O4]Okay[/]. [T8]I[/] [D3]miss[/] [T8]you[/], [S1]Tom[/]. [D3]Love[/] [T8]you[/]! [D5]Talk[/] [P2]to[/] [T8]you[/] [A2]soon[/]! — Ладно. Скучаю по тебе, Том. Люблю тебя! Скоро созвонимся!

    '
- number: 2
  body: '**Video** — от латинского *video*, «я вижу». Поэтому «видео» — это то, на что смотрят. **Camera** — по-латыни «комната»: первые фотоаппараты были тёмными комнатами с маленьким отверстием.


    **Miss** в старом значении — «промахнуться, не попасть». Когда вы скучаете, человек как будто «мимо» вас — его не хватает рядом.

    '
- number: 3
  body: 'Слова для звонка:


    > [T8]I[/] [D7]can[/] [D6]hear[/] [T3]your[/] [S9]voice[/]. — Я слышу твой голос.

    > [T8]I[/] [D1]am[/] [P3]on[/] [T3]your[/] [S2]screen[/]! — Я у тебя на экране!


    - **hear** — слышать (само по себе), **listen to** — слушать специально.

    - **talk to someone** — разговаривать с кем-то: I am talking to my mom.

    - **miss someone** — скучать по кому-то, без предлога: I miss you.

    - **love** — любить: о людях и о вещах: I love coffee.

    '
- number: 4
  body: |
    **Почему «I miss you», а не «I miss for you»?** В русском «скучаю **по** тебе», а в английском человек — прямое дополнение, как в *I like you*. Предлог не нужен.

    > [O1]Hello[/]! [O4]Yes[/], [T8]I[/] [D1]am[/] [D5]writing[/] [P2]to[/] [T3]my[/] [S1]mom[/]. [T8]I[/] [A5]really[/] [D3]miss[/] [T8]her[/]. — Здравствуйте! Да, пишу маме. Я очень по ней скучаю.

    **Someone, something, everyone** — слова-«заменители». **Some-** значит «какой-то»: someone — кто-то, something — что-то. **Every-** — «каждый, все»: everyone — все люди. После них глагол как после he: *Someone is laughing. Everyone is drinking coffee.*

    **Диагностика понимания:** вы слышите смех, но не видите, кто смеётся. Как спросить: *Is someone laughing?* или *Are someone laughing?*

    **Разбор:** *Is someone laughing?* someone грамматически требует единственного числа, поэтому **is**, как с he. Это правило согласования, а не способ посчитать людей: **everyone** тоже сочетается с **is**, хотя означает всех.

- number: 5
  body: 'Так говорят американцы:


    > [T2]That[/] [D1]is[/] [A5]very[/] [J3]nice[/], [S1]Anna[/]. [S1]Moms[/] [D3]love[/] [S9]letters[/]. — Это очень мило, Анна. Мамы любят письма.

    > [J3]Nice[/] [X2]to[/] [D2]meet[/] [T8]you[/] [A5]too[/]! — Мне тоже приятно!


    - **very** — очень: very nice, very cold.

    - **too** в конце фразы — «тоже»: *I miss you too.* Перед прилагательным too значит «слишком» — это в другой неделе.

    - **really** — «правда, очень» перед глаголом: *I really miss her.*

    - **Love you!** и **Talk to you soon!** — так прощаются с семьёй и друзьями.


    Ещё слова недели: **cup** — чашка, **dish / dishes** — тарелка, посуда; **person / people** — человек, люди; **together** — вместе; **soon** — скоро; **funny** — смешной.

    '
- number: 6
  body: |
    Ловушки:

    - «I miss for you» — лишний предлог. Правильно: I miss you.
    - **Two people** — обычный разговорный вариант. **Two persons** грамматически возможно, но обычно встречается в официальных текстах и объявлениях; это различие стиля, а не запрет формы.
    - «I am hear you» — после am нельзя оставить hear в основной форме. В значении «слышу звук» естественно **I can hear you** или **I hear you**, без am. **I hear you** в другом контексте может также означать «понимаю тебя».
    - На *I miss you* ответьте **I miss you too**: так ясно, что вы тоже скучаете по собеседнику. **Me too** — короткое «я тоже», смысл которого зависит от предыдущей фразы; полный ответ здесь понятнее.

- number: 7
  body: 'Шесть заданий: узнать фразу для начала звонка, выбрать слово без лишнего предлога, собрать прощание, ответить на тёплую фразу, выбрать is после someone и закончить звонок.


    **Проверка маленького шага:** I miss you — без предлога. Someone, everyone — как he: is, likes. Too в конце — «тоже».

    '
