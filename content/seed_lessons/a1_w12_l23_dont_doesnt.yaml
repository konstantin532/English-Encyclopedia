    note_ru: "He doesn't, she doesn't, it doesn't."
layers:
  - number: 1
    body: |
      Раньше вы отрицали **be** (*it is not*) и **can** (*I can't sleep*). Теперь отрицание **обычных смысловых глаголов в Present Simple**: *have, get, know*. Здесь нужен помощник **do / does + not**. Нельзя механически добавлять *don't* к любой английской конструкции: с **be** и **can** правила другие.

      > [T1]The[/] [S9]address[/] [D1]is[/] [P1]on[/] [T1]the[/] [S2]envelope[/]. [C5]But[/] [T8]I[/] [D1]do[/] [X1]not[/] [D1]have[/] [T1]a[/] [S2]stamp[/]. — Адрес на конверте. Но у меня нет марки.
      > [T1]The[/] [J2]old[/] [S2]mailbox[/]? [T8]It[/] [D1]does[/] [X1]not[/] [D2]get[/] [S9]letters[/]. — Старый ящик? Туда письма не приходят.

      В разговоре — **don't** и **doesn't**.
  - number: 2
    body: |
      Раньше отрицание ставили прямо после глагола: «I know not», «I have not a stamp». Такие фразы ещё встречаются у Шекспира. Позже вместо этого стали говорить через do: I do not know. Глагол остался на своём месте, а «не» встало рядом с помощником.

      **know** когда-то читали со звуком k — «кноу». Звук исчез, а буква осталась, как память о прошлом.
  - number: 3
    body: |
      Схема:

      > [A1]Never[/]. [T8]I[/] [D1]do[/] [X1]not[/] [D6]know[/]! — Никогда. Сам не знаю почему!

      - I, you, we, they — **don't**: I don't know.
      - he, she, it, одна вещь — **doesn't**: it doesn't get letters.
      - После **don't / doesn't** смысловой глагол остаётся в **начальной форме**: *she doesn't live*. Не *doesn't lives*: форму третьего лица уже показывает *does*.
      - Отрицание с be — без do: it is not, I am not.
  - number: 4
    body: |
      **Почему doesn't live, а не doesn't lives?** Форму третьего лица выражает помощник **does**; **not** делает её отрицательной, а смысловой глагол остаётся в **начальной форме**. *Doesn't* — сокращение от *does not*, а не новый смысловой глагол. «-s переехало» — лишь удобный образ, не буквальное действие.

      - My mother lives in Russia. → My mother doesn't live in Russia.
      - The mailbox gets letters. → The mailbox doesn't get letters.

      > [T8]It[/] [D1]does[/] [X1]not[/] [D2]get[/] [S9]letters[/]? [A1]Never[/]? — Не приходят? Никогда?

      **Диагностика понимания:** Вы хотите сказать «Она не живёт здесь». Что верно: *She doesn't live here* или *She doesn't lives here*?

      **Разбор:** *She doesn't live here*. **Doesn't** уже обозначает третье лицо и отрицание, поэтому основной глагол **live** не получает **-s**. В утверждении: *She lives here*.
  - number: 5
    body: |
      Так говорят американцы:

      > [A1]Never[/]. [T8]I[/] [D1]do[/] [X1]not[/] [D6]know[/]! — Никогда. Сам не знаю почему!

      - I don't know — самая частая фраза для «не знаю». Можно смягчить: Sorry, I don't know.
      - I don't have… — «у меня нет…»: I don't have a stamp, I don't have time.
      - Полные **do not / does not** тоже правильны и естественны, особенно при смысловом выделении. Сокращения **don't / doesn't** очень часты в разговорном американском английском.

      Почтовая ситуация: нет вещи или информации.

      > [T8]I[/] [D1]do[/][X1]n't[/] [D1]have[/] [T1]an[/] [S2]envelope[/]. — У меня нет конверта.
      > [T1]The[/] [S9]mail[/] [D1]does[/][X1]n't[/] [D4]come[/] [T5]every[/] [S7]day[/]. — Почта не приходит каждый день.

      **Mail** — почта целиком, поэтому mail **doesn't**, как it. **Package** — посылка; **postcard** — открытка, а **envelope** — конверт. Не меняйте -s у have: Tom doesn't **have** a package.

      В очереди (**line**) можно услышать **Wait, please.** — «Подождите, пожалуйста». Посылку описывают словами **large** (размер), **heavy** или **light** (вес). Адрес проверяют фразой **The address is correct.** — «Адрес правильный».
  - number: 6
    body: |
      Ловушки:

      - «I not have» — пропущен помощник. Правильно: I don't have.
      - В **стандартном американском английском** с *he* используем **doesn't**: *He doesn't know*. *He don't* можно услышать в отдельных разговорных диалектах, но для нашего учебного стандарта эта форма не подходит.
      - «She doesn't lives» — лишнее -s.

      **I don't have** — частый способ сказать «у меня нет» в американском английском, когда говорим об отсутствии вещи у человека. Но **«здесь нет…»** — другая задача, для неё мы уже изучали **there isn't / there is no**. Сравните смысл владельца и наличие в месте.
  - number: 7
    body: |
      Шесть заданий: выбрать don't или doesn't, вставить отрицание, собрать фразу, ответить в новой ситуации, выбрать отрицание для Тома и вежливо сообщить, что вы не знаете индекс.

      **Проверка маленького шага:** *She isn't at home* отрицает **состояние или место** с *be*. *She doesn't work at home* отрицает **действие** с обычным глаголом *work*. В первом предложении нужен **is not**, во втором — **does not + work**. Не выбирайте *don't/doesn't* только потому, что в русском есть «не».
