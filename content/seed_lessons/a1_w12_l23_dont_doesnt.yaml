title: "Не делаю: don't и doesn't"
summary: "Как сказать «не» с обычными глаголами: I don't have a stamp, it doesn't get letters. Когда don't, а когда doesn't, и почему I don't know — одна из самых нужных фраз."
units: [LX-00229, LX-00230, LX-00233, LX-00235, LX-00236, LX-00415, LX-00416, LX-00421, LX-00422, LX-00423, LX-00424, LX-00425, LX-00426, LX-00427, LX-00428, LX-00429]
sound_notes:
  - text: "I don't have a stamp."
    ipa: "/aɪ ˈdoʊnt hæv ə ˈstæmp/"
    note_ru: "don't — «доунт», t на конце почти не слышно"
  - text: "It doesn't get letters."
    ipa: "/ɪt ˈdʌzənt ɡɛt ˈlɛt̬ɚz/"
