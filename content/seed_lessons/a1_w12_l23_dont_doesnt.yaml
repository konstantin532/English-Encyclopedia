    kind: choice
    stage: recognition
    prompt_ru: "Как правильно: «Туда письма не приходят»?"
    options: ["It doesn't get letters.", "It don't get letters.", "It doesn't gets letters."]
    answer: "It doesn't get letters."
    hint_ru: "it — doesn't, глагол без -s."
    explanation_ru: "It doesn't get letters — с it помощник doesn't, get без -s."
    units: [LX-00235]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "У Анны нет марки. Вставьте отрицание (сокращённо)."
    prompt_en: "I ___ have a stamp."
    answer: "don't"
    accepted: ["do not"]
    hint_ru: "С I — don't."
    explanation_ru: "I don't have a stamp — «у меня нет марки»."
    units: [LX-00233]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите: «Мой друг не живёт в России»."
    options: [live, friend, doesn't, My, in, Russia]
    answer: "My friend doesn't live in Russia"
    hint_ru: "friend — он: doesn't, live без -s."
    explanation_ru: "My friend doesn't live in Russia. -s ушло в doesn't."
    units: [LX-00230]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: прохожий спрашивает, где банк. Вы не знаете. Вежливо ответьте."
    prompt_en: "Where is the bank? — ___"
    answer: "Sorry, I don't know."
    accepted: ["Sorry, I don't know", "I don't know.", "I don't know", "Sorry, I do not know.", "Sorry. I don't know."]
    hint_ru: "Sorry + I don't know."
    explanation_ru: "Sorry, I don't know — вежливо и по-американски."
    units: [LX-00229, LX-00236]
