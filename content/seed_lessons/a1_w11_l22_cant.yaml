title: "Не могу: can't и cannot"
summary: "Как сказать, что не можете что-то сделать: I can't sleep. Почему cannot пишут слитно, как различить на слух can и can't и чем but отличается от and."
units: [LX-00217, LX-00218, LX-00219, LX-00224, LX-00402, LX-00403, LX-00404, LX-00405, LX-00406, LX-00407, LX-00409, LX-00410, LX-00411]
sound_notes:
  - text: "I can't sleep."
    ipa: "/aɪ ˈkænt ˈslip/"
    note_ru: "В разговорном AmE /t/ в can't может звучать без отдельного взрыва; важны ударение, краткая остановка звука и контекст."
  - text: "I can sleep."
    ipa: "/aɪ kən ˈslip/"
    note_ru: "Безударное can часто звучит /kən/, но сильное can тоже бывает /kæn/. По одному ударению нельзя всегда отличить can от can't."
  - text: "You can't sleep?"
    ipa: "/ju ˈkænt ˈslip/"
    note_ru: "В коротком переспросе интонация может подниматься, но это не обязательное правило для каждого вопроса."
contractions:
  - full: "cannot"
    short: "can't"
    ipa: "/kænt/"
    note_ru: "US: /kænt/; UK: /kɑːnt/. Это словарные формы; в беглой речи произношение меняется. Основа курса — AmE."
layers:
  - number: 1
    body: |
      Том не может спать. Анна не может найти ключ. «Не могу» — одна из самых частых фраз в жизни. По-английски она короткая: *can't*. Сегодня вы разберёте её устройство и признаки, которые помогают отличать can от can't в речи.

      На неделе 2 вы научились can — «могу». Теперь — обратное: **can't**, «не могу».

      > [T8]You[/] [D7]can[/][X1]not[/] [D2]sleep[/]? [D1]Do[/] [T8]you[/] [D2]work[/] [P1]at[/] [T1]a[/] [S2]computer[/] [T5]every[/] [S7]day[/]? — Не можете спать? Вы каждый день работаете за компьютером?

      Обычно отрицание **can** пишут одним словом: **cannot**; сокращение **can't** распространено в разговоре и письме. Сочетание **can not** тоже возможно в некоторых особых контекстах, поэтому это не абсолютно запрещённая запись.
  - number: 2
    body: |
      **I can sleep.** — Я могу спать.
      **I cannot sleep. / I can't sleep.** — Я не могу спать. Смысл меняет отрицание; слово **sleep** остаётся той же формой.

      После **can't** называем действие: **sleep, work, walk**. С другим человеком схема сохраняется: **Tom can't sleep**, без *cans* и без *sleeps*. Не добавляем to: **can't sleep**, а не *can't to sleep*.

      **I am tired** сообщает о состоянии: «Я устал». **I can't sleep** сообщает, какое действие не получается: «Я не могу спать». Чтобы соединить обе мысли, скажите **I am tired and I can't sleep.** Не смешивайте схемы: *I am can't sleep* и *I can tired* не подходят.

      **Cannot** — полная форма, обычно пишется слитно. **Can't** — её сокращение. Обе формы передают отрицание; сокращение не меняет действие на другое. В другом контексте can't может выражать и запрет, поэтому выбирайте смысл по всей ситуации.
  - number: 3
    body: |
      Схема:

      > [T8]I[/] [D7]can[/][X1]not[/] [D2]sleep[/]. — Я не могу спать.

      - Отрицание: I cannot / I can't + глагол: I can't sleep.
      - Глагол после can't без to и без -s: he can't sleep.
      - Вопрос: Can you sleep? — Yes, I can. / No, I can't.
      - **but** показывает контраст: My head is OK, but my back hurts. Не обязательно искать слова-антонимы: достаточно, что вторая мысль расходится с первой или с ожиданием.

      **Самочувствие и действие — разные вещи.** Sick — нездоровый, tired — уставший, hungry — голодный, thirsty — испытывающий жажду, well — здоровый. О состоянии говорят с be или feel — «чувствовать себя»:

      > [T8]I[/] [D3]feel[/] [J4]sick[/] [C1]and[/] [J4]tired[/]. [T8]I[/] [D1]have[/] [T1]a[/] [S5]headache[/]. — Мне нехорошо, и я устал. У меня болит голова.
      > [T8]I[/] [D1]am[/] [J4]hungry[/]. — Я голоден.
      > [T8]I[/] [D3]feel[/] [J4]thirsty[/]. — Я хочу пить.
      > [T8]I[/] [D1]am[/] [J4]well[/]. — Я здоров.

      Не смешивайте схемы: I am tired или I feel tired, без «I am feel». Well здесь описывает здоровье человека.

      Rest — отдыхать, sit — сидеть, sleep — спать. После can / can't нужен **глагол** в начальной форме: sleep, sit. Само прилагательное не подходит: нельзя *I can tired*. Глагол **be** тоже может стоять после can: **can be**, а не *can am*; эту схему разберём подробнее позже.

      > [T8]I[/] [D7]can[/] [D2]sit[/], [C5]but[/] [T8]I[/] [D7]ca[/][X1]n't[/] [D2]sleep[/]. — Я могу сидеть, но не могу спать.
      > [D2]Rest[/] [P1]at[/] [S4]home[/] [T5]every[/] [S7]day[/] [C1]and[/] [D2]drink[/] [S3]water[/]. — Отдыхайте дома каждый день и пейте воду.

      Medicine — лекарство, обычно без a в общем значении. Здесь мы учим слово, а не выбираем лечение:

      > [T8]I[/] [D1]have[/] [S5]medicine[/]. — У меня есть лекарство.
  - number: 4
    body: |
      **Как услышать разницу can и can't в американском английском?** Конечный /t/ в **can't** иногда **не имеет отчётливого взрыва** и может быть трудно слышен. Но нельзя сказать, что американцы «почти не произносят t» всегда. Смотрите на сочетание **звуков, ударения и контекста**:

      - I **can** sleep — can безударное, короткое: «ай кн слип».
      - *I **can't** sleep* — отрицательная форма **часто** получает больше ударения; в разных вариантах американского произношения звуки и длительность могут отличаться.

      Ударение помогает, но не даёт гарантии: can тоже бывает ударным, когда подчёркивают возможность. Слушайте всю фразу и смысл.

      > [O4]No[/], [T8]it[/] [D1]does[/] [X1]not[/]. [C5]But[/] [T3]my[/] [S5]back[/] [D3]hurts[/], [C1]and[/] [T8]I[/] [D7]can[/][X1]not[/] [D2]sleep[/]. — Нет. Но болит спина, и я не могу спать.

      **Диагностика понимания:** Вы хотите сказать «Я не могу спать». Что верно: *I can't sleep* или *I don't can sleep*?

      **Разбор:** *I can't sleep*. **Can** — модальный глагол, его отрицание строят **can + not**, а не с **do**. После **can't** слово **sleep** остаётся без **to**.
  - number: 5
    body: |
      Так звучит отказ и совет у врача:

      > [T5]Every[/] [S7]day[/]? [C5]But[/] [T8]I[/] [D3]like[/] [T3]my[/] [S2]computer[/]! — Каждый день? Но я люблю свой компьютер!
      > [C1]And[/] [T4]no[/] [S2]computer[/] [P3]at[/] [S7]night[/]! — И никакого компьютера ночью!

      - В разговоре обычно can't; cannot часто встречается в письме или при подчёркивании отрицания.
      - Вежливый отказ: Sorry, I can't.
      - Совет врача часто звучит как указание: Walk every day. Drink water.
  - number: 6
    body: |
      Ловушки:

      - **I cannot sleep / I can't sleep** — обычные формы «Я не могу спать». Написание *can not* встречается при особом смысловом выделении и в некоторых конструкциях, но **не требуется** для нашего простого отрицания.
      - «I can't to sleep» — лишнее to.
      - **and** добавляет информацию: I walk and I read. **But** выделяет контраст: I walk, but Tom never walks. Это выбор связи между мыслями, а не правило, что после and могут быть только похожие слова, а после but — только противоположные.
  - number: 7
    body: |
      Шесть заданий: различить can и can't, вставить отрицание, собрать фразу с but и отказаться в новой ситуации; назвать самочувствие и объяснить, что не можете делать.

      **Проверка маленького шага:** *I can sleep* и *I can't sleep* различаются **смыслом отрицания**. В американской речи конечный /t/ в *can't* не всегда звучит отчётливо, поэтому не полагайтесь только на одну букву или ударение: слушайте **всю фразу** и уточняйте смысл, если не расслышали.
