title: "В автобусе: билет, остановка и Does this bus go…?"
summary: "Как самостоятельно проехать на автобусе в американском городе: спросить, куда он идёт, купить билет и узнать время следующего. Знакомые вопросы и новые слова для поездки."
units: [LX-00252, LX-00253, LX-00254, LX-00255, LX-00256, LX-00257, LX-00258, LX-00464, LX-00465, LX-00466, LX-00467, LX-00468, LX-00469, LX-00470, LX-00471, LX-00472, LX-00473, LX-00474, LX-00478, LX-00480, LX-01064]
sound_notes:
  - text: "Does this bus go to Park Street?"
    ipa: "/dəz ðɪs ˈbʌs ɡoʊ tə ˈpɑrk ˌstrit/"
    note_ru: "В does this подряд идут /z/ и /ð/: для /ð/ кончик языка у зубов. Безударное to звучит /tə/."
  - text: "How much is a ticket?"
    ipa: "/ˌhaʊ ˈmʌtʃ ɪz ə ˈtɪkɪt/"
    note_ru: "is a сливаются: «изэ»; ticket — «тИкит»"
  - text: "What time is the next bus?"
    ipa: "/ˌwʌt ˈtaɪm ɪz ðə ˈnɛks ˈbʌs/"
    note_ru: "В быстрой речи /t/ в next перед bus может не звучать отчётливо. Чёткое произнесение /t/ тоже допустимо."
contractions:
  - full: "it is"
    short: "it's"
    ipa: "/ɪts/"
    note_ru: "It's two dollars — цену называют с it's."
  - full: "do not"
    short: "don't"
    ipa: "/doʊnt/"
    note_ru: "I don't know — если водитель не знает ответа."
layers:
  - number: 1
    body: |
      Финальное приключение A1: Анна и Том едут на автобусе на Park Street — по адресу со старой фотографии. Вам понадобится всё, что вы выучили: числа, цены, время и вопросы. Попробуйте применить знакомые конструкции в новой сцене поездки.

      В учебной поездке нужны три вопроса: куда идёт автобус, сколько стоит билет и когда следующий.

      > [O2]Excuse me[/]! [D1]Does[/] [T2]this[/] [S4]bus[/] [D4]go[/] [P2]to[/] [S4]Park[/] [S4]Street[/]? — Извините! Этот автобус идёт до Парк-стрит?
      > [A6]How[/] [T4]much[/] [D1]is[/] [T1]a[/] [S2]ticket[/]? — Сколько стоит билет?

      Вопросы о цене и времени уже знакомы. На этой неделе добавим bus, ticket, stop и другие слова для поездки.
  - number: 2
    body: |
      **Три цели — три вопроса.** Не выбирайте помощник только по слову **bus**: сначала решите, что хотите узнать.

      - **Маршрут:** *Does this bus go to Park Street?* Есть действие **go**; с **this bus**, как с **it**, используем **does**. После него **go** без -s.
      - **Цена:** *How much is a ticket?* Здесь нет действия **go**. Цена одного билета — вопрос с **is**.
      - **Время:** *What time is the next bus?* В этом готовом вопросе тоже **is**, хотя речь снова об автобусе.

      Проверьте цель перед вопросом. Ответ *Yes, it does* подходит к маршруту; *It's two dollars* сообщает цену; *At six* — время.
  - number: 3
    body: |
      Схема поездки:

      > [O4]Yes[/], [T8]it[/] [D1]does[/]. [S4]Park[/] [S4]Street[/] [D1]is[/] [T1]the[/] [J8]last[/] [S4]stop[/]. [T1]The[/] [S4]train[/] [S4]station[/] [D1]is[/] [P1]near[/] [T1]the[/] [S4]park[/]. — Да. Парк-стрит — конечная. Железнодорожная станция рядом с парком.
      > [N1]Two[/] [S2]tickets[/], [O8]please[/]. [A3]Here[/] [T8]you[/] [D1]are[/]. — Два билета, пожалуйста. Вот, держите.

      - Куда: Does this bus go to…? — Yes, it does. / No, it doesn't.
      - Цена: How much is a ticket? — It's two dollars.
      - Покупка: One ticket, please. / Two tickets, please.
      - Время: What time is the next bus? — At six.
  - number: 4
    body: |
      **Почему Does this bus go…?, а не Is this bus go…?** Слово **go** помогает спросить о маршруте. Об одном автобусе — **this bus**, как **it** — вопрос начинаем с **does**. После него **go** остаётся без **-s**. Короткий ответ: **Yes, it does**. Знакомый способ говорить о привычках подходит и для обычного маршрута или расписания.

      > [T9]What[/] [S7]time[/] [D1]is[/] [T1]the[/] [J8]next[/] [S4]bus[/] [A3]back[/]? — А во сколько обратный автобус?

      back здесь — «обратно»: the bus back — автобус обратно.
  - number: 5
    body: |
      Так ездят в американских городах:

      > [T8]I[/] [D1]do[/][X1]n't[/] [D6]know[/]. [O2]Sorry[/]! — Не знаю. Извините!

      - Способ оплаты, стоимость и правила провоза вещей зависят от города и перевозчика. Уточняйте их перед поездкой; два доллара в диалоге — цена в нашем вымышленном сюжете.
      - last stop — конечная остановка, next stop — следующая.
      - Расписание — schedule, американцы говорят «скЕджул».

      Другие виды транспорта и остановки:

      **Train** — поезд, **car** — автомобиль, **taxi** — такси, **plane** — самолёт. **Train station** — железнодорожная станция, **airport** — аэропорт. **Bus stop** — остановка автобуса. Не заменяйте station словом stop в вопросе о железнодорожной станции.

      > [T1]The[/] [S4]train[/] [D4]arrives[/] [P3]at[/] [N3]six[/]. — Поезд прибывает в шесть.
      > [T1]The[/] [S4]bus[/] [D4]leaves[/] [P3]at[/] [N3]five[/]. — Автобус отправляется в пять.
      > [T8]I[/] [D3]want[/] [X2]to[/] [D2]buy[/] [T1]a[/] [S2]ticket[/]. — Я хочу купить билет.

      **Leave** — отправляться, **arrive** — прибывать: это разные моменты поездки. После does глагол без -s: **What time does the train arrive?** Прибыть на станцию — **arrive at the station**, в город — **arrive in the city**. Для этих обычных значений учим **at / in**, а не *arrive to*. **Travel** — ездить, путешествовать; **trip** — отдельная поездка.

      Сумка — **bag**, место для сидения — **seat**. **Take a seat, please.** — приглашение сесть; sit — само действие, seat здесь предмет или место. Цены и время в сценках вымышленные, а способ оплаты и правила провоза вещей зависят от перевозчика.
  - number: 6
    body: |
      Ловушки:

      - **By bus** обозначает способ поездки: I travel by bus — «Я езжу на автобусе». **On the bus** обозначает нахождение или поездку в автобусе: I am on the bus — «Я в автобусе». Нельзя механически менять одно на другое: *I am by bus* не передаёт «Я в автобусе».
      - «Two ticket» — нужно -s: two tickets.
      - stop — и «остановка», и «останавливаться»: The bus stops here — автобус здесь останавливается.
  - number: 7
    body: |
      Шесть заданий: понять ответ водителя, купить билеты, собрать вопрос о расписании, спросить направление, различить прибытие и отправление, найти станцию в новом городе.
