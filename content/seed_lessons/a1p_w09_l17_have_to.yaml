layers:
- number: 1
  body: 'Под раковиной течёт вода. Анне надо звонить хозяину, мастеру — менять трубу. А вот платить Анне и Тому не нужно. Для бытовой необходимости удобно использовать **have to**, а для отсутствия необходимости — **don''t have to**.


    > [D4]Turn[/] [X3]off[/] [T1]the[/] [S3]water[/]! [D2]Put[/] [T1]a[/] [S2]bucket[/] [P1]under[/] [T1]the[/] [S2]pipe[/]. [T8]I[/] [D1]have[/] [X2]to[/] [D5]call[/] [T1]the[/] [S1]landlord[/]. — Перекрой воду! Поставь ведро под трубу. Мне надо позвонить хозяину.

    '
- number: 2
  body: '**Have to + глагол** — цельная конструкция необходимости: «надо / приходится». Не переводите её по частям как «иметь» и «чтобы»: *I have to call* — «Мне надо позвонить», а не «У меня есть звонок».

    **Have** здесь изменяется: *he has to*, в прошлом — *had to*. В вопросах и отрицаниях помогают **do / does / did**. После помощника нужна основная форма **have**: *Does he have to pay? He doesn''t have to pay.* С **must** другой порядок: без do и без to. Обе конструкции могут выражать необходимость; выбор зависит от ситуации, а не только от наличия форм.

    '
- number: 3
  body: 'Схема:


    > [O4]No[/], [T8]you[/] [D1]do[/] [X1]not[/] [D1]have[/] [X2]to[/] [D2]pay[/]. [T1]The[/] [S1]landlord[/] [D1]has[/] [X2]to[/] [D2]pay[/]. — Нет, вам платить не нужно. Платит хозяин.


    - Надо: **I / you / we / they have to + глагол**.

    - Ему, ей: **he / she has to + глагол** — The landlord has to pay.

    - Не обязательно: **don''t / doesn''t have to** — You don''t have to wait.

    - Вопрос: **Do we have to…? / Does he have to…?**

    '
- number: 4
  body: '**mustn''t и don''t have to — не одно и то же!**


    - *You mustn''t pay* — платить **нельзя** (запрещено).

    - *You don''t have to pay* — платить **не нужно** (можно не платить).


    > [D1]Do[/] [T8]we[/] [D1]have[/] [X2]to[/] [D2]pay[/] [P5]for[/] [T8]it[/]? — Нам за это платить?


    **Диагностика понимания:** ремонт бесплатный. Что сказать: *You mustn''t pay* или *You don''t have to pay*?


    **Разбор:** *You don''t have to pay.* Платить не нужно, но никто не запрещает.

    '
- number: 5
  body: 'Так говорят американцы:


    - **What''s wrong?** — что случилось?

    - **How long does it take?** — сколько времени это займёт?

    - **That''s fine.** — ничего страшного.

    - **for free** — бесплатно; **every month** — каждый месяц.


    Слова: **repair** — чинить, **landlord** — хозяин квартиры, **owner** — владелец, **plumber** — сантехник, **rent** — плата за квартиру, **month** — месяц, **free** — бесплатный.

    '
- number: 6
  body: 'Ловушки:


    - «He have to» — с he / she: **has to**.

    - «I must to» и «I have pay» — must без to, have — с to: **I must pay / I have to pay**.

    - «You mustn''t wait» вместо «не обязательно ждать» — нужно **don''t have to**.

    - «Do we must…?» — спросите **Do we have to…?**

    '
- number: 7
  body: 'Шесть заданий: выбрать have или has, сказать «не обязательно», собрать вопрос, рассказать о своих делах, отличить mustn''t от don''t have to и спросить, сколько времени займёт ремонт.


    **Проверка маленького шага:** have / has to — надо; don''t / doesn''t have to — не обязательно; mustn''t — нельзя.

    '
