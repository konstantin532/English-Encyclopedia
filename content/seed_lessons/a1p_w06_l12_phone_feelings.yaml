layers:
- number: 1
  body: 'Рут вернула телефон и предупредила: батарея села. А когда разговор зашёл о Роуз, она призналась, что разволновалась. В этом уроке — слова о телефоне и о чувствах.


    > [D1]Be[/] [J6]careful[/] [P4]with[/] [T8]it[/]. [T1]The[/] [S2]battery[/] [D1]is[/] [J2]dead[/]. — Осторожнее с ним. Батарея села.

    > [O2]Thank[/] [T8]you[/] [F4]so[/] [T4]much[/]! [T8]You[/] [D1]are[/] [A5]very[/] [J6]kind[/]. — Огромное спасибо! Вы очень добры.

    '
- number: 2
  body: '**Battery** — от французского *batterie*, «ряд пушек»: учёные XVIII века соединяли банки с электричеством в ряд, как пушки на батарее. **Nervous** — от латинского *nervus*, «нерв». **Stranger** — родственник слова strange: незнакомец — это «чужой, странный» человек.

    '
- number: 3
  body: 'Схема чувств:


    > [S1]Tom[/], [T8]she[/] [D1]was[/] [J4]afraid[/] [P6]of[/] [T9]something[/]. [T8]I[/] [D3]want[/] [P2]to[/] [D6]know[/] [T3]her[/] [S10]secret[/]. — Том, она чего-то боялась. Я хочу узнать её тайну.


    - Сейчас: **I am glad / nervous / afraid.**

    - В прошлом: **I was nervous. We were surprised.**

    - Чего боятся — **afraid of**: afraid of something, afraid of dogs.

    - Телефон: **The battery is dead** — сел. **I need a charger** — нужна зарядка. **I forgot my password** — забыл пароль.

    '
- number: 4
  body: '**Почему «I am afraid», а не «I afraid»?** Чувства по-английски — это прилагательные, им нужен глагол **be**: I **am** glad, she **was** nervous. По-русски «мне страшно», а по-английски «я есть испуганный».


    **surprised или surprising?** **-ed** — о том, кто чувствует: *I was surprised* (я удивился). **-ing** — о том, что вызывает чувство: *It was surprising*.


    **Диагностика понимания:** что верно: *I was surprising* или *I was surprised*?


    **Разбор:** *I was surprised.* Удивились вы — значит -ed.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Come in!** — заходите!

    - **You''re very kind.** — вы очень добры.

    - **I''m glad!** — я рад(а)!

    - **Be careful!** — осторожнее!

    - **My battery is dead.** — у меня сел телефон.


    Слова: **knock** — стучать, **print** — печатать, **album** — альбом, **stairs** — лестница, **downstairs** — внизу, **secret** — тайна, **memory** — воспоминание, **stranger** — незнакомец, **tonight** — сегодня вечером, **strange** — странный.

    '
- number: 6
  body: 'Ловушки:


    - «I nervous» — нужен глагол: **I am nervous / I was nervous**.

    - «afraid from» — правильно **afraid of**.

    - «stranger» — не «странный», а «незнакомец». Странный — **strange**.

    - «My phone is died» — говорят **my battery is dead**.

    '
- number: 7
  body: 'Шесть заданий: сказать, что телефон сел, выбрать afraid of, собрать благодарность, рассказать, как вы волновались, отличить stranger от strange и предупредить «осторожно».


    **Проверка маленького шага:** чувство = am / is / are / was / were + слово.

    '
