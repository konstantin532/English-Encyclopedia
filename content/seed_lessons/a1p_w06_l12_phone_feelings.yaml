title: 'Телефон и чувства: The battery is dead. I was nervous.'
summary: 'Слова о телефоне (battery, charger, password) и о чувствах в прошлом: nervous, afraid, glad, surprised. Как поблагодарить незнакомого человека: Thank you so much! You are very kind.'
