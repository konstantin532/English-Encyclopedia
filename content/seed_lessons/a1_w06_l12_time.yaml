title: "Время: at seven, in the evening, lunch и dinner"
summary: "Как назвать время на часах, время действия и части дня: It is seven o'clock, at six, in the evening, at night; поговорим о breakfast, lunch и dinner без выдуманного общего расписания США."
units: [LX-00131, LX-00132, LX-00133, LX-00135, LX-00136, LX-00140, LX-00124, LX-00126, LX-00309, LX-00310, LX-00311, LX-00312, LX-00316, LX-00317, LX-00173]
sound_notes:
  - text: "It's seven o'clock."
    ipa: "/ɪts ˈsɛvən əˈklɑk/"
    note_ru: "o'clock — «экЛАК»: первый звук короткий, ударение на clock"
  - text: "What time do you get up?"
    ipa: "/ˌwʌt ˈtaɪm də jə ɡɛt ˈʌp/"
    note_ru: "t в what почти не слышно перед time: «уа тайм»"
  - text: "at seven"
    ipa: "/ət ˈsɛvən/"
    note_ru: "at без ударения звучит как короткое «эт»"
contractions:
  - full: "it is"
    short: "it's"
    ipa: "/ɪts/"
    note_ru: "Время называют с it's: It's seven o'clock."
layers:
  - number: 1
    body: |
      Здесь два разных вопроса, хотя в русском оба содержат слово «семь»: **«Который час?»** — сообщаем время сейчас; **«Во сколько?»** — говорим, когда происходит действие. В английском ответы строятся по-разному.

      > [T8]It[/] [D1]is[/] [N3]seven o'clock[/]. — Сейчас ровно семь.
      > [T8]I[/] [D9]get[/] [X3]up[/] [P3]at[/] [N3]five[/]. — Я встаю в пять.

      Числа вы знаете с недели 3. Осталось научиться ставить их рядом с at и o'clock.
  - number: 2
    body: |
      **o'clock** — сокращение старого выражения `of the clock`, «по часам». Когда часы на башнях были новинкой, люди уточняли: время по часам, а не по солнцу.

      **time** — древнее `tīma`, «отрезок, пора». Отсюда же английское tide — прилив, который приходит в своё время.
  - number: 3
    body: |
      Две формы:

      > [T8]It[/] [D1]is[/] [N3]seven o'clock[/]. — Сейчас семь.
      > [T8]You[/] [D1]are[/] [A3]here[/] [P3]at[/] [N3]seven[/]! — Вы здесь в семь!

      - **Который час?** — *It is seven o'clock*: *it is* сообщает текущее время.
      - **Во сколько происходит событие?** — *at seven*: **at** соединяет действие с точным временем.
      - o'clock говорят только про ровный час. Можно и без него: at seven.
      - Вопрос «во сколько?» — What time…?: What time do you get up?
  - number: 4
    body: |
      Почему at? В английском at указывает на точку: точку на карте (at home) и точку на часах (at seven). Время ровно в семь — это точка, поэтому at.

      По-русски говорим «в семь», и хочется повторить предлог как *in seven*. Но при обозначении **точного времени события** обычно используем **at seven**. *In* используется иначе, например в *in the evening* («вечером») или в сочетаниях про месяцы и годы. Не переводите русское «в» одним английским предлогом во всех случаях.

      > [T8]I[/] [D2]drink[/] [S3]coffee[/] [P3]at[/] [N3]seven[/]. — Я пью кофе в семь.
  - number: 5
    body: |
      Так говорят о времени американцы:

      > [J3]Good[/] [S7]morning[/]! [T8]You[/] [D1]are[/] [A3]here[/] [P3]at[/] [N3]seven[/]! — Доброе утро! Вы здесь в семь!
      > [T9]What[/] [S7]time[/] [D1]do[/] [T8]you[/] [D9]get[/] [X3]up[/], [S1]Mia[/]? — Во сколько ты встаёшь, Мия?

      - В разговоре: It's seven o'clock — или совсем коротко: Seven.
      - What time is it? — «Который час?»
      - Время открытия кафе и привычки людей в США различаются. Примеры *at six* и *at seven* здесь показывают грамматику, а не универсальное расписание американцев.
  - number: 6
    body: |
      Русское «в» перед временем — ловушка. Сравните:

      - в семь — at seven (не in seven);
      - в кафе — at the cafe;
      - дома — at home.

      **Seven o'clock** обозначает время на часах, а **seven hours** — продолжительность («семь часов»). Оба выражения правильны, но отвечают на **разные вопросы**.

      Части дня говорят с **in the**, а ночь — с **at**:

      - [P1]in[/] [T1]the[/] [S7]morning[/] — утром, [P1]in[/] [T1]the[/] [S7]afternoon[/] — днём (после 12)
      - [P1]in[/] [T1]the[/] [S7]evening[/] — вечером, [P3]at[/] [S7]night[/] — ночью

      Еда тоже идёт по часам — и тоже с have, без артикля:

      > [T8]I[/] [D2]have[/] [S3]breakfast[/] [P3]at[/] [N3]seven[/], [S3]lunch[/] [P3]at[/] [N3]twelve[/] [C1]and[/] [S3]dinner[/] [P3]at[/] [N3]six[/]. — Завтрак в семь, обед в двенадцать, ужин в шесть.

      [A2]early[/] — рано, [A2]late[/] — поздно. Время ужина различается между семьями и регионами США: *dinner at six* — пример, не правило культуры.
  - number: 7
    body: |
      Шесть заданий: узнать, как назвать время, вставить at, собрать вопрос, ответить в новой ситуации, выбрать in the или at и назвать время еды.

      **Проверка маленького шага:** *It is seven o'clock* — **время сейчас**. *I have breakfast at seven* — **расписание действия**. *I sleep seven hours* — **продолжительность**, а не время на часах. Одинаковое число «семь» отвечает здесь на три разных вопроса.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Часы показывают ровно семь. Как это сказать?"
    options: ["It is seven o'clock.", "It is at seven.", "It is time seven."]
    answer: "It is seven o'clock."
    hint_ru: "Для ровного часа — o'clock."
    explanation_ru: "It is seven o'clock сообщает время сейчас; at seven связывает с этим часом действие, например I get up at seven."
    units: [LX-00132, LX-00140]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Скажите, что встаёте в шесть. Вставьте нужное слово."
    prompt_en: "I get up ___ six."
    answer: "at"
    hint_ru: "Точный час — точка на часах."
    explanation_ru: "at six — at ставят перед точным временем."
    units: [LX-00136]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Во сколько ты встаёшь?»"
    options: [get, What, up, do, time, you]
    answer: "What time do you get up"
    hint_ru: "Начните с What time, потом do you."
    explanation_ru: "What time do you get up? — what time, помощник do, потом you и get up."
    units: [LX-00133, LX-00135]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: друг спрашивает, во сколько вы завтракаете. Вы завтракаете в восемь. Ответьте."
    prompt_en: "What time do you have breakfast? — ___"
    answer: "I have breakfast at eight."
    accepted: ["At eight.", "At eight", "I have breakfast at eight", "At eight o'clock.", "I have breakfast at eight o'clock.", "Eight o'clock.", "At 8."]
    hint_ru: "at + число."
    explanation_ru: "I have breakfast at eight. Коротко — At eight."
    units: [LX-00130, LX-00136]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: "Как сказать «вечером»?"
    options: ["in the evening", "at the evening", "in evening"]
    answer: "in the evening"
    hint_ru: "Части дня — с in the."
    explanation_ru: "in the morning, in the afternoon, in the evening — но at night."
    units: [LX-00312]
  - order: 6
    kind: fill
    stage: substitution
    prompt_ru: "Скажите, что вы обедаете в двенадцать."
    prompt_en: "I have ___ at twelve."
    answer: "lunch"
    hint_ru: "Обед в середине дня."
    explanation_ru: "I have lunch at twelve. — lunch без артикля, как breakfast и dinner."
    units: [LX-00309]
