layers:
- number: 1
  body: 'Понедельник, кафе Мии. «Как прошли выходные?» — и чтобы ответить, нужно впервые заговорить о прошлом. Хорошая новость: для «был, была, были» в английском всего два слова.


    > [J3]Good[/] [S7]morning[/]! [A6]How[/] [D1]was[/] [T3]your[/] [S7]weekend[/]? — Доброе утро! Как прошли выходные?

    > [T8]It[/] [D1]was[/] [J3]great[/]! [P3]On[/] [S7]Saturday[/], [S1]Tom[/] [C1]and[/] [T8]I[/] [D1]were[/] [P3]at[/] [T1]the[/] [S4]museum[/]. — Отлично! В субботу мы с Томом были в музее.

    '
- number: 2
  body: '**was** и **were** — прошедшие формы глагола **be**, того самого am / is / are. В древнеанглийском у be было несколько разных корней, поэтому формы так не похожи друг на друга: be, am, is, was — это осколки разных старых глаголов, собранных в одну семью.

    '
- number: 3
  body: 'Схема:


    > [T8]I[/] [D1]was[/] [P3]at[/] [S2]home[/]. — Я был дома.

    > [T8]We[/] [D1]were[/] [P3]at[/] [T1]the[/] [S6]beach[/]. — Мы были на пляже.


    - **I / he / she / it**, одно имя → **was**: I was, Anna was, it was.

    - **you / we / they** → **were**: you were, we were, they were.

    - Вопрос: was / were впереди: *Where were you? Was it cold?*

    - Отрицание: was not (wasn''t), were not (weren''t).

    '
- number: 4
  body: |
    **Почему you were, даже если «ты» один?** Так же, как **you are**: у you всегда форма множественного числа — и в настоящем, и в прошлом. *You were at home* — «ты был» и «вы были».

    > [D1]Were[/] [T8]you[/] [P3]at[/] [S2]home[/] [J8]last[/] [S7]night[/]? — А вчера вечером вы были дома?

    **Last night** — «вчера вечером» или «прошлой ночью», по контексту. **Yesterday evening** — точнее «вчера вечером». Вместо *yesterday night* в обычной речи выбирайте **last night**. **Yesterday** означает весь вчерашний день, а не только светлое время суток; **the day before yesterday** — позавчера.

    **Диагностика понимания:** вы рассказываете, что Мия была в кафе одна. Что верно: *Mia were alone* или *Mia was alone*?

    **Разбор:** *Mia was alone.* Одна Мия — как she, значит **was**.

- number: 5
  body: 'Так говорят американцы:


    > [O4]Yes[/], [T8]we[/] [D1]were[/]. [T8]We[/] [D1]were[/] [A5]very[/] [J4]tired[/] [P3]after[/] [T1]the[/] [S6]beach[/]. — Да. Мы очень устали после пляжа.

    > [C1]And[/] [A6]where[/] [D1]were[/] [T8]you[/] [P3]on[/] [S7]Sunday[/]? [T8]I[/] [D1]was[/] [J4]alone[/] [P1]in[/] [T1]the[/] [S4]cafe[/]. — А где вы были в воскресенье? Я была в кафе одна.


    - Короткие ответы: *Yes, I was. / No, I wasn''t. Yes, we were. / No, we weren''t.*

    - «Был в музее» — **at the museum**; «был на пляже» — **at the beach**; «был в воде» — **in the water**.

    - Сколько времени: **for one minute, for two hours** — с for.


    Места этой недели: **museum** — музей, **beach** — пляж, **gym** — спортзал, **concert** — концерт, **party** — вечеринка, **movie** — фильм.

    '
- number: 6
  body: 'Ловушки:


    - «I were at home» — с I нужно **was**.

    - «You was» — с you всегда **were**.

    - «Yesterday night» — говорят **last night**.

    - «a hour» — h не читается, поэтому **an hour**.

    '
- number: 7
  body: 'Шесть заданий: выбрать was или were, ответить коротко, собрать вопрос, рассказать о своих выходных, выбрать last night и сказать «я не был».


    **Проверка маленького шага:** I / he / she / it — **was**. You / we / they — **were**. Вчера вечером — **last night**.

    '
