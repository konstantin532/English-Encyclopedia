    uid: EX-00098
    kind: choice
    stage: recognition
    prompt_ru: "Вас просят: Can you spell your last name, please? Что нужно сделать?"
    options: ["Назвать фамилию по буквам", "Назвать номер телефона", "Повторить имя медленно"]
    answer: "Назвать фамилию по буквам"
    hint_ru: "spell — по буквам, last name — фамилия."
    explanation_ru: "Can you spell your last name? — продиктовать фамилию по буквам."
    units: [LX-00189]
  - order: 2
    uid: EX-00099
    kind: choice
    stage: substitution
    prompt_ru: "Название какой английской буквы звучит примерно как русское «и» (/iː/)? Это вопрос о названии буквы, не аудиозадание."
    options: ["E", "I", "Y"]
    answer: "E"
    hint_ru: "I звучит «ай», Y — «уай»."
    explanation_ru: "E называется «и». Это главная ловушка для русскоязычных."
    units: []
  - order: 3
    uid: EX-00100
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Какой у вас номер телефона?»"
    options: [number, What, phone, your, is]
    answer: "What is your phone number"
    hint_ru: "What is your, потом phone number."
    explanation_ru: "What is your phone number? — в разговоре What's your phone number?"
    units: [LX-00185, LX-00190]
  - order: 4
    uid: EX-00101
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: администратор отеля просит назвать по буквам имя Tom. Продиктуйте через дефис."
    prompt_en: "Can you spell it, please? — ___"
    answer: "T-O-M"
    accepted: ["T-O-M.", "T O M", "T, O, M", "T-O-M, Tom.", "T O M."]
    hint_ru: "Три буквы: T, O, M."
    explanation_ru: "T-O-M — «ти, оу, эм». По буквам диктуют медленно, с короткими паузами."
    units: []
  - order: 5
    uid: EX-00102
    kind: choice
    stage: recognition
    prompt_ru: "Вы звоните в мастерскую и хотите поговорить с Томом. Что сказать?"
    options: ["Can I speak to Tom, please?", "Can I spell Tom, please?", "Can I call Tom's phone number?"]
    answer: "Can I speak to Tom, please?"
    hint_ru: "speak to — «поговорить с»."
    explanation_ru: "Can I speak to Tom, please? — так просят позвать человека к телефону."
    units: [LX-00367]
  - order: 6
    uid: EX-00103
    kind: fill
    stage: transfer
    prompt_ru: "Вы заняты и просите перезвонить. Скажите «Позвони мне позже»."
    prompt_en: "___"
    answer: "Call me later."
    accepted: ["Call me later", "Call me later, please.", "Please call me later."]
    hint_ru: "call + me + later."
    explanation_ru: "Call me later — «Позвони мне позже». Text me later означает «Напиши мне позже»: это другое действие, поэтому не подходит к этому заданию."
    units: [LX-00351, LX-00360, LX-00368]
