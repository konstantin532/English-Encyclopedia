    note_ru: "It's five five five… — ответ с номером."
layers:
  - number: 1
    body: |
      По телефону фамилию легко расслышать неточно. Названия букв помогают проверить запись: сегодня вы научитесь диктовать их по-английски и отличать эту задачу от диктовки номера.

      Незнакомую русскую фамилию собеседник в США **может записать по-разному**, потому что её звуки не всегда однозначно передаются английскими буквами. Поэтому полезно **назвать фамилию, а затем при необходимости продиктовать по буквам**. Телефонный номер обычно диктуют отдельными цифрами или короткими группами.

      > [O4]Yes[/]. [N7]B-E-L-O-V-A[/]. [S1]Anna[/] [S1]Belova[/]. — Да. B-E-L-O-V-A (латинскими буквами). Анна Белова.
      > [T8]It[/] [D1]is[/] [N7]five five five, two one four six[/]. — Пять-пять-пять, два-один-четыре-шесть.

      Для этого нужен английский алфавит — 26 букв.
  - number: 2
    body: |
      **Назвать имя** и **продиктовать его по буквам** — разные действия.

      **What is your name? — Tom.** — Как вас зовут? — Том. Мы произносим имя целиком.
      **Can you spell it, please? — T-O-M.** — Можете сказать по буквам? — T, O, M. Теперь называем каждую букву: /ti/, /oʊ/, /ɛm/.

      Так же с фамилией: **Can you spell your last name, please? — B-E-L-O-V-A.** Собеседник должен записать шесть латинских букв. Называйте их английские названия, а не русские «бэ, е, эль…».

      С номером телефона задача другая: **What is your phone number?** просит номер, поэтому в ответе нужны **цифры**, а не буквы фамилии. Если вам диктуют, сначала запишите ответ, затем повторите его вслух для проверки.
  - number: 3
    body: |
      Английские названия всех 26 букв. В косых чертах — произношение, как в словаре; это **названия букв**, а не все звуки, которые они обозначают при чтении:

      - **A** /eɪ/, **B** /bi/, **C** /si/, **D** /di/, **E** /i/;
      - **F** /ɛf/, **G** /dʒi/, **H** /eɪtʃ/, **I** /aɪ/, **J** /dʒeɪ/;
      - **K** /keɪ/, **L** /ɛl/, **M** /ɛm/, **N** /ɛn/, **O** /oʊ/;
      - **P** /pi/, **Q** /kju/, **R** /ɑr/, **S** /ɛs/, **T** /ti/;
      - **U** /ju/, **V** /vi/, **W** /ˈdʌbəlju/, **X** /ɛks/, **Y** /waɪ/, **Z** /zi/.

      Выберите буквы своей фамилии и произнесите их по одной. Если забыли название, найдите его в списке; не пытайтесь прочитать фамилию целиком вместо диктовки.

      - Типичный номер США — **10 цифр**: трёхзначный **код зоны** и семь цифр местного номера. *555-2146* в нашей истории — только **семизначный учебный фрагмент**, а не полноценный десятизначный номер. В реальном контакте уточняйте весь номер.
      - Цифры называют по одной: five five five, а не «пятьсот пятьдесят пять».
      - Одинаковые цифры по телефону **можно** произнести по одной (*five five five*) — это самый надёжный вариант для начинающего. Употребление *double* зависит от говорящего; не используйте его как универсальный способ диктовки американского номера.
      - 0 в номере можно назвать **zero** или **oh**, как букву O. Если важно не спутать цифру 0 с буквой O, используйте **zero**.
  - number: 4
    body: |
      **Почему название буквы не равно её звуку в слове?** В английском название **A** произносят /eɪ/, но в разных словах эта буква обозначает **разные звуки**. На написание и произношение влияла долгая история языка, включая изменения гласных и заимствования. Для диктовки нужно отдельно выучить **названия букв**, а для чтения — постепенно узнавать **звуки в словах**. Это два разных навыка.

      Самые коварные для русскоязычных:

      - E — «и», I — «ай», A — «эй»;
      - G — «джи», J — «джей»;
      - R — «ар», Y — «уай», W — «дабл-ю».

      **Диагностика понимания:** Вас попросили **продиктовать по буквам** имя Tom. Что точнее: *Tom* или *T-O-M*?

      **Разбор:** *T-O-M*. Слово **spell** здесь означает назвать **каждую букву**, а не просто повторить имя целиком. По-американски T, O, M произносят как названия букв: /tiː/, /oʊ/, /ɛm/.
  - number: 5
    body: |
      Так диктуют в Америке:

      > [D7]Can[/] [T8]you[/] [D5]spell[/] [T3]your[/] [J8]last[/] [S9]name[/], [O8]please[/]? — Продиктуйте, пожалуйста, фамилию по буквам.
      > [O4]Yes[/]. [N7]B-E-L-O-V-A[/]. [S1]Anna[/] [S1]Belova[/]. — Да. B-E-L-O-V-A. Анна Белова.

      - Хороший собеседник повторяет номер вслух, чтобы проверить себя.
      - Если буквы звучат похоже, можно уточнить через знакомое слово: *B as in boy* — «B, как в boy». В официальной связи также используют фонетические алфавиты, но для начала достаточно повторять буквы раздельно и проверять запись.
      - Z в Америке — «зи», а в Британии — «зэд».
  - number: 6
    body: |
      Русские фамилии по-английски пишут латиницей, и звуки иногда передают несколькими буквами:

      - Ж — ZH: Zhukova;
      - Ш — SH: Shilova; Щ — SHCH;
      - Ч — CH: Chernova; Х — KH: Kharitonova.

      В реальных документах написание фамилии обычно нужно **сверять с паспортом или выбранной системой транслитерации**: варианты могут отличаться. Диктуйте именно то написание, которое указано в нужном документе, медленно и короткими группами.

      Слова для телефона и сообщений:

      - [D5]call[/] — звонить, [D5]answer[/] — отвечать, [D5]text[/] — писать сообщение
      - [D2]send[/] [T1]a[/] [S9]message[/] — отправить сообщение, [S9]email[/] — электронное письмо
      - [A2]now[/] — сейчас, [A2]later[/] — позже, [A2]today[/] — сегодня, [A2]tomorrow[/] — завтра

      > [D7]Can[/] [T8]I[/] [D5]speak[/] [P2]to[/] [S1]Tom[/], [O8]please[/]? — Можно Тома к телефону?
      > [D5]Call[/] [T8]me[/] [A2]later[/]. — Перезвоните мне позже.
      > [O2]Sorry[/], [T8]it[/] [D1]is[/] [T1]the[/] [J3]wrong[/] [S9]number[/]. — Извините, вы ошиблись номером.
      > [O4]Okay[/]! [O1]See you[/] [P3]at[/] [N3]nine[/]! [O1]Bye[/]! — Хорошо! До встречи в девять! Пока!

      В анкетах: [S9]first name[/] — имя, [J8]last[/] [S9]name[/] — фамилия. Адрес почты диктуют так: anna **at** mail **dot** com. Здесь **at** — знак **@**, **dot** — точка. При записи ставьте символы: **anna@mail.com**, а не слова at и dot; это только учебный пример, не адрес для отправки.
  - number: 7
    body: |
      Шесть заданий: узнать вопрос о фамилии, определить букву по её названию и транскрипции, собрать вопрос о номере, продиктовать в новой ситуации, попросить человека к телефону и попросить перезвонить.

      **Проверка маленького шага:** *What is your name?* — назовите **имя целиком** (*Tom*). *Can you spell it?* — назовите **отдельные буквы по порядку** (*T-O-M*). Это разные действия, хотя речь об одном имени. Названия букв **не всегда совпадают** со звуками букв внутри слова.
