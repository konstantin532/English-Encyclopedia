    ipa: "/bi i ɛl oʊ vi eɪ/"
    note_ru: "E — «и», A — «эй»: самые коварные буквы"
  - text: "five five five, two one four six"
    ipa: "/faɪv faɪv faɪv tu wʌn fɔr sɪks/"
    note_ru: "в этом семизначном фрагменте — группа из трёх цифр и группа из четырёх; полный американский номер обычно диктуют группами 3–3–4"
  - text: "Can you spell your last name, please?"
    ipa: "/kən jə ˈspɛl jɚ ˈlæst ˌneɪm ˈpliz/"
