    stage: recognition
    prompt_ru: "Вас просят: Can you spell your last name, please? Что нужно сделать?"
    options: ["Назвать фамилию по буквам", "Назвать номер телефона", "Повторить имя медленно"]
    answer: "Назвать фамилию по буквам"
    hint_ru: "spell — по буквам, last name — фамилия."
    explanation_ru: "Can you spell your last name? — продиктовать фамилию по буквам."
    units: [LX-00189]
  - order: 2
    kind: choice
    stage: substitution
    prompt_ru: "Вы слышите букву «и». Какая это буква?"
    options: ["E", "I", "Y"]
    answer: "E"
    hint_ru: "I звучит «ай», Y — «уай»."
    explanation_ru: "E называется «и». Это главная ловушка для русскоязычных."
    units: [LX-00187]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Какой у вас номер телефона?»"
    options: [number, What, phone, your, is]
    answer: "What is your phone number"
    hint_ru: "What is your, потом phone number."
    explanation_ru: "What is your phone number? — в разговоре What's your phone number?"
    units: [LX-00185, LX-00190]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: администратор отеля просит назвать по буквам имя Tom. Продиктуйте через дефис."
    prompt_en: "Can you spell it, please? — ___"
    answer: "T-O-M"
    accepted: ["T-O-M.", "T O M", "T, O, M", "T-O-M, Tom.", "T O M."]
    hint_ru: "Три буквы: T, O, M."
    explanation_ru: "T-O-M — «ти, оу, эм». По буквам диктуют медленно, с короткими паузами."
    units: [LX-00183, LX-00187]
