title: "По буквам и по цифрам: алфавит, Can you spell…? и номер телефона"
summary: "Английский алфавит и его ловушки для русскоязычных. Как продиктовать фамилию по буквам и номер телефона по цифрам и понять, когда диктуют вам."
units: [LX-00183, LX-00184, LX-00185, LX-00187, LX-00189, LX-00190]
