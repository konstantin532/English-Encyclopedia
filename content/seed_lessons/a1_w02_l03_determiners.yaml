slug: a1-determiners-a-the-this-my
level: A1
week: 2
order: 3
focus: T
minutes: 40
title: "a, the, this, my: маленькие указатели"
summary: "Слова, которые стоят перед существительным и говорят, о каком предмете речь. И чем местоимение I отличается от указателя my."
units: [LX-00022, LX-00037, LX-00020, LX-00038, LX-00021, LX-00039, LX-00017, LX-00018, LX-00019]
sound_notes:
  - text: "the book"
    ipa: "/ðə ˈbʊk/"
    note_ru: "the перед согласным звуком: /ðə/"
  - text: "That's nice!"
    ipa: "/ðæts ˈnaɪs/"
    note_ru: "that is → that's"
  - text: "Is this your phone?"
    ipa: "/ɪz ðɪʃ jɚ ˈfoʊn/"
    note_ru: "в быстрой речи s + y сливаются в /ʃ/"
contractions:
  - full: "that is"
    short: "that's"
    ipa: "/ðæts/"
    note_ru: "is сокращается до /s/ после that."
layers:
  - number: 1
    body: |
      > [T2]This[/] [D1]is[/] [T3]my[/] [J2]new[/] [S2]house[/]. [T2]This[/] [D1]is[/] [T1]a[/] [J1]big[/] [S2]room[/]. — Это мой новый дом. Это большая комната.

      Перед существительным в английском почти всегда стоит маленькое слово-указатель. Оно отвечает на вопрос: **о каком именно предмете речь?**

      > [T1]a[/] [S2]book[/] — какая-то книга, одна из многих
      > [T1]the[/] [S2]book[/] — та самая книга, о которой мы знаем
      > [T2]this[/] [S2]book[/] — эта книга, рядом со мной
      > [T2]that[/] [S2]book[/] — та книга, подальше
      > [T3]my[/] [S2]book[/] — моя книга

      Такие слова называются **детерминативами**. У них одна линия сверху: в English Encyclopedia верхние линии означают служебные слова, которые скрепляют фразу.
  - number: 2
    body: |
      **Determiner** — от латинского `determinare`, «ограничивать, проводить границу» (`terminus` — граница). Детерминатив проводит границу: из всех книг на свете выбирает одну.

      **Article** (артикль) — от латинского `articulus`, «суставчик, маленькая часть». Артикли — самые маленькие суставы предложения.

      История самих артиклей простая. **a** — это ослабленное древнеанглийское `ān`, «один»: из того же слова получилось современное one. **the** выросло из старых указательных слов и родственно **that**. Получается, a значит «один», а the — «тот».
  - number: 3
    body: |
      Указатель стоит **перед** существительным, а если есть прилагательное — перед ним:

      > [T2]This[/] [S2]room[/] [D1]is[/] [J1]big[/]. — Эта комната большая.
      > [T2]That[/] [S2]house[/] [D1]is[/] [J2]new[/]. — Тот дом новый.
      > [T3]Your[/] [S2]phone[/] [D1]is[/] [P1]at[/] [S2]home[/]. — Твой телефон дома.
      > [T8]It[/] [D1]is[/] [T1]a[/] [J1]big[/] [S2]house[/]. — Это большой дом.

      Указатель в группе один: либо a, либо the, либо my. Вместе они не ставятся.

      Теперь важное различие. **I, you, it** — местоимения (pronouns). Они заменяют существительное целиком и сами бывают главным словом: I am Tom. **my, your** — притяжательные детерминативы. Они не стоят одни, им нужно существительное: my phone.
  - number: 4
    body: |
      Как выбрать между a и the? Работает простое правило знакомства. Впервые упоминаем — **a**. Дальше, когда собеседник уже знает, о чём речь, — **the**:

      > [T8]I[/] [D1]have[/] [T1]a[/] [S2]book[/]. — У меня есть книга.
      > [T1]The[/] [S2]book[/] [D1]is[/] [J3]good[/]. — Книга хорошая.

      В русском эту работу делают порядок слов и интонация: «Книга лежит на столе» и «На столе лежит книга». В английском — артикли.

      a и an — одно и то же слово. an ставится перед гласным **звуком**, чтобы два гласных не сталкивались: `an apple`. Решает звук, а не буква.
  - number: 5
    body: |
      В разговоре эти фразы звучат постоянно:

      > [D1]Is[/] [T2]this[/] [T3]your[/] [S2]phone[/]? — Это твой телефон?
      > [T2]That[/][D1]'s[/] [J3]nice[/]! — Как здорово!
      > [D1]Have[/] [T1]a[/] [J3]nice[/] [S7]day[/]! — Хорошего дня!

      - the в речи безударное: /ðə/ перед согласным, /ði/ перед гласным звуком.
      - a почти всегда звучит как короткое /ə/ и прилипает к следующему слову.
      - That's nice! — универсальная реакция на хорошую новость собеседника.
  - number: 6
    body: |
      Когда указатель **не нужен**:

      - перед именами: Anna, а не the Anna;
      - перед неисчисляемыми в общем смысле: I like coffee;
      - если уже стоит my или your: my book, а не a my book.

      Тонкость this и that. Они бывают и указателями, и местоимениями. В this room слово this — детерминатив, оно стоит перед существительным. В This is Tom слово this — местоимение, оно само указывает на человека.
  - number: 7
    body: |
      Четыре задания: выбрать a или the, выбрать this или that, вставить your и собрать фразу с указателем.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Вы впервые говорите о книге: «У меня есть книга». Что вставить?"
    prompt_en: "I have ___ book."
    options: [a, the]
    answer: a
    hint_ru: "Собеседник ещё ничего не знает об этой книге."
    explanation_ru: "При первом упоминании — a. Если продолжить разговор об этой же книге, будет the: The book is good."
    units: [LX-00022, LX-00037]
  - order: 2
    kind: choice
    stage: substitution
    prompt_ru: "Вы показываете на дом на другой стороне улицы: «Тот дом новый»."
    prompt_en: "___ house is new."
    options: [This, That]
    answer: That
    hint_ru: "Дом далеко от вас."
    explanation_ru: "That — о том, что подальше. This — о том, что рядом."
    units: [LX-00038]
  - order: 3
    kind: fill
    stage: substitution
    prompt_ru: "Вы нашли чужой телефон: «Это твой телефон?»"
    prompt_en: "Is this ___ phone?"
    answer: your
    hint_ru: "Не you're: нужно слово «твой»."
    explanation_ru: "Your — притяжательный детерминатив «твой, ваш». You're — это сокращение от you are."
    units: [LX-00039]
  - order: 4
    kind: build
    stage: production
    prompt_ru: "Соберите фразу: «Эта комната большая»."
    options: [big, room, This, is]
    answer: This room is big
    hint_ru: "Указатель стоит перед существительным."
    explanation_ru: "This room — группа «указатель + существительное», затем be и признак: This room is big."
    units: [LX-00020, LX-00024]
