title: "a, the, this, my: маленькие указатели"
summary: "Маленькие слова, которые помогают понять, о какой вещи речь. Почему I может стоять само, а после my мы называем вещь."
units: [LX-00022, LX-00037, LX-00020, LX-00038, LX-00021, LX-00039, LX-00017, LX-00018, LX-00019, LX-00481, LX-00482, LX-00483, LX-00484, LX-00485, LX-00486, LX-00487, LX-00488, LX-00489, LX-00490]
sound_notes:
  - text: "the book"
    ipa: "/ðə ˈbʊk/"
    note_ru: "the перед согласным звуком: /ðə/"
  - text: "That's nice!"
    ipa: "/ðæts ˈnaɪs/"
    note_ru: "that is → that's"
  - text: "Is this your phone?"
    ipa: "/ɪz ðɪs jɚ ˈfoʊn/"
    note_ru: "Основной образец: this /ðɪs/ + your /jɚ/. Произнесите слова слитно, но не заменяйте /s/ на /ʃ/ специально. В быстрой речи граница слов может звучать иначе; здесь тренируем ясный базовый вариант."
contractions:
  - full: "that is"
    short: "that's"
    ipa: "/ðæts/"
    note_ru: "is сокращается до /s/ после that."
layers:
  - number: 1
    body: |
      Анна показывает друзьям новый дом: *my kitchen, the table, this box*. Маленькие слова перед названием вещи работают как указательный палец: показывают, о какой именно вещи речь. В русском есть похожие слова «мой», «этот», но нет отдельных слов со всей работой английских a и the. Сегодня вы научитесь замечать эти слова и выбирать их по смыслу.

      > [T2]This[/] [D1]is[/] [T3]my[/] [J2]new[/] [S2]house[/]. [T2]This[/] [D1]is[/] [T3]my[/] [S2]kitchen[/]. — Это мой новый дом. Это моя кухня.

      В первом уроке мы встретили **my book** и **a book**. Теперь разберём, зачем нужны такие маленькие слова. Они помогают понять, **о каком предмете** мы говорим: о любом, об уже известном, об этом или о моём.

      **Когда особенно нужен указатель?** Когда называем одну вещь, которую можно посчитать по одной штуке: *a book*, *my book*. С именами (*Anna*), водой вообще (*water*) и несколькими вещами (*books*) всё устроено иначе. Поэтому не запоминайте правило «перед любым названием всегда нужен указатель».

      > [T1]a[/] [S2]book[/] — какая-то книга, одна из многих
      > [T1]the[/] [S2]book[/] — та самая книга, о которой мы знаем
      > [T2]this[/] [S2]book[/] — эта книга, рядом со мной
      > [T2]that[/] [S2]book[/] — та книга, подальше
      > [T3]my[/] [S2]book[/] — моя книга

      **a, the, my и this — слова-указатели.** Они помогают собеседнику понять, о какой вещи идёт речь. Одна линия сверху помогает заметить их в примерах. Важнее всего выбрать слово по смыслу, а не запомнить название группы.
  - number: 2
    body: |
      **Том показывает на предмет и спрашивает, что это.** Анна отвечает: *This is a book* — «Это книга». **This** уже указывает, на какую вещь они смотрят, а **a book** сообщает, что это за вещь: книга. Здесь **a** не означает, что Анна и Том не понимают, на какой предмет смотрят. Затем можно сказать *The book is new* — «Эта книга новая»: теперь **the book** обозначает конкретную обсуждаемую книгу.

      **Но the — не просто «второе упоминание».** Если Анна и Том стоят у одного стола и обоим ясно, о каком столе речь, можно сразу сказать *The table is new*. Даже если слово *table* прозвучало впервые.

      Что изменится, если выбрать другое маленькое слово?
      - *a book* — одна книга при введении предмета в разговор; в *This is a book* — название вида предмета;
      - *the book* — книга, которую собеседник может определить;
      - *this book* — эта книга: говорящий показывает на неё или выделяет её;
      - *my book* — моя книга: говорящий называет владельца.

      **Сначала решите, что хотите сообщить:** назвать предмет или рассказать о конкретной вещи? Затем спросите себя: собеседник уже знает эту вещь? Вы показываете на неё? Хотите сказать, чья она? Ответ поможет выбрать **a, the, this или my**.
  - number: 3
    body: |
      Указатель стоит **перед** названием вещи. Если мы ещё говорим, какая она, указатель ставим перед этими словами:

      > [T2]This[/] [S2]room[/] [D1]is[/] [J1]big[/]. — Эта комната большая.
      > [T2]That[/] [S2]house[/] [D1]is[/] [J2]new[/]. — Тот дом новый.
      > [T3]Your[/] [S2]phone[/] [D1]is[/] [P1]at[/] [S2]home[/]. — Твой телефон дома.
      > [T8]It[/] [D1]is[/] [T1]a[/] [J1]big[/] [S2]house[/]. — Это большой дом.

      В наших простых примерах перед одним существительным выбираем **один основной указатель**: *a book*, *the book*, *my book*, *this book*. Нельзя сказать *a my book* или *the this book*. Это правило для **данных сочетаний**, а не запрет вообще на любые два слова перед существительным: позже встретятся, например, слова количества.

      **I, you, it** могут сами называть того, о ком говорим: *I am Tom*, *It is new*. А **my, your** помогают сказать, чья вещь: *my phone*. Здесь **my** стоит **перед phone**. Не путайте **your** («твой») и **you're** («you are»), как во втором уроке.

      **This** может само означать «это»: *This is my book* — «Это моя книга». А перед **book** оно означает «эта»: *This book is new* — «Эта книга новая». Смотрите на всю фразу, чтобы выбрать перевод.
  - number: 4
    body: |
      **Как выбрать a или the?** Сначала посмотрите, что делает сочетание с существительным. Мы можем назвать, что это за вещь, или обозначить конкретную вещь, чтобы что-то о ней сообщить. Рассмотрите две фразы подряд:

      > [T2]This[/] [D1]is[/] [T1]a[/] [S2]book[/]. — Это книга (называем, что это за предмет).
      > [T1]The[/] [S2]book[/] [D1]is[/] [J2]new[/]. — Эта книга новая (мы уже знаем, о какой книге речь).

      **a** может вводить одну книгу в разговор; после **is** сочетание *a book* также называет вид предмета. Поэтому на видимую книгу нормально указать словами *This is a book*. **The book** обозначает книгу, которую слушатель **может определить из разговора или ситуации**. Например, можно сказать *the book* и при первом упоминании, если мы оба смотрим на одну конкретную книгу. И наоборот: новое упоминание не всегда требует *a*.

      В русском нужная вещь часто понятна из ситуации и порядка слов. Поэтому не ищите отдельное русское слово для каждого **a** или **the**: переводите весь смысл.

      **a или an?** Выбирайте по первому звуку **следующего слова**: перед гласным звуком — *an* (*an apple* — «яблоко»), перед согласным — *a* (*a book*). В *a big book* после **a** сразу идёт **big**, поэтому важен звук в начале **big**, а не **book**. Решает звук, а не название буквы.

      **Диагностика понимания:** Комната рядом с вами. Что верно: *This room is big* или *This is room big*?

      **Разбор:** *This room is big*. Перед **room** слово **this** означает «эта», затем **is** соединяет предмет с признаком **big**. А *This is a big room* тоже верно, но это **другая конструкция**.
  - number: 5
    body: |
      В разговоре эти фразы звучат постоянно:

      > [D1]Is[/] [T2]this[/] [T3]your[/] [S2]phone[/]? — Это твой телефон?
      > [T2]That[/][D1]'s[/] [J3]nice[/]! — Как здорово!
      > [D1]Have[/] [T1]a[/] [J3]nice[/] [S7]day[/]! — Хорошего дня!

      - the в речи безударное: /ðə/ перед согласным, /ði/ перед гласным звуком.
      - a почти всегда звучит как короткое /ə/ и прилипает к следующему слову.
      - That's nice! — спокойная положительная реакция, когда вам что-то показали или рассказали. Её смысл зависит и от интонации: не считайте эту фразу универсальным ответом на любую хорошую новость.

      **Дом: маленькие группы слов для практики**

      - **kitchen** — кухня. Kitchen — комната, а не кухонная мебель.
      - **bathroom** — ванная; санузел. В США bathroom может означать санузел, даже без ванны.
      - **bedroom** — спальня. Bedroom пишется слитно.
      - **living room** — гостиная. Living room — одно название комнаты из двух слов; a относится ко всему названию.
      - **table** — стол. Table — обычный стол, например обеденный; письменный стол — desk.
      - **chair** — стул. Chair — отдельный стул; перед одним неопределённым предметом нужно a.
      - **window** — окно. Одно окно — a window; известное собеседнику — the window.
      - **wall** — стена. Wall — стена; floor — пол.
      - **floor** — пол. Здесь floor — пол комнаты; значение «этаж» пока не вводим.
      - **sofa** — диван. Sofa — диван; в американской речи также встречается couch, это слово пока не проверяем.

      Начните с двух комнат: kitchen — кухня, bedroom — спальня. Затем добавьте bathroom — ванная и living room — гостиная. Не учите весь список за один раз. Здесь нет нового правила: замените book в знакомой схеме на нужный предмет.

      > [T2]This[/] [D1]is[/] [T1]a[/] [S2]table[/]. [T1]The[/] [S2]table[/] [D1]is[/] [J2]new[/]. — Это стол. Этот стол новый.
      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]kitchen[/]. — Это моя кухня.

      В первой фразе a table называет вид предмета: это стол. Во второй the table обозначает именно этот стол, и мы сообщаем, что он новый. Если называете владельца, используйте my table без a.
  - number: 6
    body: |
      Когда **a / the** в наших примерах **не нужны**:

      - перед именами: Anna, а не the Anna;
      - когда говорим о напитке вообще: I like coffee;
      - если уже стоит my или your: my book, а не a my book.

      **Для любопытных:** **This** может работать по-разному. В *this room* оно означает «эта» и уточняет, какая комната. В *This is Tom* оно самостоятельно означает «это»: мы представляем Тома. Чтобы понять смысл, смотрите на всю фразу.
  - number: 7
    body: |
      **Шесть заданий:** сначала выбрать *a / the*, потом *this / that*, отличить *your* от *you're*, собрать предложение и самостоятельно описать две комнаты.

      Проверяйте причину выбора: «слушатель знает, о чём речь?», «вещь близко или далеко?», «слово стоит перед существительным или отдельно?».

      **Проверка маленького шага:** *This is my phone* — **this** стоит самостоятельно («это»), а *This phone is new* — перед существительным («этот телефон»). Не выбирайте часть речи только по русскому переводу: посмотрите, **какую работу** слово делает в английской фразе.

      Шестое задание переносит знакомую схему на новые предметы дома.
