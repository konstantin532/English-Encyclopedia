layers:
- number: 1
  body: 'Анна и Том решили срезать через парк и заблудились. Прохожий объясняет дорогу — и почти каждое слово в его ответе показывает, **как** идти.


    > [S4]Park[/] [S4]Street[/]? [D4]Walk[/] [P2]along[/] [T1]the[/] [S6]river[/] [C1]and[/] [D4]go[/] [P2]over[/] [T1]the[/] [S4]bridge[/]. — Парк-стрит? Идите вдоль реки и перейдите через мост.

    > [A2]Then[/] [D4]go[/] [P2]past[/] [T1]the[/] [S4]church[/] [C1]and[/] [P2]across[/] [T1]the[/] [S4]square[/]. — Потом мимо церкви и через площадь.

    '
- number: 2
  body: 'В русском «через» одно на всё: через улицу, через парк, через мост. А английский различает: **across** — по поверхности с одной стороны на другую (*across the street*), **through** — сквозь, внутри чего-то (*through the park*, *through the door*), **over** — сверху, над (*over the bridge*). Это как три разных картинки.

    '
- number: 3
  body: 'Схема:


    > [O4]Okay[/]. [D2]Let[/] [T8]us[/] [D4]go[/] [P2]through[/] [T1]the[/] [S4]park[/]. [T8]It[/] [D1]is[/] [X1]not[/] [J1]far[/]. — Хорошо. Пойдём через парк. Это недалеко.


    - **across** — через (улицу, площадь): across the square.

    - **through** — сквозь (парк, лес, дверь): through the park.

    - **over** — через сверху (мост): over the bridge.

    - **along** — вдоль: along the river.

    - **past** — мимо: past the church.

    - **into** — внутрь: into the garden.

    - **toward** — в сторону: toward the church.

    - **around** — вокруг, за: around the corner.

    '
- number: 4
  body: '**Почему «go into the library», но «I am in the library»?** **into** — движение внутрь (куда?), **in** — место (где?). Так же *to* (куда) и *at* (где): *go to the bank — I''m at the bank*.


    **Диагностика понимания:** вы идёте сквозь парк. Что сказать: *across the park* или *through the park*?


    **Разбор:** *through the park* — сквозь, между деревьями. Across — если парк — просто открытая площадь.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Follow me!** — за мной!

    - **Follow the river to the bridge.** — идите вдоль реки до моста.

    - **It''s around the corner.** — это за углом.


    Слова: **along, through, into, toward, around, over, opposite** (напротив), **follow** — идти за, **cross** — переходить. Из истории 10: **library** — библиотека, **tree** — дерево, **garden** — сад, **past** — мимо.

    '
- number: 6
  body: 'Ловушки:


    - «through the street» — по улице на другую сторону: **across the street**.

    - «go in the garden» — движение: **go into the garden**.

    - «go past of the church» — без of: **past the church**.

    - «towards» — британское; в США **toward**.

    '
- number: 7
  body: 'Шесть заданий: выбрать across или through, сказать «мимо», собрать маршрут, объяснить дорогу до магазина, выбрать into и позвать за собой.


    **Проверка маленького шага:** across — по поверхности, through — сквозь, over — сверху, along — вдоль, past — мимо.

    '
