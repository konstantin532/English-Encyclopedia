slug: a1-directions-turn-left
level: A1
week: 8
order: 16
focus: D
minutes: 40
title: "Как пройти: go straight, turn left — просьбы и указания"
summary: "Как объяснить дорогу и понять объяснение: Go straight. Turn left. Почему в указаниях нет «вы» и как вежливо остановить прохожего: Excuse me!"
units: [LX-00158, LX-00159, LX-00161, LX-00166, LX-00167, LX-00168, LX-00169, LX-00170, LX-00175, LX-00177, LX-00164, LX-00341, LX-00342, LX-00343, LX-00347]
sound_notes:
  - text: "Go straight and turn left."
    ipa: "/ˈɡoʊ ˈstreɪt ən tɝn ˈlɛft/"
    note_ru: "and без ударения — «эн»; ударение на straight и left"
  - text: "Excuse me!"
    ipa: "/ɪkˈskjuz mi/"
    note_ru: "ударение на cuse: «икскьЮз ми», s звонкое"
  - text: "Turn right."
    ipa: "/ˈtɝn ˈraɪt/"
    note_ru: "turn — американское r в середине: «тёрн»"
contractions:
  - full: "do not"
    short: "don't"
    ipa: "/doʊnt/"
    note_ru: "Запрет — Don't turn left: «Не поворачивайте налево»."
layers:
  - number: 1
    body: |
      Объясняя дорогу, мы даём указания: «идите», «поверните». По-английски для этого берут глагол прямо из словаря и ставят его первым.

      > [D4]Go[/] [A3]straight[/] [C1]and[/] [D4]turn[/] [A3]left[/]. [T1]The[/] [S4]bank[/] [D1]is[/] [P1]on[/] [T1]the[/] [A3]right[/]. — Идите прямо и поверните налево. Банк будет справа.

      Здесь используется **повелительное наклонение** — форма для указаний. Подлежащее **you** («вы/ты») обычно **не произносится**, но понятно из ситуации: указание обращено к слушателю. Не путайте с полным утверждением *You go straight*: там мы **рассказываем** о действии, а не даём маршрут.
  - number: 2
    body: |
      **left** раньше значило «слабый»: левая рука у большинства людей слабее. **right** — «прямой, правильный». Отсюда второе значение: That is right — «Верно».

      **excuse** — латинское «освобождать от вины». Excuse me — буквально «освободите меня от вины», то есть «простите, что беспокою».
  - number: 3
    body: |
      Схема указания:

      > [D4]Turn[/] [A3]left[/]. — Поверните налево.
      > [D4]Go[/] [A3]straight[/]. — Идите прямо.

      - Для простого утвердительного указания берём **начальную форму без to** в начале: *Go*, *Turn*. Это не правило, что в любом английском предложении глагол ставят первым.
      - Направление после него: left, right, straight.
      - Несколько шагов соединяют and: Go straight and turn left.
      - **Запрет или предупреждение** строим с **Don't + глагол**: *Don't turn left*. Сокращение **don't** здесь выражает отрицательное указание, а не вопрос.
  - number: 4
    body: |
      Почему без «вы»? В английском указание и так обращено к собеседнику. Глагол в начале — уже знак: «сделайте это». Так звучат рецепты, инструкции и объяснения дороги.

      Короткая инструкция **не обязательно груба**: контекст маршрута подразумевает, что человек попросил помочь. Но тон и ситуация важны; **please** может смягчить команду, если это уместно. В инструкциях на карте *Turn left* нейтрально.

      > [O2]Excuse me[/]! [T8]I[/] [D1]have[/] [T1]an[/] [J2]old[/] [S2]key[/]. — Извините! У меня старый ключ.

      **Диагностика понимания:** Вы хотите дать указание **повернуть налево**. Что верно: *Turn left* или *On the left*?

      **Разбор:** *Turn left* — указание выполнить действие. *On the left* описывает, **где что-то находится** («слева»); это не самостоятельная команда повернуть. Сначала решите, **действие** вам нужно или **место**.
  - number: 5
    body: |
      Так объясняют дорогу на американской улице:

      > [D4]Go[/] [A3]straight[/] [C1]and[/] [D4]turn[/] [A3]left[/]. [T1]The[/] [S4]bank[/] [D1]is[/] [P1]on[/] [T1]the[/] [A3]right[/]. — Идите прямо и поверните налево. Банк будет справа.
      > [O2]Thank you[/]! [A3]Straight[/], [A3]left[/], [C1]and[/] [P1]on[/] [T1]the[/] [A3]right[/]. — Спасибо! Прямо, налево и справа.

      - Хороший приём: повторить дорогу вслух. Так вы проверяете, что поняли, а собеседник поправит, если что.
      - Американцы часто считают кварталы: go two blocks — «пройдите два квартала».
  - number: 6
    body: |
      Три пары, которые путают:

      - turn left — поверните налево; on the left — слева.
      - go straight — идите прямо; straight ahead — прямо впереди.
      - **Excuse me** удобно, чтобы привлечь внимание незнакомца; **sorry** — чтобы извиниться или вежливо переспросить. Оба выражения имеют и другие применения, поэтому не превращайте это сравнение в правило «только так».

      **Почему Can you help us?, а не Can you help we?** Некоторые английские местоимения меняют форму в зависимости от **роли** в предложении. Когда человек сам выполняет действие, употребляют форму **подлежащего** (*we*). Когда помощь направлена **на него**, нужна форма **дополнения** (*us*):

      - [T8]I[/] → [T8]me[/]: Excuse me!
      - [T8]he[/] → [T8]him[/], [T8]she[/] → [T3]her[/]
      - [T8]we[/] → [T8]us[/], [T8]they[/] → [T8]them[/]

      > [O2]Sorry[/], [D7]can[/] [T8]you[/] [D2]help[/] [T8]us[/]? — Простите, не поможете нам? (Анна — прохожему)

      Для прямого дополнения после *help* в нашем примере выбираем **us**, не **we**: *Can you help us?*. Но это не значит, что после любого глагола всегда стоит именно одна из этих форм: выбор зависит от **того, кто действует и на кого направлено действие**.
  - number: 7
    body: |
      Шесть заданий: понять указание, вставить глагол, собрать объяснение дороги, объяснить путь, выбрать us и попросить помочь другу.

      **Проверка маленького шага:** *Turn right* — **действие** для слушателя: «Поверните направо». *The bank is on the right* — **расположение** банка: «Банк справа». Из сообщения о месте не всегда следует, что нужно повернуть: сначала отделите **маршрут** от **описания**.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Прохожий говорит: Turn right. Что нужно сделать?"
    options: ["Повернуть направо", "Повернуть налево", "Идти прямо"]
    answer: "Повернуть направо"
    hint_ru: "right — правая сторона."
    explanation_ru: "Turn right — «Поверните направо»."
    units: [LX-00167, LX-00169]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Скажите «Идите прямо». Вставьте глагол."
    prompt_en: "___ straight."
    answer: "Go"
    hint_ru: "Глагол движения из словаря."
    explanation_ru: "Go straight — указание начинается с глагола."
    units: [LX-00166]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите: «Идите прямо и поверните налево»."
    options: [left, Go, and, straight, turn]
    answer: "Go straight and turn left"
    hint_ru: "Два шага соединяет and."
    explanation_ru: "Go straight and turn left. Каждый шаг — глагол и направление."
    units: [LX-00177]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: у вас спрашивают дорогу к банку. Нужно повернуть направо. Скажите это."
    prompt_en: "Where is the bank? — ___"
    answer: "Turn right."
    accepted: ["Turn right", "Turn right, please."]
    hint_ru: "Глагол turn и направление."
    explanation_ru: "Turn right. — поверните направо. В условии не сказано, что нужно сначала идти прямо или что банк окажется справа после поворота, поэтому дополнительные указания не следует придумывать."
    units: [LX-00167, LX-00169]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: "Вы с другом заблудились. Как попросить прохожего о помощи?"
    options: ["Can you help us?", "Can you help we?", "Can you help our?"]
    answer: "Can you help us?"
    hint_ru: "После глагола «мы» меняется."
    explanation_ru: "Can you help us? — после help нужна форма us, а не we."
    units: [LX-00343, LX-00347]
  - order: 6
    kind: fill
    stage: substitution
    prompt_ru: "Ваш друг потерялся. Попросите: «Можете ему помочь?»"
    prompt_en: "Can you help ___?"
    answer: "him"
    hint_ru: "he после глагола превращается в…"
    explanation_ru: "Вопрос Can you help him? относится к другу: он получатель помощи. Поэтому здесь нужна форма дополнения him, а he подходит для подлежащего (He is here)."
    units: [LX-00341]
