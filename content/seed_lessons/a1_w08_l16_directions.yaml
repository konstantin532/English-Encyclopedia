  - text: "Go straight and turn left."
    ipa: "/ˈɡoʊ ˈstreɪt ən tɝn ˈlɛft/"
    note_ru: "and без ударения — «эн»; ударение на straight и left"
  - text: "Excuse me!"
    ipa: "/ɪkˈskjuz mi/"
    note_ru: "ударение на cuse: «икскьЮз ми», s звонкое"
  - text: "Turn right."
    ipa: "/ˈtɝn ˈraɪt/"
