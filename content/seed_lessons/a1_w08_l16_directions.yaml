title: "Как пройти: go straight, turn left — просьбы и указания"
summary: "Как объяснить дорогу и понять объяснение: Go straight. Turn left. Почему в указаниях нет «вы» и как вежливо остановить прохожего: Excuse me!"
units: [LX-00158, LX-00159, LX-00161, LX-00166, LX-00167, LX-00168, LX-00169, LX-00170, LX-00175, LX-00177, LX-00164, LX-00341, LX-00342, LX-00343, LX-00347]
