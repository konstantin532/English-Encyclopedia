layers:
- number: 1
  body: 'В американском офисе понедельник начинается с короткого small talk: «Как выходные?» Отвечают коротко, задают вопрос в ответ — и через минуту переходят к работе.


    > [T9]What[/] [A6]about[/] [T8]you[/]? — А у тебя?

    > [T8]I[/] [D2]stayed[/] [P3]at[/] [S2]home[/]. [T8]I[/] [D6]watched[/] [N1]three[/] [S10]movies[/] [C1]and[/] [D2]relaxed[/]. — Я сидела дома. Посмотрела три фильма и отдыхала.

    '
- number: 2
  body: '**Colleague** пришло из латыни: *collega* — «тот, кого выбрали вместе с тобой». **Meeting** — от глагола *meet*, «встречаться»: совещание — это просто «встреча» по работе.

    '
- number: 3
  body: 'Схема разговора:


    > [T8]I[/] [D3]enjoyed[/] [N1]two[/] [S10]movies[/]. [T8]I[/] [D3]hated[/] [N1]one[/]. [T8]It[/] [D1]was[/] [A5]very[/] [J7]boring[/]! — Два мне понравились. Один я терпеть не могла. Он был очень скучный!


    - Вопрос: **How was your weekend?**

    - Короткий ответ: **Great! / Not bad. / It was boring.**

    - Вопрос в ответ: **What about you?**

    - Согласие: **Me too.**

    - К делу: **Back to work!**

    '
- number: 4
  body: |
    **Почему «Me too», а не «I too»?** В самостоятельном коротком разговорном ответе говорят **Me too**. В полном предложении подлежащее — **I**: *I love it too*. Сочетание **I too** возможно внутри полного предложения в более книжном стиле, но как отдельный ответ здесь не подходит.

    **Me too** подхватывает положительное сообщение: *I love lazy weekends. — Me too.* Не используйте его автоматически после любого высказывания: после отрицания смысл и форма ответа будут другими.

    > [T8]Me[/] [A5]too[/]. [C5]But[/] [A2]now[/], [A3]back[/] [P2]to[/] [S9]work[/]! [T1]The[/] [S9]meeting[/] [D8]starts[/] [P3]at[/] [N3]ten[/]. [T8]We[/] [D3]need[/] [T1]the[/] [S9]report[/]. — Я тоже. Но теперь — за работу! Совещание в десять. Нам нужен отчёт.

    **Need** — «нужно». По-русски «мне нужно», по-английски «я нуждаюсь»: **I need**, **we need**.

    **Диагностика понимания:** коллега говорит: *I love lazy weekends.* Вы тоже. Что сказать: *Me too* или *I too*?

    **Разбор:** *Me too.* — так говорят в разговоре.

- number: 5
  body: |
    Так говорят американцы:

    - **Not bad** — «неплохо», то есть нормально или даже хорошо.
    - **I enjoyed it** — мне понравилось; в полном рассказе обычно уточняют, что понравилось: I enjoyed the concert. Отдельное **Enjoy!** — тоже правильное разговорное пожелание «приятно провести время / приятного аппетита», особенно в американском английском.
    - **I hated it** — мне ужасно не понравилось. Сильное слово, но в разговоре о фильме — нормально.
    - **A lazy weekend** — ленивые выходные, это скорее хорошо.

    Работа: **colleague** — коллега, **meeting** — совещание, **project** — проект, **report** — отчёт. Выходные на природе: **lake** — озеро, **river** — река, **boat** — лодка, **flower** — цветок, **picture** — картина, **beautiful** — красивый.

- number: 6
  body: |
    Ловушки:

    - В рассказе *I enjoyed…* обычно требует уточнения: **I enjoyed the movie / I enjoyed it**. Не переносите это на отдельное пожелание **Enjoy!** — оно допустимо.
    - «Me need the report» — нужно **We need / I need**.
    - «I too» — в разговоре **Me too**.
    - «Not bad» — это не «плохо», а «неплохо, нормально».

- number: 7
  body: 'Шесть заданий: ответить на How was your weekend?, вернуть вопрос, согласиться, сказать, что нужно, рассказать о понравившемся и перейти к работе.


    **Проверка маленького шага:** коротко ответили — спросили в ответ What about you? — согласились Me too.

    '
