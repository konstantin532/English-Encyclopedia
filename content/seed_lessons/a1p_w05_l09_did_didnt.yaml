layers:
- number: 1
  body: 'В бюро находок сотрудник задаёт Анне вопросы о вчерашнем дне. Для вопросов и отрицаний в прошлом английскому нужен помощник — **did**.


    > [T9]Which[/] [S4]bus[/] [D1]did[/] [T8]you[/] [D2]take[/]? — На каком автобусе вы ехали?

    > [D1]Did[/] [T8]you[/] [D2]sit[/] [P1]in[/] [T1]the[/] [S4]front[/] [C1]or[/] [P1]in[/] [T1]the[/] [S5]back[/]? — Вы сидели впереди или сзади?

    '
- number: 2
  body: '**did** — прошедшая форма **do**. В настоящем вы уже спрашивали *Do you like…?* и говорили *I don''t…*. В прошлом всё то же самое, только **do → did**. Do-помощник появился в английском около 500 лет назад, и с тех пор без него вопросы с обычными глаголами не строят.

    '
- number: 3
  body: 'Схема:


    > [T8]I[/] [D1]did[/] [X1]not[/] [D2]sit[/]. [T9]There[/] [D1]were[/] [O4]no[/] [S2]seats[/]. — Я не сидела. Мест не было.


    - Вопрос: **Did + you + глагол?** — Did you take the bus?

    - С вопросительным словом: **Which / Where / What + did + you + глагол?**

    - Отрицание: **I did not (didn''t) + глагол** — I didn''t sit.

    - Главное: после did глагол без -ed и в основной форме: did you **take**, не *did you took*.

    - Короткие ответы: **Yes, I did. / No, I didn''t.**

    '
- number: 4
  body: '**Почему «Did you take», а не «Did you took»?** Прошлое уже показано в did. Два раза его не ставят — глагол возвращается в словарную форму. Так же и в отрицании: *I didn''t go*, не *I didn''t went*.


    > [T1]A[/] [S9]driver[/] [D2]brought[/] [T8]it[/] [J8]last[/] [S7]night[/]. — Его принёс водитель вчера вечером.


    В утвердительной фразе did не нужен: *A driver brought it.*


    **Диагностика понимания:** что верно: *Did you saw my umbrella?* или *Did you see my umbrella?*


    **Разбор:** *Did you see…?* После did — основная форма.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Let me check.** — сейчас проверю.

    - **Are you sure?** — вы уверены?

    - **Don''t worry.** — не волнуйтесь.

    - **Maybe it''s on the bus.** — может быть, он в автобусе.


    Глаголы недели: **stand — stood** (стоять), **put — put** (класть), **keep — kept** (хранить), **happen** (случаться), **worry** (волноваться), **check** (проверять). Слова: **only** — только, **nothing** — ничего, **everything** — всё.

    '
- number: 6
  body: 'Ловушки:


    - «Did you took?» — после did основная форма: **Did you take?**

    - «I didn''t went» — **I didn''t go**.

    - «Where you went?» — нужен did: **Where did you go?**

    - «Yes, I took» в коротком ответе — говорят **Yes, I did.**

    '
- number: 7
  body: 'Шесть заданий: узнать вопрос с did, ответить коротко, собрать вопрос Where did you…?, рассказать, чего вы не делали, найти ошибку и успокоить человека.


    **Проверка маленького шага:** did — помощник прошлого. После него глагол в основной форме.

    '
