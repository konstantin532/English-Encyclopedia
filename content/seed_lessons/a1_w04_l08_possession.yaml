    uid: EX-00038
    kind: choice
    stage: recognition
    prompt_ru: "Мия показывает фото брата. Как сказать «её брат»?"
    options: ["her brother", "his brother", "she brother"]
    answer: "her brother"
    hint_ru: "Владелец — Мия, женщина."
    explanation_ru: "Выбор зависит от владельца: Мия — her. То, что брат мужчина, не важно."
    units: [LX-00098]
  - order: 2
    uid: EX-00039
    kind: fill
    stage: substitution
    prompt_ru: "Скажите «Это фото Тома»."
    prompt_en: "This is ___ photo."
    answer: "Tom's"
    accepted: ["Tom’s"]
    hint_ru: "Владелец — 's — вещь."
    explanation_ru: "Tom's photo: к владельцу добавляют 's."
    units: []
  - order: 3
    uid: EX-00040
    kind: build
    stage: production
    prompt_ru: "Соберите: «Его зовут Том»."
    options: [Tom, name, is, His]
    answer: "His name is Tom"
    hint_ru: "Дословно: «его имя есть Том»."
    explanation_ru: "His name is Tom. — his, потому что владелец имени — мужчина."
    units: [LX-00097, LX-00104]
  - order: 4
    uid: EX-00041
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вы показываете сестру друга. Её зовут Анна. Сообщите её имя, используя her name."
    prompt_en: "___"
    answer: "Her name is Anna."
    accepted: ["Her name is Anna", "Her name's Anna."]
    hint_ru: "Владелец имени — женщина."
    explanation_ru: "Her name is Anna. — her, потому что имя принадлежит ей."
    units: [LX-00098]
  - order: 5
    uid: EX-00042
    kind: fill
    stage: substitution
    prompt_ru: "Мама и папа Мии на фото. Спросите, сколько им лет."
    prompt_en: "How old ___ they?"
    answer: "are"
    hint_ru: "С they глагол be в форме…"
    explanation_ru: "How old are they? — когда говорим о том, что есть сейчас, с they используем are."
    units: [LX-00264]
  - order: 6
    uid: EX-00043
    kind: fill
    stage: transfer
    prompt_ru: "Вы показываете фото своей семьи, затем фото дома бабушки и дедушки. Скажите: «У нас большая семья. Их дом большой»."
    prompt_en: "___"
    answer: "We are a big family. Their house is big."
    accepted: ["We're a big family. Their house is big.", "We are a big family. Their house is big", "We have a big family. Their house is big."]
    hint_ru: "мы — we, их — their."
    explanation_ru: "We are a big family — we («мы») требует are. Their house is big — their («их») стоит перед house и относится к бабушке и дедушке, о которых мы уже говорим."
    units: [LX-00263, LX-00265, LX-00279]
