slug: a1-family-possession
level: A1
week: 4
order: 8
focus: T
minutes: 40
title: "Кто и чьё: he, she, we, they; his, her, their и 's"
summary: "Как сказать «мы», «они», «его», «её», «их» и «Мии»: we, they, his, her, their и окончание 's."
units: [LX-00095, LX-00096, LX-00097, LX-00098, LX-00100, LX-00104, LX-00105, LX-00106, LX-00263, LX-00264, LX-00265, LX-00279]
sound_notes:
  - text: "Mia's photo"
    ipa: "/ˈmiəz ˈfoʊt̬oʊ/"
    note_ru: "'s после гласной звучит как /z/"
  - text: "His name is Tom."
    ipa: "/hɪz ˈneɪm ɪz ˈtɑm/"
    note_ru: "his и is звучат почти одинаково, разница — лёгкое h"
  - text: "She is happy."
    ipa: "/ʃi ɪz ˈhæpi/, быстро /ʃiz ˈhæpi/"
    note_ru: "she is сливается в she's; в happy широкое /æ/"
contractions:
  - full: "she is"
    short: "she's"
    ipa: "/ʃiz/"
    note_ru: "She's = she is: She’s happy — «Она рада». Her перед существительным — «её»: her family."
  - full: "he is"
    short: "he's"
    ipa: "/hiz/"
    note_ru: "he's звучит как «хиз»."
  - full: "we are"
    short: "we're"
    ipa: "/wɪr/"
    note_ru: "we're звучит коротко: «уир»."
  - full: "they are"
    short: "they're"
    ipa: "/ðɛr/"
    note_ru: "they're, their и there звучат одинаково — различают по смыслу."
layers:
  - number: 1
    body: |
      Фото нашлось — осталось вернуть его хозяйке. Для этого нужно сказать, чьё оно: *her photo, Mia's brother*. Без этих слов разговор о людях превращается в «он, она, она, он», и никто не понимает, о ком речь.

      Чтобы вернуть вещь хозяину, нужно сказать, чья она.

      > [S1]Mia[/][T3]'s[/] [S1]brother[/] [D1]is[/] [N5]ten[/]! — Брату Мии десять!
      > [T3]Her[/] [S1]family[/] [D1]is[/] [J3]nice[/]. — У неё хорошая семья.
      > [T3]His[/] [S9]name[/] [D1]is[/] [S1]Tom[/]. — Его зовут Том.
      > [A3]Here[/] [D1]is[/] [T3]your[/] [S2]photo[/], [S1]Mia[/]. — Вот твоя фотография, Мия.

      **Что объединяет her, his и Mia's?** Они показывают, **чья вещь или с кем связан человек**: *her photo* — её фотография, *her family* — её семья, *Mia's brother* — брат Мии. Родственники не являются чьей-то собственностью: слова помогают понять, о чьей семье речь. Верхняя линия помогает заметить такие слова. А **he / she / we / they** сами называют тех, о ком говорим, без названия вещи сразу после них. **They** может означать не только людей, но и предметы.
  - number: 2
    body: |
      **Один и тот же человек — две разные формы слова.** Мия рада, потому что ей вернули фотографию. Сравните:

      - *She is happy.* — Она рада. **She** заменяет имя Мии и отвечает на вопрос «кто?».
      - *Her photo is here.* — Её фото здесь. **Her** помогает понять, кому принадлежит фотография, и стоит перед **photo**.
      - *Mia's photo* — фото Мии. **'s** после имени указывает на ту же принадлежность.

      По той же схеме: **he → his** (*he is Tom → his photo*), **they → their** (*they are here → their photo*). Не выбирайте **his** по тому, мужчина ли на фотографии: выбирайте по тому, **чья это фотография**.

      В следующем слое соберём эти формы вместе. Сейчас учимся выбирать **her / his** и **'s**, когда называем, чья вещь или о чьей семье идёт речь.
  - number: 3
    body: |
      Схема простая: владелец — 's — вещь.

      > [S1]Mia[/][T3]'s[/] [S2]photo[/] — фото Мии.
      > [S1]Tom[/][T3]'s[/] [S2]box[/] — коробка Тома.

      - [T3]his[/] — когда речь о принадлежности **ему**: *his name*.
      - [T3]her[/] — когда речь о принадлежности **ей**: *her family*.
      - **His / her** выбираем по **владельцу**, а не по тому, кого или что назвали дальше: *her brother* — «её брат», хотя брат мужчина.
      - После **his / her** называем вещь или человека: *name, family, brother*. А **he / she** могут сами сказать, о ком речь.

      Теперь сопоставим изученные формы — кто и чьё:

      - [T8]I[/] — [T3]my[/], [T8]you[/] — [T3]your[/]
      - [T8]he[/] — [T3]his[/], [T8]she[/] — [T3]her[/]
      - [T8]we[/] — «мы», [T8]they[/] — «они», [T3]their[/] — «их» (перед названием вещи)

      **Почему здесь нет пары we — our?** **Our** тоже существует и означает «наш», но мы введём его отдельно. В данном диалоге нужно прежде всего различить **we are** («мы») и **their house** («их дом»).

      > [T8]We[/] [D1]are[/] [T1]a[/] [J1]big[/] [S1]family[/]! — У нас большая семья!
      > [A6]How[/] [J2]old[/] [D1]are[/] [T8]they[/]? — Сколько им лет?
      > [T3]Their[/] [S2]house[/] [D1]is[/] [J1]big[/]. — Их дом большой.

      С **we** и **they**, когда говорим о том, что есть сейчас, выбираем **are**: *we are, they are*. Но в *Their house is big* говорим об **одном доме**, поэтому нужно **is**, хотя владельцев несколько.
  - number: 4
    body: |
      **Для любопытных:** Русское «свой» не всегда переводится одним и тем же словом. В примере «Он показывает свою книгу» выбираем слово по владельцу: *his book* — «его / свою книгу». Слово **own** тоже может уточнять «собственный». Пока тренируем простые фразы о том, чья вещь.

      > [T3]Her[/] [S1]family[/] [D1]is[/] [J3]nice[/]. — У неё хорошая семья.
      > [T8]She[/] [D1]is[/] [J4]happy[/]. — Она рада.

      **Не путайте she и her.** **She** — «она», когда называем саму женщину. **Her** перед названием помогает сказать «её»: *her family* — её семья. Здесь выбирайте слово по образцам *she* и *her family*.

      **Для любопытных:** **Her** может обозначать «её» и тогда, когда к женщине направлено действие. Сейчас тренируем только знакомое сочетание перед названием: *her family*.

      **Диагностика понимания:** «Её зовут Анна». Что верно: *Her name is Anna* или *She name is Anna*?

      **Разбор:** *Her name is Anna*. **Her** перед **name** означает «её». Если сказать *She is Anna*, получится другой смысл: «Она Анна».
  - number: 5
    body: |
      В непринуждённой речи **he is** и **she is** часто сокращают, когда форма **is** безударна. Полные формы также правильны: выбор зависит от темпа и того, какое слово говорящий выделяет.

      > [T8]He[/][D1]'s[/] [N5]ten[/]. — Ему десять.
      > [T8]I[/][D1]'m[/] [J4]happy[/]! — Я рада!
      > [A3]Here[/][D1]'s[/] [T3]your[/] [S2]photo[/], [S1]Mia[/]. — Вот твоя фотография, Мия.

      - Here is в быстрой речи — here's.
      - Сегодня различаем два употребления 's: he's = he is, Mia's photo = фото Мии. Это не полный список всех значений 's в английском: здесь выбирайте по смыслу всей фразы.
  - number: 6
    body: |
      **Одинаковая запись 's — разный смысл.** Посмотрите на всю фразу:

      - *Mia's photo* — **чья фотография?** Это принадлежность.
      - *Mia's happy* — **какая Мия?** Здесь *Mia's = Mia is*.

      **Не определяйте значение только по следующему существительному.** *Mia's my sister* означает *Mia is my sister* — «Мия — моя сестра»: после сокращения тоже есть существительное, но вся фраза **называет, кто такая Мия**. В *Mia's photo* сочетание **называет фотографию и указывает, чья она**, а глагол **is** в него не входит.

      Смотрите, **что сообщает вся фраза**. Одинаковая запись **'s** не всегда означает одно и то же.
  - number: 7
    body: |
      Шесть заданий: выбрать his или her, вставить 's, собрать фразу, сказать о новом человеке, выбрать are для they и сказать о своей семье.

      **Проверка маленького шага:** *She is happy* — **she** сама обозначает человека. *Her family is nice* — **her** указывает, **чья** семья, и стоит перед **family**. А в *Mia's photo* принадлежность показана через **'s** после имени. Три конструкции могут говорить об одном человеке, но слова выполняют разные роли.
exercises:
