slug: a1-family-possession
level: A1
week: 4
order: 8
focus: T
minutes: 40
title: "Кто и чьё: he, she, we, they; his, her, their и 's"
summary: "Как сказать «мы», «они», «его», «её», «их» и «Мии»: we, they, his, her, their и окончание 's."
units: [LX-00095, LX-00096, LX-00097, LX-00098, LX-00100, LX-00104, LX-00105, LX-00106, LX-00263, LX-00264, LX-00265, LX-00279]
sound_notes:
  - text: "Mia's photo"
    ipa: "/ˈmiəz ˈfoʊt̬oʊ/"
    note_ru: "'s после гласной звучит как /z/"
  - text: "His name is Tom."
    ipa: "/hɪz ˈneɪm ɪz ˈtɑm/"
    note_ru: "his и is звучат почти одинаково, разница — лёгкое h"
  - text: "She is happy."
    ipa: "/ʃi ɪz ˈhæpi/, быстро /ʃiz ˈhæpi/"
    note_ru: "she is сливается в she's; в happy широкое /æ/"
contractions:
  - full: "she is"
    short: "she's"
    ipa: "/ʃiz/"
    note_ru: "Не путайте she's (она есть) и her (её)."
  - full: "he is"
    short: "he's"
    ipa: "/hiz/"
    note_ru: "he's звучит как «хиз»."
  - full: "we are"
    short: "we're"
    ipa: "/wɪr/"
    note_ru: "we're звучит коротко: «уир»."
  - full: "they are"
    short: "they're"
    ipa: "/ðɛr/"
    note_ru: "they're, their и there звучат одинаково — различают по смыслу."
layers:
  - number: 1
    body: |
      Фото нашлось — осталось вернуть его хозяйке. Для этого нужно сказать, чьё оно: *her photo, Mia's brother*. Без этих слов разговор о людях превращается в «он, она, она, он», и никто не понимает, о ком речь.

      Чтобы вернуть вещь хозяину, нужно сказать, чья она.

      > [S1]Mia[/][T3]'s[/] [S1]brother[/] [D1]is[/] [N1]ten[/]! — Брату Мии десять!
      > [T3]Her[/] [S1]family[/] [D1]is[/] [J3]nice[/]. — У неё хорошая семья.
      > [T3]His[/] [S9]name[/] [D1]is[/] [S1]Tom[/]. — Его зовут Том.
      > [A3]Here[/] [D1]is[/] [T3]your[/] [S2]photo[/], [S1]Mia[/]. — Вот твоя фотография, Мия.

      **Что объединяет her, his и Mia's?** Все они помогают назвать **владельца**: *her family* — её семья, *Mia's brother* — брат Мии. В системе разметки курса верхняя линия T3 отмечает такие слова принадлежности. Но **he / she / we / they** — это уже **местоимения**: они называют людей, а не обозначают владельца перед существительным.
  - number: 2
    body: |
      Притяжательная форма **'s** исторически связана с древнеанглийскими падежными окончаниями: раньше принадлежность часто выражалась окончанием, похожим на русское «дом отца». Теперь в простом примере добавляем **'s** после имени: *Mia's photo*. Это не означает, что все английские падежи просто «исчезли»: некоторые различия сохранились, например, в местоимениях **he / him**.

      **He / his** — разные формы для разных функций («он» / «его»). **She / her** тоже различаются по работе в предложении, хотя их история сложнее. Для сегодняшнего урока полезнее сначала понять **место в предложении**, а не происхождение каждой формы.
  - number: 3
    body: |
      Схема простая: владелец — 's — вещь.

      > [S1]Mia[/][T3]'s[/] [S2]photo[/] — фото Мии.
      > [S1]Tom[/][T3]'s[/] [S2]box[/] — коробка Тома.

      - [T3]his[/] — когда речь о принадлежности **ему**: *his name*.
      - [T3]her[/] — когда речь о принадлежности **ей**: *her family*.
      - Выбор **his / her** зависит от того, **о каком владельце мы говорим**, а не от пола названной вещи или человека: *her brother* — «её брат», хотя брат мужчина.
      - После **his / her** в этих примерах стоит существительное (*name, family, brother*). Сами **he / she** могут быть подлежащими предложения.

      Теперь вся таблица — кто и чьё:

      - [T8]I[/] — [T3]my[/], [T8]you[/] — [T3]your[/]
      - [T8]he[/] — [T3]his[/], [T8]she[/] — [T3]her[/]
      - [T8]we[/] — «мы», [T8]they[/] — «они», [T3]their[/] — «их» (перед названием вещи)

      **Почему здесь нет пары we — our?** **Our** тоже существует и означает «наш», но мы введём его отдельно. В данном диалоге нужно прежде всего различить **we are** («мы») и **their house** («их дом»).

      > [T8]We[/] [D1]are[/] [T1]a[/] [J1]big[/] [S1]family[/]! — У нас большая семья!
      > [A6]How[/] [J2]old[/] [D1]are[/] [T8]they[/]? — Сколько им лет?
      > [T3]Their[/] [S2]house[/] [D1]is[/] [J1]big[/]. — Их дом большой.

      С we и they глагол be всегда **are**: we are, they are.
  - number: 4
    body: |
      **Почему нет отдельного слова для русского «свой» в наших примерах?** Когда по-русски говорим «Он показывает свою книгу», английское притяжательное слово обычно выбирают **по владельцу**, например *his book* («его/свою книгу»). Английский может уточнять принадлежность словом **own** («собственный»), но обязательного универсального соответствия русскому «свой» нет. Поэтому правило «в английском вообще нет способа сказать свой» — неверное.

      > [T3]Her[/] [S1]family[/] [D1]is[/] [J3]nice[/]. — У неё хорошая семья.
      > [T8]She[/] [D1]is[/] [J4]happy[/]. — Она рада.

      **Не путайте** *she* («она» — подлежащее) и *her* **перед существительным** (*her family* — её семья). Но **her** умеет работать и по-другому: например, обозначать «её» как получателя действия; пока этот случай не тренируем. Смотрите на **позицию и функцию** слова, а не на один русский перевод.

      **Диагностика понимания:** «Её зовут Анна». Что верно: *Her name is Anna* или *She name is Anna*?

      **Разбор:** *Her name is Anna*. **Her** перед **name** обозначает владельца имени. **She** употребляют самостоятельно как подлежащее: *She is Anna* — другая по смыслу фраза.
  - number: 5
    body: |
      В непринуждённой речи **he is** и **she is** часто сокращают, когда форма **is** безударна. Полные формы также правильны: выбор зависит от темпа и того, какое слово говорящий выделяет.

      > [T8]He[/][D1]'s[/] [N1]ten[/]. — Ему десять.
      > [T8]I[/][D1]'m[/] [J4]happy[/]! — Я рада!
      > [A3]Here[/][D1]'s[/] [T3]your[/] [S2]photo[/], [S1]Mia[/]. — Вот твоя фотография, Мия.

      - Here is в быстрой речи — here's.
      - 's бывает двух видов: he's = he is, Mia's photo = фото Мии. Различают по смыслу.
  - number: 6
    body: |
      **Зачем один и тот же знак 's?** Апостроф с **s** может обозначать разные конструкции:

      - *Mia's photo* — **чья фотография?** Это принадлежность.
      - *Mia's happy* — **какая Мия?** Здесь *Mia's = Mia is*.

      Чтобы не путать, ищите **работу всей фразы**: после имени идёт предмет, который ей принадлежит, или сообщение о её состоянии? Одинаковое написание не означает одинаковую грамматическую функцию.
  - number: 7
    body: |
      Шесть заданий: выбрать his или her, вставить 's, собрать фразу, сказать о новом человеке, выбрать are для they и сказать о своей семье.

      **Проверка маленького шага:** *She is happy* — **she** сама обозначает человека. *Her family is nice* — **her** указывает, **чья** семья, и стоит перед **family**. А в *Mia's photo* принадлежность показана через **'s** после имени. Три конструкции могут говорить об одном человеке, но слова выполняют разные роли.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Мия показывает фото брата. Как сказать «её брат»?"
    options: ["her brother", "his brother", "she brother"]
    answer: "her brother"
    hint_ru: "Владелец — Мия, женщина."
    explanation_ru: "Выбор зависит от владельца: Мия — her. То, что брат мужчина, не важно."
    units: [LX-00098]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Скажите «Это фото Тома»."
    prompt_en: "This is ___ photo."
    answer: "Tom's"
    accepted: ["Tom’s"]
    hint_ru: "Владелец — 's — вещь."
    explanation_ru: "Tom's photo: к владельцу добавляют 's."
    units: [LX-00097]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите: «Его зовут Том»."
    options: [Tom, name, is, His]
    answer: "His name is Tom"
    hint_ru: "Дословно: «его имя есть Том»."
    explanation_ru: "His name is Tom. — his, потому что владелец имени — мужчина."
    units: [LX-00097, LX-00104]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вы показываете сестру друга. Её зовут Анна. Скажите «Её зовут Анна»."
    prompt_en: "___"
    answer: "Her name is Anna."
    accepted: ["Her name is Anna", "Her name's Anna."]
    hint_ru: "Владелец имени — женщина."
    explanation_ru: "Her name is Anna. — her, потому что имя принадлежит ей."
    units: [LX-00098]
  - order: 5
    kind: fill
    stage: substitution
    prompt_ru: "Мама и папа Мии на фото. Спросите, сколько им лет."
    prompt_en: "How old ___ they?"
    answer: "are"
    hint_ru: "С they глагол be в форме…"
    explanation_ru: "How old are they? — с we и they всегда are."
    units: [LX-00264]
  - order: 6
    kind: fill
    stage: transfer
    prompt_ru: "Вы показываете фото своей семьи, затем фото дома бабушки и дедушки. Скажите: «У нас большая семья. Их дом большой»."
    prompt_en: "___"
    answer: "We are a big family. Their house is big."
    accepted: ["We're a big family. Their house is big.", "We are a big family. Their house is big"]
    hint_ru: "мы — we, их — their."
    explanation_ru: "We are a big family — we («мы») требует are. Their house is big — their («их») стоит перед house и относится к бабушке и дедушке, о которых мы уже говорим."
    units: [LX-00263, LX-00265, LX-00279]
