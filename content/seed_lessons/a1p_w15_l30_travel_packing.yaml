sound_notes:
- text: Did you pack your suitcase?
  ipa: /dɪdʒə ˈpæk jɚ ˈsutkeɪs/
  note_ru: suitcase — «сУткейс», ui читается как «у»
- text: Have a nice trip!
  ipa: /ˈhæv ə ˈnaɪs ˈtrɪp/
  note_ru: 'have a сливается: «хэвэ»'
- text: I can't wait!
  ipa: /aɪ ˈkænt ˈweɪt/
  note_ru: 'can''t wait — t на стыке почти не слышно: «кэн уэйт»'
