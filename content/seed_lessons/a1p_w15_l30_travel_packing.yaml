  note_ru: Don't forget your passport! — не забудь паспорт!
layers:
- number: 1
  body: 'Вечер перед поездкой: чемодан, паспорт, посадочный талон. Анна проверяет список, а Том пытается уложить всё в один чемодан.


    > [S1]Tom[/], [T3]our[/] [S4]flight[/] [D1]is[/] [P3]at[/] [N3]seven[/] [A2]tomorrow[/]. [D1]Did[/] [T8]you[/] [D2]pack[/] [T3]your[/] [S2]suitcase[/]? — Том, наш рейс завтра в семь. Ты собрал чемодан?

    > [S2]Passport[/], [S2]boarding[/] [S2]pass[/], [S2]phone[/]. [C1]And[/] [T3]my[/] [S2]guitar[/]? — Паспорт, посадочный, телефон. А гитара?

    '
- number: 2
  body: '**Passport** — «пропуск через порт»: раньше это была бумага, чтобы войти в морской порт. **Souvenir** — французское «воспоминание»: сувенир — вещь, чтобы помнить поездку. **Luggage** — от *lug*, «тащить»: багаж — то, что приходится тащить.

    '
- number: 3
  body: 'Схема сборов:


    > [A2]Then[/] [D2]put[/] [T3]your[/] [S2]swimsuit[/] [C1]and[/] [T1]the[/] [S5]sunscreen[/] [P1]in[/] [T1]the[/] [S2]suitcase[/]. — Тогда положи в чемодан плавки и крем от солнца.


    - Документы: **passport, boarding pass, ticket**.

    - Вещи: **suitcase, bag, luggage** (неисчисляемое!).

    - Пляж: **swimsuit, sunscreen, sunglasses**.

    - В аэропорту: **The flight is delayed.** — рейс задерживается.

    - Отдых: **a cabin by the ocean, sand, an island**.

    '
- number: 4
  body: '**excited или exciting?** **I''m excited** — я радостно жду (это моё чувство). **The trip is exciting** — поездка захватывающая (она вызывает чувство). Как *surprised / surprising* на неделе 6.


    > [D1]Have[/] [T1]a[/] [J3]nice[/] [S10]trip[/]! [T8]I[/] [D7]will[/] [D6]check[/] [T3]your[/] [S2]apartment[/]. — Хорошей поездки! Я присмотрю за квартирой.


    **Диагностика понимания:** что сказать перед поездкой: *I''m so exciting!* или *I''m so excited!*?


    **Разбор:** *I''m so excited!* — чувствуете вы, значит -ed.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Have a nice trip! / Have a safe trip!** — хорошей поездки! / счастливо доехать!

    - **I can''t wait!** — жду не дождусь!

    - **go camping** — в поход с палаткой.

    - **go abroad** — поехать за границу.


    Слова: **pack** — собирать вещи, **delay** — задерживать, **passport, suitcase, luggage, flight, tent** — палатка, **cabin** — домик, **island** — остров, **ocean** — океан, **sand** — песок, **sunscreen, swimsuit, souvenir, adventure** — приключение, **abroad** — за границей, **exciting, excited**.

    '
- number: 6
  body: 'Ловушки:


    - «luggages» — **luggage** неисчисляемое.

    - «I''m exciting» — **I''m excited**.

    - «go to abroad» — без to: **go abroad**.

    - island: s не читается — «Айлэнд».

    '
- number: 7
  body: 'Шесть заданий: назвать документ, сказать про задержку, собрать список, собраться на море, выбрать excited и пожелать доброго пути.


    **Проверка маленького шага:** passport, boarding pass, suitcase — Have a nice trip!

    '
