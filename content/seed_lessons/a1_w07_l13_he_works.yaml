title: "Он работает: he works, she works — окончание -s"
summary: "Почему с he, she и одним человеком у глагола появляется -s: Tom works, Mia works. Как спросить Does he…? и ответить No, he doesn't. Как звучит -s."
units: [LX-00148, LX-00149, LX-00150, LX-00147, LX-00153, LX-00154, LX-00155, LX-00156, LX-00332, LX-00333, LX-00334]
sound_notes:
  - text: "Tom works at home."
    ipa: "/ˈtɑm ˈwɝks ət ˈhoʊm/"
    note_ru: "-s после k глухое: «уёркс»; не проглатывайте его"
  - text: "Does he work at a school?"
    ipa: "/dəz i ˈwɝk ət ə ˈskul/"
    note_ru: "does без ударения — «дэз», h в he почти пропадает: «дэзи»"
  - text: "He goes home at eight."
    ipa: "/hi ˈɡoʊz ˈhoʊm ət ˈeɪt/"
    note_ru: "после гласной -s звонкое: goes — «гоуз»"
contractions:
  - full: "does not"
    short: "doesn't"
    ipa: "/ˈdʌzənt/"
    note_ru: "No, he doesn't. В разговоре почти всегда doesn't."
layers:
  - number: 1
    body: |
      Том работает дома, Мия — в кафе, а сосед сверху… почему-то только по ночам. Чтобы рассказывать о других людях, английскому нужна одна маленькая буква *-s*. Её теряют почти все начинающие. Вы — не потеряете.

      На неделе 6 вы говорили о себе: I work, you work. Теперь — о других людях: о друге, соседе, коллеге.

      > [S1]Tom[/] [D2]works[/] [P1]at[/] [S2]home[/]. — Том работает дома.
      > [T8]He[/] [D2]works[/] [P3]at[/] [S7]night[/]! — Он работает по ночам!

      Правило для **обычного утвердительного предложения в Present Simple**: с **he, she, it** и именем одного человека чаще нужна форма глагола с **-s** (*works*). Это не правило для **всех** глаголов и **всех** конструкций: *can* не получает -s, а *be* имеет особую форму *is*.
  - number: 2
    body: |
      Современная форма **-s** — один из сохранившихся следов более богатой древней системы глагольных окончаний. Многие старые окончания исчезли, но глаголы **be** и некоторые формы вроде **has** по-прежнему устроены необычно. В простом настоящем *works* относится к **he / she / it** и одному названному человеку, а не только к «он / она».

      В старом английском на его месте стояло `-eth`: he worketh. Его ещё можно встретить в старинных книгах и песнях.
  - number: 3
    body: |
      Схема с he, she и одним человеком:

      > [S1]Mia[/] [D2]works[/] [A3]here[/], [P1]at[/] [T1]the[/] [S4]cafe[/]! — Мия работает здесь, в кафе!
      > [D1]Does[/] [T8]he[/] [D2]work[/] [P1]at[/] [T1]a[/] [S4]school[/]? — Он работает в школе?
      > [O4]No[/], [T8]he[/] [D1]does[/] [X1]not[/]. — Нет.

      - Утверждение: he / she + глагол с -s: she works.
      - Вопрос: does + he / she + глагол без -s: Does she work?
      - Отрицание: he does not work — he doesn't work.
      - В **обычном вопросе и отрицании с does** основной глагол остаётся без -s: *Does he work?*, не *Does he works?*. Это правило для **данной конструкции**, а не утверждение обо всех сочетаниях глаголов.
  - number: 4
    body: |
      **Почему work, а не works после does?** Вспомогательный глагол **does** уже показывает лицо и число: *Does he work?*. Поэтому **основной глагол** остаётся без окончания. Представьте, что грамматическую работу берёт на себя **does**: это полезное объяснение, хотя буквально окончание из одного слова в другое не «переезжает».

      - He works. → Does he work?
      - She likes milk. → Does she like milk?

      Обратите внимание на три формы: have → **has**, do → **does**, go → **goes**. После **does** и они возвращаются к начальной форме: *Does he have a computer?*, а не *Does he has a computer?*.

      > [T8]He[/] [D1]has[/] [T1]a[/] [S2]computer[/]. — У него компьютер.

      **Диагностика понимания:** Спросите, работает ли Том. Что верно: *Does Tom work?* или *Does Tom works?*?

      **Разбор:** *Does Tom work?* Помощник **does** показывает форму для одного человека, поэтому **основной глагол work** остаётся без **-s**. В утверждении без does: *Tom works*.
  - number: 5
    body: |
      Так говорят о чужой работе в Америке:

      > [O4]No[/], [T8]he[/] [D1]does[/] [X1]not[/]. [S1]Tom[/] [D2]works[/] [P1]at[/] [S2]home[/]. [T8]He[/] [D1]has[/] [T1]a[/] [S2]computer[/]. — Нет. Том работает дома. У него компьютер.

      - В разговоре — No, he doesn't.
      - **Works from home** часто означает «работает удалённо, из дома»; **works at home** может означать, что человек выполняет работу дома, без уточнения формата. Это не полностью одинаковые выражения. В упражнении тренируем грамматическую форму *works*, а ситуацию уточняет контекст.
      - О соседе сверху говорят the man upstairs — без имени, просто «мужчина сверху».
  - number: 6
    body: |
      Как звучит -s — зависит от последнего звука глагола:

      - после глухих k, p, t — глухое «с»: works, likes, gets;
      - после звонких и гласных — «з»: goes, has, does;
      - после ch, sh, s — «из» и на письме -es: teaches, watches.

      Распространённая ошибка — *He work* вместо **He works** в обычном утверждении. Смысл собеседник, вероятно, поймёт, но форма для учебного стандартного американского английского неправильная.

      Новые глаголы рабочего дня — по тому же правилу:

      > [T8]I[/] [D8]start[/] [P3]at[/] [N3]eight[/]. — Я начинаю в восемь. (Анна)
      > [T8]I[/] [D8]finish[/] [P3]at[/] [N3]two[/]. — Я заканчиваю в два. (Мия)

      - [T8]she[/] [D8]starts[/] — глухое «с» после t
      - [T8]she[/] [D8]finishes[/] — после sh пишут -es и читают «из»
      - [T8]he[/] [D5]writes[/] — пишет: w в начале не читается, «райтс»
  - number: 7
    body: |
      Шесть заданий: узнать правильную форму, вставить does, собрать фразу о друге, ответить о соседе в новой ситуации, выбрать finishes и сказать, когда начинает работу знакомый.

      **Проверка маленького шага:** *Tom works* — обычное утверждение, поэтому **works**. *Does Tom work?* — вопрос: **does** уже показывает форму для Tom, и основной глагол **work** остаётся без **-s**. Сначала найдите, **есть ли does**, затем выбирайте форму основного глагола.
