title: "Глагол be: «есть», который русский прячет"
summary: "Почему «Я дома» по-английски нельзя сказать без глагола, как работают am, is, are и как с их помощью отрицать и спрашивать."
units: [LX-00016, LX-00017, LX-00018, LX-00019, LX-00030, LX-00031, LX-00032, LX-00023, LX-00028]
sound_notes:
  - text: "It's nice."
    ipa: "/ɪts ˈnaɪs/"
    note_ru: "it is → it's"
  - text: "You're my friend."
    ipa: "/jɚ maɪ ˈfrend/"
    note_ru: "you're звучит как your"
  - text: "It isn't my book."
    ipa: "/ɪt ˈɪzənt maɪ ˈbʊk/"
    note_ru: "n't звучит как слабое /ənt/"
contractions:
  - full: "I am"
    short: "I'm"
    ipa: "/aɪm/"
    note_ru: "am присоединяется к I: произносите слитно."
  - full: "you are"
    short: "you're"
    ipa: "/jɚ/"
    note_ru: "Без ударения звучит как your."
  - full: "it is"
    short: "it's"
    ipa: "/ɪts/"
    note_ru: "is сокращается до /s/ после it."
  - full: "is not"
    short: "isn't"
    ipa: "/ˈɪzənt/"
    note_ru: "Отрицание присоединяется к is; слышно слабое /ənt/."
  - full: "are not"
    short: "aren't"
    ipa: "/ɑrnt/"
    note_ru: "В американском варианте сохраняется звук /r/."
layers:
  - number: 1
    body: |
      > [T8]It[/] [D1]is[/] [J3]nice[/]. [T8]It[/] [D1]is[/] [T1]a[/] [J1]big[/] [S2]house[/]! — Какой хороший дом! И большой!

      В русском мы говорим «Я дома», «Анна — моя подруга», «Телефон новый». Глагола в этих фразах не видно: он подразумевается.

      В английском так нельзя. В каждом предложении должен стоять глагол. Если ничего не делается, а просто что-то **есть**, где-то **находится** или **является** чем-то, работает глагол **be**.

      > [T8]I[/] [D1]am[/] [P1]at[/] [S2]home[/]. — Я дома.
      > [S1]Anna[/] [D1]is[/] [T3]my[/] [S1]friend[/]. — Анна — моя подруга.

      Двойная линия под словом в English Encyclopedia всегда означает глагол.
  - number: 2
    body: |
      **be** — одно из самых древних слов английского языка. Его формы пришли из разных старых корней и со временем слились в один глагол: am и is — из одного корня, be — из другого, was — из третьего. Поэтому формы так непохожи друг на друга.

      Интересное родство: английское **is** и русское **есть** («у меня есть») восходят к одному древнему корню. Тот же корень в немецком `ist` и латинском `est`. Русский язык просто перестал произносить «есть» в настоящем времени, а английский сохранил.

      Слово **verb** (глагол) — от латинского `verbum`, «слово». Древние грамматики считали глагол главным словом предложения.
  - number: 3
    body: |
      У be в настоящем времени три формы. Какую выбрать, зависит от того, о ком речь:

      > [T8]I[/] [D1]am[/] [S1]Tom[/]. — Я Том.
      > [T8]You[/] [D1]are[/] [T3]my[/] [S1]friend[/]. — Ты мой друг.
      > [T8]It[/] [D1]is[/] [T1]a[/] [S2]book[/]. — Это книга.
      > [S1]Anna[/] [D1]is[/] [P1]at[/] [S2]home[/]. — Анна дома.

      - [T8]I[/] — всегда с [D1]am[/].
      - [T8]you[/] — всегда с [D1]are[/], и для «ты», и для «вы».
      - [T8]it[/] и один человек по имени — с [D1]is[/].

      Порядок слов жёсткий: сначала **кто или что**, потом **be**, потом всё остальное.
  - number: 4
    body: |
      Почему английскому глагол нужнее, чем русскому? В русском слова держатся друг за друга окончаниями: «моя подруга», «Анне», «Анной». В английском окончаний почти нет. Предложение держится на каркасе: **кто — глагол — остальное**. Уберёте глагол, и каркас рассыпается.

      Зато с be легко строить отрицания и вопросы. Для отрицания после be ставят [X1]not[/]:

      > [T8]It[/] [D1]is[/] [X1]not[/] [T3]my[/] [S2]phone[/]. — Это не мой телефон.

      Для вопроса be выходит вперёд:

      > [D1]Is[/] [T8]it[/] [T1]a[/] [S2]book[/]? — Это книга?
      > [O4]Yes[/], [T8]it[/] [D1]is[/]. — Да.
      > [O4]No[/], [T8]it[/] [D1]is[/][X1]n't[/]. — Нет.
  - number: 5
    body: |
      В живой речи американцы почти всегда сокращают be. Полные формы звучат подчёркнуто, официально или сердито.

      > [T8]I[/][D1]'m[/] [J4]busy[/]. — Я занят.
      > [T8]It[/][D1]'s[/] [J3]nice[/]! — Как мило!
      > [T8]You[/][D1]'re[/] [T3]my[/] [S1]friend[/]. — Ты мой друг.
      > [T8]It[/] [D1]is[/][X1]n't[/] [T3]my[/] [S2]book[/]. — Это не моя книга.

      - I'm звучит как /aɪm/, it's — /ɪts/, you're — почти как your.
      - На вопрос отвечают не голым Yes, а коротким хвостом с be: Yes, it is. No, it isn't. Так звучит естественно и вежливо.
      - В коротком ответе Yes, it is сокращать нельзя: Yes, it's звучит обрубленно.
  - number: 6
    body: |
      Возраст по-английски тоже через be: «Мне тридцать» звучит как `I am thirty`, буквально «я есть тридцать». Числа будут в отдельном уроке.

      Про место: дома — `at home`. Но после глаголов движения «домой» предлог не нужен: `I'm home!` — «Я дома!» (кричат с порога).

      Самая частая ошибка русскоязычных учеников — потерять be: «I busy», «Anna my friend». Проверка простая: если в английской фразе нет ни одного глагола, скорее всего пропущен be.
  - number: 7
    body: |
      Четыре задания: узнать be в предложении, выбрать форму, вставить её самостоятельно и собрать отрицание.

      Не спешите открывать подсказку: ошибка тоже учит.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Какое слово в этой фразе — глагол be?"
    prompt_en: "Anna is my friend."
    options: [Anna, is, my, friend]
    answer: is
    hint_ru: "Ищите слово, которого нет в русском переводе «Анна — моя подруга»."
    explanation_ru: "Is — форма be для одного человека или предмета. В русском на её месте тире."
    units: [LX-00016]
  - order: 2
    kind: choice
    stage: substitution
    prompt_ru: "Выберите форму be: «Ты мой друг»."
    prompt_en: "You ___ my friend."
    options: [am, is, are]
    answer: are
    hint_ru: "С you всегда одна и та же форма."
    explanation_ru: "С you всегда are — и когда это «ты», и когда «вы»."
    units: [LX-00016, LX-00018]
  - order: 3
    kind: fill
    stage: substitution
    prompt_ru: "Впишите форму be: «Я дома»."
    prompt_en: "I ___ at home."
    answer: am
    hint_ru: "С I работает только одна форма."
    explanation_ru: "I всегда сочетается с am. В разговоре сокращают: I'm at home."
    units: [LX-00016, LX-00017, LX-00023]
  - order: 4
    kind: build
    stage: production
    prompt_ru: "Соберите фразу: «Это не телефон»."
    options: [not, phone, It, a, is]
    answer: It is not a phone
    accepted: ["It isn't a phone", "It's not a phone"]
    hint_ru: "Порядок: кто — be — not — остальное."
    explanation_ru: "Not ставится сразу после be: It is not a phone. В разговоре: It isn't a phone."
    units: [LX-00016, LX-00019, LX-00030]
