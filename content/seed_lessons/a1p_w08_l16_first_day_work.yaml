layers:
- number: 1
  body: 'Первый день на новой работе: тебе дают форму, показывают стойку и знакомят с командой. Слов много, и важно вовремя переспросить.


    > [J3]Good[/] [S7]morning[/], [S1]Jake[/]! [O2]Welcome[/] [P2]to[/] [T1]the[/] [S9]team[/]! [A3]Here[/] [D1]is[/] [T3]your[/] [S2]apron[/]. — Доброе утро, Джейк! Добро пожаловать в команду! Вот твой фартук.

    > [O2]Thank[/] [T8]you[/]! [T8]It[/] [D1]is[/] [T3]my[/] [N2]first[/] [S7]day[/]. [D7]Can[/] [T8]I[/] [D5]ask[/] [T1]a[/] [S9]question[/]? [T9]What[/] [D1]are[/] [T1]the[/] [S9]rules[/]? — Спасибо! У меня первый день. Можно вопрос? Какие тут правила?

    '
- number: 2
  body: '**Customer** родственно слову *custom* — «обычай, привычка»: клиент — это тот, кто привык к вам ходить. **Shift** — «сдвиг, смена»: рабочий день «сдвигается» от одного человека к другому. **Uniform** — «одна форма»: *uni-* значит «один», как в слове «униформа».

    '
- number: 3
  body: 'Схема первого дня:


    > [D2]Got[/] [T8]it[/]. [D7]Can[/] [T8]I[/] [D2]use[/] [T3]my[/] [S2]phone[/] [P1]at[/] [S9]work[/]? — Понял. А телефоном на работе можно пользоваться?


    - Приветствие команды: **Welcome to the team!**

    - Вопрос: **Can I ask a question?** — затем сам вопрос.

    - Понял: **Got it.** / **Okay.**

    - Согласие: **No problem.**

    - Перерыв: **Take a break.**

    '
- number: 4
  body: |
    **Почему «Got it», а не «I understand»?** **I understand** — правильная нейтральная фраза; она не обязательно официальная. **Got it** короче и разговорнее, удобно подтверждает, что вы поняли объяснение или инструкцию. **Got it** — короткое разговорное «понял, принято». Его говорят и начальнику, и коллеге.

    > [D1]Do[/] [X1]not[/] [D3]worry[/]. [T8]It[/] [D2]happens[/]. [D2]Take[/] [T1]a[/] [S7]break[/]. — Не переживай. Бывает. Передохни.

    **Take a break** — здесь break — «перерыв», а не «ломать». Одно слово — два значения, понятно по фразе.

    **Диагностика понимания:** коллега объяснила задачу. Что коротко ответить: *Got it* или *I got*?

    **Разбор:** *Got it.* — с it.

- number: 5
  body: 'Так говорят американцы:


    > [O3]Oh[/] [O4]no[/]! [T8]I[/] [D2]dropped[/] [T1]a[/] [S2]cup[/]. [T8]I[/] [D2]broke[/] [T8]it[/]! — О нет! Я уронил чашку. Разбил!


    - **It happens.** — бывает.

    - **No problem.** — без проблем; и в ответ на спасибо.

    - **Thanks!** — коротко «спасибо».


    Слова: **customer** — клиент, **apron** — фартук, **uniform** — форма, **counter** — стойка, **machine** — аппарат, **tray** — поднос, **trash** — мусор, **shift** — смена, **team** — команда, **problem** — проблема, **break — broke** — разбить, **chat** — болтать, **wet** — мокрый, **fast** — быстрый.

    '
- number: 6
  body: 'Ловушки:


    - «I got» без it — нужно **Got it**.

    - machine — не «машина-автомобиль»: это **car**.

    - «uniform» читается «Юниформ», с «ю».

    - «a trash» — trash неисчисляемое: **the trash**, some trash.

    '
- number: 7
  body: 'Шесть заданий: поприветствовать новичка, переспросить, собрать «не переживай, бывает», рассказать о первом дне, выбрать слово по картинке и ответить на спасибо.


    **Проверка маленького шага:** Can I ask a question? — Got it. — No problem.

    '
