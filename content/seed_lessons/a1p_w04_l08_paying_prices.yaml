layers:
- number: 1
  body: 'Подарок оказался не того цвета. Хорошо, что Том сохранил чек — покупку можно обменять. Для такого разговора нужны слова о деньгах.


    > [D1]Do[/] [T8]you[/] [D1]have[/] [T1]the[/] [S2]receipt[/]? — Чек у тебя есть?

    > [J3]Good[/]. [T8]We[/] [D7]can[/] [D2]change[/] [T8]it[/] [A2]tomorrow[/]. [J2]Blue[/] [D1]is[/] [T3]her[/] [J3]favorite[/] [S2]color[/]. — Хорошо. Завтра обменяем. Её любимый цвет — синий.

    '
- number: 2
  body: '**Receipt** пришло из старофранцузского *recete* — «полученное». В слове осталась немая буква p: её вставили книжники по латинскому образцу, а произносить не стали. **Cash** — от французского *caisse*, «ящик для денег», отсюда и **cashier** — кассир.

    '
- number: 3
  body: 'Схема:


    > [T8]I[/] [D2]paid[/] [N1]twenty[/] [N6]dollars[/] [P4]by[/] [S2]card[/]. — Я заплатил двадцать долларов картой.


    - Цена в прошлом: **How much was it? — It was twenty dollars.**

    - Цена сейчас: **How much is it?**

    - Как платили: **by card** — картой, **in cash** — наличными.

    - Скидка: **It was on sale.**

    - Обменять: **change it**; для этого нужен **receipt**.

    '
- number: 4
  body: '**Почему «by card», но «in cash»?** By — «с помощью чего»: by card, by bus. А наличные — это то, «в чём» вы платите: in cash, in dollars. Это нужно просто запомнить парой.


    **Money** — одно целое, как «вода»: *money is*, не «moneys». Сколько денег — *how much money*.


    **Диагностика понимания:** как спросить, сколько стоил подарок: *How much is it?* или *How much was it?*


    **Разбор:** *How much was it?* — покупка уже в прошлом.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Happy birthday!** — с днём рождения.

    - **It''s perfect!** — идеально, о подарке.

    - **It was a great price** — отличная цена.

    - **It''s the wrong size / color** — не тот размер / цвет.


    Одежда и вещи: **dress** — платье, **jeans** — джинсы, **ring** — кольцо, **wallet** — кошелёк, **pocket** — карман, **card** — карта или открытка. Цвет и оценка: **pink** — розовый, **pretty** — симпатичный, **perfect** — идеальный, **favorite** — любимый.

    '
- number: 6
  body: 'Ловушки:


    - «I paid with cash» — понятно, но обычно говорят **in cash**.

    - «How much it was?» — в вопросе was впереди: **How much was it?**

    - «moneys» — у money нет -s.

    - receipt: p не произносится.

    '
- number: 7
  body: 'Шесть заданий: спросить цену, выбрать by card или in cash, собрать фразу про скидку, обменять покупку, похвалить подарок и сказать любимый цвет.


    **Проверка маленького шага:** How much was it? — It was … dollars. I paid by card / in cash.

    '
