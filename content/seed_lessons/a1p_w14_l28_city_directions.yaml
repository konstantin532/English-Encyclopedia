layers:
- number: 1
  body: 'В американском городе дорогу объясняют кварталами (**blocks**) и ориентирами: мост, церковь, фонтан. Сначала спросите вежливо, потом повторите маршрут, чтобы проверить себя.


    > [O2]Excuse[/] [T8]me[/]! [A6]How[/] [D1]do[/] [T8]I[/] [D9]get[/] [P2]to[/] [S4]Park[/] [S4]Street[/]? — Простите! Как пройти на Парк-стрит?

    > [D4]Turn[/] [A3]left[/] [P3]at[/] [T1]the[/] [S4]fountain[/]. [T1]The[/] [S2]photo[/] [S4]shop[/] [D1]is[/] [P3]on[/] [T1]the[/] [A3]left[/]. [T8]You[/] [D7]cannot[/] [D3]miss[/] [T8]it[/]. — У фонтана поверните налево. Фотоателье будет слева. Мимо не пройдёте.

    '
- number: 2
  body: '**Downtown** — американское слово: в первых городах деловой центр был в «нижней» части, у реки и порта. Отсюда *downtown* — «в центр», а *uptown* — в жилые кварталы. **Avenue** — от французского «подход, подъезд»: широкая улица, которая ведёт к чему-то важному.

    '
- number: 3
  body: 'Схема разговора:


    > [S1]Tom[/], [D6]look[/] [P3]at[/] [T1]the[/] [J2]old[/] [S4]map[/]. [C4]If[/] [T8]we[/] [D4]go[/] [P2]to[/] [S1]Ruth[/], [T8]we[/] [D7]can[/] [D5]ask[/] [T3]her[/] [A6]about[/] [S1]Sam[/]. — Том, посмотри на старую карту. Если мы сходим к Рут, мы спросим её про Сэма.


    - Вопрос: **How do I get to…? / Is it far?**

    - Шаги: **Walk two blocks. Turn left at the fountain.**

    - Где: **on the left / on the right, opposite the bank, at the end of the street**.

    - Время: **It''s ten minutes on foot.**

    - Условие: **If + сейчас, … can / will…** — If we go to Ruth, we can ask her.

    '
- number: 4
  body: '**if — первое знакомство.** *If we go to Ruth, we can ask her.* После **if** стоит обычное настоящее время (go), даже если речь о будущем. По-русски «если мы сходим», а по-английски — «если мы идём».


    **Повторите маршрут** — так делают и американцы: *Past the church, across the square. And then?* Это вежливо и помогает не заблудиться.


    **Диагностика понимания:** что верно: *If we will go…* или *If we go…*?


    **Разбор:** *If we go…* — после if будущее не ставят.

    '
- number: 5
  body: 'Так говорят американцы:


    - **I''m lost.** — я заблудился.

    - **You can''t miss it.** — мимо не пройдёте.

    - **It''s on the left.** — это слева.


    Город: **bridge** — мост, **square** — площадь, **block** — квартал, **avenue** — проспект, **crosswalk** — переход, **traffic** — движение, **entrance** — вход, **gate** — ворота, **fountain** — фонтан, **statue** — памятник, **church** — церковь, **downtown** — в центре, **tourist** — турист, **directions** — как пройти, **main** — главный. Из истории 10: **if** — если.

    '
- number: 6
  body: 'Ловушки:


    - «How can I go to…?» — понятно, но обычно **How do I get to…?**

    - «on the left side of hand» — просто **on the left**.

    - «If we will go» — **If we go**.

    - «by foot» — говорят **on foot**.

    '
- number: 7
  body: 'Шесть заданий: спросить дорогу, сказать «слева», собрать фразу с if, объяснить путь до остановки, выбрать on foot и сказать «я заблудился».


    **Проверка маленького шага:** How do I get to…? — Turn left at… — on the left — on foot. If + настоящее время.

    '
