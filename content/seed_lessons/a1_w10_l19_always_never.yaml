    kind: choice
    stage: recognition
    prompt_ru: "Как правильно сказать «Я никогда не гуляю»?"
    options: ["I never walk.", "I don't never walk.", "I walk never."]
    answer: "I never walk."
    hint_ru: "never уже содержит «не»."
    explanation_ru: "В нормативном утверждении I never walk слово never уже означает «никогда не». Поэтому don't здесь не добавляют; never стоит перед основным глаголом walk."
    units: [LX-00197, LX-00210]
