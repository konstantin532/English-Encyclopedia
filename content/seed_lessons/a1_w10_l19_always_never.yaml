contractions:
  - full: "do not"
    short: "don't"
    ipa: "/doʊnt/"
    note_ru: "I don't walk = I never walk? Нет: don't — «не гуляю (сейчас, обычно)», never — «никогда»."
layers:
  - number: 1
    body: |
      Рассказывая о выходных, мы говорим не только что делаем, но и как часто. Для этого есть слова частоты.

      > [T8]I[/] [A1]always[/] [D2]read[/] [P3]on[/] [S7]Saturday[/]. [T8]I[/] [D3]like[/] [D2]reading[/]. — По субботам я всегда читаю. Люблю читать.
      > [O4]No[/], [T8]I[/] [A1]never[/] [D4]walk[/]! — Нет, я никогда не гуляю!

      Условная шкала: **always** («всегда») → **usually** («обычно») → **sometimes** («иногда») → **never** («никогда»). Это **не точные проценты**: *usually* не означает одно и то же число раз для всех людей.
  - number: 2
    body: |
      **always** — слияние двух слов: all way, «весь путь». Сначала — «всю дорогу», потом — «всё время».

      **never** — тоже два слова: ne + ever, «не когда-либо». Отрицание уже спрятано внутри, поэтому второе «не» ему не нужно.

      **weekend** — week + end, «конец недели». Слово американцы произносят с двумя ударениями.
  - number: 3
    body: |
      Место слова частоты:

      > [T8]I[/] [A1]always[/] [D2]read[/] [P3]on[/] [S7]Saturday[/]. — По субботам я всегда читаю.
      > [T8]I[/] [A1]never[/] [D4]walk[/]! — Я никогда не гуляю!

      - Перед обычным глаголом: I always read, she never walks.
      - После be: I am always busy, he is never at home.
      - sometimes может стоять и в начале: Sometimes I read.
      - Дни недели — с on: on Saturday, on Sunday, on the weekend.

      **Когда встречаемся? Дни и месяцы.**

      Дни недели: **Monday** — понедельник, **Tuesday** — вторник, **Wednesday** — среда, **Thursday** — четверг, **Friday** — пятница; Saturday и Sunday уже знакомы.

      > [O1]See you[/] [P3]on[/] [S7]Friday[/], [S1]Mia[/]! — Увидимся в пятницу, Мия!
      > [C1]And[/] [P3]on[/] [S7]Sunday[/] [P3]in[/] [S7]October[/]? — А в воскресенье в октябре?

      Месяцы по порядку:

      - **January, February, March** — январь, февраль, март;
      - **April, May, June** — апрель, май, июнь;
      - **July, August, September** — июль, август, сентябрь;
      - **October, November, December** — октябрь, ноябрь, декабрь.

      С днём — **on**, с месяцем — **in**: on Friday, in October. Дни и месяцы всегда с большой буквы. В Wednesday середина слова не звучит: /ˈwɛnzˌdeɪ/.

      > [T8]I[/] [A1]usually[/] [D2]work[/] [P3]on[/] [S7]Monday[/]. — По понедельникам я обычно работаю.
      > [T8]I[/] [D3]like[/] [D4]walking[/] [P3]in[/] [S7]May[/]. — Я люблю гулять в мае.
  - number: 4
    body: |
      **Почему не I don't never walk?** В **стандартном американском английском**, который мы изучаем, **never** само выражает отрицание: *I never walk*. Добавлять к нему **don't** для обычного отрицательного утверждения не нужно. Но нельзя утверждать, будто двойное отрицание «всегда взаимно уничтожается»: в некоторых диалектах английского оно реально встречается с отрицательным смыслом. В курсе используем нормативную конструкцию *I never…*.

      > [T8]You[/] [A1]never[/] [D4]walk[/]? [A1]Never[/]? — Ты никогда не гуляешь? Совсем никогда?

      Слово частоты отвечает на вопрос How often…? — «Как часто…?».
  - number: 5
    body: |
      Так говорят о выходных американцы:

      > [T9]What[/] [D1]do[/] [T8]you[/] [D2]do[/] [P3]on[/] [T1]the[/] [S7]weekend[/], [S1]Anna[/]? — Анна, а что ты делаешь в выходные?
      > [T8]I[/] [D2]work[/] [P3]on[/] [S7]Sunday[/]. [T8]I[/] [A1]always[/] [D2]work[/] [P3]at[/] [N3]five[/]! — А я работаю в воскресенье. Всегда с пяти!

      - **В американском английском** очень распространено **on the weekend**. Для привычных действий также встречается **on weekends**. Британский вариант *at the weekend* приводится лишь для узнавания, а основной образец нашего курса — американский.
      - Для коротких ответов хватит одного слова: Always! Never! Sometimes.
      - В США многие настенные календари отображают **Sunday** первым днём недели, но форматы различаются; это не правило о том, когда у каждого человека начинается рабочая неделя.
  - number: 6
    body: |
      Ловушки:

      - В **обычном нейтральном утверждении** наречие частоты обычно стоит перед смысловым глаголом: **I always read**. Иные позиции бывают для особой выразительности, но на A1 тренируем базовый порядок.
      - «I don't never walk» — двойное отрицание. Правильно: I never walk.
      - on Saturday — «в субботу» (одну или каждую); on Saturdays — подчёркнуто «по субботам».

      Дни недели по-английски всегда пишут с большой буквы: Saturday, Sunday.
  - number: 7
    body: |
      Шесть заданий: понять слово частоты, поставить его на место, собрать фразу о выходных и рассказать о себе в новой ситуации; выбрать предлог перед месяцем и договориться о дне встречи.

      **Проверка маленького шага:** *I always read* — **always** перед обычным смысловым глаголом **read**. *I am always busy* — то же **always** стоит после формы **be** (*am*). Сперва найдите **какой глагол** в предложении, затем выбирайте место слова частоты.
