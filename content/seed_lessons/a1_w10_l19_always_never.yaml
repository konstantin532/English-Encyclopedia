    explanation_ru: "No, I never work on Sunday. Коротко — No, never."
    units: [LX-00195, LX-00197]
  - order: 5
    kind: choice
    stage: substitution
    prompt_ru: "Выберите фразу: «Я люблю гулять в октябре»."
