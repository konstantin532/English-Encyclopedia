title: "Как часто: always, usually, sometimes, never"
summary: "Как сказать, насколько часто вы что-то делаете: always, usually, sometimes, never. Куда ставить эти слова и почему never не любит второе «не»."
units: [LX-00193, LX-00194, LX-00195, LX-00196, LX-00197, LX-00198, LX-00199, LX-00206, LX-00207, LX-00210, LX-00369, LX-00370, LX-00371, LX-00372, LX-00373, LX-00374, LX-00375, LX-00376, LX-00377, LX-00378, LX-00379, LX-00380, LX-00381, LX-00382, LX-00383, LX-00384, LX-00385]
sound_notes:
