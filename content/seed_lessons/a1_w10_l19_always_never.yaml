contractions:
  - full: "do not"
    short: "don't"
    ipa: "/doʊnt/"
    note_ru: "I don't walk on Sundays — «по воскресеньям я не гуляю» (обычная привычка); never подчёркивает «никогда». Present Simple сам по себе не описывает процесс прямо сейчас."
layers:
  - number: 1
    body: |
      Анна по субботам всегда читает. Том никогда не гуляет — вообще никогда. Слова «всегда», «иногда», «никогда» делают рассказ о себе живым: не просто что вы делаете, а какой вы человек.

      Рассказывая о выходных, мы говорим не только что делаем, но и как часто. Для этого есть слова частоты.

      > [T8]I[/] [A1]always[/] [D2]read[/] [P3]on[/] [S7]Saturdays[/]. [T8]I[/] [D3]like[/] [D2]reading[/]. — По субботам я всегда читаю. Люблю читать.
      > [O4]No[/], [T8]I[/] [A1]never[/] [D4]walk[/]! — Нет, я никогда не гуляю!

      Условная шкала: **always** («всегда») → **usually** («обычно») → **sometimes** («иногда») → **never** («никогда»). Это **не точные проценты**: *usually* не означает одно и то же число раз для всех людей.

      **Маленький шаг на будущее:** *I like reading* в истории значит «Я люблю читать». Пока запомните сочетание как готовую фразу; почему у *read* появляется окончание **-ing** после *like*, подробно узнаете **в следующем уроке**. Здесь тренируем только положение *always / never*.
  - number: 2
    body: |
      Эти слова уточняют, **как часто повторяется действие**. Сравните:

      **I read.** — Я читаю. Мы называем привычное занятие, но не говорим, как часто.
      **I always read on Saturdays.** — По субботам я всегда читаю. Always относится к субботам: фраза не означает, что человек читает каждую минуту всей недели.
      **I sometimes read.** — Я иногда читаю. Это случается время от времени.
      **I never read.** — Я никогда не читаю. Never само выражает отрицание; don't к нему в этой фразе не добавляем.

      Найдите глагол, прежде чем выбирать место слова частоты. Перед обычным глаголом: **I always read**. После am/is/are: **I am always busy**. Это базовый нейтральный порядок, а не запрет других позиций во всех контекстах.

      Для sometimes доступны и другие места: **Sometimes I play the guitar** и **I play the guitar sometimes**. В начале или конце меняется расположение слова, но сохраняется смысл «иногда».
  - number: 3
    body: |
      Место слова частоты:

      > [T8]I[/] [A1]always[/] [D2]read[/] [P3]on[/] [S7]Saturdays[/]. — По субботам я всегда читаю.
      > [T8]I[/] [A1]never[/] [D4]walk[/]! — Я никогда не гуляю!

      - Перед обычным глаголом: I always read, she never walks.
      - После be: I am always busy, he is never at home.
      - sometimes может стоять и в начале: Sometimes I read.
      - С днями недели часто используют **on**: on Saturday, on Sunday. Отдельное американское сочетание **on the weekend** означает «в выходные».

      **Когда встречаемся? Дни и месяцы.**

      Дни недели: **Monday** — понедельник, **Tuesday** — вторник, **Wednesday** — среда, **Thursday** — четверг, **Friday** — пятница; Saturday и Sunday уже знакомы.

      > [O3]Oh[/], [S1]Mia[/]! [O1]See you[/] [P3]on[/] [S7]Friday[/]! — Ох, Мия! Увидимся в пятницу!
      > [C1]And[/] [P3]on[/] [S7]Sundays[/] [P3]in[/] [S7]October[/]? — А по воскресеньям в октябре?

      Месяцы по порядку:

      - **January, February, March** — январь, февраль, март;
      - **April, May, June** — апрель, май, июнь;
      - **July, August, September** — июль, август, сентябрь;
      - **October, November, December** — октябрь, ноябрь, декабрь.

      С днём обычно — **on**, с месяцем — **in**: on Friday, in October. В неформальном разговоре **on** перед днём можно опустить: *See you Friday!* Поэтому такой ответ тоже верен. Дни и месяцы всегда с большой буквы. В Wednesday середина слова не звучит: /ˈwɛnzˌdeɪ/.

      > [T8]I[/] [A1]usually[/] [D2]work[/] [P3]on[/] [S7]Mondays[/]. — По понедельникам я обычно работаю.
      > [T8]I[/] [D3]like[/] [D4]walking[/] [P3]in[/] [S7]May[/]. — Я люблю гулять в мае.
  - number: 4
    body: |
      **Почему не I don't never walk?** В **стандартном американском английском**, который мы изучаем, **never** само выражает отрицание: *I never walk*. Добавлять к нему **don't** для обычного отрицательного утверждения не нужно. Но нельзя утверждать, будто двойное отрицание «всегда взаимно уничтожается»: в некоторых диалектах английского оно реально встречается с отрицательным смыслом. В курсе используем нормативную конструкцию *I never…*.

      **Don't и never не равны по силе утверждения.** *I don't work on Sundays* — «По воскресеньям я не работаю» (обычный режим). *I never work on Sundays* — «Я никогда не работаю по воскресеньям»: **never** подчёркивает отсутствие исключений. Здесь обе фразы — о регулярности, не о действии в данную секунду. Как описывать происходящее сейчас, разберём в A1+.

      > [T8]You[/] [A1]never[/] [D4]walk[/]? [A1]Never[/]? — Ты никогда не гуляешь? Совсем никогда?

      Слово частоты отвечает на вопрос How often…? — «Как часто…?».

      **Диагностика понимания:** Вы хотите сказать «Я никогда не гуляю». Что соответствует стандартному AmE: *I never walk* или *I don't never walk*?

      **Разбор:** *I never walk*. **Never** уже выражает отрицание в **стандартном американском английском**. В отдельных диалектах двойные отрицания возможны; мы не объявляем их «неправильным английским вообще», но здесь тренируем нормативную учебную форму.
  - number: 5
    body: |
      Так говорят о выходных американцы:

      > [O1]Hey[/], [S1]Anna[/]! [T9]What[/] [D1]do[/] [T8]you[/] [D2]do[/] [P3]on[/] [T1]the[/] [S7]weekend[/]? — Привет, Анна! А что ты делаешь в выходные?
      > [T8]I[/] [D2]work[/] [P3]on[/] [S7]Sundays[/]. [T8]I[/] [A1]always[/] [D8]start[/] [P3]at[/] [N3]five[/]! — А я работаю по воскресеньям. Всегда начинаю в пять!

      - **В американском английском** очень распространено **on the weekend**. Для привычных действий также встречается **on weekends**. Британский вариант *at the weekend* приводится лишь для узнавания, а основной образец нашего курса — американский.
      - Для коротких ответов хватит одного слова: Always! Never! Sometimes.
      - В США многие настенные календари отображают **Sunday** первым днём недели, но форматы различаются; это не правило о том, когда у каждого человека начинается рабочая неделя.
  - number: 6
    body: |
      Ловушки:

      - В обычной фразе **always** ставим перед действием: **I always read**. Сейчас тренируем этот порядок.
      - «I don't never walk» — лишнее **don't**: **never** уже означает «никогда». Скажите **I never walk**.
      - Для явной привычки «по субботам» удобно **on Saturdays**.

      **Для любопытных:** **On Saturday** может означать конкретную субботу, а в подходящей ситуации — и регулярность. **On Saturdays** яснее показывает повторение. Слова частоты иногда ставят в другие места для особого выделения, но здесь используем простой образец **I always read**.

      Дни недели по-английски всегда пишут с большой буквы: Saturday, Sunday.
  - number: 7
    body: |
      Шесть заданий: понять, как часто что-то происходит, поставить нужное слово на место, собрать фразу о выходных и рассказать о себе; выбрать слово перед месяцем и договориться о дне встречи.

      **Проверка маленького шага:** *I always read* — **always** перед обычным глаголом **read**. *I am always busy* — то же **always** стоит после формы **be** (*am*). Сперва найдите **какой глагол** в предложении, затем выбирайте место слова частоты.
