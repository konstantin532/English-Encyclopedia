    ipa: "/aɪ ˈɔlweɪz ˈrid ɑn ˈsæt̬ɚˌdeɪz/"
    note_ru: "В always ударение на первом слоге, на конце /z/. Не заменяйте l русским мягким «ль»; t в Saturdays здесь произносится коротким ударом языка."
  - text: "I never walk!"
    ipa: "/aɪ ˈnɛvɚ ˈwɔk/"
    note_ru: "never с сильным ударением на первом слоге, l в walk не читается"
