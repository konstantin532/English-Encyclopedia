title: "В кафе: I'd like…, Can I have…?, want и просьба повторить"
summary: "Как вежливо заказать (I'd like, Can I have), чем want отличается от would like, как выбрать из двух и попросить повторить."
units: [LX-00055, LX-00056, LX-00057, LX-00058, LX-00059, LX-00060, LX-00082, LX-00084, LX-00085, LX-00086, LX-00087, LX-00280, LX-00281, LX-00282, LX-00283, LX-00284, LX-00285]
sound_notes:
  - text: "Coffee or tea?"
    ipa: "/ˈkɔfi ɚ ˈti/"
    note_ru: "or без ударения звучит коротко, почти «эр»"
  - text: "Sorry? Can you say it again, please?"
    ipa: "/ˈsɑri kən ju ˈseɪ ɪt əˈɡɛn ˈpliz/"
    note_ru: "Sorry с вопросительной интонацией вверх — значит «повторите»"
  - text: "Here you are."
    ipa: "/ˈhɪr ju ˈɑr/"
    note_ru: "Говорят, когда подают вещь; сокращения здесь нет"
contractions:
  - full: "I would"
    short: "I'd"
    ipa: "/aɪd/"
    note_ru: "В заказе почти всегда I'd like — «айд лайк»."
layers:
  - number: 1
    body: |
      Кофемашина шумит, бариста переспрашивает, а за вами очередь. Знакомо? Сегодня — несколько фраз, с которыми вы спокойно закажете кофе в любом американском кафе и не растеряетесь, если вас не расслышали.

      В кафе нужны три умения: попросить, выбрать и переспросить.

      > [D7]Can[/] [T8]I[/] [D1]have[/] [T1]a[/] [S3]cookie[/], [O8]please[/]? — Можно мне печенье, пожалуйста?
      > [S3]Coffee[/] [C1]or[/] [S3]tea[/]? — Кофе или чай?
      > [D7]Can[/] [T8]you[/] [D5]say[/] [T8]it[/] [A2]again[/], [O8]please[/]? — Можете повторить, пожалуйста?

      Последняя фраза — ваш главный помощник. Если не поняли, не нужно угадывать заказ: попросите повторить. Это обычная часть разговора, а не признак плохого английского.

      **Три разные задачи:** *Can I have…?* — попросить; *Coffee or tea?* — выбрать; *Can you say it again, please?* — попросить повторить. Сначала узнавайте готовые фразы целиком, затем разберём, почему они устроены так.
  - number: 2
    body: |
      **Or** и **and** — очень старые слова. **And** восходит к древнеанглийскому *and*. **Or** развилось через среднеанглийские варианты союза со значением «или»; встречалась форма *other*, исторически связанная с древнеанглийским *oþþe*. Это **история слова**, а не правило, будто современное *other* («другой») можно подставить вместо *or*.

      **sorry** родственно слову sore, «больной, ноющий». Сначала sorry значило «мне больно, мне жаль». Сегодня это и извинение, и вежливая просьба повторить.
  - number: 3
    body: |
      Просьба строится по уже знакомой схеме can:

      > [D7]Can[/] [T8]I[/] [D1]have[/] [S3]water[/], [O8]please[/]? — Можно мне воды?
      > [D7]Can[/] [T8]I[/] [D1]have[/] [T1]a[/] [S3]tea[/], [O8]please[/]? — Можно мне чай?

      - [C1]or[/] соединяет **альтернативы**: *coffee or tea?* — собеседник предлагает выбор.
      - [C1]and[/] соединяет то, что называют **вместе**: *coffee and tea* — оба напитка.
      - [O8]please[/] делает просьбу вежливее. В наших образцах оно стоит в конце после запятой, но не является единственно возможным положением слова.

      **Почему Can I have, а не просто Can I?** Здесь **can** выражает возможность или просьбу, а **have** называет нужное действие — получить напиток. Поэтому для заказа используем весь каркас *Can I have + напиток + please?*
  - number: 4
    body: |
      **Почему заказ похож на вопрос?** *Can I have…?* буквально спрашивает о возможности, а в кафе работает как **вежливая просьба**. Прямое *Give me…* без смягчения иногда может прозвучать резко, но оно **не всегда грубое**: важны интонация, близость людей и ситуация. Для начинающего надёжнее готовый каркас с *please*.

      Переспросить тоже лучше вопросом, а не словом «Что?»:

      > [O2]Sorry[/]? — Простите?
      > [D7]Can[/] [T8]you[/] [D5]say[/] [T8]it[/] [A2]again[/], [O8]please[/]? — Повторите, пожалуйста.

      Есть два способа сказать «хочу», и в кафе важно не перепутать:

      > [T8]I[/] [D3]want[/] [N1]one[/]! — Я тоже хочу! (Анна — Тому, среди своих)
      > [T8]I[/] [D7]would[/] [D3]like[/] [N1]one[/] [S3]coffee[/] [C1]and[/] [N1]one[/] [S3]tea[/], [O8]please[/]. — Мне кофе и чай, пожалуйста. (Том — бариста)

      - [D3]want[/] прямо выражает желание: *I want…*. Само слово **не грубое**, но короткий заказ без вежливых слов или подходящей интонации может звучать требовательно.
      - [D7]would[/] [D3]like[/] означает **«хотел(а) бы»**, мягкий и привычный вариант для заказа. **Would** здесь не делает просьбу прошедшим временем.
      - В живой речи **I'd like** — сокращение от **I would like**; апостроф и **'d** заменяют **would**. В других конструкциях *I'd* может сокращать *I had*, но после **like** в этом заказе подразумевается **would**.
      - Бариста тоже может спросить: [T9]What[/] [D7]would[/] [T8]you[/] [D3]like[/]? — Что будете?

      **Диагностика понимания:** Вы хотите попросить чай. Что верно: *Can I have a tea, please?* или *Can I a tea, please?*?

      **Разбор:** *Can I have a tea, please?* После **can** требуется слово действия **have** — «получить» в этой просьбе. **A tea** здесь означает одну порцию чая.
  - number: 5
    body: |
      Так звучит заказ в американском кафе:

      > [S3]Coffee[/] [C1]or[/] [S3]tea[/]? — Кофе или чай?
      > [A3]Here[/] [T8]you[/] [D1]are[/]. — Вот, пожалуйста.
      > [O2]Thank you[/]! — Спасибо!
      > [T8]You[/] [D1]are[/] [J3]welcome[/]. — Пожалуйста.

      - Подавая вещь, говорят Here you are. В этой фразе you are не сокращают.
      - На Thank you отвечают You are welcome. В быстрой речи — You're welcome.
  - number: 6
    body: |
      Русское «пожалуйста» по-английски бывает тремя разными фразами:

      - просьба — please: A tea, please;
      - подаёте вещь — Here you are;
      - ответ на «спасибо» — You are welcome.

      **Почему a tea, если чай нельзя посчитать как вещество?** В кафе **a coffee / a tea** — одна **порция** напитка. Поэтому *two coffees* — две порции, а *I like coffee* — кофе вообще. Это смена значения в зависимости от ситуации, а не превращение любого вещества в исчисляемый предмет.

      В меню американского кафе ещё есть [S3]juice[/] (сок) и [S3]sandwich[/] (сэндвич):

      > [T8]I[/] [D7]would[/] [D3]like[/] [T1]a[/] [S3]sandwich[/] [C1]and[/] [T1]an[/] [S3]apple[/] [S3]juice[/], [O8]please[/]. — Мне сэндвич и яблочный сок.
  - number: 7
    body: |
      Шесть заданий: узнать вежливую просьбу, выбрать «или», собрать заказ, ответить в новой ситуации, выбрать между want и would like и заказать по-своему.

      **Проверка маленького шага:** *I like coffee* — «Мне **нравится** кофе вообще». *I'd like a coffee, please* — «Я **хотел(а) бы заказать** одну порцию сейчас». Разница между **like** и **would like** — не просто степень вежливости: в этих фразах мы выражаем **предпочтение** или **просьбу**.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Вы не расслышали бариста. Что сказать?"
    options: ["Sorry? Can you say it again, please?", "No, it is not my cookie.", "Thank you!"]
    answer: "Sorry? Can you say it again, please?"
    hint_ru: "Нужна просьба повторить."
    explanation_ru: "Sorry? Can you say it again, please? — вежливая просьба повторить. Так вы сами управляете разговором."
    units: [LX-00084]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Бариста предлагает выбор из двух напитков. Вставьте слово «или»."
    prompt_en: "Coffee ___ tea?"
    answer: "or"
    hint_ru: "Выбирают одно из двух."
    explanation_ru: "or ставят между вариантами, из которых выбирают один."
    units: [LX-00058]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите просьбу: «Можно мне печенье, пожалуйста?»"
    options: [have, please, Can, a, cookie, I]
    answer: "Can I have a cookie please"
    hint_ru: "Начните с Can I."
    explanation_ru: "Can I have …, please? — вежливая просьба. Перед cookie нужен a."
    units: [LX-00056]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вам предлагают кофе или чай, а вы хотите чай. Ответьте коротко и вежливо."
    prompt_en: "Coffee or tea? — ___"
    answer: "Tea, please."
    accepted: ["A tea, please.", "One tea, please.", "Can I have a tea, please?", "Can I have tea, please?", "Tea, thanks.", "Tea, thank you.", "A tea, thanks."]
    hint_ru: "Назовите напиток и добавьте please."
    explanation_ru: "Достаточно назвать напиток и сказать please: Tea, please. Полная просьба Can I have a tea, please? тоже верна."
    units: [LX-00055, LX-00082]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: "Вы заказываете у бариста. Какая фраза звучит вежливо?"
    options: ["I would like a tea, please.", "I want tea.", "Tea!"]
    answer: "I would like a tea, please."
    hint_ru: "Нужна мягкая форма «я бы хотел»."
    explanation_ru: "I would like / I'd like — мягкий и надёжный способ заказать. I want tea грамматически верно, но без контекста и please может звучать прямолинейнее; Tea! без смягчения тоже зависит от интонации."
    units: [LX-00281, LX-00285]
  - order: 6
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: бариста спрашивает What would you like? Вы хотите сэндвич и сок. Ответьте вежливо."
    prompt_en: "What would you like? — ___"
    answer: "I would like a sandwich and a juice, please."
    accepted: ["I'd like a sandwich and a juice, please.", "I would like a sandwich and juice, please.", "I'd like a sandwich and juice, please.", "A sandwich and a juice, please.", "A sandwich and juice, please.", "Can I have a sandwich and a juice, please?", "Can I have a sandwich and juice, please?"]
    hint_ru: "Начните с I'd like…"
    explanation_ru: "I'd like = I would like («я бы хотел»). A sandwich — одна порция еды, a juice — одна порция сока. Можно сказать и короче: A sandwich and a juice, please."
    units: [LX-00282, LX-00283, LX-00284, LX-00285]
