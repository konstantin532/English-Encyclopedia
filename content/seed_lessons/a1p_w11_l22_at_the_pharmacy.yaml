sound_notes:
- text: I have a sore throat and a cough.
  ipa: /aɪ ˈhæv ə ˈsɔr ˈθroʊt ən ə ˈkɔf/
  note_ru: 'throat — межзубный th и r подряд: «сроут»'
- text: Do you have a fever?
  ipa: /də jə ˈhæv ə ˈfivɚ/
  note_ru: 'fever — долгое «ии»: «фИвэр»'
- text: Get well soon!
  ipa: /ˈɡɛt ˈwɛl ˈsun/
  note_ru: t в get почти не слышно перед w
