- full: I am
  short: I'm
  ipa: /aɪm/
  note_ru: I'm allergic to cats — у меня аллергия на кошек.
layers:
- number: 1
  body: 'В американской аптеке лекарство от простуды продают без рецепта, но вас всё равно спросят, что болит, есть ли температура и аллергия.


    > [O1]Hi[/]. [T8]I[/] [D1]have[/] [T1]a[/] [J4]sore[/] [S5]throat[/] [C1]and[/] [T1]a[/] [S5]cough[/]. [T8]I[/] [D2]slept[/] [A4]badly[/]. — Здравствуйте. У меня болит горло и кашель. Я плохо спала.

    > [O6]Oh no[/]. [D1]Do[/] [T8]you[/] [D1]have[/] [T1]a[/] [S5]fever[/]? — Ой. Температура есть?

    '
- number: 2
  body: '**Pharmacy** — от греческого *pharmakon*, «лекарство» (и «яд»!). **Flu** — сокращение от итальянского *influenza*, «влияние»: раньше думали, что болезнь приходит под влиянием звёзд. **Sore** — древнее слово «боль, рана»; от него и *sorry*: сожаление — «боль в душе».

    '
- number: 3
  body: 'Схема:


    > [D1]Are[/] [T8]you[/] [J4]allergic[/] [P2]to[/] [T4]any[/] [S5]medicine[/]? — У вас есть аллергия на лекарства?


    - Что у меня: **I have + a cough / a fever / a sore throat / the flu**.

    - Что болит: **My throat hurts. My head hurts.**

    - Аллергия: **I''m allergic to… / I have an allergy to…**

    - Самочувствие: **I feel dizzy. I feel better.**

    '
- number: 4
  body: '**Почему «I have a fever», а не «I have a temperature»?** Обе фразы понятны, но в США обычно говорят **fever**. *Temperature* — температура тела: *Let me check your temperature* — «Давайте измерим вам температуру». Выражение *have a temperature* тоже может означать повышенную температуру, особенно в британском английском; для американской речи в этом уроке выбираем **have a fever**.


    **Bless you!** — так говорят, когда кто-то чихнул. Отвечают: **Thank you!**


    **Диагностика понимания:** как сказать «у меня аллергия на мёд»: *I''m allergic on honey* или *I''m allergic to honey*?


    **Разбор:** *I''m allergic to honey.* — allergic **to**.

    '
- number: 5
  body: 'Так говорят американцы:


    > [A2]Then[/] [D2]put[/] [T1]the[/] [S5]pills[/] [J8]next[/] [P2]to[/] [T3]your[/] [S3]tea[/]! [D9]Get[/] [O7]well[/] [A2]soon[/]! — Тогда положите таблетки рядом с чаем! Выздоравливайте!


    - **Get well soon!** — поправляйся!

    - **I feel better.** — мне лучше.

    - **Bless you!** — будь здоров (когда чихают).


    Слова: **pharmacy** — аптека, **cough** — кашель, **fever** — жар, **flu** — грипп, **throat** — горло, **allergy** — аллергия, **prescription** — рецепт, **temperature** — температура, **cream** — крем, **bandage** — пластырь, **honey** — мёд, **sneeze** — чихать, **sore** — больной, **dizzy** — с головокружением.

    '
- number: 6
  body: 'Ловушки:


    - «recipe» — это рецепт блюда; от врача — **prescription**.

    - «allergic on» — **allergic to**.

    - «I have flu» — обычно **the flu**.

    - «I am sick on throat» — **I have a sore throat**.

    '
- number: 7
  body: 'Шесть заданий: назвать болезнь, сказать про аллергию, собрать фразу о горле, описать свою простуду, ответить на чих и пожелать выздоровления.


    **Проверка маленького шага:** I have a cough / a fever / a sore throat. I''m allergic to… Get well soon!

    '
