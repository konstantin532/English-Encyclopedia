layers:
  - number: 1
    body: |
      Посмотрите вокруг. У всего, что вы видите, есть название: книга, телефон, вода, мама, утро. Слово, которое называет человека, вещь, место, вещество или отрезок времени, называется **существительным**.

      Проверка простая: если про слово можно спросить «кто это?» или «что это?», перед вами существительное.

      > [S2]book[/] — книга
      > [S1]mother[/] — мама
      > [S7]morning[/] — утро

      Видите сплошную линию под словами? В English Encyclopedia она всегда означает существительное. Цвет линии подсказывает тему: красный — люди, оранжевый — дом и вещи, охра — еда, фиолетовый — время.
  - number: 2
    body: |
      Английское **noun** пришло через старофранцузский из латинского `nomen` — «имя». Буквально noun означает «имя предмета».

      Русское **существительное** — сокращение от «имя существительное». Это перевод латинского `nomen substantivum`, где `substantia` значит «сущность». То есть «имя того, что существует».

      Получается, оба языка называют эту часть речи одинаково: «имя». Поэтому в английском так и говорят: My **name** is Anna.
  - number: 3
    body: |
      Самая полезная фраза первого дня строится вокруг одного существительного:

      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]book[/].

      - [S2]book[/] — существительное, называет предмет. Главное слово фразы.
      - [T3]my[/] — «мой». Показывает, чей предмет. Это притяжательный детерминатив: он всегда стоит перед существительным.
      - [D1]is[/] — глагол «есть, является». В русском его пропускают («Это — книга»), в английском он обязателен.
      - [T2]This[/] — «это». Здесь this работает как указательное местоимение (pronoun): заменяет сам предмет.

      Поменяйте существительное, и получится новая фраза. Каркас остаётся прежним:

      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]mother[/].
      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]room[/].
      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]friend[/].
  - number: 4
    body: |
      В русском существительное может стоять в одиночку: «Это книга». В английском одиночное исчисляемое существительное звучит как ошибка. Перед ним почти всегда нужен маленький «указатель»: **a** (какой-то один), **my** (мой), **the** (тот самый).

      > [T2]This[/] [D1]is[/] [T1]a[/] [S2]book[/].

      Почему так? В русском окончания слов показывают роль слова: книга, книгу, книгой. В английском окончаний почти нет. Порядок слов и маленькие слова-указатели делают ту работу, которую в русском делают окончания.

      Запомните одно правило: **одна вещь, которую можно посчитать, не стоит одна**. Перед ней ставят a, my или the.
  - number: 5
    body: |
      В живой американской речи эти слова звучат в коротких готовых фразах. Их стоит запоминать целиком:

      > Good [S7]morning[/]!
      > [D1]Have[/] [T1]a[/] nice [S7]day[/]!
      > [T8]I[/][D1]'m[/] [S2]home[/]!
      > [S3]Water[/], please.

      - Have a nice day! — так прощаются кассир и бариста. Отвечают: Thanks, you too!
      - I'm home! — то, что кричат, войдя в дом. Предлог не нужен.
      - О маме и папе в разговоре говорят mom и dad. Mother и father звучат официальнее, как в анкете.
      - Квартира в США — apartment. House — отдельный дом.
  - number: 6
    body: |
      Есть вещества, которые нельзя посчитать по штукам: вода, кофе. Это **неисчисляемые** существительные. Перед ними a не ставят:

      > [T8]I[/] [D3]like[/] [S3]coffee[/].

      Тонкость кафе: a coffee там означает «чашка кофе». Это нормально, но только в заказе.

      **home** и **house** — оба «дом», но разные. House — здание. Home — место, где вы живёте и где вам хорошо. Поэтому говорят I'm home, а не I'm house.

      **family** в американском английском обычно согласуется в единственном числе: My family is big.
  - number: 7
    body: |
      Теперь ваша очередь. Задания идут по ступеням: сначала узнать существительное, потом подставить его в каркас, потом собрать фразу самостоятельно.

      Отвечайте сами: подсказка появится, только если вы её попросите.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Какое слово в этой фразе — существительное?"
    prompt_en: "I have a new phone."
    options: [I, have, new, phone]
    answer: phone
    hint_ru: "Задайте вопрос «что это?» к каждому слову."
    explanation_ru: "Phone называет предмет, поэтому это существительное. New описывает телефон (прилагательное), have — действие, I — местоимение."
    units: [LX-00009]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Вы представляете подругу: «Это моя подруга». Вставьте слово."
    prompt_en: "This is my ___."
    answer: friend
    hint_ru: "Одно слово и для «друга», и для «подруги»."
    explanation_ru: "Friend не различает пол. Перед ним стоит my, поэтому a не нужен."
    units: [LX-00004]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите фразу: «Меня зовут Анна»."
    options: [name, Anna, My, is]
    answer: My name is Anna
    hint_ru: "По-английски не «меня зовут», а «моё имя есть…»."
    explanation_ru: "Русское «меня зовут» по-английски строится через существительное name: My name is Anna. Глагол is обязателен."
    units: [LX-00015]
