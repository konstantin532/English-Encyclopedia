title: "Существительное: слово, которое называет"
summary: "Первые 15 слов о семье, доме, еде и времени и главное правило: в английском название почти никогда не стоит в одиночку."
units: [LX-00001, LX-00002, LX-00003, LX-00004, LX-00005, LX-00006, LX-00007, LX-00008, LX-00009, LX-00010, LX-00011, LX-00012, LX-00013, LX-00014, LX-00015]
