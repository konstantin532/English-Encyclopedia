title: "Существительное: слово, которое называет"
summary: "Первые слова о семье, доме, еде и времени: как узнать существительное в фразе, зачем рядом стоят a / my и почему перевод с русского устроен иначе."
units: [LX-00001, LX-00002, LX-00003, LX-00004, LX-00005, LX-00006, LX-00007, LX-00008, LX-00009, LX-00010, LX-00011, LX-00012, LX-00013, LX-00014, LX-00015]
sound_notes:
  - text: "I'm home."
    ipa: "/aɪm ˈhoʊm/"
    note_ru: "I am сливается в одно слово"
  - text: "Have a nice day!"
    ipa: "/hæv‿ə ˈnaɪs ˈdeɪ/"
    note_ru: "v прилипает к a, a звучит как короткое /ə/"
  - text: "water"
    ipa: "/ˈwɑt̬ɚ/"
    note_ru: "американское t между гласными звучит как быстрое d"
layers:
  - number: 1
    body: |
      Первое утро Анны в Америке. Вокруг коробки, а сосед Том уже стоит на пороге. Чтобы ответить ему, Анне хватит десятка слов, и почти все они — существительные: *house, coffee, morning, name*. С них начинается любой язык: сначала мы называем мир, потом говорим о нём.

      > [J3]Good[/] [S7]morning[/]! [T8]I[/] [D1]am[/] [S1]Tom[/]. [T9]What[/] [D1]is[/] [T3]your[/] [S9]name[/]? — Доброе утро! Я Том. Как вас зовут?

      Начнём не с правила, а со знакомых вещей: книга, телефон, мама, вода, утро. Слова, которые **называют** людей, предметы, вещества, места, время и даже идеи, называются **существительными**.

      > [S2]book[/] — книга
      > [S1]mother[/] — мама
      > [S7]morning[/] — утро

      **Как найти существительное?** Попробуйте спросить о слове «кто?» или «что?»: «кто?» — мама, «что?» — книга. Это первая подсказка, а не правило без исключений: важно, какую работу слово выполняет в конкретной фразе.

      **Зачем цветная линия?** Одна сплошная линия **снизу** означает существительное. Цвет уточняет его смысловую группу: люди, предметы, еда, время. Линия показывает роль слова в нашем учебном разборе, а не меняет правила английского.
  - number: 2
    body: |
      **Почему book, name и Anna — существительные?** *Book* называет предмет, *name* — то, что есть у человека, а *Anna* — конкретного человека. Существительное не обязательно обозначает вещь, которую можно потрогать.

      **Обычное название и имя человека — не одно и то же.** *Friend* означает «друг или подруга» вообще; *Anna* называет определённого человека. Оба слова — существительные, но **Anna** пишется с заглавной буквы, потому что это имя человека.

      Сравните работу двух слов в *my new book*: **book** называет предмет, а **new** сообщает, какой он. Не судите только по вопросу «что?»: смотрите, что слово делает во фразе.
  - number: 3
    body: |
      Рассмотрим одно короткое предложение и разберём **каждое** слово:

      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]book[/]. — Это моя книга.

      - [T2]This[/] — «это»: мы показываем на предмет. Здесь слово стоит **самостоятельно**, без существительного сразу после него.
      - [D1]is[/] — слово, которое соединяет «это» с описанием предмета. В русском «Это моя книга» обычно обходится без отдельного «есть». Подробно разберём is в следующем уроке.
      - [T3]my[/] — «мой / моя / моё»: показывает принадлежность. В английском **my не меняется** из-за того, как по-русски называется вещь.
      - [S2]book[/] — «книга»: существительное, то есть название предмета.

      **Зачем слово-указатель?** Оно помогает понять, **о каком** предмете речь: *my* показывает, чья это вещь, а *a* помогает назвать одну вещь без уточнения, чья она. Другие слова-указатели разберём во второй неделе.

      Сравните две конструкции — у них разная работа слова **this**:

      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]book[/]. — Это моя книга.
      > [T2]This[/] [S2]book[/] [D1]is[/] [J2]new[/]. — Эта книга новая.

      В первой строке **this** означает «это»: мы показываем на вещь. Во второй **this** стоит **перед book** и означает «эта»: мы уточняем, какую книгу имеем в виду.

      **Как добавить вторую мысль о книге?** Назовём предмет, а затем заменим повторное слово *book* на **it** — «она» в русском переводе, но **it** в английской фразе:

      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]book[/]. [T8]It[/] [D1]is[/] [J2]new[/]. — Это моя книга. Она новая.

      Так вы уже видели образец для четвёртого задания. Использование **it** разберём подробнее в следующем уроке.

      Заменяем только последнее существительное — и сохраняем смысл каркаса:

      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]mother[/]. — Это моя мама.
      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]room[/]. — Это моя комната.
      > [T2]This[/] [D1]is[/] [T3]my[/] [S1]friend[/]. — Это мой друг.
  - number: 4
    body: |
      **Почему перед book бывает a, а иногда my?** Посмотрите:

      > [T2]This[/] [D1]is[/] [T1]a[/] [S2]book[/]. — Это книга.
      > [T2]This[/] [D1]is[/] [T3]my[/] [S2]book[/]. — Это моя книга.

      В первом случае **a** помогает представить одну книгу без уточнения, чья она. Во втором **my** уже объясняет, что книга моя. Сказать *a my book* нельзя: эти два указателя не ставят вместе перед одним существительным.

      **Книги можно посчитать по одной штуке:** одна книга, две книги. Когда называем одну книгу, перед **book** нужно слово-указатель: *a book* или *my book*. Поэтому *This is book* — ошибка: скажите *This is a book*. Если хотите сказать, что книга ваша, используйте *This is my book*. С именами людей (*Anna*) и словами *water* и *coffee* так не делают — их разберём ниже.

      **Почему русскому переводу не нужен a?** По-русски можно сказать «Это книга» без отдельного слова перед «книга». В английском здесь нужно **a**. Если говорим «Это моя книга», место перед **book** уже занимает **my**.

      Ещё один указатель — **the**, когда предмет уже известен собеседникам. Здесь достаточно заметить разницу между *a* и *my*; выбор *a / the* подробно объясняется в третьем уроке.

      **Проверьте себя:** Вы хотите сказать «Это моя книга». Что верно: *This is my book* или *This is a my book*?

      **Разбор:** *This is my book*. **My** уже указывает, чья книга. Дополнительное **a** перед ним не требуется. Это правило о сочетании этих слов-указателей, а не о том, что перед всяким существительным обязательно есть *my*.
  - number: 5
    body: |
      В живой американской речи полезно сначала услышать и запомнить несколько **готовых фраз**. Не обязательно уже уметь объяснить грамматику каждого слова:

      > [J3]Good[/] [S7]morning[/]! — Доброе утро!
      > [D1]Have[/] [T1]a[/] [J3]nice[/] [S7]day[/]! — Хорошего дня!
      > [T8]I[/][D1]'m[/] [S2]home[/]! — Я дома!
      > [S3]Water[/], please. — Воды, пожалуйста.

      - *Have a nice day!* произносят при прощании. Здесь **have** входит в пожелание, а не буквально означает «владей днём». Можно ответить таким же пожеланием.
      - *I'm home!* часто говорят, когда вернулись домой. Здесь не нужно вставлять *at*: сочетание *at home* разберём в следующем уроке.
      - В разговоре о родителях часто используют **mom** и **dad**; **mother** и **father** тоже правильны, но нередко звучат нейтральнее или официальнее в зависимости от ситуации.
      - **House** обычно означает отдельный дом как здание, **apartment** — квартиру. Значение **home** разберём ниже.

      **Не путайте:** готовые реплики вроде *Water, please* — нормальная разговорная просьба, хотя это не полная фраза.
  - number: 6
    body: |
      **Почему a book, но coffee без a?** Книги можно посчитать по одной: одна книга, две книги. Воду и кофе как вещество обычно не считают по штукам. Поэтому:

      > [T8]I[/] [D3]like[/] [S3]coffee[/]. — Я люблю кофе.

      Здесь **coffee** — кофе как напиток вообще: его не считают по одной штуке, поэтому **a** не нужно. О порции кофе можно узнать в закрытом блоке ниже.

      **Home или house?** **House** — здание, **home** — место, где человек живёт и которое считает своим домом. В доме-квартире тоже может быть **home**. Поэтому в готовой фразе говорят *I'm home*, а не *I'm house*.

      **А почему нет is в I like coffee?** Потому что **like** уже означает «люблю». **Is** не надо вставлять в каждую английскую фразу: оно нужно не всегда. Разберём это в следующем уроке.

      **Для любопытных:** **Откуда слово noun?** Это английское название существительного; исторически оно связано с латинским *nomen* — «имя, название». **Одна порция кофе.** *A coffee* возможно, когда речь об **одной порции кофе**, например в кафе. Это не отдельное правило только для заказа: смысл слова зависит от ситуации. **Одна семья.** В *My family is big* слово **family** означает одну семью как группу, поэтому рядом стоит **is**. Пока достаточно узнавать слово **family**.
  - number: 7
    body: |
      Теперь четыре задания: сначала найдите существительное, затем подставьте слово, соберите знакомую фразу и используйте её в новой ситуации.

      **Как себя проверять:** не только выбирайте ответ, но и спрашивайте себя «какое слово называет предмет?» и «почему здесь my, а не a?». Если пока неясно — вернитесь к короткому сравнению выше. Подсказку можно открыть после попытки.

      **Проверка маленького шага:** В *This is my room* слово *room* **называет** место, а *my* лишь указывает, кому оно принадлежит. Если убрать *room*, изменится не только длина фразы, но и её смысл. Поэтому не называйте каждое слово перед существительным существительным.
exercises:
  - order: 1
    uid: EX-00001
    kind: choice
    stage: recognition
    prompt_ru: "Какое слово в этой фразе — существительное?"
    prompt_en: "This is my new phone."
    options: [This, is, new, phone]
    answer: phone
    hint_ru: "Ищите название предмета. This указывает на предмет, new описывает его, а какое слово называет сам предмет?"
    explanation_ru: "Phone называет предмет, поэтому это существительное. New описывает, какой телефон; is связывает части фразы, This указывает на предмет."
    units: [LX-00009]
  - order: 2
    uid: EX-00002
    kind: fill
    stage: substitution
    prompt_ru: "Вы представляете подругу: «Это моя подруга». Вставьте слово."
    prompt_en: "This is my ___."
    answer: friend
    hint_ru: "Одно слово и для «друга», и для «подруги»."
    explanation_ru: "Friend не различает пол. Перед ним стоит my, поэтому a не нужен."
    units: [LX-00004]
  - order: 3
    uid: EX-00003
    kind: build
    stage: production
    prompt_ru: "Соберите фразу: «Меня зовут Анна»."
    options: [name, Anna, My, is]
    answer: My name is Anna
    hint_ru: "Сначала My name («моё имя»), затем is и имя человека."
    explanation_ru: "My — «моё», name — «имя», is связывает их с Anna. Готовая фраза My name is Anna означает «Меня зовут Анна», хотя дословный порядок другой."
    units: [LX-00015]
  - order: 4
    uid: EX-00004
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вы показываете гостю свою книгу и говорите, что она новая. Можно ответить одной или двумя короткими фразами."
    prompt_en: "___"
    answer: "This is my book. It is new."
    accepted: ["This is my book. It's new.", "This is my book. It is new", "This is my new book.", "This is my book and it is new.", "This is my book and it's new.", "It is my new book.", "It's my new book."]
    hint_ru: "Сначала This is my…, потом It is…"
    explanation_ru: "This is my book. It is new. Сначала назвали книгу, потом сказали о её свойстве. Можно объединить: This is my new book — указатель my стоит перед new book."
    units: [LX-00008, LX-00027]
