layers:
- number: 1
  body: 'Шестнадцать недель позади. Последняя сцена A1+ — снова парк, снова скамейка, и в одной короткой сцене звучит почти вся грамматика уровня.


    > [J3]Great[/]! [T8]I[/] [D2]made[/] [T1]the[/] [S3]sandwiches[/]. [C1]And[/] [T8]I[/] [D1]did[/] [X1]not[/] [D6]forget[/] [T9]anything[/]! — Отлично! Я сделал бутерброды. И ничего не забыл!

    > [T8]It[/] [D1]is[/] [N3]ten[/] [N3]o''clock[/]. [C4]If[/] [S1]Sam[/] [D4]comes[/], [T8]we[/] [D7]will[/] [D6]see[/] [T8]him[/] [P1]by[/] [T1]the[/] [J2]old[/] [S4]bench[/]. — Десять часов. Если Сэм придёт, мы увидим его у старой скамейки.

    '
- number: 2
  body: 'На A1 вы говорили о том, что есть сейчас. A1+ добавил три измерения: **прошлое** (was, did, -ed), **обязанность** (must, have to) и **условие с будущим** (if…, will). Плюс вежливость (could you…?) и оттенки (some / any, quietly, too / enough). С этим набором можно рассказать историю своей жизни и договориться о завтрашнем дне.

    '
- number: 3
  body: 'Карта уровня:


    > [T8]I[/] [D4]came[/] [A5]too[/]. [T8]I[/] [D6]knew[/] [S1]Sam[/] [T1]a[/] [J1]long[/] [S7]time[/] [A2]ago[/]. [T8]He[/] [D1]was[/] [T1]a[/] [J4]quiet[/] [S1]boy[/]. — Я тоже пришла. Я знала Сэма давным-давно. Он был тихим мальчиком.


    - Сейчас: **I''m walking** (недели 1).

    - Прошлое: **was / were** (2), **-ed** (3), **went, bought** (4), **did / didn''t** (5, 13).

    - Кому: **me, him, her, them** (6).

    - Количество: **some / any** (7).

    - Правила: **must / mustn''t** (8), **have to / don''t have to** (9).

    - Просьба: **Could you…?**, как: **slowly** (10).

    - Как часто: **twice a day** (11). Слишком: **too / enough** (12).

    - Дорога: **across, past** (14). Будущее: **if…, will** (15).

    '
- number: 4
  body: '**Как проверить себя?** Попробуйте пересказать пикник от лица Рут: *I came to the park. I knew Sam…* А потом скажите, что будет завтра: *If Sam tells us about Rose, we will…*


    > [S1]Ruth[/], [D7]could[/] [T8]you[/] [D2]sit[/] [P1]in[/] [T1]the[/] [S6]shade[/]? [T8]It[/] [D1]is[/] [A5]very[/] [J2]hot[/] [A2]today[/]. — Рут, может, сядете в тень? Сегодня очень жарко.


    **Диагностика понимания:** где ошибка? *If Sam will come, we see him.*


    **Разбор:** *If Sam comes, we will see him.* После if — настоящее, will — во второй части.

    '
- number: 5
  body: 'Так говорят американцы:


    > [S1]Tom[/], [C4]if[/] [T8]it[/] [D1]is[/] [S1]Sam[/], [T8]he[/] [D7]will[/] [D5]tell[/] [T8]us[/] [A6]about[/] [S1]Rose[/]. [S7]Time[/] [D4]flies[/]. [N1]Sixty[/] [S7]years[/]! — Том, если это Сэм, он расскажет нам о Роуз. Как летит время. Шестьдесят лет!


    - **Time flies!** — время летит!

    - **Thanks for everything!** — спасибо за всё!

    - **See you soon!** — до скорого!


    Из истории 11: **picnic** — пикник, **bench** — скамейка, **hope** — надеяться.

    '
- number: 6
  body: 'Самые частые ошибки уровня:


    - «I didn''t went» — **I didn''t go**.

    - «He have to» — **He has to**.

    - «If it will rain» — **If it rains**.

    - «We don''t have some» — **We don''t have any**.

    - «Play quiet» — **Play quietly**.

    '
- number: 7
  body: 'Шесть заданий — по одному на каждую большую тему: прошлое, отрицание, правило, просьба, условие и наречие.


    **Проверка маленького шага:** вы умеете рассказать о прошлом, о правилах и о планах с if. Это и есть A1+.

    '
