  stage: recognition
  prompt_ru: 'Рут говорит: «Да, она мне звонила». Выберите фразу.'
  options:
  - Yes, she called me.
  - Yes, she called I.
  - Yes, her called me.
  answer: Yes, she called me.
  hint_ru: Кто — she, кому — me.
  explanation_ru: She called me. Перед глаголом she, после — me.
