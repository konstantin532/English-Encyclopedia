layers:
- number: 1
  body: 'Анна и Том пришли к Рут за телефоном. Чтобы не повторять «Рут, Рут, Рут», англичане, как и мы, заменяют имена: «она мне звонила», «расскажите нам о ней».


    > [O4]Yes[/], [T8]she[/] [D5]called[/] [T8]me[/]. [D4]Come[/] [P1]in[/]! [A3]Here[/] [T8]it[/] [D1]is[/]. — Да, она мне звонила. Заходите! Вот он.

    > [S1]Ruth[/], [P3]on[/] [T1]the[/] [S2]phone[/] [T8]you[/] [D6]knew[/] [T3]our[/] [S2]house[/]. [C1]And[/] [T8]you[/] [D6]knew[/] [S1]Rose[/]. [D5]Tell[/] [T8]us[/] [A6]about[/] [T3]her[/], [O8]please[/]. — Рут, по телефону вы узнали наш дом. И вы знали Роуз. Расскажите нам о ней, пожалуйста.

    '
- number: 2
  body: 'В русском у «я» много форм: меня, мне, мной. В английском осталась одна «косвенная» форма на всё: **me**. Когда-то и в английском были падежи, но почти все исчезли — остались только у местоимений: **I → me, he → him, she → her, we → us, they → them**. У **you** и **it** форма не меняется.

    '
- number: 3
  body: 'Схема:


    > [T8]I[/] [D7]can[/] [D2]show[/] [T8]it[/] [P2]to[/] [T8]you[/] [P3]on[/] [S7]Sunday[/]. — Я могу показать его вам в воскресенье.


    - Кто делает — **I, he, she, we, they** — перед глаголом.

    - Кого / кому — **me, him, her, us, them** — после глагола: She called **me**.

    - После предлога — тоже они: about **her**, to **you**, with **us**.

    - **her** бывает двух видов: «её» (her phone) и «ей / её» после глагола (I miss **her**).

    '
- number: 4
  body: '**Почему «She called me», а не «She called I»?** По-английски место слова решает всё: перед глаголом — тот, кто делает, после глагола — тот, с кем это делают. Поэтому **I** и **me** не меняются местами.


    > [T8]I[/] [D1]was[/] [J4]nervous[/]. [T8]I[/] [D1]am[/] [J2]old[/], [C1]and[/] [S1]Rose[/] [D1]was[/] [T3]my[/] [S1]friend[/]. [T8]I[/] [D3]miss[/] [T3]her[/]. — Я разволновалась. Я старая, а Роуз была моей подругой. Я по ней скучаю.


    **Диагностика понимания:** что верно: *Tell we about her* или *Tell us about her*?


    **Разбор:** *Tell us…* — после глагола нужно **us**.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Tell me about it.** — расскажи об этом.

    - **It''s a long story.** — долго рассказывать.

    - **Call me back.** — перезвони мне.

    - **Guess what!** — представляешь!


    Глаголы с «кому»: **tell** (told) — рассказать кому-то, **show** — показать кому-то, **return** — вернуть. Story 7: **lose — lost**, **find — found**, **then** — потом, **ago** — тому назад, **so** — поэтому.

    '
- number: 6
  body: 'Ловушки:


    - «Say me» — с «кому» нужен **tell**: Tell me.

    - «Me and Anna went» — в начале говорят **Anna and I went**.

    - «I miss she» — после глагола **her**.

    - «I can show to you it» — порядок: **show it to you**.

    '
- number: 7
  body: 'Шесть заданий: выбрать me / us, заменить имя, собрать фразу show it to you, рассказать о помощи друга, выбрать tell или say и сказать «перезвони мне».


    **Проверка маленького шага:** перед глаголом — I, he, she; после глагола и предлога — me, him, her, us, them.

    '
