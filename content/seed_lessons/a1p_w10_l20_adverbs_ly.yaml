layers:
- number: 1
  body: 'Лео просит играть **тихо**, а сам **плохо** спал. Тому разрешают играть **громко** вечером. Все эти слова отвечают на вопрос «как?» — это наречия.


    > [O2]Thank[/] [T8]you[/]. [T1]The[/] [S10]music[/] [D2]woke[/] [T8]me[/] [X3]up[/], [C1]and[/] [T8]I[/] [D2]slept[/] [A4]badly[/]. — Спасибо. Музыка меня разбудила, и я плохо спал.

    '
- number: 2
  body: '**-ly** — потомок древнеанглийского *-lice*, «подобно, в виде»: *quietly* — буквально «тихо-подобно». Тот же корень, что в слове *like*. Поэтому по-английски наречие почти всегда легко узнать по концу -ly.

    '
- number: 3
  body: 'Схема:


    > [T4]Any[/] [S7]time[/]. [T8]You[/] [D7]can[/] [D2]play[/] [A4]loudly[/] [P1]in[/] [T1]the[/] [S7]evening[/]. [T8]I[/] [D1]am[/] [P3]at[/] [D2]work[/] [A2]then[/]! — Обращайтесь. Вечером можешь играть громко. Я тогда на работе!


    - Какой? — прилагательное: **a quiet street, a loud TV**.

    - Как? — наречие: **play quietly, speak loudly**.

    - Образование: **quiet → quietly, bad → badly, slow → slowly, careful → carefully**.

    - y → i: **easy → easily**.

    - Исключения: **good → well** (хорошо), **fast → fast** (быстро).

    '
- number: 4
  body: '**Где стоит наречие?** Обычно после глагола или после того, что делают: *play **quietly***, *carry the box **carefully***. Не между глаголом и тем, что с ним делают: не *carry carefully the box*.


    **Почему «Sleep well», а не «Sleep good»?** Good — какой? *a good sleep*. Как? — **well**: *Sleep well! She speaks English well.*


    **Диагностика понимания:** что верно: *He speaks slow* или *He speaks slowly*?


    **Разбор:** *He speaks slowly.* Как говорит? — наречие на -ly.

    '
- number: 5
  body: 'Так говорят американцы:


    > [J4]Sure[/]. [T8]I[/] [D7]can[/] [D1]do[/] [T8]it[/] [A4]easily[/]. — Конечно. Мне это легко.


    - **Sorry about the noise.** — простите за шум.

    - **Sleep well!** — выспитесь!

    - В разговоре иногда слышно *Drive safe!* без -ly — это разговорная вольность, писать лучше **safely**.


    Слова: **loudly, slowly, carefully, badly, easily**; **wake — woke** — будить, **noise** — шум, **noisy** — шумный, **drum** — барабан, **plant** — растение, **pet** — домашнее животное, **bell** — звонок, **sleepy** — сонный, **during** — во время. Из истории 9: **quietly, quickly, down, bad**.

    '
- number: 6
  body: 'Ловушки:


    - «play quiet» — как? нужно **quietly**.

    - «sleep good» — **sleep well**.

    - «fastly» — такого слова нет: **fast**.

    - «carry carefully the box» — **carry the box carefully**.

    '
- number: 7
  body: 'Шесть заданий: выбрать прилагательное или наречие, образовать -ly, поставить наречие на место, описать, как вы делаете что-то, выбрать well и пожелать спокойной ночи.


    **Проверка маленького шага:** какой? — quiet; как? — quietly. Good → well, fast → fast.

    '
