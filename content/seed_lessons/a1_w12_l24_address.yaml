layers:
  - number: 1
    body: |
      Анна отправляет письмо маме в Россию. А вам в США понадобится и другой навык — записать местный адрес, например для заказа. Разберём обычный адрес США и ZIP code; адрес мамы в России нужно записывать по требованиям страны назначения, без американского штата и ZIP code.

      На почте нужны три вещи: письмо, адрес и марка.

      > [O4]Yes[/], [O8]please[/]. [T8]I[/] [D1]have[/] [T1]a[/] [S9]letter[/] [P5]for[/] [T3]my[/] [S1]mother[/] [P1]in[/] [S4]Russia[/]. — Да, пожалуйста. У меня письмо для мамы в России.
      > [T9]What[/][D1]'s[/] [T1]the[/] [S9]address[/]? — Какой адрес?

      Дальше посмотрим на **типичный почтовый адрес США**. Он может отличаться от привычного русского порядка записи, но не существует одного универсального русского формата, который всегда «перевёрнут» относительно американского.
  - number: 2
    body: |
      На почте слова связаны с разными предметами и действиями:

      **A letter for my mother** — письмо для мамы. **An envelope** — конверт: в него кладут письмо. **A stamp** — марка: её помещают на конверт. **The address** — адрес: он сообщает, куда нужно доставить письмо.

      Не смешивайте адрес и получателя. **Who is it for? — For my mother.** — Для кого? — Для мамы. **What is the address?** — Какой адрес? В ответе нужны данные для доставки, а не только слово mother.

      У **letter** есть и другое знакомое значение — «буква»: **A, B, C — letters**. В сочетании **a letter for my mother** речь о письме, а не об одной букве для мамы. Смысл выбираем по ситуации.

      Дальше разберём формат адреса США. Это образец оформления почты, а не правило для адресов всех стран.
  - number: 3
    body: |
      В распространённом формате **почтового адреса США** сведения группируют так (обратите внимание: это формат записи для почты, а не грамматика предложения):

      - имя получателя;
      - номер дома и улица: 5 Park Street;
      - город, двухбуквенное сокращение штата, индекс **ZIP code**: Springfield, IL 62701 (условный пример оформления);
      - при международной отправке — название страны назначения отдельной последней строкой.

      На **обычных уличных адресах США** номер здания обычно стоит **перед названием улицы**: *5 Park Street*. Для специальных типов адресов (например, почтовых ящиков) формат может отличаться. В разных странах порядок записи тоже различается, поэтому сверяйте адрес с официальным образцом получателя.
  - number: 4
    body: |
      Для обычного адреса улицы в США сначала пишут номер дома и название улицы; номер квартиры, если нужен, добавляют в строку адреса (APT). На следующей строке — город, штат и ZIP code. Это формат почтового адреса, а не правило порядка слов в любом английском предложении. Сравните готовый пример улицы: «five Park Street».

      > [O7]Hmm[/]… [D1]do[/] [T8]you[/] [D1]have[/] [S9]letters[/] [P5]for[/] [T3]our[/] [S2]house[/]? [T3]Our[/] [S2]mailbox[/] [D1]is[/] [J2]old[/]. — Хм… а для нашего дома есть письма? У нас старый почтовый ящик.

      Почтовый ящик у дома — mailbox. Синие ящики на улице — тоже mailbox: туда бросают письма.

      **Диагностика понимания:** Вы заполняете **американский конверт**. Как обычно записать адрес: *5 Park Street* или *Park Street, 5*?

      **Разбор:** *5 Park Street* — привычный формат обычного уличного адреса США: номер здания перед улицей. **Вслух** тот же адрес произносят *five Park Street*. Для специальных типов адреса есть другие форматы, поэтому слово «всегда» не нужно.
  - number: 5
    body: |
      Так может звучать **учебная сцена на американской почте**:

      > [A3]Here[/][D1]'s[/] [T1]a[/] [S2]stamp[/]. [T8]It[/][D1]'s[/] [N6]two dollars[/]. — Вот марка. Два доллара.

      Two dollars — цена в учебной сцене, а не текущий почтовый тариф. Стоимость реального отправления уточняют отдельно.

      - Государственная почтовая служба США называется **USPS**. Для работника, разносящего почту, нейтральное название — **mail carrier**; слово *mailman* также встречается.
      - mail — это сама почта: письма, которые приходят. Is there mail for me? — Мне есть почта?
      - *St.* часто сокращает **Street** в адресах, но в реальных почтовых формах важнее ориентироваться на **официальное написание**; существуют и другие типы улиц, например *Road*.

      Слова для бланка и адреса:

      - **city** — город; **town** — обычно небольшой город; **country** — страна; **state** — штат США;
      - **street** — улица; **road** — дорога; **apartment** — квартира; **ZIP code** — почтовый индекс в США;
      - **form** — бланк; **first name** — имя, **last name** — фамилия;
      - **letter** — письмо, **postcard** — открытка, **envelope** — конверт, **package** — посылка; **mail** — почта в целом;
      - **paper** — бумага: I have paper, без a; **line** — очередь; **wait** — ждать;
      - **large** — большой по размеру; **heavy** — тяжёлый; **light** — лёгкий по весу; **correct** — правильный.

      > [D9]Fill out[/] [T1]the[/] [S9]form[/], [O8]please[/]. — Заполните анкету, пожалуйста.
      > [D2]Sign[/] [T1]the[/] [S9]form[/], [O8]please[/]. — Подпишите бланк, пожалуйста.
      > [T3]My[/] [S9]last name[/] [D1]is[/] [S1]Belova[/]. — Моя фамилия — Белова.
      > [T1]The[/] [S9]address[/] [D1]is[/] [J3]correct[/]. — Адрес правильный.

      **Fill out** — распространённый американский вариант для анкеты. Fill out просит заполнить поля, sign — поставить подпись. Это разные действия; следуйте указаниям конкретного бланка. Не путайте квартиру (apartment), город (city), штат (state) и страну (country).
  - number: 6
    body: |
      Ловушки:

      - **letter** — и «письмо», и «буква»: *A, B, C* — **letters**; *a letter for my mother* — письмо для мамы.
      - **post office** — почтовое отделение, а **mail** — почта / корреспонденция. «Почта пришла» — *The mail is here*.
      - На конверте достаточно **5 Park Street**. В полной фразе нужны другие образцы: **I live on Park Street** — называем улицу; **I live at 5 Park Street** — точный адрес. Не переносите короткую запись с конверта в полный ответ.
  - number: 7
    body: |
      Шесть заданий: понять вопрос на почте, вставить слово, собрать адрес по-американски, ответить почтальону в новой ситуации, распознать строку города/штата/индекса и назвать фамилию в анкете.

      **Проверка маленького шага:** Адрес обычно **пишут** как *5 Park Street*, с номером здания **цифрой**. Вслух его **читают** *five Park Street*. А фраза *I live on Park Street* сообщает **на какой улице**, но **не содержит полного адреса**. Различайте написание для конверта и произнесение вслух.
