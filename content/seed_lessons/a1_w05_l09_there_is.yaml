contractions:
  - full: "there is"
    short: "there's"
    ipa: "/ðɛrz/"
    note_ru: "В разговоре часто **there's**: *There's no cat food*. Полная форма **there is** тоже естественна, особенно при выделении слова."
  - full: "is not"
    short: "isn't"
    ipa: "/ˈɪzənt/"
    note_ru: "There isn't… — «нет, не имеется». Другой способ выразить отсутствие — There's no…"
layers:
  - number: 1
    body: |
      Утро, пустой холодильник, кот Box ждёт завтрак. В магазине у дома Анне нужно спросить: молоко есть? А корм? Одна конструкция — **there is** — поможет спросить, есть ли нужный товар.

      По-русски мы говорим «Молоко есть?», «Есть яблоки». По-английски для этого есть готовый оборот **there is / there are**.

      > [D1]Is[/] [T9]there[/] [S3]milk[/]? — Молоко есть?
      > [O4]Yes[/], [T9]there[/] [D1]is[/]. — Да, есть.
      > [T9]There[/] [D1]are[/] [S3]apples[/]. — Есть яблоки.

      **Не путайте два способа сказать «есть».** *I have a book* — «У меня есть книга»: здесь называем **того, у кого есть книга**, поэтому используем *have*. *There is a book* — «Есть книга»: мы сообщаем **о наличии**, не называя владельца. Этот оборот пригодится в магазине, доме и городе. Продавца можно спросить и *Do you have milk?* — «У вас есть молоко?»: в магазине **have** тоже помогает узнать о наличии товара.
  - number: 2
    body: |
      **There is milk.** — «Есть молоко»: сообщаем о наличии. Здесь **there** отдельно не переводим — весь оборот **there is** помогает сказать «есть, имеется».

      **The milk is there.** — «Молоко там»: говорим, где находится молоко. Здесь **there** означает **«там»**.

      **Some** позволяет не называть точное количество: *some apples* — яблоки без уточнения числа; *some milk* — молоко без уточнения объёма. Это не обязательно маленькое количество.
  - number: 3
    body: |
      **Как выбрать is или are?** Смотрите, **что имеется в наличии**: одна вещь или напиток / еда вообще — обычно **there is**; несколько отдельных вещей — **there are**. Само слово **there** не подсказывает количество. Сравните:

      > [T9]There[/] [D1]is[/] [T1]a[/] [S4]store[/] [A3]here[/]. — Здесь есть магазин.
      > [T9]There[/] [D1]are[/] [N1]six[/] [S3]eggs[/]. — Есть шесть яиц.

      - Одна вещь или то, что не считают штуками (milk, water), — **there is**.
      - Несколько вещей — **there are**.
      - В вопросе be встаёт вперёд: Is there…? Are there…?
      - Нет вещи или вещества — **there is no**: *There is no cat food*. Нет нескольких вещей — **there are no**: *There are no apples*. После **no** не добавляем **a**.
      - Вопрос о нескольких предметах: *Are there apples?* Коротко отвечаем *Yes, there are* / *No, there are not*. Форма **are** сохраняется и в ответе.
  - number: 4
    body: |
      **Почему не Milk is?** *Milk is…* начинает сообщение **о молоке** и требует продолжения: какое оно или где находится. А чтобы спросить **«Молоко вообще есть?»**, скажите *Is there milk?* Здесь **there** помогает спросить именно о наличии. Короткие разговорные ответы могут быть устроены проще — сейчас тренируем этот полный вопрос.

      **Some** означает **неопределённое количество**, когда точное число неважно: *some apples* — некоторое количество яблок; *some milk* — некоторое количество молока. В вопросе-просьбе *Can I have some…?* оно естественно, потому что говорящий рассчитывает получить товар. Но **some** само по себе не делает любую фразу вежливой — вежливость здесь создаёт весь вопрос с **can** и **please**:

      > [D7]Can[/] [T8]I[/] [D1]have[/] [T4]some[/] [S3]apples[/], [O8]please[/]? — Можно мне яблок, пожалуйста?

      Если количество важно (например, две штуки), лучше назвать число. Если нет — **some** позволяет не уточнять его сразу.

      **Диагностика понимания:** В магазине **несколько яблок**. Что верно: *There are apples* или *There is apples*?

      **Разбор:** *There are apples*. Форма **are** относится к **apples** (несколько предметов). Для одного яблока было бы *There is an apple*. **There** здесь не означает конкретное «там».
  - number: 5
    body: |
      Так звучит разговор в американском магазине у дома:

      > [D7]Can[/] [T8]I[/] [D2]help[/] [T8]you[/]? — Чем могу помочь?
      > [O4]Yes[/], [O8]please[/]. [D1]Is[/] [T9]there[/] [S6]cat[/] [S3]food[/]? — Да, пожалуйста. Корм для кошек есть?
      > [O2]Sorry[/], [T9]there[/] [D1]is[/] [T4]no[/] [S6]cat[/] [S3]food[/]. — Извините, корма для кошек нет.

      - Продавцы часто встречают покупателя фразой Can I help you?
      - В быстрой речи there is звучит как there's: Sorry, there's no cat food.
      - В коротком ответе сокращения нет: Yes, there is.
  - number: 6
    body: |
      **there** «там» и there в обороте «есть» звучат одинаково, но работают по-разному:

      - There is milk. — Есть молоко. (there не переводят)
      - The milk is there. — Молоко там. (there — «там»)

      **Для любопытных:** В *some milk, some water, some food* говорим о молоке, воде и еде вообще и обычно выбираем **there is**. В кафе *a milk* иногда может означать **порцию молока**, а **foods** — **виды еды**. Не превращайте учебный образец в правило «у этих слов никогда не бывает -s». Сейчас используем только основной смысл: напиток или еда вообще.

      **Какой предмет?** В *red apple / red apples* слово **red** стоит перед названием и остаётся одинаковым: одно яблоко или несколько. Здесь описываем цвет; способы сравнить вещи разберём позже.

      > [D7]Can[/] [T8]I[/] [D1]have[/] [T4]some[/] [J2]red[/] [S3]apples[/], [O8]please[/]? — Можно мне красных яблок?
      > [J2]Red[/] [C1]or[/] [J2]green[/]? — Красные или зелёные?

      - [J2]red[/] [J2]green[/] [J2]yellow[/] [J2]orange[/] [J2]blue[/] [J2]black[/] [J2]brown[/]
      - [J2]hot[/] [S3]tea[/] — горячий чай, [J2]cold[/] [S3]milk[/] — холодное молоко
      - Ещё продукты: [S3]bread[/] (хлеб), [S3]cheese[/] (сыр), [S3]banana[/] (банан)

      По-русски «красное яблоко — красные яблоки», окончание меняется. По-английски a red apple — red apples: red остаётся red.
  - number: 7
    body: |
      Шесть заданий: узнать вопрос «есть ли», выбрать is или are, собрать просьбу с some, ответить в новой ситуации, поставить цвет на место и попросить продукт с цветом.

      **Проверка маленького шага:** *I have a book* отвечает на вопрос «**Что у меня есть?**». *There is a book* сообщает «**Тут есть книга**», но **не называет владельца**. Перед выбором конструкции определите, что важнее в ситуации: **обладатель** или **наличие предмета**.
exercises:
