    uid: EX-00044
    kind: choice
    stage: recognition
    prompt_ru: "Вы хотите узнать, продаётся ли в магазине молоко. Что спросить?"
    options: ["Is there milk?", "The milk is here.", "How much is it?"]
    answer: "Is there milk?"
    hint_ru: "Нужен вопрос «есть ли». Он начинается с Is there."
    explanation_ru: "Is there milk? — «Молоко есть?». В вопросе is стоит перед there."
    units: [LX-00119]
