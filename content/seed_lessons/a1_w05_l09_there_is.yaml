title: "В магазине: there is, there are, some и цвета"
summary: "Как сказать «есть, имеется» (there is milk, there are apples), попросить яблоки без точного количества (some) и описать продукт: red apples, cold milk."
units: [LX-00107, LX-00108, LX-00109, LX-00110, LX-00111, LX-00112, LX-00113, LX-00117, LX-00118, LX-00119, LX-00120, LX-00121, LX-00286, LX-00287, LX-00288, LX-00289, LX-00290, LX-00291, LX-00292, LX-00296, LX-00297, LX-00298, LX-00299, LX-00300, LX-00301]
sound_notes:
  - text: "Is there milk?"
    ipa: "/ɪz ðɛr ˈmɪlk/"
    note_ru: "there без ударения, ударение на milk; th звонкий, кончик языка между зубами"
  - text: "There are apples."
    ipa: "/ðɛr ɚ ˈæpəlz/"
    note_ru: "are почти пропадает: «зэр эр эпэлз», слова сливаются"
  - text: "Can I have some apples, please?"
