    answer: "Can I have some apples please"
    hint_ru: "Начните с Can I have, потом some."
    explanation_ru: "Can I have some apples, please? — some обозначает некоторое количество без точного числа (не обязательно мало)."
    units: [LX-00113, LX-00121]
  - order: 4
    uid: EX-00047
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: Том спрашивает, есть ли дома вода. Вода есть. Сообщите об этом."
    prompt_en: "Is there water? — ___"
    answer: "Yes, there is."
    accepted: ["Yes there is", "Yes, there is", "Yes, there is water.", "Yes, there is water", "There is water.", "Yes. There is water.", "Yes, there's water.", "There's water."]
    hint_ru: "Короткий ответ повторяет there и be."
    explanation_ru: "Yes, there is. — короткий ответ: в нём is не сокращаем. Если после is называем воду, сокращение возможно: Yes, there's water. / There's water."
    units: [LX-00120]
  - order: 5
    uid: EX-00048
    kind: choice
    stage: recognition
    prompt_ru: "Как сказать «зелёные яблоки»?"
    options: ["green apples", "apples green", "greens apples"]
    answer: "green apples"
    hint_ru: "Цвет — перед словом, и он не меняется."
    explanation_ru: "green apples — сначала цвет, затем предметы. Слово green остаётся без -s."
    units: [LX-00287]
