    uid: EX-00049
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: в магазине есть жёлтые бананы. Вежливо попросите именно жёлтые бананы без точного числа. Используйте some."
    prompt_en: "___"
    answer: "Can I have some yellow bananas, please?"
    accepted: ["Can I have some yellow bananas please?", "Some yellow bananas, please.", "I would like some yellow bananas, please.", "I'd like some yellow bananas, please."]
    hint_ru: "Can I have some…, please? Цвет — перед словом."
    explanation_ru: "Can I have some yellow bananas, please? — some выражает неопределённое количество, yellow стоит перед bananas. Просьба без some тоже возможна. В этом задании тренируем some + цвет + продукт, как указано в условии."
    units: [LX-00288, LX-00299]
