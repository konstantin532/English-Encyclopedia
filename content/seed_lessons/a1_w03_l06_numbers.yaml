title: "Числа от 1 до 20: сколько чашек и печений"
summary: "Числа для заказа: one, two, three… twenty. Где ударение в thirteen и почему two coffees, а не two coffee."
units: [LX-00061, LX-00062, LX-00063, LX-00064, LX-00065, LX-00066, LX-00067, LX-00068, LX-00069, LX-00070, LX-00071, LX-00072, LX-00073, LX-00074, LX-00075, LX-00076, LX-00077, LX-00078, LX-00079, LX-00080, LX-00081, LX-00083]
sound_notes:
  - text: "three"
    ipa: "/θri/"
    note_ru: "th глухой: кончик языка между зубами, не «с» и не «ф»"
  - text: "thirteen"
    ipa: "/ˌθɝˈtin/"
    note_ru: "ударение в конце: thir-TEEN"
  - text: "twenty"
    ipa: "/ˈtwɛnti/"
    note_ru: "в быстрой речи t после n часто пропадает: «твэни»"
layers:
  - number: 1
    body: |
      Числа нужны в первый же час в кафе: сколько чашек, сколько печений.

      > [N1]One[/] [S3]coffee[/] [C1]and[/] [N1]one[/] [S3]tea[/]. — Один кофе и один чай.
      > [N1]Two[/] [S3]coffees[/] [C1]and[/] [N1]one[/] [S3]tea[/], [O8]please[/]. — Два кофе и один чай, пожалуйста.
      > [N1]Three[/] [S3]teas[/], [O8]please[/]. — Три чая, пожалуйста.

      Штриховая линия под словом — **числительное**: слово, с помощью которого мы называем количество (*one*, *two*, *three*) или порядок. Сегодня используем только **количество**.

      **Почему coffees с -s, если кофе — вещество?** В кафе *one coffee* означает **одну порцию**, а *two coffees* — две. Мы считаем **заказы**, а не кофе как вещество. Сравните с *I like coffee* («Я люблю кофе»), где никакого числа порций нет.
  - number: 2
    body: |
      Английское **number** и русское «нумерация» — от латинского `numerus`, «число».

      Числа от 13 до 19 содержат хвост **-teen**, это старое «десять»: thirteen — «три и десять». Русское «тринадцать» устроено так же: «три на десять».
  - number: 3
    body: |
      **Как построить заказ?** Назовите число, затем предмет. Если считаем **обычные исчисляемые существительные** (или порции напитков) и их больше одного, часто добавляем окончание **-s**:

      > [N1]One[/] [S3]coffee[/], [O8]please[/]. — Один кофе.
      > [N1]Two[/] [S3]coffees[/], [O8]please[/]. — Два кофе.
      > [N1]Five[/] [S3]cookies[/], [O8]please[/]. — Пять печений.

      - После **one** обычное исчисляемое слово в единственном числе: *one cookie*; после **two / three / five** — множественное: *two cookies*.
      - Это **не означает**, что после любого числа любое существительное обязательно получает **-s**: неисчисляемые вещества (*water*) нельзя считать по штукам без уточнения порций, а у некоторых существительных есть необычные множественные формы — их изучим позже.
      - В русском «два печенья» и «пять печений» различаются по форме. Для обычных английских слов множественное число часто образуется одинаково — с **-s**.
  - number: 4
    body: |
      **Почему -s, хотя число уже есть?** Потому что в английском число (*two*) и форма существительного (*cookies*) выполняют **две связанные работы**: первое сообщает точное количество, а второе грамматически показывает множественное число. Поэтому *two cookie* в обычном значении двух печений — ошибка.

      **Почему eleven и twelve выглядят необычно?** Они происходят от очень старых германских форм, которые связывают с идеей «один сверх десяти» и «два сверх десяти». А **thirteen–nineteen** имеют узнаваемый элемент **-teen**, связанный с числом десять. Это историческая подсказка, а не способ образовать 11 и 12 по современному правилу.
  - number: 5
    body: |
      Американцы говорят числа быстро, поэтому важно ударение:

      > [N1]Thirteen[/] — ударение в конце.
      > [N1]Fifteen[/] — ударение в конце.
      > [N1]Twenty[/] — ударение в начале.

      - **-teen** часто выделяется ударением, когда число произносят отдельно: *thir-TEEN*. В сочетании со следующим существительным или при противопоставлении ударение может меняться. Чтобы не путать **thirteen** (13) и **thirty** (30), слушайте **целое слово и контекст**, а не только ударение. Числа с -ty подробно встретятся позже.
      - [O2]Thanks[/] — короткое «спасибо», его часто слышно в кафе.
  - number: 6
    body: |
      **Three** начинается со звука /θ/: язык мягко соприкасается с краем верхних зубов или чуть выходит между зубами, воздух проходит без голоса. Это **не** русское «т» и **не** «с». Если произнести его как английское *tree*, смысл может измениться — поэтому тренируйте различие, не ускоряясь.

      **Eight** заканчивается согласным /t/: его не стоит пропускать. В американском **twenty** звук /t/ после /n/ в быстрой речи иногда ослабляется или исчезает, но на письме **t остаётся**. Сначала произносите отчётливую форму, потом слушайте разговорную.
  - number: 7
    body: |
      **Четыре задания:** узнать *thirteen*, образовать множественное число **порций**, собрать заказ и сказать свой вариант. После каждого спросите себя: «Я считаю предметы или само вещество?», «Почему здесь нужно -s?».

      **Проверка маленького шага:** *two cookies* — два отдельных печенья; *two coffees* — две **порции** напитка. Если убрать идею порции и говорить о кофе вообще, получим *I like coffee* без множественного **-s**. Сначала определите, **что именно считаете**.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Какое число — 13?"
    options: ["thirteen", "three", "twelve"]
    answer: "thirteen"
    hint_ru: "13 — это три и десять, хвост -teen."
    explanation_ru: "thirteen — 13; three — 3; twelve — 12."
    units: [LX-00074]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Вы заказываете два чая. Допишите слово."
    prompt_en: "Two ___, please."
    answer: "teas"
    hint_ru: "Предметов больше одного — добавьте -s."
    explanation_ru: "В кафе считают две порции чая: one tea — two teas. Поэтому слово tea в значении порции здесь становится множественным с -s; о чае как напитке вообще можно сказать I like tea."
    units: [LX-00063, LX-00055]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите заказ: «Два кофе и один чай, пожалуйста»."
    options: [one, coffees, please, Two, and, tea]
    answer: "Two coffees and one tea please"
    hint_ru: "Число — предмет, потом and."
    explanation_ru: "Two coffees and one tea, please. У coffees есть -s, у tea после one — нет."
    units: [LX-00063, LX-00062, LX-00059]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вас четверо, и всем нужен чай. Закажите."
    prompt_en: "___"
    answer: "Four teas, please."
    accepted: ["Can I have four teas, please?", "4 teas, please.", "Four teas, thanks.", "4 teas, thanks."]
    hint_ru: "Число, предмет с -s и please."
    explanation_ru: "Four teas, please. Можно и полной просьбой: Can I have four teas, please?"
    units: [LX-00065, LX-00055]
