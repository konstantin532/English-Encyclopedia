layers:
  - number: 1
    body: |
      Один кофе или два? Три печенья или тринадцать? В кафе ошибка в числе — это чужой заказ на вашем подносе. Числа от 1 до 20 пригодятся вам у первой же кассы.

      Числа нужны в первый же час в кафе: сколько чашек, сколько печений.

      > [N1]One[/] [S3]coffee[/] [C1]and[/] [N1]one[/] [S3]tea[/]. — Один кофе и один чай.
      > [N1]Two[/] [S3]coffees[/] [C1]and[/] [N1]one[/] [S3]tea[/], [O8]please[/]. — Два кофе и один чай, пожалуйста.
      > [N1]Three[/] [S3]teas[/], [O8]please[/]. — Три чая, пожалуйста.

      Штриховая линия под словом помогает заметить **число**: *one*, *two*, *three*. Сегодня учимся отвечать на вопрос «сколько?».

      **Почему coffees с -s, если кофе — вещество?** В кафе *one coffee* означает **одну порцию**, а *two coffees* — две. Мы считаем **заказы**, а не кофе как вещество. Сравните с *I like coffee* («Я люблю кофе»), где никакого числа порций нет.
  - number: 2
    body: |
      **Как отличить 3 от 13?** Сравните *three* («три») и *thirteen* («тринадцать»). У чисел **13–19** есть часть **-teen**, связанная с числом десять. Например, *four* — 4, *fourteen* — 14. Поэтому важно услышать слово **целиком**, а не только его начало.

      **Не все числа строятся одинаково.** Числа *eleven* (11) и *twelve* (12) не оканчиваются на **-teen**. В некоторых числах меняется написание основы: *three → thirteen*, *five → fifteen*, *eight → eighteen*. Это не приглашение образовывать числа по догадке: для первых двадцати названий полезно сверять написание и звук.

      **Названия от 1 до 20 — короткая опора для заказа:**

      - **1–5:** one — 1, two — 2, three — 3, four — 4, five — 5.
      - **6–10:** six — 6, seven — 7, eight — 8, nine — 9, ten — 10.
      - **11–15:** eleven — 11, twelve — 12, thirteen — 13, fourteen — 14, fifteen — 15.
      - **16–20:** sixteen — 16, seventeen — 17, eighteen — 18, nineteen — 19, twenty — 20.

      Это справочник, а не просьба выучить двадцать слов за один подход. Начните с 1–5 и подставляйте числа в короткий заказ; затем переходите к следующей группе. Сверяйте произношение со словарными образцами.

      **Перед заказом уточните количество.** *One tea* — одна порция, *two teas* — две, *three teas* — три. Сначала решите, сколько порций нужно, затем подберите число и форму существительного.
  - number: 3
    body: |
      **Как построить заказ?** Сначала назовите число, затем предмет. Когда предметов или порций больше одного, во многих знакомых словах добавляем **-s**:

      > [N1]One[/] [S3]coffee[/], [O8]please[/]. — Один кофе.
      > [N1]Two[/] [S3]coffees[/], [O8]please[/]. — Два кофе.
      > [N1]Five[/] [S3]cookies[/], [O8]please[/]. — Пять печений.

      - Одно печенье — *one cookie*, несколько — *two cookies*.
      - Так можно считать отдельные вещи и порции. Воду (*water*) по штукам не считают: сначала нужно уточнить, что именно считаем.
      - Иногда добавляется **-es**, как в знакомом слове **sandwiches**: *two sandwiches*. Другие необычные варианты разберём позже.
      - В русском «два печенья» и «пять печений» звучат по-разному. В знакомых английских словах окончание **-s** часто остаётся одинаковым.
  - number: 4
    body: |
      **Почему -s, хотя число уже есть?** **Two** сообщает, сколько печений. А **cookies** показывает, что печенье не одно. Нужны обе части: **two cookies**. Поэтому *two cookie* в обычной фразе о двух печеньях — ошибка.

      **Для любопытных:** **Eleven** и **twelve** происходят от старых германских слов, которые связывают с идеями «один сверх десяти» и «два сверх десяти». В **thirteen–nineteen** узнаётся **-teen**, связанное с десятью. Это историческая подсказка, а не современное правило, по которому можно получить 11 и 12.

      **Диагностика понимания:** Вы заказываете **две порции** кофе. Что верно: *two coffees* или *two coffee*?

      **Разбор:** *Two coffees* — две порции кофе. **Two** называет количество, а **coffees** показывает, что порций несколько. В *I like coffee* говорим о кофе вообще, поэтому **-s** не добавляем.
  - number: 5
    body: |
      Американцы говорят числа быстро, поэтому важно ударение:

      > [N1]Thirteen[/] — ударение в конце.
      > [N1]Fifteen[/] — ударение в конце.
      > [N1]Twenty[/] — ударение в начале.

      - **-teen** часто выделяется ударением, когда число произносят отдельно: *thir-TEEN*. В сочетании со следующим существительным или при противопоставлении ударение может меняться. Чтобы не путать **thirteen** (13) и **thirty** (30), слушайте **целое слово и контекст**, а не только ударение. Числа с -ty подробно встретятся позже.
      - [O2]Thanks[/] — короткое «спасибо», его часто слышно в кафе.
  - number: 6
    body: |
      **Three** начинается со звука /θ/: язык мягко соприкасается с краем верхних зубов или чуть выходит между зубами, воздух проходит без голоса. Это **не** русское «т» и **не** «с». Если произнести его как английское *tree*, смысл может измениться — поэтому тренируйте различие, не ускоряясь.

      **Eight** заканчивается согласным /t/: его не стоит пропускать. В американском **twenty** звук /t/ после /n/ в быстрой речи иногда ослабляется или исчезает, но на письме **t остаётся**. Сначала произносите отчётливую форму, потом слушайте разговорную.
  - number: 7
    body: |
      **Четыре задания:** узнать *thirteen*, назвать несколько **порций**, собрать заказ и сказать свой вариант. После каждого спросите себя: «Я считаю предметы или порции?», «Почему здесь нужно -s?».

      **Проверка маленького шага:** *two cookies* — два отдельных печенья; *two coffees* — две **порции** напитка. А *I like coffee* — о кофе вообще, без **-s**. Сначала решите, **что именно считаете**.
