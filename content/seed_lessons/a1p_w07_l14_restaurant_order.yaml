sound_notes:
- text: Are you ready to order?
  ipa: /ɑr jə ˈrɛdi tə ˈɔrdɚ/
  note_ru: ready to — «рЭди тэ», order — «Ордэр» с американским r
- text: Can we have the check, please?
  ipa: /kən wi ˈhæv ðə ˈtʃɛk ˈpliz/
  note_ru: can безударное — «кэн», почти «кн»
- text: Keep the change!
  ipa: /ˈkip ðə ˈtʃeɪndʒ/
  note_ru: change — «чейндж», в конце мягкое «дж»
contractions:
- full: I would
  short: I'd
  ipa: /aɪd/
  note_ru: I'd like the pasta — разговорное сокращение I would like.
layers:
- number: 1
  body: 'Американский ресторан: вас встречают, сажают за столик, приносят меню, а потом спрашивают, готовы ли вы заказать. В конце просят счёт и оставляют чаевые.


    > [J3]Good[/] [S7]evening[/]! [D1]Are[/] [T8]you[/] [J4]ready[/] [X2]to[/] [D2]order[/]? — Добрый вечер! Готовы сделать заказ?

    > [A2]Then[/] [T8]I[/] [D7]would[/] [D3]like[/] [T1]the[/] [S3]chicken[/] [P4]with[/] [S3]rice[/], [O8]please[/]. — Тогда мне курицу с рисом, пожалуйста.

    '
- number: 2
  body: '**Menu** — французское слово: «подробный, мелкий» (от того же корня, что «минута»). Меню — это подробный список. **Dessert** тоже из французского: *desservir* — «убрать со стола». Десерт подают, когда тарелки уже убрали. **Tip** в английском значит и «кончик», и «совет», и «чаевые».

    '
- number: 3
  body: 'Схема ужина:


    > [N1]Two[/] [S3]pies[/], [O8]please[/]. [C1]And[/] [D7]can[/] [T8]we[/] [D1]have[/] [T1]the[/] [S2]check[/], [O8]please[/]? — Два пирога, пожалуйста. И можно счёт?


    1. Вход: **A table for two, please.**

    2. Заказ: **Are you ready to order? — I would like…**

    3. Вопрос о блюде: **Is it spicy? What do you recommend?**

    4. Еду принесли: **Enjoy your meal!**

    5. После: **Anything else? Any dessert?**

    6. Счёт: **Can we have the check, please?**

    7. Чаевые: **Keep the change.**

    '
- number: 4
  body: |
    **Почему «I would like», а не «I want»?** **I want** — грамматически правильное «я хочу», но при заказе может звучать прямолинейно. **I would like** (или **I'd like**) — удобный нейтрально-вежливый вариант. Вежливость зависит и от интонации, please и ситуации, поэтому I want не означает грубость автоматически.

    После **would like** можно назвать еду: **I'd like the chicken**, или действие с **to**: **I'd like to order**. Это отличается от **I like chicken** — «мне нравится курица вообще».

    **Keep the change** означает «оставьте сдачу себе»: так можно оставить чаевые при оплате наличными. Эта реплика подходит, только если вы действительно не ждёте сдачи; она не означает просто «спасибо» и не подходит автоматически к оплате картой.

    **Диагностика понимания:** что вежливее сказать официанту: *I want the chicken* или *I would like the chicken*?

    **Разбор:** *I would like the chicken.* — вежливая форма.

- number: 5
  body: 'Так говорят американцы:


    > [A3]Here[/] [D1]are[/] [N1]sixty[/] [N6]dollars[/]. [D2]Keep[/] [T1]the[/] [S2]change[/]! — Вот шестьдесят долларов. Сдачи не надо!


    - **Here you go. Enjoy your meal!** — пожалуйста, приятного аппетита.

    - **Everything was delicious!** — всё было очень вкусно.

    - **the check** — счёт (в Британии — the bill).


    Слова: **order** — заказывать, **recommend** — советовать, **menu** — меню, **server** — официант(ка), **tip** — чаевые, **soup** — суп, **dessert** — десерт, **plate** — тарелка, **fork** — вилка, **knife** — нож, **spoon** — ложка, **delicious** — очень вкусный, **fresh** — свежий, **spicy** — острый, **ready** — готовый, **without** — без.

    '
- number: 6
  body: |
    Ловушки:

    - При заказе **I would like the chicken, please** — надёжный вежливый образец. **I want the chicken** может звучать слишком прямо, но оценка зависит от ситуации и интонации.
    - «Give me the bill» — в США **Can we have the check, please?**
    - **Delicious** уже выражает сильную положительную оценку. Для обычной похвалы достаточно **It was delicious**; усилить можно **really delicious**. Сочетание very delicious обычно не выбирают как учебный образец, но это вопрос сочетаемости, а не особого запрета слова very перед любым прилагательным.
    - dessert (ss, десерт) и desert (пустыня) — разные слова.

- number: 7
  body: 'Шесть заданий: вежливо заказать, спросить совет, собрать просьбу о счёте, заказать в новом месте, похвалить еду и оставить чаевые.


    **Проверка маленького шага:** I would like… — Can we have the check, please? — Keep the change.

    '
