slug: a1-where-is-prepositions
level: A1
week: 8
order: 15
focus: P
minutes: 40
title: "Где это: Where is…? и предлоги in, on, near, next to, between"
summary: "Как спросить, где находится место или вещь, и ответить: in the box, on the right, near the bank, next to the cafe. Почему «на» — не всегда on."
units: [LX-00157, LX-00162, LX-00165, LX-00171, LX-00172, LX-00173, LX-00174, LX-00176, LX-00178, LX-00160, LX-00163, LX-00337, LX-00338, LX-00339, LX-00340, LX-00344, LX-00345, LX-00346]
sound_notes:
  - text: "Where is the bank?"
    ipa: "/ˈwɛr ɪz ðə ˈbæŋk/"
    note_ru: "where и is сливаются: «уэриз»; в разговоре — where's"
  - text: "It's next to the cafe."
    ipa: "/ɪts ˈnɛks tə ðə kæˈfeɪ/"
    note_ru: "t в next пропадает: «нэкс тэ»"
  - text: "It's on the right."
    ipa: "/ɪts ɑn ðə ˈraɪt/"
    note_ru: "on — открытое «а»: «ан», не «он»"
contractions:
  - full: "where is"
    short: "where's"
    ipa: "/wɛrz/"
    note_ru: "В разговоре почти всегда where's: Where's the bank?"
  - full: "it is"
    short: "it's"
    ipa: "/ɪts/"
    note_ru: "Ответ о месте — с it's: It's near the bank."
layers:
  - number: 1
    body: |
      В новом городе главный вопрос — «Где?». По-английски — **Where**.

      > [O2]Sorry[/], [D7]can[/] [T8]you[/] [D2]help[/] [T8]us[/]? [A6]Where[/] [D1]is[/] [T1]the[/] [S4]bank[/]? — Простите, не поможете нам? Где банк?
      > [T1]The[/] [S2]key[/] [S4]shop[/]? [T8]It[/] [D1]is[/] [P1]near[/] [T1]the[/] [S4]bank[/]. — Мастерская? Она рядом с банком.

      В **этих** ответах место уточняет предлог (*near*, *next to*, *on*, *in*). Но на вопрос **Where?** можно ответить и иначе, например названием места или наречием; не нужно искать предлог в **каждом** возможном ответе.

      **Готовая фраза из диалога:** *Can you help us?* — «Можете нам помочь?» Здесь **us** означает «нам»; отличие от **we** («мы») будет разбираться в следующем уроке. Пока можно использовать весь вопрос целиком, без дополнительных терминов.
  - number: 2
    body: |
      **Where / here / there** — старые германские слова о месте. Они близки по значению, но не являются одним современным словом с разными окончаниями: **where** спрашивает, **here** указывает «здесь», а **there** может указывать «там» или выполнять другую функцию в *there is*. Для ученика важнее различать **работу** слов в контексте, чем заучивать их историю.

      **near** когда-то значило «ближе» — сравнительная форма от слова «близко». Позже стало просто «рядом».
  - number: 3
    body: |
      Схема вопроса и ответа:

      > [A6]Where[/] [D1]is[/] [T1]the[/] [S4]bank[/]? — Где банк?
      > [T8]It[/] [D1]is[/] [P1]next to[/] [T1]the[/] [S4]cafe[/]. — Он рядом с кафе.

      - **in** — внутри: in the box, in the house.
      - **on** — на поверхности или сбоку: on the box, on the right.
      - **near** — недалеко: near the bank.
      - **next to** — совсем рядом, вплотную: next to the cafe.

      Ещё четыре предлога места:

      > [T1]The[/] [S2]key[/] [S4]shop[/] [D1]is[/] [P1]between[/] [T1]the[/] [S4]bank[/] [C1]and[/] [T1]the[/] [S4]hotel[/]. — Мастерская между банком и гостиницей.

      - [P1]under[/] — под: under the box
      - [P1]between[/] — между: between the bank **and** the hotel
      - [P9]in front of[/] — перед: in front of the cafe
      - [P9]across from[/] — напротив, через дорогу: across from the park

      В городе ещё пригодятся [S4]hotel[/] (гостиница), [S4]supermarket[/] (супермаркет) и [S4]map[/] (карта).
  - number: 4
    body: |
      **Почему нельзя переводить русский предлог один к одному?** В русском сочетания «в коробке» и «у банка» включают **предлог и форму существительного**. В английском в наших примерах отношения места часто показывает предлог *in / near / next to*. Но правило «предлог всегда стоит перед любым словом» неверно: здесь мы изучаем лишь простые предложные сочетания, например *near the bank*.

      **Near** означает «недалеко», без конкретного расстояния. **Next to** — непосредственно рядом, обычно по соседству. *Near* не означает строго «в двух шагах»: это расстояние зависит от ситуации.

      > [P1]On[/] [T1]the[/] [A3]right[/]? [P1]Next to[/] [S1]Mia[/][T3]'s[/] [S4]cafe[/]? — Справа? Рядом с кафе Мии?
  - number: 5
    body: |
      Так спрашивают и отвечают американцы:

      > [O2]Excuse me[/]! [T8]I[/] [D1]have[/] [T1]an[/] [J2]old[/] [S2]key[/]. [A6]Where[/] [D1]is[/] [T1]the[/] [S2]key[/] [S4]shop[/], [O8]please[/]? — Извините! У меня старый ключ. Где мастерская по ключам?

      - Начинают с Excuse me — так вежливо останавливают незнакомца.
      - В разговоре: Where's the bank? It's on the right.
      - Часто отвечают коротко: Near the bank. Next to the cafe.
  - number: 6
    body: |
      Русское «на» — ловушка:

      - на столе — on the table (поверхность);
      - на работе — at work;
      - **на улице** по-американски зависит от смысла: *outside* — снаружи помещения; *on the street* — на улице как месте/дороге. *In the street* чаще подчёркивает **проезжую часть**, а не просто пребывание на улице.

      И «у»: у двери — next to the door или near the door. Выбирайте предлог по смыслу места, а не по русскому слову.
  - number: 7
    body: |
      Шесть заданий: узнать вопрос «где», выбрать предлог, собрать ответ, объяснить, где место, выбрать between и сказать, что напротив.

      **Проверка маленького шага:** *The bank is near the cafe* — банк **неподалёку**, расстояние не названо. *The bank is next to the cafe* — банк **непосредственно рядом**. Оба выражения говорят «рядом», но для точного направления различие важно.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Вы ищете банк. Что спросить у прохожего?"
    options: ["Excuse me, where is the bank?", "Excuse me, what is the bank?", "Excuse me, who is the bank?"]
    answer: "Excuse me, where is the bank?"
    hint_ru: "«Где» — where."
    explanation_ru: "Excuse me, where is the bank? — вежливо и понятно."
    units: [LX-00175, LX-00176]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Ключ лежит внутри коробки. Вставьте предлог."
    prompt_en: "The key is ___ the box."
    answer: "in"
    hint_ru: "Внутри — in."
    explanation_ru: "in the box — внутри коробки. on the box было бы «на коробке»."
    units: [LX-00173]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите ответ: «Банк рядом с кафе»."
    options: [cafe, The, is, to, bank, next, the]
    answer: "The bank is next to the cafe"
    hint_ru: "next to — два слова вместе."
    explanation_ru: "The bank is next to the cafe. next to — «рядом с», всегда вместе."
    units: [LX-00174]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: турист спрашивает, где кафе. Оно справа. Ответьте."
    prompt_en: "Where is the cafe? — ___"
    answer: "It is on the right."
    accepted: ["It's on the right.", "On the right.", "It is on the right", "It's on the right", "On the right", "The cafe is on the right."]
    hint_ru: "Справа — on the right."
    explanation_ru: "It is on the right — в разговоре It's on the right или просто On the right."
    units: [LX-00178]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: "Кафе стоит посередине: слева банк, справа гостиница. Как сказать?"
    options: ["The cafe is between the bank and the hotel.", "The cafe is under the bank and the hotel.", "The cafe is in front of the bank and the hotel."]
    answer: "The cafe is between the bank and the hotel."
    hint_ru: "Посередине между двумя — between … and …"
    explanation_ru: "between the bank and the hotel — между двумя названными местами. В этой конструкции их соединяет and; слово between само обозначает расположение между."
    units: [LX-00338, LX-00344]
  - order: 6
    kind: fill
    stage: transfer
    prompt_ru: "Супермаркет — через дорогу от парка. Скажите это по-американски."
    prompt_en: "The supermarket is ___ the park."
    answer: "across from"
    hint_ru: "Американское «напротив» — два слова."
    explanation_ru: "The supermarket is across from the park. — across from значит «через дорогу, напротив»."
    units: [LX-00340, LX-00345]
