title: "Итог A1: что вы уже умеете по-английски"
summary: "Повторение всего уровня A1 на одной странице: be, have, can, настоящее простое время, вопросы с do и does, отрицания, предлоги, время и цены. С примерами из жизни Анны, Тома и Мии."
