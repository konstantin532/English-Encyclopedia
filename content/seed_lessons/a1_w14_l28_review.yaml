layers:
  - number: 1
    body: |
      14 недель назад вы знали несколько английских слов. Теперь вы можете познакомиться, заказать кофе, купить продукты, спросить дорогу, сходить к врачу, отправить письмо и проехать на автобусе.

      > [O2]Excuse me[/]! [D1]Does[/] [T2]this[/] [S4]bus[/] [D4]go[/] [P2]to[/] [S4]Park[/] [S4]Street[/]? — Извините! Этот автобус идёт до Парк-стрит?

      Эта страница собирает всю грамматику A1 в одну карту.
  - number: 2
    body: |
      Весь уровень держится на трёх «опорных» глаголах:

      - **be** — быть, являться: I am Anna. It is my cat. There is a key.
      - **have** — иметь: I have a headache. She has a computer.
      - **do** — помощник для вопросов и отрицаний: Do you work? I don't know.

      Плюс **can** — могу и умею: I can speak English. I can't sleep.

      Почти каждая фраза A1 — один из этих глаголов и несколько слов вокруг.
  - number: 3
    body: |
      Настоящее простое время — для привычек и фактов:

      > [T8]I[/] [D1]do[/] [X1]not[/] [D6]know[/]. [O2]Sorry[/]! — Не знаю. Извините!

      - I / you / we / they work. — he / she / it work**s**.
      - Вопрос: Do you…? / Does he…?
      - Отрицание: I don't… / She doesn't…
      - Слова частоты перед глаголом: I always read, I never walk.
  - number: 4
    body: |
      Почему английский так держится за порядок слов? В нём почти нет окончаний. Кто делает, что делает и с чем — понятно только по месту слова: **кто — глагол — остальное**. Если вы помните этот каркас, вы уже говорите правильно в большинстве фраз.

      Вопрос меняет порядок: помощник (is, do, does, can) выходит вперёд.

      > [T9]What[/] [S7]time[/] [D1]is[/] [T1]the[/] [J8]next[/] [S4]bus[/] [A3]back[/]? — А во сколько обратный автобус?
  - number: 5
    body: |
      Фразы-спасатели, которые работают в любой поездке:

      > [A6]How[/] [T4]much[/] [D1]is[/] [T1]a[/] [S2]ticket[/]? — Сколько стоит билет?

      - Sorry? Can you say it again, please? — не расслышали.
      - Excuse me, where is…? — ищете место.
      - How much is it? — цена.
      - I don't know. — не знаете.
      - Can you spell it, please? — не поняли имя.

      Погода и вещи в поездке:

      > [T8]It[/] [D1]is[/] [J2]sunny[/] [C1]and[/] [J2]warm[/] [A2]today[/]. — Сегодня солнечно и тепло.
      > [T8]I[/] [D1]have[/] [T1]an[/] [S2]umbrella[/]. — У меня есть зонт.

      **Weather** — погода, **sunny** — солнечно, **windy** — ветрено, **cloudy** — облачно, **warm** — тепло. Эти описания строятся через **It is…**: It is cloudy. **Rain** — дождь, **snow** — снег; здесь оба слова — существительные, без a. Не превращайте sunny в новое действие: для этой ступени достаточно it is sunny.

      **Coat** — пальто, **hat** — головной убор, **sweater** — свитер, **umbrella** — зонт, **bag** — сумка. Перед umbrella нужен an: **an umbrella**. Прилагательное перед предметом: **a warm coat**, **a blue sweater**.

      Соберите несколько знакомых конструкций:

      - **I have a warm coat and a hat.** — вещи и описание;
      - **I can take a taxi.** — возможность;
      - **What time does the train leave?** — вопрос о расписании;
      - **I want to buy an umbrella because I don't like the rain.** — желание и причина.

      **Train / car / taxi / plane** — транспорт, **station / airport** — места. **Leave** — отправляться, **arrive** — прибывать, **travel** — ездить, **trip** — отдельная поездка, **seat** — место для сидения. Повторение помогает соединить навыки, но эта страница не заменяет отдельный итоговый тест A1.
  - number: 6
    body: |
      Пять ошибок, которые чаще всего остаются после A1:

      - «I am work» → I work.
      - «He work» → He works.
      - «I am teacher» → I am a teacher.
      - «Does she lives» → Does she live.
      - «I don't never» → I never.

      Если поймали себя на одной из них — это нормально. Исправьте и скажите ещё раз.
  - number: 7
    body: |
      Шесть заданий из разных недель: от знакомства до поездки, затем описание погоды и желание купить вещь с объяснением причины. Если что-то забылось, вернитесь к уроку своей недели.
