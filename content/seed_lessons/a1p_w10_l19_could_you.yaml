layers:
- number: 1
  body: 'Лео работает ночью, а днём спит. Сверху ему слышна гитара Тома. Он мог бы сказать «Тише!», но говорит вежливо — с **Could you…?**


    > [O1]Hello[/], [S1]Tom[/]. [D7]Could[/] [T8]you[/] [D2]play[/] [A4]quietly[/], [O8]please[/]? [T8]I[/] [D2]work[/] [P3]at[/] [S7]night[/], [C1]and[/] [T8]I[/] [D2]sleep[/] [P3]during[/] [T1]the[/] [S7]day[/]. — Здравствуй, Том. Не мог бы ты играть потише? Я работаю ночью, а днём сплю.

    '
- number: 2
  body: '**Could** — прошедшая форма **can**. Но в просьбе она не про прошлое: прошедшая форма делает просьбу мягче, «на шаг дальше» от собеседника. Как в русском «не могли бы вы» вместо «можете». В английском вежливость часто живёт именно в таких формах: could, would.

    '
- number: 3
  body: 'Схема:


    > [S1]Leo[/], [D7]could[/] [T8]you[/] [D1]do[/] [T8]me[/] [T1]a[/] [S10]favor[/]? [D7]Could[/] [T8]you[/] [D2]lend[/] [T8]me[/] [T3]your[/] [S2]hammer[/]? — Лео, можно попросить? Не одолжишь мне молоток?


    - Просьба: **Could you + глагол + (please)?**

    - Более просто, между друзьями: **Can you…?**

    - Попросить разрешения: **Could I borrow…?**

    - Ответ «да»: **Of course! / Sure. / I don''t mind.**

    - borrow — взять на время, **lend** — дать на время.

    '
- number: 4
  body: '**Почему Leo говорит Could you, а не Play quietly!?** Повелительная форма — *Play quietly!* — звучит как приказ. Соседу, начальнику, незнакомцу говорят **Could you…?**. Это не слабость, а норма вежливости в США.


    > [C1]And[/] [J8]next[/] [S7]week[/] [T8]we[/] [D1]are[/] [P3]on[/] [S7]vacation[/]. [D7]Could[/] [T8]you[/] [D6]check[/] [T3]our[/] [S2]apartment[/]? — А на следующей неделе мы уезжаем в отпуск. Не могли бы вы присматривать за квартирой?


    **Диагностика понимания:** что вежливее сказать незнакомцу: *Give me your pen* или *Could you give me your pen?*


    **Разбор:** *Could you give me your pen?* — просьба, а не приказ.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Could you do me a favor?** — можно попросить об одолжении?

    - **That''s sweet of you.** — как мило с вашей стороны.

    - **Any time.** — обращайтесь.


    Слова: **borrow** — взять на время, **lend — lent** — дать на время, **share** — делиться, **explain** — объяснять, **promise** — обещать, **feed — fed** — кормить, **vacation** — отпуск, **favor** — одолжение. Из истории 9: **give** — давать.

    '
- number: 6
  body: 'Ловушки:


    - «Could you to help me?» — без to: **Could you help me?**

    - «Could you borrow me your hammer?» — давать — **lend**: Could you lend me…?

    - «Of course» на «Do you mind…?» — отдельная тема; сейчас отвечаем на Could you…?

    - favor — американское написание, favour — британское.

    '
- number: 7
  body: 'Шесть заданий: выбрать вежливую просьбу, отличить borrow и lend, собрать просьбу, попросить о новом, ответить «конечно» и поблагодарить за доброту.


    **Проверка маленького шага:** Could you + глагол + please? — Of course!

    '
