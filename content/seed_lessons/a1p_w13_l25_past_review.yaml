layers:
- number: 1
  body: 'Джейк заполняет анкету в кулинарную школу. Вопросы о прошлом — значит, пора собрать вместе всё, что вы знаете о прошедшем времени.


    > [P6]Of[/] [O4]course[/]! [T8]I[/] [D1]am[/] [T1]a[/] [S9]teacher[/]. [D5]Tell[/] [T8]me[/] [P6]about[/] [T9]yourself[/]. [A6]Where[/] [D1]did[/] [T8]you[/] [D2]grow[/] [X3]up[/]? — Конечно! Я же учительница. Расскажи о себе. Где ты вырос?

    > [T8]I[/] [D1]was[/] [J7]born[/] [P1]in[/] [T2]this[/] [S4]town[/], [C1]and[/] [T8]I[/] [D2]grew[/] [X3]up[/] [A3]here[/]. — Я родился в этом городе и вырос здесь.

    '
- number: 2
  body: 'За двенадцать недель вы выучили четыре инструмента прошлого. **was / were** — для «был». **-ed** — для правильных глаголов. **Особые формы** — для неправильных. **did** — для вопросов и отрицаний. Из них складывается любой рассказ о себе.

    '
- number: 3
  body: 'Схема:


    > [O4]Yes[/]! [T8]I[/] [D2]worked[/] [P3]at[/] [T1]a[/] [J1]small[/] [S4]restaurant[/] [P3]for[/] [N1]one[/] [S7]year[/]. [T8]I[/] [D2]cooked[/] [T5]every[/] [S7]day[/]. — Да! Год работал в маленьком ресторане. Готовил каждый день.


    - Был: **I was born… / We were at school.**

    - Правильные: **work → worked, study → studied, decide → decided**.

    - Неправильные: **grow → grew, teach → taught, go → went**.

    - Вопрос: **Where / What / Why + did + you + глагол?**

    - Отрицание: **I didn''t + глагол**.

    '
- number: 4
  body: '**Почему «I was born», а не «I born»?** По-английски рождение — это то, что с вами «сделали»: вас родили. Рассказывая о рождении в прошлом, используйте **was / were born**: *She was born in May. We were born in Russia.* В вопросе и отрицании работает сам be: **Were you born here? I wasn''t born here.** Did сюда не добавляют.


    > [O3]Awesome[/]. [C1]And[/] [A6]why[/] [D1]did[/] [T8]you[/] [D6]decide[/] [X2]to[/] [D5]apply[/]? — Класс. А почему ты решил поступать?


    **Диагностика понимания:** что верно: *Where did you grew up?* или *Where did you grow up?*


    **Разбор:** *Where did you grow up?* После did — основная форма.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Tell me about yourself.** — расскажите о себе (так начинают собеседование).

    - **I grew up in…** — я вырос в…

    - **a long time ago** — давным-давно.


    Слова: **grow — grew** — расти, **decide** — решать, **born** — рождённый.

    '
- number: 6
  body: 'Ловушки:


    - «I born» — **I was born**.

    - «Where did you grew up?» — **grow**.

    - «I was work» — **I worked**.

    - «I didn''t went» — **I didn''t go**.

    '
- number: 7
  body: 'Шесть заданий: выбрать форму, сказать «я родился», собрать вопрос, рассказать о детстве, найти ошибку и сказать «давным-давно».


    **Проверка маленького шага:** was / were, -ed, особые формы, did — и рассказ о себе готов.

    '
