layers:
- number: 1
  body: 'У Джейка первый рабочий день в кафе, и Мия рассказывает правила. Правила по-английски звучат через **must** — «надо, обязан» — и **must not** — «нельзя».


    > [T1]The[/] [S9]rules[/] [D1]are[/] [J3]easy[/]. [T8]You[/] [D7]must[/] [D1]be[/] [A3]here[/] [P3]at[/] [N3]six[/]. [T8]You[/] [D7]must[/] [X1]not[/] [D1]be[/] [A2]late[/]. — Правила простые. Ты должен быть здесь в шесть. Опаздывать нельзя.

    '
- number: 2
  body: '**Must** — очень старый глагол, когда-то он значил «мочь, иметь право». Теперь это строгое «надо». У must нет форм: нет *musts*, *musted*, *musting*. Одна форма для всех: I must, she must, they must.

    '
- number: 3
  body: 'Схема:


    > [A2]Yesterday[/] [T8]I[/] [D1]was[/] [A2]late[/], [C1]and[/] [T1]the[/] [S9]boss[/] [D1]was[/] [X1]not[/] [J4]happy[/]! [O4]Okay[/], [A2]now[/] [T8]you[/] [D7]must[/] [D2]wash[/] [T3]your[/] [S5]hands[/]. — Вчера я опоздала, и начальник был недоволен! Так, теперь нужно вымыть руки.


    - Надо: **must + глагол** — You must wash your hands.

    - Нельзя: **must not (mustn''t) + глагол** — You mustn''t smoke here.

    - Глагол после must — без to: must **wash**, не *must to wash*.

    - У must нет -s: she **must**, не *she musts*.

    - Вовремя — **on time**: You must be on time.

    '
- number: 4
  body: |
    **Почему must not — «нельзя», а не «не обязательно»?** В русском «не должен» может значить «не обязан». В изучаемых правилах и инструкциях **mustn't** выражает запрет: *You mustn't use your phone* — «телефоном пользоваться нельзя». «Не обязательно» скажем иначе — это будет на следующей неделе: **don't have to**.

    > [O4]No[/], [T8]you[/] [D7]must[/] [X1]not[/] [D2]use[/] [T3]your[/] [S2]phone[/] [P1]at[/] [T1]the[/] [S2]counter[/]. [C1]And[/] [T8]you[/] [D7]must[/] [D1]be[/] [J6]polite[/] [P2]to[/] [S1]customers[/]. — Нет, у стойки телефон нельзя. И с клиентами надо быть вежливым.

    **Диагностика понимания:** что верно: *You must to be polite* или *You must be polite*?

    **Разбор:** *You must be polite.* После must — без to.

- number: 5
  body: |
    Так говорят американцы:

    - В этих инструкциях **must** подчёркивает обязательность и может звучать строго. Но это не единственное значение must во всём языке. Здесь учим именно обязанность и запрет; более разговорную схему **have to** разберём на следующей неделе.
    - **Watch out!** — осторожно!
    - **You must be on time.** — приходи вовремя.

    Слова: **rule** — правило, **hair** — волосы, **gloves** — перчатки, **drop** — ронять, **throw** — бросать, **hurry** — спешить, **smoke** — курить, **polite** — вежливый, **rude** — грубый. Из истории 8: **must**, **basement** — подвал, **girl** — девочка, **boy** — мальчик.

- number: 6
  body: 'Ловушки:


    - «must to wash» — без to: **must wash**.

    - «she musts» — у must нет -s.

    - «You mustn''t come» — это «нельзя приходить», а не «можно не приходить».

    - «Do I must…?» — вопрос с must: **Must I…?** (но чаще говорят Do I have to…?).

    '
- number: 7
  body: 'Шесть заданий: узнать правило, сказать «нельзя», собрать правило с must, написать правило для своей работы, найти ошибку и предупредить «осторожно».


    **Проверка маленького шага:** must + глагол = надо; mustn''t + глагол = нельзя. Без to и без -s.

    '
