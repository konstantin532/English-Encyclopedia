layers:
  - number: 1
    body: |
      Американские цены — отдельное приключение: доллары, центы и налог, который часто добавляют прямо на кассе. Но главный вопрос всегда один: *How much is it?* Научитесь задавать его и понимать ответ — и сможете уточнить цену покупки.

      Чтобы купить что-то, нужно понять цену. Для этого хватит одного вопроса и одного ответа.

      > [A6]How[/] [T4]much[/] [D1]is[/] [T1]the[/] [S3]milk[/]? — Сколько стоит молоко?
      > [T8]It[/] [D1]is[/] [N6]two dollars[/]. — Два доллара.

      Числа 1–20 вы уже изучили в кафе. Теперь переносим знакомые числа в **новую ситуацию** — узнать и назвать цену. Дополнительное слово здесь — **dollars**.
  - number: 2
    body: |
      В магазине нужны два разных вопроса:

      - *How much is the milk?* — «Сколько стоит молоко?»: спрашиваем **цену**.
      - *How much milk?* — «Сколько молока?»: спрашиваем **количество**.

      Цена яблок тоже спрашивается через **how much**: *How much are the apples?* Яблок несколько, поэтому ставим **are**. Для сравнения: *How many apples?* — «Сколько яблок?»: здесь нас интересует число яблок, а не цена.
  - number: 3
    body: |
      **Как спросить цену с be?** Сначала идёт *How much*, затем **is** для одной вещи или продукта вроде молока, **are** — для нескольких вещей. После **is / are** называем товар:

      > [A6]How[/] [T4]much[/] [D1]is[/] [T8]it[/]? — Сколько это стоит?
      > [A6]How[/] [T4]much[/] [D1]are[/] [T1]the[/] [S3]apples[/]? — Сколько стоят яблоки?

      - Один предмет или неисчисляемый продукт (*milk*) — **How much is…?**
      - Несколько предметов (*apples*) — **How much are…?**
      - К одной вещи относится **it**, к нескольким — **they**. Ответ может быть и коротким: *Two dollars*.

      **Почему It is two dollars, хотя dollars во множественном числе?** Форму **is** выбираем по **it** — предмету, о котором говорим. Цена после глагола не превращает предмет в несколько: *It is two dollars*. Если спрашиваем о яблоках, ответ *They are two dollars*: **are** связано с **they**, то есть с яблоками.

      **Почему how much are the apples, хотя яблоки считают по штукам?** Здесь вопрос **о стоимости**, а не количестве. *How many apples?* спрашивает, **сколько яблок**. Запомните разницу между двумя жизненными вопросами.
  - number: 4
    body: |
      **Куда пропало русское «стоит»?** В обычном вопросе *How much is it?* нет отдельного слова со значением «стоить»: **be** связывает предмет с его ценой. Это **распространённый способ**, но не единственная английская конструкция о стоимости.

      В простых **целых суммах** число стоит перед названием валюты: **one dollar**, **two dollars**, **three dollars**. Существительное в обычной множественной форме получает **-s**. Для центов и дробных сумм позже будет отдельная практика.

      > [T2]That[/] [D1]is[/] [N6]three dollars[/]. — С вас три доллара.

      **Диагностика понимания:** Вы спрашиваете цену **нескольких яблок**. Что верно: *How much are the apples?* или *How much is the apples?*?

      **Разбор:** *How much are the apples?* — выбираем **are**, потому что яблок несколько. При этом **how much** относится к **цене**, а не к числу яблок. Чтобы спросить их количество, используйте *How many apples?*.
  - number: 5
    body: |
      Так называют цену в американском магазине:

      > [T8]It[/] [D1]is[/] [N6]two dollars[/]. — Два доллара.
      > [T2]That[/] [D1]is[/] [N6]three dollars[/]. — С вас три доллара.

      - В разговоре — It's и That's: It's two dollars. That's three dollars.
      - Цену часто называют совсем коротко: Two dollars.
      - На ценнике пишут $2: значок доллара стоит перед числом.

      Услышали цену — оцените её:

      > [T8]They[/] [D1]are[/] [J3]cheap[/]! — Они дешёвые! (продавец о яблоках)
      > [S6]Cat[/] [S3]food[/] [D1]is[/] [J3]expensive[/]! — Корм для кошек дорогой! (Том)
      > [T2]That[/] [D1]is[/] [J3]expensive[/]! — Это дорого!

      - [J3]cheap[/] — дешёвый, [J3]expensive[/] — дорогой. Ударение: ikSPENsiv.
      - В кафе размер называют перед напитком: [T1]a[/] [J1]small[/] [S3]coffee[/], [T1]a[/] [J1]big[/] [S3]coffee[/].
  - number: 6
    body: |
      Пишут одно, читают другое:

      - $2 — читают two dollars, а не «доллар два».
      - $1 — one dollar, без -s: доллар один.
      - $10 — ten dollars.

      В русском после разных чисел окончания меняются сложнее. В наших примерах с **целыми числами** правило короткое: *one dollar* и *two / three / ten dollars*. Цены вроде *$1.50* читаются иначе, их изучим отдельно.
  - number: 7
    body: |
      Шесть заданий: узнать вопрос о цене, прочитать ценник, собрать вопрос, назвать цену яблок, оценить цену и заказать маленький напиток.

      **Проверка маленького шага:** *How much is the milk?* спрашивает **цену молока**, а *How much milk?* — его **количество**. В этих двух примерах различайте **«сколько стоит»** и **«сколько молока»**. Это сравнение двух вопросов, а не общее правило для всех фраз с how much.
exercises:
  - order: 1
    uid: EX-00050
    kind: choice
    stage: recognition
    prompt_ru: "Вы хотите узнать цену. Что спросить?"
    options: ["How much is it?", "Is there milk?", "Can I help you?"]
    answer: "How much is it?"
    hint_ru: "how much — «сколько»."
    explanation_ru: "How much is it? — распространённый вопрос о цене. Здесь is связывает it («это») с суммой; отдельный глагол «стоит» не требуется."
    units: [LX-00122]
  - order: 2
    uid: EX-00051
    kind: fill
    stage: substitution
    prompt_ru: "На ценнике $3. Допишите, как это читают."
    prompt_en: "It is three ___."
    answer: "dollars"
    hint_ru: "Долларов больше одного."
    explanation_ru: "$3 читают three dollars: число, потом dollars с -s."
    units: [LX-00116]
  - order: 3
    uid: EX-00052
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Сколько стоит молоко?»"
    options: [the, much, How, milk, is]
    answer: "How much is the milk"
    hint_ru: "Начните с How much."
    explanation_ru: "How much is the milk? — how much, потом is, потом вещь."
    units: [LX-00114, LX-00115]
  - order: 4
    uid: EX-00053
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: вы продаёте яблоки на школьной ярмарке. Все эти яблоки стоят $5. Ответьте полным предложением о яблоках, начните с They."
    prompt_en: "How much are the apples? — ___"
    answer: "They are five dollars."
    accepted: ["They're five dollars.", "They are 5 dollars.", "They're 5 dollars."]
    hint_ru: "They относится к яблокам: после they выберите are, затем назовите цену."
    explanation_ru: "They are five dollars. They относится к apples, поэтому are. They're five dollars тоже подходит. Five dollars — естественный короткий ответ, но здесь по условию нужно полное предложение о яблоках с They."
    units: ["LX-00116"]
  - order: 5
    uid: EX-00054
    kind: choice
    stage: recognition
    prompt_ru: "Сыр стоит двадцать долларов, и для вас это слишком дорого. Как выразить свою оценку?"
    options: ["That is expensive!", "That is cheap!", "That is small!"]
    answer: "That is expensive!"
    hint_ru: "Двадцать долларов за сыр — много."
    explanation_ru: "That is expensive! — «Это дорого!» Так говорят, если цена кажется высокой лично вам; cheap — «дёшево». Одна и та же сумма не для всех одинаково дорогая."
    units: [LX-00294, LX-00302]
  - order: 6
    uid: EX-00055
    kind: build
    stage: production
    prompt_ru: "Соберите заказ: «Маленький кофе, пожалуйста»."
    options: [coffee, small, A, please]
    answer: "A small coffee please"
    hint_ru: "Размер — перед напитком."
    explanation_ru: "A small coffee, please. — small стоит перед coffee, как и цвет."
