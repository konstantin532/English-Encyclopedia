title: "Сколько стоит: How much is it? и цены в долларах"
summary: "Как спросить цену, понять ответ и назвать сумму в долларах. Почему $2 читают two dollars и где в цене слово «стоит»."
units: [LX-00114, LX-00115, LX-00116, LX-00122, LX-00123, LX-00109, LX-00108, LX-00293, LX-00294, LX-00295, LX-00302]
sound_notes:
