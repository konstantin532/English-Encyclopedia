title: "Сколько стоит: How much is it? и цены в долларах"
summary: "Как спросить цену, понять ответ и назвать сумму в долларах. Почему $2 читают two dollars и где в цене слово «стоит»."
units: [LX-00114, LX-00115, LX-00116, LX-00122, LX-00123, LX-00109, LX-00108, LX-00293, LX-00294, LX-00295, LX-00302]
sound_notes:
  - text: "How much is it?"
    ipa: "/ˌhaʊ ˈmʌtʃ ɪz ɪt/"
    note_ru: "ударение на much; is it сливаются: «изит»"
  - text: "It's two dollars."
    ipa: "/ɪts ˈtu ˈdɑlɚz/"
    note_ru: "В dollars ударный гласный /ɑ/ открытый, отдалённо похож на русское «а»; после /ɚ/ произносится /z/; русская подсказка приблизительная"
  - text: "That's three dollars."
    ipa: "/ðæts ˈθri ˈdɑlɚz/"
    note_ru: "в three язык между зубами и глухой звук, в that's — звонкий"
