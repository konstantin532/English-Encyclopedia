layers:
- number: 1
  body: 'Американский пикник — это корзина с бутербродами, лимонад, арбуз, иногда гриль. А ещё мяч или воздушный змей.


    > [S7]Morning[/]! [T8]I[/] [D2]brought[/] [T4]some[/] [S3]lemonade[/] [C1]and[/] [T1]a[/] [J1]huge[/] [S3]watermelon[/]. — Доброе утро! Я принесла лимонад и огромный арбуз.

    > [S1]Ruth[/], [D7]would[/] [T8]you[/] [D3]like[/] [X2]to[/] [D2]sit[/] [P1]in[/] [T1]the[/] [S6]shade[/]? [T8]It[/] [D1]is[/] [A5]really[/] [J2]hot[/] [A2]today[/]. — Рут, может, сядете в тень? Сегодня очень жарко.

    '
- number: 2
  body: '**Picnic** пришло из французского *pique-nique*: «поклевать немножко». Каждый приносил что-то своё. **Fall** — американское «осень»: время, когда листья **падают** (fall). В Британии говорят **autumn**, а в США чаще **fall**.

    '
- number: 3
  body: 'Схема:


    > [D6]Look[/]! [T1]An[/] [J2]old[/] [S1]man[/] [D1]is[/] [D4]walking[/] [A4]slowly[/] [P2]across[/] [T1]the[/] [S6]grass[/]. — Смотрите! Через лужайку медленно идёт старик.


    - Времена года: **spring, summer, fall, winter**. Обычно **in (the)**: in summer / in the summer. С this / next / last предлог не нужен: this summer, next winter.

    - Пикник: **basket, blanket, grill, napkin, lemonade, watermelon, strawberries**.

    - В парке: **grass, shade, ants, a ball, a kite**.

    - Восхищение: **What a great day! What a lovely song!**

    - Тост: **Cheers!**

    '
- number: 4
  body: '**Почему «What a great day!», а не «How great day!»?** Перед исчисляемым существительным в единственном числе используем **What a/an + (прилагательное) + существительное**: *What a great day!* Во множественном числе и с неисчисляемым существительным a/an не нужен: *What lovely songs! What lovely weather!* Если существительного нет, удобно **How + прилагательное**: *How nice!*


    **Почему «in the summer», а не «in summer»?** Можно и так, и так. В разговоре в США чаще с **the**: *in the summer, in the fall*.


    **Диагностика понимания:** что верно: *What great day!* или *What a great day!*?


    **Разбор:** *What a great day!* — с a.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Let''s celebrate!** — давайте отпразднуем!

    - **Cheers!** — будем здоровы!

    - **See you soon!** — до скорого!


    Слова: **celebrate** — праздновать, **fly — flew** — летать, **basket** — корзина, **grill** — гриль, **napkin** — салфетка, **ball** — мяч, **kite** — змей, **lemonade, watermelon, strawberry**, **grass** — трава, **shade** — тень, **ant** — муравей, **sunset** — закат, **season** — время года, **future** — будущее, **guest** — гость, **game** — игра, **song** — песня.

    '
- number: 6
  body: 'Ловушки:


    - «What great day!» — **What a great day!**

    - «autumn» — понятно, но в США **fall**.

    - «on the summer» — **in the summer**.

    - shade (тень от солнца) и shadow (тень предмета) — разные слова; на пикнике садятся **in the shade**.

    '
- number: 7
  body: 'Шесть заданий: назвать время года, выбрать What a…, собрать фразу о пикнике, рассказать о любимом сезоне, найти лишнее и сказать тост.


    **Проверка маленького шага:** in (the) summer / in (the) fall; What a great day! — один день, What lovely weather! — неисчисляемое weather.

    '
