sound_notes:
- text: Do you have any experience?
  ipa: /də jə ˈhæv ˈɛni ɪkˈspɪriəns/
  note_ru: 'experience — ударение на второй слог: «икспИриэнс»'
- text: I want to be a chef.
  ipa: /aɪ ˈwɑnə bi ə ˈʃɛf/
  note_ru: want to в быстрой речи — «уонэ»
- text: Good luck!
  ipa: /ˈɡʊd ˈlʌk/
  note_ru: good — короткое «у», luck — открытое «а»
