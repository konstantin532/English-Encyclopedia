layers:
- number: 1
  body: 'В анкете на курсы спрашивают одно и то же: когда вы родились, чему учились, какой у вас опыт и зачем вы поступаете.


    > [D1]Do[/] [T8]you[/] [D1]have[/] [T4]any[/] [S9]experience[/]? — У тебя есть опыт?

    > [T8]It[/] [D1]is[/] [T3]my[/] [S8]dream[/]. [T8]I[/] [D3]want[/] [X2]to[/] [D1]be[/] [T1]a[/] [S9]chef[/]. [T3]My[/] [S1]grandmother[/] [D5]taught[/] [T8]me[/]. — Это моя мечта. Хочу стать шеф-поваром. Меня научила бабушка.

    '
- number: 2
  body: '**Chef** — французское слово, «глава, начальник» (как «шеф»). На кухне это главный повар. **Interview** — «взгляд между»: *inter* — «между», *view* — «взгляд». Собеседование — это когда два человека смотрят друг на друга и решают, подходят ли они друг другу.

    '
- number: 3
  body: 'Схема анкеты:


    > [J3]Perfect[/]. [A2]Now[/], [T3]your[/] [S9]signature[/] [A3]here[/]. [A6]When[/] [D1]is[/] [T1]the[/] [S9]interview[/]? — Прекрасно. Теперь подпись вот здесь. Когда собеседование?


    - **Date of birth** — дата рождения.

    - **Education** (учёба): **school, college, university**; любимый **subject**.

    - **Experience** — опыт работы.

    - **Skills** — навыки, **hobbies** — увлечения.

    - **Signature** — подпись.

    '
- number: 4
  body: '**Почему «I want to be a chef», а не «I want be chef»?** Если после **want** стоит другой глагол, используйте **to + глагол**: *I want to be a teacher.* Но перед существительным to не нужен: *I want a job.* Когда называем профессию одного человека, обычно нужны **a / an**: *a chef, an engineer*. Выбор a или an зависит от первого звука следующего слова. Во множественном числе артикля a/an нет: *They are teachers.*


    **experience** в значении «опыт» — без -s и без a: *I have experience.*


    **Диагностика понимания:** что верно: *I have a lot of experiences in cooking* или *I have experience in cooking*?


    **Разбор:** *I have experience…* — без -s.

    '
- number: 5
  body: 'Так говорят американцы:


    > [D1]Do[/] [X1]not[/] [D3]worry[/]. [T8]I[/] [D1]am[/] [J4]proud[/] [P6]of[/] [T8]you[/]. [J3]Good[/] [S10]luck[/]! — Не переживай. Я тобой горжусь. Удачи!


    - **Good luck!** — удачи!

    - **I''m proud of you.** — я тобой горжусь.

    - **It''s my dream.** — это моя мечта.


    Слова: **apply** — подавать заявление, **college, university**, **chef** — шеф-повар, **dream** — мечта, **experience** — опыт, **skill** — навык, **hobby** — хобби, **subject** — предмет, **math** — математика, **history** — история, **art** — рисование, искусство, **date** — дата, **birth** — рождение, **signature** — подпись, **application** — заявление, **interview** — собеседование, **proud** — гордый.

    '
- number: 6
  body: 'Ловушки:


    - «I want be a chef» — **want to be**.

    - «experiences» в значении «опыт работы» — **experience**.

    - «history» — наука; рассказ — **story**.

    - «maths» — британское; в США **math**.

    '
- number: 7
  body: 'Шесть заданий: заполнить поле анкеты, сказать о мечте, собрать фразу о навыках, рассказать о любимом предмете, выбрать story или history и пожелать удачи.


    **Проверка маленького шага:** date of birth, experience, skills, signature — Good luck!

    '
