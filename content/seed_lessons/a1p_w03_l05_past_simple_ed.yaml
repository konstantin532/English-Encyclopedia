layers:
- number: 1
  body: 'Понедельник, офис. Коллега Кейт спрашивает Тома о выходных, и Том перечисляет дела: навестил, приготовил, убрал, починил. Все эти глаголы в прошлом получают одно и то же окончание **-ed**.


    > [X1]Not[/] [J3]bad[/]. [P3]On[/] [S7]Saturday[/] [T8]I[/] [D4]visited[/] [T3]my[/] [S1]grandparents[/]. [T8]I[/] [D2]cooked[/] [S3]dinner[/] [P5]for[/] [T8]them[/]. — Неплохо. В субботу я навестил бабушку с дедушкой. Приготовил им ужин.

    '
- number: 2
  body: |
    **Правильные глаголы** образуют форму Past Simple с **-ed**: **work → worked, play → played**. Это грамматическое окончание, а не отдельное слово со значением «сделано». Форма одна для всех лиц — I worked, she worked, they worked.

    Past Simple показывает действие или состояние в прошлом; оно не обязано быть коротким или завершённым в русском смысле: *I worked all day* — «я работал весь день». Поэтому не выбирайте это время только по русскому окончанию «-л» или по различию «делал / сделал».

- number: 3
  body: |
    Схема:

    > [T8]I[/] [D2]cleaned[/] [T3]my[/] [S2]apartment[/]. — Я убрал квартиру.
    > [T8]I[/] [D2]stayed[/] [P3]at[/] [S2]home[/]. — Я сидел дома.

    - Глагол + **-ed**: clean → cleaned, visit → visited, stay → stayed.
    - Кончается на **-e** → только **-d**: love → loved, bake → baked.
    - Согласная + **y** → **-ied**: try → tried, carry → carried. Но гласная + y — просто -ed: play → played, stay → stayed.
    - В односложном слове с одной гласной буквой перед одной конечной согласной обычно удваиваем согласную: **plan → planned, stop → stopped**. Конечные **w, x, y** не удваиваем: **fix → fixed, play → played**. Слово **relax → relaxed** тоже не получает xx.
    - Когда: **last weekend, last night, yesterday, on Saturday** — в начале или в конце.

- number: 4
  body: |
    **Почему «I cooked», а не «I was cook»?** По-русски прошлое — это отдельная форма глагола («готовил»), и в английском тоже: просто добавляем -ed. В изучаемой схеме **Past Simple** вспомогательный **was** перед cooked не нужен: *I cooked dinner*. Но нельзя делать вывод, что **was** вообще не бывает рядом с другим глаголом: у других конструкций свои правила, их будем изучать отдельно.

    > [T8]I[/] [D8]finished[/] [T8]it[/] [J8]last[/] [S7]night[/]. — Я закончил его вчера вечером.

    **Диагностика понимания:** как сказать «Я весь день отдыхал»: *I was relax all day* или *I relaxed all day*?

    **Разбор:** *I relaxed all day.* Глагол + -ed, без was.

- number: 5
  body: 'Так говорят американцы:


    > [T8]I[/] [D2]stayed[/] [P3]at[/] [S2]home[/]. [T8]I[/] [D6]watched[/] [N1]three[/] [S10]movies[/] [C1]and[/] [D2]relaxed[/]. — Я сидела дома. Посмотрела три фильма и отдыхала.


    - Несколько дел подряд — через **and** или **After that**: I cleaned my apartment and fixed my bike. After that I played the guitar.

    - **all day** — весь день: I played the guitar all day.

    - **last weekend** — в прошлые выходные, без предлога.


    Глаголы недели: **visit** — навещать, **stay** — оставаться, **enjoy** — получать удовольствие, **relax** — отдыхать, **plan** — планировать, **try** — стараться, **use** — пользоваться, **remember** — вспоминать, **invite** — приглашать, **paint** — рисовать красками, **fix** — чинить, **carry** — нести, **hate** — терпеть не мочь.

    '
- number: 6
  body: |
    Ловушки:

    - Для смысла «я убрал» выбирайте **I cleaned**. **I was cleaned** — другая конструкция с другим смыслом («меня вымыли / очистили»), а не способ построить Past Simple от clean.
    - «I tryed», «I carryed» — после согласной y → i: **tried, carried**.
    - Для прошлого от **plan** нужно **planned**, с удвоенной n. **Plane** — другое слово, а не прошедшая форма plan.
    - «вИзитэд» с ударением на конец — нет, ударение остаётся: **VIsited**.

- number: 7
  body: |
    Шесть заданий: узнать прошедшее время, написать форму с -ied, собрать фразу о выходных, рассказать, что вы делали вчера, услышать «ид» и выбрать фразу без was.

    **Проверка маленького шага:** в утвердительном Past Simple правильный глагол получает -ed; форма одинакова для всех лиц. Перед ней не добавляем was. Неправильные формы, вопросы и отрицания изучим отдельно.

