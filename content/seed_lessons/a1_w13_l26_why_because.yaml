slug: a1-why-because
level: A1
week: 13
order: 26
focus: C
minutes: 40
title: "Почему? Потому что: Why? и because"
summary: "Как спросить о причине и ответить: Why? — Because I like Russian music. Как построить вопрос с do или be и назвать причину полной мыслью."
units: [LX-00241, LX-00242, LX-00245, LX-00250, LX-00434, LX-00435, LX-00436, LX-00437, LX-00438, LX-00439, LX-00440, LX-00441, LX-00442, LX-00443, LX-00444, LX-00445, LX-00446, LX-00447, LX-00448, LX-00449, LX-00450, LX-00451, LX-00452, LX-00453, LX-00454, LX-00455, LX-00456]
sound_notes:
  - text: "Why, Mia?"
    ipa: "/ˈwaɪ ˈmiə/"
    note_ru: "why звучит как название буквы Y. В нейтральном вопросе тон часто понижается; переспрос может звучать иначе."
  - text: "Because I like Russian music."
    ipa: "/bɪˈkɔz aɪ ˈlaɪk ˈrʌʃən ˈmjuzɪk/"
    note_ru: "ударение на второй слог: «бикОз»"
  - text: "The lesson is on Saturday at ten."
    ipa: "/ðə ˈlɛsən ɪz ɑn ˈsæt̬ɚˌdeɪ ət ˈtɛn/"
    note_ru: "lesson — ударение на первом слоге: «лэсэн»"
contractions:
  - full: "is not"
    short: "isn't"
    ipa: "/ˈɪzənt/"
    note_ru: "Why isn't Tom here? — «Почему Тома нет?». Полная форма is not тоже возможна; сокращение обычно в разговоре."
layers:
  - number: 1
    body: |
      Зачем американцу русский? Том отвечает: из-за музыки. Мия — из-за красивых букв. «Почему?» — «Потому что…» — так начинается настоящий разговор, а не обмен фразами из учебника.

      В разговоре мы всё время объясняем: «почему?» — «потому что…». По-английски это пара **Why?** — **Because…**

      > [O4]Yes[/], [T8]I[/] [D7]can[/]! [C5]But[/] [A6]why[/], [S1]Tom[/]? — Конечно! Но зачем тебе, Том?
      > [C3]Because[/] [T8]I[/] [D3]like[/] [S10]Russian[/] [S10]music[/]. — Потому что мне нравится русская музыка.

      **Why** спрашивает о причине **или цели** («почему?» / «зачем?») в зависимости от ситуации. **Because** вводит **причину**, объясняющую ответ. Не любой вопрос с *why* требует начинать ответ строго с *because*: это удобный тренировочный каркас, а не обязательный закон разговора.
  - number: 2
    body: |
      **Добавьте вопрос к знакомому утверждению.** *You like music.* → *Why do you like music?* С обычным **like** нужен помощник **do**.

      *You are tired.* → *Why are you tired?* С **be** переставляем **are** перед **you**, без **do**.

      В ответе назовите причину: *Because I work at night.* — «Потому что я работаю ночью». **Why** задаёт вопрос, **because** начинает объяснение.
  - number: 3
    body: |
      Схема:

      > [A6]Why[/], [S1]Mia[/]? — А тебе зачем, Мия?
      > [C3]Because[/] [T1]the[/] [S10]Russian[/] [S9]letters[/] [D1]are[/] [J3]nice[/]! — Потому что русские буквы красивые!

      - Короткий вопрос: Why?
      - Полный вопрос с do: Why do you like Russian music?
      - С be — без do: Why is Tom happy?
      - Ответ: Because + полная мысль: Because I like music.
  - number: 4
    body: |
      **После because в наших ответах — целая мысль.** *Because I like music* сообщает, **кто** (*I*) и **что делает** (*like music*). В *Because the exercise is difficult* сказано, **что** (*the exercise*) и **какое оно** (*is difficult*). В грамматике because вводит **придаточную часть причины** — часть предложения, которая объясняет «почему».

      На вопрос **Why?** можно ответить отдельной репликой: *Because I like music.* Причину можно присоединить к основной мысли: *I learn Russian because I like the music.* Начало реплики с **Because** само по себе не ошибка; важно, чтобы собеседнику было понятно, что вы объясняете.

      **Не добавляйте of перед I like.** Сравните: *because I like music* — «потому что я люблю музыку»; *because of the music* — «из-за музыки». После **because of** здесь только название причины, **the music**. Форму **because of I like music** не используем.

      **Диагностика понимания:** вы хотите сказать «Потому что я люблю музыку». Что подходит: *Because I like music* или *Because of I like music*?

      **Разбор:** *Because I like music*. После because здесь идёт целая мысль, а не только название причины; перед I like слово of лишнее.
  - number: 5
    body: |
      Так объясняют причины американцы:

      > [C3]Because[/] [T8]I[/] [D3]like[/] [S10]Russian[/] [S10]music[/]. — Потому что мне нравится русская музыка.
      > [T1]The[/] [S9]lesson[/] [D1]is[/] [P3]on[/] [S7]Saturday[/] [P3]at[/] [N3]ten[/]! [D2]Take[/] [T1]a[/] [S2]notebook[/], [O8]please[/]. — Урок в субботу в десять! Возьмите тетрадь, пожалуйста.

      - **Why not?** часто означает «Почему бы и нет?» в ответе на предложение, но иногда буквально спрашивает **«А почему нет?»**. Решают контекст и интонация.
      - Why? Because! — так шутят, когда не хотят объяснять.
      - В быстрой речи вы можете услышать сокращённое ’cause. На этой ступени используйте полное because; сокращённые слияния вводятся позже.

      Учимся объяснять трудность:

      > [C3]Because[/] [T1]the[/] [S9]exercise[/] [D1]is[/] [J3]difficult[/]. — Потому что упражнение трудное.
      > [C3]Because[/] [T8]I[/] [D1]do[/][X1]n't[/] [D6]understand[/] [T1]the[/] [S9]word[/]. — Потому что я не понимаю слово.

      **Question** — вопрос; **answer** — ответ. **Sentence** — предложение, **page** — страница, **exercise** — отдельное учебное упражнение, **test** — проверочная работа. **Easy** и **difficult** говорят о сложности, а знакомые light и heavy — о весе.

      Указания на уроке: **Open your book to page ten.** — «Откройте книгу на странице десять». **Repeat the sentence, please.** — «Повторите предложение, пожалуйста». Тетрадь — notebook, бумага — paper; домашняя работа — homework: **I do my homework**.

      **I study English because my friend speaks English.** — «Я изучаю английский, потому что мой друг говорит по-английски». В вопросе **Why do you study English?** нужен do, но с be — **Why is the exercise difficult?** без do. Причину после because называйте целой мыслью: кто что делает или какой предмет каков.
  - number: 6
    body: |
      Ловушки:

      - «Why you like it?» — пропущен do. Правильно: Why do you like it?
      - Не смешивайте **because I like music** и **because of the music**. Первая конструкция содержит целую мысль, вторая — только название причины. Перед **I like** слово **of** лишнее.
      - Русское «зачем» и «почему» по-английски часто оба — why.
  - number: 7
    body: |
      Шесть заданий: понять вопрос о причине, вставить because, собрать вопрос, назвать причину по условию, выбрать фразу о трудности и объяснить непонимание слова.

      **Проверка маленького шага:** *Because I like music* — после **because** идёт целая мысль: **кто** (*I*) и **что делает** (*like*). *Because of the music* — после **because of** только группа с существительным. Похожий русский перевод «из-за музыки / потому что…» не делает английские конструкции взаимозаменяемыми.
