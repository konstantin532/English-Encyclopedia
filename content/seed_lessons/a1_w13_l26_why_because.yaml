slug: a1-why-because
level: A1
week: 13
order: 26
focus: C
minutes: 40
title: "Почему? Потому что: Why? и because"
summary: "Как спросить о причине и ответить: Why? — Because I like Russian music. Чем why отличается от what for и как звучит разговорное ’cause."
units: [LX-00241, LX-00242, LX-00245, LX-00250, LX-00434, LX-00435, LX-00436, LX-00437, LX-00438, LX-00439, LX-00440, LX-00441, LX-00442, LX-00443, LX-00444, LX-00445, LX-00446, LX-00447, LX-00448, LX-00449, LX-00450, LX-00451, LX-00452, LX-00453, LX-00454, LX-00455, LX-00456]
sound_notes:
  - text: "Why, Mia?"
    ipa: "/ˈwaɪ ˈmiə/"
    note_ru: "why — как буква Y: «уай»; голос опускается в конце"
  - text: "Because I like Russian music."
    ipa: "/bɪˈkɔz aɪ ˈlaɪk ˈrʌʃən ˈmjuzɪk/"
    note_ru: "ударение на второй слог: «бикОз»"
  - text: "The lesson is on Saturday at ten."
    ipa: "/ðə ˈlɛsən ɪz ɑn ˈsæt̬ɚˌdeɪ ət ˈtɛn/"
    note_ru: "lesson — ударение на первом слоге: «лэсэн»"
contractions:
  - full: "is not"
    short: "isn't"
    ipa: "/ˈɪzənt/"
    note_ru: "Why isn't Tom here? — «Почему Тома нет?». Полная форма is not тоже возможна; сокращение обычно в разговоре."
layers:
  - number: 1
    body: |
      Зачем американцу русский? Том отвечает: из-за музыки. Мия — из-за красивых букв. «Почему?» — «Потому что…» — так начинается настоящий разговор, а не обмен фразами из учебника.

      В разговоре мы всё время объясняем: «почему?» — «потому что…». По-английски это пара **Why?** — **Because…**

      > [O4]Yes[/], [T8]I[/] [D7]can[/]! [C5]But[/] [A6]why[/], [S1]Tom[/]? — Конечно! Но зачем тебе, Том?
      > [C3]Because[/] [T8]I[/] [D3]like[/] [S10]Russian[/] [S10]music[/]. — Потому что мне нравится русская музыка.

      **Why** спрашивает о причине **или цели** («почему?» / «зачем?») в зависимости от ситуации. **Because** вводит **причину**, объясняющую ответ. Не любой вопрос с *why* требует начинать ответ строго с *because*: это удобный тренировочный каркас, а не обязательный закон разговора.
  - number: 2
    body: |
      **because** — сложение двух слов: by + cause, «по причине». Так же в русском «потому что» = «по тому, что».

      **Why** — старое вопросительное слово германского происхождения, исторически связанное с вопросительными формами вроде **what**. Но считать **why** просто «формой от who и what» неточно. Слова **what, where, who, why** действительно имеют древнее родство, однако в современном английском у каждого **собственная функция**: причина, место, лицо или предмет.
  - number: 3
    body: |
      Схема:

      > [A6]Why[/], [S1]Mia[/]? — А тебе зачем, Мия?
      > [C3]Because[/] [T1]the[/] [S10]Russian[/] [S9]letters[/] [D1]are[/] [J3]nice[/]! — Потому что русские буквы красивые!

      - Короткий вопрос: Why?
      - Полный вопрос с do: Why do you like Russian music?
      - С be — без do: Why is Tom happy?
      - Ответ: Because + полная мысль: Because I like music.
  - number: 4
    body: |
      **Почему после because обычно целая мысль?** **Because** вводит **придаточную часть причины**, часто с подлежащим и сказуемым: *because I like music*. В коротком разговоре возможны и неполные ответы, но здесь мы тренируем **полную причину**, чтобы ученик понимал структуру. Не путайте с **because of**: это сочетание ставят перед именной группой (*because of the music*), а не перед фразой *I like music*.

      На вопрос **Why?** естественно ответить **Because I like music** — отдельной репликой. В полном предложении причина может идти **после основной мысли**: *I learn Russian because I like the music*. Поэтому начало предложения с *Because…* **не является ошибкой само по себе**; важно, чтобы мысль была понятна в контексте.

      **Диагностика понимания:** Вы объясняете причину целым предложением. Что верно: *Because I like music* или *Because of I like music*?

      **Разбор:** *Because I like music*. После **because** здесь есть полноценная мысль (*I + like*). В **because of the music** после **of** стоит **именная группа**, а не *I like music*. Обе формы полезны, но их устройство разное.
  - number: 5
    body: |
      Так объясняют причины американцы:

      > [C3]Because[/] [T8]I[/] [D3]like[/] [S10]Russian[/] [S10]music[/]. — Потому что мне нравится русская музыка.
      > [T1]The[/] [S9]lesson[/] [D1]is[/] [P3]on[/] [S7]Saturday[/] [P3]at[/] [N3]ten[/]! [D2]Take[/] [T1]a[/] [S2]notebook[/], [O8]please[/]. — Урок в субботу в десять! Возьмите тетрадь, пожалуйста.

      - **Why not?** часто означает «Почему бы и нет?» в ответе на предложение, но иногда буквально спрашивает **«А почему нет?»**. Решают контекст и интонация.
      - Why? Because! — так шутят, когда не хотят объяснять.
      - В быстрой речи вы можете услышать сокращённое ’cause. На этой ступени используйте полное because; сокращённые слияния вводятся позже.

      Учимся объяснять трудность:

      > [C3]Because[/] [T1]the[/] [S9]exercise[/] [D1]is[/] [J3]difficult[/]. — Потому что упражнение трудное.
      > [C3]Because[/] [T8]I[/] [D1]do[/][X1]n't[/] [D6]understand[/] [T1]the[/] [S9]word[/]. — Потому что я не понимаю слово.

      **Question** — вопрос; **answer** — ответ. **Sentence** — предложение, **page** — страница, **exercise** — отдельное учебное упражнение, **test** — проверочная работа. **Easy** и **difficult** говорят о сложности, а знакомые light и heavy — о весе.

      Указания на уроке: **Open your book at page ten.** — «Откройте книгу на странице десять». **Repeat the sentence, please.** — «Повторите предложение, пожалуйста». Тетрадь — notebook, бумага — paper; домашняя работа — homework: **I do my homework**.

      **I study English because my friend speaks English.** — «Я изучаю английский, потому что мой друг говорит по-английски». В вопросе **Why do you study English?** нужен do, но с be — **Why is the exercise difficult?** без do. Причину после because называйте целой мыслью: кто что делает или какой предмет каков.
  - number: 6
    body: |
      Ловушки:

      - «Why you like it?» — пропущен do. Правильно: Why do you like it?
      - **Because I like music** — за ним идёт **целая мысль** (*I like music*). **Because of the music** — после *because of* идёт **именная группа** (*the music*). Поэтому *because of I like…* неверно: после *of* здесь не подходит личная форма *I like*.
      - Русское «зачем» и «почему» по-английски часто оба — why.
  - number: 7
    body: |
      Шесть заданий: понять вопрос о причине, вставить because, собрать вопрос, объяснить свою причину, выбрать фразу о трудности и объяснить непонимание слова.

      **Проверка маленького шага:** *Because I like music* — после **because** идёт целая мысль: **кто** (*I*) и **что делает** (*like*). *Because of the music* — после **because of** только группа с существительным. Похожий русский перевод «из-за музыки / потому что…» не делает английские конструкции взаимозаменяемыми.
exercises:
  - order: 1
    kind: choice
    stage: recognition
    prompt_ru: "Анна спрашивает: Why, Tom? Что ей ответить?"
    options: ["Because I like Russian music.", "Yes, I can.", "On Saturday at ten."]
    answer: "Because I like Russian music."
    hint_ru: "На why отвечают с because."
    explanation_ru: "Why? спрашивает о причине или цели. Because I like Russian music объясняет причину. В этом упражнении удобный ответ начинается с because, но в разговоре возможны и другие формы."
    units: [LX-00241, LX-00250]
  - order: 2
    kind: fill
    stage: substitution
    prompt_ru: "Мия объясняет, почему хочет учить русский. Вставьте слово."
    prompt_en: "___ the Russian letters are nice!"
    answer: "Because"
    hint_ru: "«Потому что»."
    explanation_ru: "Because the Russian letters are nice! — because вводит причину."
    units: [LX-00242]
  - order: 3
    kind: build
    stage: production
    prompt_ru: "Соберите вопрос: «Почему ты любишь музыку?»"
    options: [music, Why, like, you, do]
    answer: "Why do you like music"
    hint_ru: "Why + do you + глагол."
    explanation_ru: "Why do you like music? — с обычным глаголом нужен do."
    units: [LX-00241]
  - order: 4
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: на курсах вас спрашивают, почему вам нравится английский. Объясните одной фразой с because."
    prompt_en: "Why do you like English? — ___"
    answer: "Because I like English music."
    accepted: ["Because I like English music.", "Because my friend speaks English.", "Because I work in English.", "Because I can speak English."]
    hint_ru: "Because + полная мысль."
    explanation_ru: "Because I like English music — возможная причина интереса к языку. Здесь тренируем because + подлежащее + сказуемое, но причина должна по смыслу отвечать на вопрос. Фраза Because I like English повторяет исходный вопрос, не объясняя почему; Because I like music не обязательно связана с английским."
    units: [LX-00242]
  - order: 5
    kind: choice
    stage: recognition
    prompt_ru: Вас спрашивают, почему вы просите помощи с упражнением. Выберите ответ с полной причиной.
    options:
    - Because the exercise is difficult.
    - Because the exercise difficult.
    - Why the exercise is difficult.
    answer: Because the exercise is difficult.
    hint_ru: Нужны because, предмет и is перед difficult.
    explanation_ru: 'Because the exercise is difficult — причина с полным предложением: the exercise + is + difficult.'
    units:
    - LX-00452
    - LX-00456
  - order: 6
    kind: fill
    stage: transfer
    prompt_ru: 'Учитель спрашивает, почему вы просите повторить слово. Ответьте: «Потому что я не понимаю это слово».'
    prompt_en: Why? — ___
    answer: Because I don't understand the word.
    accepted:
    - Because I don't understand the word
    - Because I do not understand the word.
    - Because I do not understand the word
    hint_ru: Because + I don’t understand + the word.
    explanation_ru: После because следует полная причина. Отрицание обычного understand — don’t understand.
    units:
    - LX-00437
    - LX-00242
