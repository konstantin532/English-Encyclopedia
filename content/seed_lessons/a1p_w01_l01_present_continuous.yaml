layers:
- number: 1
  body: 'Субботнее утро, кафе Мии. Тому звонит мама и первым делом спрашивает: «Что ты делаешь прямо сейчас?» Чтобы ответить, нужна одна новая конструкция — и вы сможете рассказывать о том, что происходит в эту самую минуту.


    > [T9]What[/] [D1]are[/] [T8]you[/] [D2]doing[/] [A5]right[/] [A2]now[/]? — Что ты делаешь прямо сейчас?

    > [T8]I[/] [D1]am[/] [D2]drinking[/] [S3]coffee[/] [C1]and[/] [D5]talking[/] [P2]to[/] [T8]you[/]! — Пью кофе и разговариваю с тобой!


    **Present Continuous** — время «процесса»: действие идёт сейчас, на ваших глазах. По-русски для этого хватает «пью», в английском нужны два слова: **am / is / are** + глагол с **-ing**.

    '
- number: 2
  body: '**Continuous** — «продолжающееся», от латинского *continuus*, «непрерывный». То же слово в «континент» — непрерывная земля.


    Окончание **-ing** когда-то было отдельным словом: «в процессе». *He is making* буквально — «он есть в делании». Поэтому без **is** фраза рассыпается: процесс должен кому-то принадлежать.

    '
- number: 3
  body: 'Схема:


    > [T8]I[/] [D1]am[/] [D2]drinking[/] [S3]coffee[/]. — Я пью кофе (сейчас).

    > [S1]Mia[/] [D1]is[/] [D2]making[/] [T1]a[/] [S3]cake[/]. — Мия печёт торт.

    > [T8]We[/] [D1]are[/] [D2]cleaning[/] [T1]the[/] [S2]kitchen[/]. — Мы убираем кухню.


    - **I** → am: I am drinking.

    - **he / she / it**, одно имя → is: Mia is making, she is writing.

    - **you / we / they** → are: you are wearing, we are cleaning.

    - Глагол получает **-ing**: drink → drinking, make → making (e пропадает), sit → sitting (t удваивается).

    '
- number: 4
  body: '**Почему нельзя просто «I drink coffee»?** Можно, но смысл другой. *I drink coffee* — «я (вообще) пью кофе», это привычка, Present Simple из A1. *I am drinking coffee* — «пью прямо сейчас». Сравните:


    > [T8]I[/] [D2]drink[/] [S3]coffee[/] [P3]at[/] [N3]seven[/]. — Я пью кофе в семь (каждый день).

    > [T8]I[/] [D1]am[/] [D2]drinking[/] [S3]coffee[/] [A5]right[/] [A2]now[/]. — Я пью кофе прямо сейчас.


    Слова-сигналы помогают: **now, right now, at the moment** — почти всегда Present Continuous. **always, every day, at seven** — Present Simple.


    **Диагностика понимания:** мама звонит и спрашивает, что вы делаете. Вы как раз пишете письмо. Что сказать: *I write a letter* или *I am writing a letter*?


    **Разбор:** *I am writing a letter* (или *I''m writing a letter*). Действие идёт сейчас — значит **am + -ing**. *I write letters* сказало бы о привычке.

    '
- number: 5
  body: 'Так говорят американцы:


    > [T2]That[/] [D1]is[/] [S1]Anna[/]. [T8]She[/] [D1]is[/] [D2]sitting[/] [P3]at[/] [T1]the[/] [S2]window[/]. — Это Анна. Она сидит у окна.

    > [D1]Is[/] [T9]someone[/] [D2]laughing[/]? — Кто-то смеётся?


    - В разговоре **am / is / are** почти всегда сокращают: I''m, she''s, you''re, we''re.

    - Вопрос — **is / are** выходит вперёд: *Are you wearing your jacket?* *Is Mia making a cake?*

    - Короткие ответы: *Yes, I am. / No, I''m not. Yes, she is. / No, she isn''t.*


    Полезные действия этой недели: **make** — делать, готовить; **wash** — мыть; **clean** — убирать; **hold** — держать; **smile** — улыбаться; **laugh** — смеяться.

    '
- number: 6
  body: 'Ловушки:


    - «I drinking coffee» — потерян **am**. Правильно: I am drinking coffee.

    - «She are making» — с she нужен **is**.

    - «I am know», «I am like coffee» — с глаголами состояния (know, like, want) Present Continuous обычно не используют: *I know*, *I like coffee*.

    - Написание: make → making (без e), sit → sitting, swim → swimming.

    '
- number: 7
  body: 'Шесть заданий: узнать фразу о «сейчас», выбрать am / is / are, собрать вопрос, рассказать о себе в новой ситуации, отличить привычку от процесса и ответить коротко.


    **Проверка маленького шага:** «сейчас» — это **am / is / are + -ing**. «Обычно, каждый день» — Present Simple без -ing. Если в фразе есть **right now**, ищите **-ing**.

    '
