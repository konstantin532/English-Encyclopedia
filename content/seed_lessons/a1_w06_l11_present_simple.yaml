title: "Мой день: I get up, I eat, I go to bed — настоящее простое время"
summary: "Как рассказать о том, что вы делаете каждый день: I work, I drink coffee. Как спросить Do you…? и ответить Yes, I do. Что такое фразовый глагол get up."
units: [LX-00124, LX-00125, LX-00126, LX-00127, LX-00128, LX-00129, LX-00130, LX-00134, LX-00137, LX-00138, LX-00139, LX-00303, LX-00304, LX-00305, LX-00306, LX-00307, LX-00308, LX-00313, LX-00314, LX-00315, LX-00318]
sound_notes:
  - text: "I work here every day."
    ipa: "/aɪ ˈwɝk hɪr ˈɛvri ˈdeɪ/"
    note_ru: "в work губы трубочкой, потом американское r — без звука «о»"
  - text: "Do you have breakfast?"
    ipa: "/də jə hæv ˈbrɛkfəst/"
    note_ru: "do и you в беглой речи часто без ударения; слушайте /də jə/, ударение на breakfast"
  - text: "I get up at six."
    ipa: "/aɪ ɡɛt̬ ˈʌp ət ˈsɪks/"
    note_ru: "t между гласными звучит мягко, почти как «д»: «гэдап»"
contractions:
  - full: "do not"
    short: "don't"
    ipa: "/doʊnt/"
    note_ru: "I don't work at five — «Я не работаю в пять». В разговоре почти всегда don't."
layers:
  - number: 1
    body: |
      Мия встаёт в пять, Том — в шесть, а таинственный большой кот приходит в кафе ровно в семь. Каждый день. Сегодня вы научитесь рассказывать о своём обычном дне — а это то, о чём люди говорят чаще всего.

      Чтобы рассказать о своём дне, нужно время, которое описывает привычки: что вы делаете обычно, каждый день. По-английски это **Present Simple** — настоящее простое.

      > [T8]I[/] [D9]get[/] [X3]up[/] [P3]at[/] [N3]five[/]. [T8]I[/] [D2]work[/] [A3]here[/] [T5]every[/] [S7]day[/]. — Я встаю в пять. Я работаю здесь каждый день.

      С **I** и **you** в простом утверждении о привычке глагол обычно без окончания **-s**: *I work*, *you work*. Перед точным временем действия ставьте **at**: *at five* — «в пять». Почему используется этот предлог, объяснит следующий урок. Главное действие здесь — *get up* («вставать»).
  - number: 2
    body: |
      **Когда говорим I work?** Представьте обычный день Мии: *I work here every day.* Она описывает **свой распорядок**, а не утверждает, что работает именно в момент произнесения фразы. Present Simple помогает говорить о привычках, регулярных действиях и фактах. Слова *every day* показывают, что речь о повторяющемся действии.

      **Почему I work без am?** Потому что **work** уже обозначает действие. Сравните: *I work here* — «Я здесь работаю» и *I am at home* — «Я дома». Во второй фразе **am** связывает человека с местом; в первой эту работу выполняет глагол **work**.

      **Что меняется, когда мы спрашиваем или отрицаем?**
      - *I work here.* — Сообщаю о своей работе.
      - *Do you work here?* — Спрашиваю о работе собеседника.
      - *I do not work here.* / *I don't work here.* — Говорю, что здесь не работаю.

      **Do** здесь не значит «делать»: оно помогает образовать вопрос или отрицание. Поэтому в настоящем простом нужны не только глаголы действий, но иногда и **вспомогательный do**. В этом уроке мы работаем с **I / you**; формы **he / she** разберём позже.
      **breakfast** состоит из break («прервать») и fast («поститься»): после ночи без еды наступает завтрак.
  - number: 3
    body: |
      Схема для I и you:

      > [T8]I[/] [D2]drink[/] [S3]coffee[/] [P3]at[/] [N3]seven[/]. — Я пью кофе в семь.
      > [D1]Do[/] [T8]you[/] [D2]have[/] [S3]breakfast[/]? — Ты завтракаешь?
      > [O4]Yes[/], [T8]I[/] [D1]do[/]. — Да.

      - Утверждение: I или you + глагол из словаря: I work.
      - Вопрос: do в начале: Do you work?
      - Короткий ответ: Yes, I do. / No, I do not — в разговоре No, I don't.
      - Отрицание: I do not work — I don't work.
  - number: 4
    body: |
      **Почему в вопросе появляется do?** В русском вопрос может отличаться только интонацией: «Ты работаешь?». В английском **обычный нейтральный вопрос о привычке** строят с помощником **do**: *Do you work?* После него идёт **you + work**. А **be** — особый глагол, он выходит вперёд сам: *Is it…?*. Английская интонация тоже важна, но для учебного полного вопроса одного подъёма голоса обычно недостаточно.

      **Get up** — **фразовый глагол**: знакомое слово действия **get** вместе с частицей **up** образует устойчивое значение «вставать» (например, с кровати). Нельзя каждый раз переводить слова по отдельности. Обратите внимание на разницу: *get up* — подняться, встать; *go to bed* — лечь спать. Эту пару полезно учить как два действия одного дня.

      > [T9]What[/] [S7]time[/] [D1]do[/] [T8]you[/] [D9]get[/] [X3]up[/]? — Во сколько ты встаёшь?

      **Диагностика понимания:** Вы хотите узнать, работает ли человек обычно. Что верно: *Do you work?* или *Do you are work?*?

      **Разбор:** *Do you work?* В таком вопросе **do** уже вспомогательный глагол; **are** сюда не добавляют. Сравните с *Are you busy?*: там основное слово **busy** описывает состояние, поэтому нужен **be**.
  - number: 5
    body: |
      Так звучит разговор о дне в Америке:

      > [T9]What[/] [S7]time[/] [D1]do[/] [T8]you[/] [D9]get[/] [X3]up[/], [S1]Mia[/]? — Во сколько ты встаёшь, Мия?
      > [T8]I[/] [D9]get[/] [X3]up[/] [P3]at[/] [N3]five[/]. — Я встаю в пять.
      > [P3]At[/] [N3]five[/]! [D1]Do[/] [T8]you[/] [D2]have[/] [S3]breakfast[/]? — В пять! А ты завтракаешь?
      > [O4]Yes[/], [T8]I[/] [D1]do[/]. [T8]I[/] [D2]have[/] [S3]breakfast[/] [P3]at[/] [N3]ten[/]. — Да. Я завтракаю в десять.

      **Здесь два разных вопроса.** На **What time…?** отвечают **временем** (*at five*). На **Do you have breakfast?** отвечают **Yes, I do / No, I don't**. Нельзя использовать *Yes, I do* как ответ на вопрос «Во сколько?» — нужно назвать время.

      - do you в быстрой речи звучит как «дэ ю», а иногда почти «джу».
      - Завтракают глаголом have: have breakfast, без артикля.
      - На вопрос Do you…? отвечают коротко: Yes, I do или No, I don't — повторять весь глагол не нужно.

      Глаголы обычного дня — по той же схеме: I + глагол.

      > [T8]I[/] [D2]drink[/] [S3]coffee[/] [P3]at[/] [N3]seven[/]. [T8]I[/] [D2]eat[/] [P3]at[/] [N3]twelve[/]. — В семь я пью кофе, а ем в двенадцать.
      > [T8]I[/] [D4]go[/] [P2]to[/] [S2]bed[/] [A2]early[/]! — Я рано ложусь спать!

      - [D2]take[/] [T1]a[/] [S2]shower[/] — принять душ, [D2]cook[/] [S3]dinner[/] — готовить ужин
      - [D6]watch[/] [S2]TV[/] — смотреть телевизор, [D6]listen[/] [P2]to[/] [S10]music[/] — слушать музыку
      - [D4]come[/] [A3]home[/] — приходить домой, [D4]go[/] [P2]to[/] [S2]bed[/] — ложиться спать

      Такие пары учите целиком: по-английски душ «берут» (take), а не «принимают».
  - number: 6
    body: |
      Три частые ошибки:

      - *I am work* — ошибка **для значения «я работаю (вообще, регулярно)»**: правильно *I work*. Но правило «be никогда не бывает рядом с действием» неверно: позднее вы узнаете другую конструкцию *I am working* («я работаю сейчас»). Пока тренируем **Present Simple**.
      - *You work?* может звучать как **короткий разговорный переспрос или удивление**, но для обычного вопроса о привычке учим *Do you work?*. Это **не** означает, что первый вариант невозможен во всех ситуациях.
      - «go to home» — домой идут без to: I go home.

      С **he / she** (а также с **it** и одним названным человеком) обычный глагол в Present Simple получает форму с **-s**: *she works*. В этой неделе достаточно освоить I / you; -s подробно изучим в следующем уроке.
  - number: 7
    body: |
      Шесть заданий: узнать вопрос о привычке, вставить do, собрать фразу о своём утре, ответить в новой ситуации, выбрать глагол для душа и описать свой вечер.

      **Проверка маленького шага:** *Do you get up at six?* — вопрос «**Да или нет?**», ответ *Yes, I do*. *What time do you get up?* — вопрос «**Во сколько?**», ответ *At six*. Помощник **do** присутствует в обоих, но **тип ответа** задаёт начало вопроса.
exercises:
  - order: 1
    uid: EX-00056
    kind: choice
    stage: recognition
    prompt_ru: "Как правильно сказать «Я работаю здесь каждый день»?"
    options: ["I work here every day.", "I am work here every day.", "I works here every day."]
    answer: "I work here every day."
    hint_ru: "С I глагол как в словаре, без am и без -s."
    explanation_ru: "I work — глагол без изменений. am рядом с work лишний, а форма с -s нужна с he, she, it или одним названным человеком в обычном утверждении Present Simple."
    units: [LX-00128, LX-00137]
  - order: 2
    uid: EX-00057
    kind: fill
    stage: substitution
    prompt_ru: "Спросите Мию, завтракает ли она. Вставьте слово-помощник."
    prompt_en: "___ you have breakfast?"
    answer: "Do"
    hint_ru: "Вопрос с обычным глаголом начинается с помощника."
    explanation_ru: "Do you have breakfast? — do выходит вперёд, а have остаётся как в словаре."
    units: [LX-00138]
  - order: 3
    uid: EX-00058
    kind: build
    stage: production
    prompt_ru: "Соберите фразу: «Я пью кофе в семь»."
    options: [seven, drink, I, at, coffee]
    answer: "I drink coffee at seven"
    accepted: ["At seven, I drink coffee"]
    hint_ru: "Кто — что делает — что — когда."
    explanation_ru: "I drink coffee at seven. Здесь время стоит в конце. At seven можно поставить и в начало, когда выделяем время; перед точным временем события используем at."
    units: [LX-00129, LX-00139]
  - order: 4
    uid: EX-00059
    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: коллега спрашивает, работаете ли вы каждый день. Вы работаете. Ответьте коротко."
    prompt_en: "Do you work every day? — ___"
    answer: "Yes, I do."
    accepted: ["Yes I do", "Yes, I do", "Yes. I do."]
    hint_ru: "Короткий ответ повторяет помощника do."
    explanation_ru: "Yes, I do. Повторять work не нужно — короткий ответ строится на do."
    units: [LX-00128, LX-00134]
  - order: 5
    uid: EX-00060
    kind: choice
    stage: recognition
    prompt_ru: "Как по-американски сказать «Я принимаю душ»?"
    options: ["I take a shower.", "I have shower.", "I am shower."]
    answer: "I take a shower."
    hint_ru: "Душ «берут»."
    explanation_ru: "I take a shower — устойчивое сочетание. Глагол take, перед shower — a."
    units: [LX-00308, LX-00314]
  - order: 6
    uid: EX-00061
    kind: fill
    stage: transfer
    prompt_ru: "Расскажите о своём вечере двумя фразами: «Я смотрю телевизор. Я рано ложусь спать»."
    prompt_en: "___"
    answer: "I watch TV. I go to bed early."
    accepted: ["I watch TV. I go to bed early", "I watch TV, and I go to bed early."]
    hint_ru: "watch TV — без артикля; go to bed early."
    explanation_ru: "I watch TV. I go to bed early. — после I глагол без -s, а TV и bed без артикля."
    units: [LX-00305, LX-00313, LX-00318]
