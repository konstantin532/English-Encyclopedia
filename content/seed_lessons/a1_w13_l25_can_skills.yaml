    kind: fill
    stage: transfer
    prompt_ru: "Новая ситуация: в поездке вас спрашивают, говорите ли вы по-английски. По условию вы говорите и по-русски, и по-английски. Ответьте коротко; если хотите, добавьте вторую фразу об обоих языках."
    prompt_en: "Can you speak English? — ___"
    answer: "Yes, I can. I can speak Russian and English."
    accepted: ["Yes, I can.", "Yes, I can", "Yes, I can. I speak Russian and English.", "Yes, I can speak English.", "Yes. I can speak Russian and English.", "Yes, I can. I can speak Russian and English"]
    hint_ru: "На Can you…? достаточно Yes, I can. Фразу о двух языках добавьте только по желанию."
    explanation_ru: "На Can you speak English? достаточно Yes, I can. Если вы хотите назвать оба языка, можно добавить I can speak Russian and English. Это образец по условию задания, а не предположение об умениях ученика."
