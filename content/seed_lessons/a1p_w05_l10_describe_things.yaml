layers:
- number: 1
  body: 'Чтобы зонт нашёлся, Анне нужно его описать: какой цвет, какая ручка. А когда зонт находится, сказать главное: «Это мой!»


    > [T9]What[/] [S2]color[/] [D1]is[/] [T8]it[/]? [D7]Can[/] [T8]you[/] [D5]describe[/] [T8]it[/]? — Какого он цвета? Можете его описать?

    > [T8]It[/] [D1]is[/] [J2]pink[/], [P4]with[/] [T1]a[/] [J1]long[/] [J2]black[/] [S2]handle[/]. [T8]It[/] [D1]was[/] [T1]a[/] [S2]gift[/]. — Розовый, с длинной чёрной ручкой. Это подарок.

    '
- number: 2
  body: '**Describe** — от латинского *describere*, «списать, срисовать»: описать вещь — словами «нарисовать» её. **Mine** — старая форма *my*: раньше перед гласной говорили *mine eyes*, «мои глаза». Сейчас mine стоит только отдельно, без существительного.

    '
- number: 3
  body: 'Схема описания:


    > [D2]Let[/] [T8]me[/] [D6]check[/]. [T2]This[/] [J2]pink[/] [S2]umbrella[/] [D1]has[/] [T1]a[/] [J1]short[/] [S2]handle[/]. — Сейчас проверю. У этого розового зонта ручка короткая.


    - Цвет: **It''s pink / gray / purple.**

    - Деталь: **with a long handle**, **with a small pocket**.

    - Порядок: размер или длина, потом цвет, потом вещь: **a long black handle**.

    - Что внутри: **My keys were inside.**

    - Сравнить: **the same** — тот же, **different** — другой.

    '
- number: 4
  body: |
    **my или mine?** **My** определяет существительное: *my umbrella, my pink umbrella*. Между my и существительным может стоять прилагательное. **Mine** заменяет всю группу «мой зонт»: *That's mine!* После mine не повторяют название вещи.

    Это не правило «mine всегда в конце»: **Mine is pink** — «мой — розовый» — тоже правильно. Пары: **my — mine, your — yours, her — hers**. У **his** обе формы совпадают: **his umbrella — it is his**. У самостоятельных yours / hers нет апострофа.

    > [O4]No[/], [T2]that[/] [D1]is[/] [X1]not[/] [T9]mine[/]. [T3]My[/] [S2]umbrella[/] [D1]is[/] [J3]different[/]. — Нет, это не мой. Мой другой.

    **Диагностика понимания:** что верно: *That umbrella is my* или *That umbrella is mine*?

    **Разбор:** *That umbrella is mine.* Здесь название вещи не повторяется: **mine** заменяет «мой зонт».

- number: 5
  body: 'Так говорят американцы:


    > [T2]That[/] [D1]is[/] [T9]mine[/]! [O2]Thank[/] [T8]you[/]! [T8]I[/] [D1]am[/] [A5]very[/] [J4]lucky[/]. — Это мой! Спасибо! Мне очень повезло.


    - **Here it is!** — вот он!

    - **I''m lucky** — мне повезло (буквально «я везучий»).

    - **another one** — ещё один, другой: We have another one.


    Слова: **glasses** — очки, **backpack** — рюкзак, **handle** — ручка, **long / short** — длинный / короткий, **purple** — фиолетовый, **gray** — серый, **inside / outside** — внутри / снаружи, **sure** — уверенный.

    '
- number: 6
  body: 'Ловушки:


    - «It is my» — без слова после нужно **mine**: It is mine.

    - «a black long handle» — сначала длина, потом цвет: **a long black handle**.

    - «the same color» — с **the** обязательно.

    - «What color it is?» — в вопросе is впереди: **What color is it?**

    '
- number: 7
  body: 'Шесть заданий: выбрать my или mine, задать вопрос о цвете, собрать описание, описать свой рюкзак, сравнить два зонта и сказать «Вот он!».


    **Проверка маленького шага:** цвет + деталь with…; my + слово, mine — без слова.

    '
