title: 'Описать вещь: It''s pink, with a long handle. That''s mine!'
summary: 'Как описать потерянную вещь: цвет, длина, ручка, что внутри. Отличаем my и mine, same и different и говорим в бюро находок: What color is it? Here it is!'
