layers:
- number: 1
  body: 'Субботнее утро. Прежде чем куда-то идти, американцы смотрят прогноз — **the forecast**. А температуру считают в градусах Фаренгейта.


    > [O7]Hmm[/]. [T9]What[/] [D1]is[/] [T1]the[/] [S6]weather[/] [P6]like[/]? — Хм. А какая погода?

    > [T1]The[/] [S10]forecast[/] [D5]says[/] [S6]rain[/] [P3]in[/] [T1]the[/] [S7]afternoon[/]. [C1]And[/] [T8]it[/] [D1]is[/] [A5]only[/] [N9]forty[/] [N9]degrees[/]. — По прогнозу днём дождь. И всего сорок градусов.

    '
- number: 2
  body: '**Forecast** — «бросок вперёд»: *fore* — «вперёд», *cast* — «бросать». Прогноз — это взгляд, брошенный в будущее. **Fahrenheit** — фамилия учёного XVIII века; в США до сих пор пользуются его шкалой. Запомните ориентиры: **32 °F** — ноль по Цельсию, **50 °F** — около +10, **70 °F** — около +21.

    '
- number: 3
  body: 'Схема:


    > [A6]How[/] [A6]about[/] [T1]a[/] [J1]short[/] [S10]walk[/] [P1]by[/] [T1]the[/] [S6]river[/] [A7]instead[/]? [T8]It[/] [D1]is[/] [X1]not[/] [J1]far[/]. — Может, лучше короткая прогулка у реки? Это недалеко.


    - Вопрос: **What''s the weather like?**

    - Ответ: **It''s sunny / rainy / foggy / cool / freezing.**

    - Прогноз: **The forecast says rain.**

    - Новая идея: **How about + слово / -ing…?** How about the museum? How about hiking?

    - Вместо: **…instead** — в конце фразы.

    - Начать: **Let''s go!**

    '
- number: 4
  body: '**Почему «What''s the weather like?», а не «How is the weather?»** Оба вопроса естественны. **What''s … like?** просит описать: «какой / какая?». Здесь **like** — предлог, а не глагол «нравиться»: поэтому у него другая линия и цвет. Вопрос строится с **is**, без do. Сравните: **Do you like the weather?** — «Тебе нравится погода?»; **What''s the weather like?** — «Какая погода?». *What''s your city like? What''s Leo like?*


    > [D6]Look[/] [P7]at[/] [T1]the[/] [S6]sky[/]. [T9]There[/] [D1]are[/] [J1]big[/] [J2]dark[/] [S6]clouds[/]. [T8]It[/] [D6]looks[/] [P6]like[/] [S6]rain[/]. — Посмотри на небо. Большие тёмные тучи. Похоже, будет дождь.


    **Диагностика понимания:** что верно: *How about go to the lake?* или *How about the lake?*


    **Разбор:** *How about the lake?* (или *How about going…?*) — после about не ставят голый глагол.

    '
- number: 5
  body: 'Так говорят американцы:


    - **Maybe next time.** — может, в другой раз.

    - **It''s freezing!** — жуткий холод!

    - **That''s cool!** — классно! (cool — и «прохладный», и «классный»).


    Слова: **instead** — вместо этого, **hike** — ходить в поход, **ride — rode** — ездить, **cloud** — облако, **storm** — гроза, **mountain** — гора, **hill** — холм, **forecast** — прогноз, **degree** — градус, **boots** — ботинки, **sunglasses** — солнечные очки, **rainy, foggy, cool, freezing, bright**.

    '
- number: 6
  body: 'Ловушки:


    - «How is the weather like?» — либо **How is the weather?**, либо **What''s the weather like?**

    - «How about go…?» — **How about going…?**

    - **Instead** возможно и в начале, и в конце предложения. Здесь удобно закончить им предложение: Let''s go to the lake instead. Не путайте его с **instead of + существительное / -ing** — «вместо чего-то».

    - 40 degrees в США — это холодно (около +4 °C)!

    '
- number: 7
  body: 'Шесть заданий: спросить о погоде, понять градусы, предложить другой план, описать погоду у себя, выбрать How about и сказать «пошли».


    **Проверка маленького шага:** What''s the weather like? — How about…? — …instead. — Let''s go!

    '
