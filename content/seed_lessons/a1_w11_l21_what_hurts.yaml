  - full: "does not"
    short: "doesn't"
    ipa: "/ˈdʌzənt/"
    note_ru: "It doesn't hurt — «Не болит»."
layers:
  - number: 1
    body: |
      Том не спит, у него болит голова и спина. Объяснить врачу, что болит, — один из самых важных разговоров в другой стране. В этом уроке вы освоите несколько коротких фраз, чтобы назвать боль и часть тела.

      У врача главное — объяснить, что болит. По-английски для этого два способа.

      > [T8]I[/] [D3]feel[/] [J4]sick[/] [C1]and[/] [J4]tired[/]. [T8]I[/] [D1]have[/] [T1]a[/] [S5]headache[/]. — Мне нехорошо, и я устал. У меня болит голова.
      > [O4]No[/], [T8]it[/] [D1]does[/] [X1]not[/]. [C5]But[/] [T3]my[/] [S5]back[/] [D3]hurts[/], [C1]and[/] [T8]I[/] [D7]ca[/][X1]n't[/] [D2]sleep[/]. — Нет. Но болит спина, и я не могу спать.

      Можно сообщить о недомогании двумя знакомыми способами: *I have a headache* — «У меня болит голова»; *my back hurts* — «У меня болит спина». Во втором случае сначала называем часть тела, затем говорим, что она болит. Не переводите **have** здесь как буквальное «владеть болью»: учите фразы целиком.

      **Готовый кусочек из разговора:** *I cannot sleep* — «Я не могу спать». Умение и возможность с **can** вам уже знакомы, а его **отрицательную форму cannot / can't** подробно разберём **в следующем уроке**. Пока не нужно самому строить новые отрицания с can.
  - number: 2
    body: |
      Одну жалобу можно выразить двумя способами:

      **I have a headache.** — У меня болит голова. После **have** называем недомогание: **a headache**.
      **My head hurts.** — У меня болит голова. Теперь сначала называем часть тела — **my head**, затем говорим, что она болит: **hurts**. Смысл тот же, а устройство фразы другое.

      Для спины используйте **My back hurts**. Не соединяйте половины двух схем: *I have back hurts* не подходит. Слово **my** показывает, чья часть тела болит, а **hurts** — уже глагол в Present Simple. Он описывает боль, а не обязательно действие. Дополнительное is перед ним не нужно: **My back hurts**, не *My back is hurts*.

      Сравните число: **My foot hurts. → My feet hurt.** Одна ступня — **foot**, поэтому **hurts**; несколько — **feet**, поэтому **hurt**. В вопросе **Does your head hurt?** форму для одной части тела уже показывает does, и дальше **hurt** без -s.

      Эти примеры помогают сообщить, что болит. Они не заменяют слов для подробного рассказа о симптомах или общения со специалистом.
  - number: 3
    body: |
      Две схемы:

      > [T8]I[/] [D1]have[/] [T1]a[/] [S5]headache[/]. — У меня болит голова.
      > [T3]My[/] [S5]back[/] [D3]hurts[/]. — У меня болит спина.

      - **I have + название недомогания**: *I have a headache*, *I have a stomachache*. С этими двумя словами нужен **a**. Другой образец с **pain** сравним ниже.
      - **My + часть тела + hurts**: *my head hurts*, *my back hurts*.
      - Одна спина или ступня — **hurts**, с **-s**. Несколько частей тела — **hurt**, без **-s**: *my feet hurt*.
      - Вопрос: *Does your head hurt?* После **does** используем **hurt** без **-s**.

      **Назвать часть тела.** Body — тело; face — лицо. На лице: eye — глаз, ear — ухо, nose — нос, mouth — рот, tooth — зуб. Neck — шея; arm — рука от плеча, hand — кисть, finger — палец руки; leg — нога, foot — ступня.

      > [T3]My[/] [S5]hand[/] [D3]hurts[/]. — У меня болит кисть руки.
      > [T3]My[/] [S5]neck[/] [D3]hurts[/]. — У меня болит шея.

      Когда частей тела несколько, у знакомых слов обычно появляется **-s**: *eyes, ears, arms, hands, fingers, legs*. У двух слов вид меняется по-особому: **tooth → teeth**, **foot → feet**.

      > [T3]My[/] [S5]feet[/] [D3]hurt[/]. — У меня болят ступни.
      > [T3]My[/] [S5]teeth[/] [D3]hurt[/]. — У меня болят зубы.

      Одна часть — hurts, несколько — hurt. Сравните my foot hurts и my feet hurt. Pain — боль вообще; в этой конструкции без a:

      > [T8]I[/] [D1]have[/] [S5]pain[/] [P1]in[/] [T3]my[/] [S5]leg[/]. — У меня боль в ноге.

      У headache другая привычная модель: a headache. Не переносите a автоматически на pain.
  - number: 4
    body: |
      **Почему My back hurts?** Сначала называем, что болит: **my back** — «моя спина». Потом **hurts** сообщает, что с ней происходит. В русском ту же мысль обычно выражаем иначе: «У меня болит спина». Переводите всю мысль, а не порядок русских слов.

      > [D1]Does[/] [T3]your[/] [S5]head[/] [D3]hurt[/] [T5]every[/] [S7]day[/]? — Голова болит каждый день?

      *I have hurt back* **не выражает** обычное «У меня болит спина». Используйте *My back hurts* или другую подходящую конструкцию. Но **hurt** может также означать «причинять боль / травмировать», поэтому не запоминайте правило «hurt всегда употребляется только с частью тела».

      **Диагностика понимания:** Вы говорите о **спине** — одной части тела — в настоящем времени. Что верно: *My back hurts* или *My back hurt*?

      **Разбор:** *My back hurts*. В обычном **Present Simple** с **my back** (одна часть тела) нужна форма с **-s**. Без окончания *hurt* может встречаться в других грамматических ситуациях, но **не передаёт нужную форму этого учебного утверждения**.
  - number: 5
    body: |
      Так проходит приём у американского врача:

      > [J3]Good[/] [S7]morning[/], [S1]Tom[/]. [A6]How[/] [D1]are[/] [T8]you[/]? — Доброе утро, Том. Как вы себя чувствуете?
      > [T8]I[/] [D3]feel[/] [J4]sick[/] [C1]and[/] [J4]tired[/]. [T8]I[/] [D1]have[/] [T1]a[/] [S5]headache[/]. — Мне нехорошо, и я устал. У меня болит голова.

      - **How are you?** часто служит приветствием, но в медицинском разговоре тоже может быть настоящим вопросом о самочувствии. Ответ зависит от ситуации: не требуется автоматически отвечать *Fine, thanks!*.
      - Врача называют doctor: Thank you, doctor!
      - В экстренном случае в США звонят 911 — «найн-уан-уан».
  - number: 6
    body: |
      Ловушки:

      - Для обычной жалобы «Болит голова» выбираем *My head hurts*. *My head is hurt* имеет **другое возможное значение** (повреждена голова) и не является нейтральной заменой.
      - «I have headache» — нужно a: I have a headache.
      - После my не ставят a: My neck hurts, а не «My a neck hurts».

      Если не знаете слово, покажите рукой и скажите: It hurts here — «Болит здесь».
  - number: 7
    body: |
      Шесть заданий: понять жалобу, выбрать hurts или headache, собрать фразу и объяснить врачу в новой ситуации; различить foot / feet и назвать боль в другой части тела.

      **Проверка маленького шага:** *My foot hurts* — болит **одна ступня**; *My feet hurt* — болят **ступни**. Обратите внимание на обе пары: **foot → feet** и **hurts → hurt**.
