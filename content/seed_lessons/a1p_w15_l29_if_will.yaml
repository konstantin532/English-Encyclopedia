layers:
- number: 1
  body: 'Анна и Том собираются к океану. Погода неизвестна, поэтому у них два плана — на дождь и на солнце. Для этого нужны **if** и **will**.


    > [C4]If[/] [T8]it[/] [D2]rains[/], [T8]we[/] [D7]will[/] [D2]stay[/] [P1]in[/] [T1]the[/] [S4]cabin[/] [C1]and[/] [D2]read[/] [S2]books[/]. — Если пойдёт дождь, будем сидеть в домике и читать.

    > [O3]Oh[/], [C1]and[/] [C4]if[/] [T8]it[/] [D1]is[/] [J2]sunny[/], [T8]we[/] [D7]will[/] [D4]go[/] [P2]to[/] [T1]the[/] [S6]beach[/] [T5]every[/] [S7]day[/]! — О, а если будет солнце, будем каждый день ходить на пляж!

    '
- number: 2
  body: '**Will** помогает выразить прогноз, обещание или решение о будущем: *I will go* — «Я пойду». Это не то же самое, что **I want to go** — «Я хочу пойти»: желание и решение могут различаться. В этом уроке will показывает ожидаемый результат условия: если пойдёт дождь, мы останемся дома. В разговоре will часто сокращается: **I''ll, we''ll, it''ll**. Полная форма тоже естественна, например при подчёркивании решения или уверенности.

    '
- number: 3
  body: 'Схема:


    > [T3]My[/] [S2]suitcase[/] [D1]is[/] [A5]too[/] [J2]heavy[/]. [C4]If[/] [T8]I[/] [D2]put[/] [T4]more[/] [P1]in[/] [T8]it[/], [T8]it[/] [D7]will[/] [D2]break[/]! — Чемодан слишком тяжёлый. Если положу ещё, он сломается!


    - **If + настоящее время, … will + глагол.**

    - If it **rains**, we **will stay**. (не «If it will rain»)

    - Можно наоборот: **We''ll stay in the cabin if it rains.** (без запятой)

    - Вопрос о проблеме: **What if…?** — а что, если…?

    - Уверенность: **will definitely** — точно, **will probably** — наверное.

    - Отрицание: **will not / won''t + глагол**. Вопрос: **Will you + глагол…?** После will не добавляют to или -s.

    '
- number: 4
  body: '**Почему «If it rains», а не «If it will rain»?** В этой конструкции о возможном будущем в части с **if** используем Present Simple, а в главной части — **will + основная форма**. Форма *rains* настоящая, но значение условия здесь будущее. Это не универсальный запрет will после if: другие значения и конструкции будут позже. По-русски «если пойдёт дождь» — будущее, а по-английски — *if it rains*.


    > [C4]If[/] [T1]the[/] [S2]guitar[/] [D2]stays[/] [A3]here[/], [S1]Leo[/] [D7]will[/] [D1]be[/] [A5]very[/] [J4]happy[/]! — Если гитара останется дома, Лео будет очень рад!


    **Диагностика понимания:** что верно: *If it will be sunny, we go to the beach* или *If it is sunny, we will go to the beach*?


    **Разбор:** *If it is sunny, we will go…* — после if настоящее, will — во второй части.

    '
- number: 5
  body: 'Так говорят американцы:


    - **We''ll see.** — посмотрим.

    - **What if it rains?** — а если дождь?

    - **I''ll probably…** — я, наверное…


    Слова: **will**, **probably** — вероятно, **definitely** — точно.

    '
- number: 6
  body: 'Ловушки:


    - «If it will rain» — **If it rains**.

    - «we will to go» — после will без to: **we will go**.

    - **I''ll probably go** — удобный нейтральный порядок. **I probably will go** тоже возможно; это не грамматическая ошибка. В коротком ответе естественно **I probably will**.

    - запятая: If…, we''ll… — с запятой; We''ll… if… — без.

    '
- number: 7
  body: 'Шесть заданий: выбрать правильное if, поставить will, собрать условие, сказать свой план на дождь, найти ошибку и спросить What if…?


    **Проверка маленького шага:** If + настоящее, will + глагол. В речи — we''ll, I''ll.

    '
