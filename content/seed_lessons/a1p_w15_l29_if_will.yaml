title: 'If it rains, we''ll…: условие и будущее'
summary: 'Как сказать о плане при условии: If it rains, we will stay in the cabin. После if — настоящее время, во второй части — will (сокращённо ''ll). Вопрос What if…? и слова probably, definitely.'
