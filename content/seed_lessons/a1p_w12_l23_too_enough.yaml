layers:
- number: 1
  body: 'Том зовёт Анну в горы, но холодно, а куртка не греет. Чтобы сказать «слишком» и «недостаточно», нужны **too** и **enough** — и важно, где они стоят.


    > [N9]Forty[/] [N9]degrees[/]? [T2]That[/] [D1]is[/] [A5]too[/] [J2]cold[/] [P5]for[/] [T1]the[/] [S6]mountains[/]. [T8]I[/] [D1]was[/] [J4]sick[/] [T2]this[/] [S7]week[/]. — Сорок по Фаренгейту? Для гор слишком холодно. Я на этой неделе болела.

    > [C1]And[/] [T3]my[/] [J2]old[/] [J2]blue[/] [S2]jacket[/] [D1]is[/] [X1]not[/] [J2]warm[/] [A5]enough[/]. — И моя старая синяя куртка недостаточно тёплая.

    '
- number: 2
  body: '**Too** — то же слово, что «тоже» в *Me too*: когда-то оно значило «вдобавок, сверх того». «Сверх нужного» — отсюда «слишком». **Enough** — древнее *genoh*, «достаточно, вдоволь»; gh в конце раньше читался как «х», а потом превратился в «ф».

    '
- number: 3
  body: 'Схема:


    > [J3]Great[/]! [T8]I[/] [D7]can[/] [D2]wear[/] [T3]my[/] [J1]long[/] [J2]gray[/] [S2]coat[/] [C1]and[/] [T3]my[/] [J2]new[/] [S2]boots[/]. — Отлично! Надену длинное серое пальто и новые ботинки.


    - **too + прилагательное** — слишком: too cold, too far.

    - **прилагательное + enough** — достаточно: warm enough, big enough.

    - С not: **not warm enough** — недостаточно тёплый.

    - Два прилагательных: сначала **мнение**, потом **размер**, **возраст**, **цвет**: a lovely big old blue house.

    - На практике: **long gray coat**, **old blue jacket**, **big dark clouds**.

    '
- number: 4
  body: '**Почему «warm enough», а не «enough warm»?** С прилагательными enough всегда ставят **после**. А с существительными — **перед**: *enough money, enough time*.


    **too — не «очень».** *very cold* — очень холодно (но, может, и нормально). *too cold* — холоднее, чем нужно для конкретной цели: например, для нашей прогулки. Это оценка ситуации, а не обязательно запрет или опасность.


    **Диагностика понимания:** что верно: *a blue old jacket* или *an old blue jacket*?


    **Разбор:** *an old blue jacket.* Возраст перед цветом.

    '
- number: 5
  body: 'Так говорят американцы:


    - **It''s too far.** — слишком далеко.

    - **It''s not big enough.** — маловато.

    - **That''s too bad.** — жаль.


    Слова: **enough**; размер и форма: **tall** — высокий, **huge** — огромный, **tiny** — крошечный, **far** — далёкий, **wide** — широкий, **narrow** — узкий, **deep** — глубокий; оценка: **lovely** — чудесный, **awful** — ужасный.

    '
- number: 6
  body: 'Ловушки:


    - «enough warm» — **warm enough**.

    - «too much cold» — **too cold** (much — с существительными: too much rain).

    - «a blue big umbrella» — **a big blue umbrella**: размер перед цветом.

    - **Very cold** сообщает о сильном холоде; **too cold** — что холод превышает подходящий предел. О проблеме можно сказать и very cold, но само **very** не передаёт значение «слишком».

    '
- number: 7
  body: 'Шесть заданий: выбрать too или very, поставить enough, собрать прилагательные по порядку, описать свою вещь, найти ошибку и сказать «слишком далеко».


    **Проверка маленького шага:** too cold — слишком; warm enough — достаточно; размер → возраст → цвет.

    '
