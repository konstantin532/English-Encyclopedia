layers:
- number: 1
  body: 'Когда дома что-то сломалось, нужно быстро и понятно сказать, что и где. Мастер спрашивает, вы отвечаете.


    > [J3]Good[/] [S7]morning[/]. [T1]The[/] [S1]landlord[/] [D5]called[/] [T8]me[/]. [T9]What[/] [D1]is[/] [J3]wrong[/]? — Доброе утро. Мне позвонил хозяин. Что случилось?

    > [T1]The[/] [S2]pipe[/] [P1]under[/] [T1]the[/] [S2]sink[/] [D1]is[/] [D2]leaking[/]. [T8]It[/] [D1]is[/] [T1]an[/] [S10]emergency[/]! — Под раковиной течёт труба. Это срочно!

    '
- number: 2
  body: '**Plumber** — от латинского *plumbum*, «свинец»: в Древнем Риме трубы делали из свинца. **Faucet** пришло из французского и значило «затычка для бочки». В Британии кран называют **tap**, а в США — **faucet**.

    '
- number: 3
  body: 'Схема:


    > [J3]Great[/]! [C1]And[/] [T1]the[/] [S2]light[/] [P1]in[/] [T1]the[/] [S2]bathroom[/] [D1]does[/] [X1]not[/] [D2]work[/]. — Отлично! А ещё в ванной не горит свет.


    - Что течёт: **The pipe / faucet is leaking.**

    - Что не работает: **The heater / light does not work.**

    - Что сломано: **The toilet is broken.**

    - Где: **under the sink, in the bathroom, near the door**.

    - Срочно: **It''s an emergency! Turn off the water!**

    '
- number: 4
  body: '**Doesn''t work или isn''t working?** Обе формы подходят для сообщения о неисправности. **It doesn''t work** описывает, как устройство работает вообще; **it isn''t working** выделяет нынешнюю ситуацию. Но это не граница между «навсегда сломано» и «скоро заработает»: ни одна форма сама по себе не сообщает, насколько серьёзна поломка. Смотрите на ситуацию и пояснения собеседника.


    **on / off.** **Turn on** — включить, **turn off** — выключить: turn on the light, turn off the water.


    **Диагностика понимания:** как сказать «Перекрой воду!»: *Turn on the water!* или *Turn off the water!*?


    **Разбор:** *Turn off the water!* — off значит «выключить».

    '
- number: 5
  body: 'Так говорят американцы:


    - **What''s wrong?** — что случилось?

    - **The kitchen is a mess!** — на кухне бардак!

    - **That''s fine.** — ничего страшного.


    Слова: **sink** — раковина, **faucet** — кран, **pipe** — труба, **toilet** — унитаз, **heater** — обогреватель, **switch** — выключатель, **bulb** — лампочка, **tool** — инструмент, **hammer** — молоток, **bucket** — ведро, **lock** — замок, **ceiling** — потолок, **building** — здание, **elevator** — лифт, **dirty** — грязный.

    '
- number: 6
  body: 'Ловушки:


    - **The water is flowing** — вода течёт, например из открытого крана. **The pipe is leaking** — труба протекает: вода выходит там, где не должна. Первое предложение грамматически верно, но не называет протечку.

    - «Turn out the light» тоже бывает, но проще **turn off**.

    - «lift» — британское; в США **elevator**.

    - wrong: w не читается — «рон».

    '
- number: 7
  body: 'Шесть заданий: назвать поломку, сказать «выключи», собрать фразу о трубе, позвонить мастеру по новой поломке, выбрать слово и сказать «ничего страшного».


    **Проверка маленького шага:** что + is leaking / doesn''t work / is broken; turn on / turn off.

    '
