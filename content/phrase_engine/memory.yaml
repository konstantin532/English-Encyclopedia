# Настройки модуля «Память слов» (вариант B: рейтинг = вероятность вспомнить).
# Все числа — стартовые значения из симуляции 27.10.2026, а не измеренные на учениках.
# Меняются здесь, без правки кода. version увеличивать при изменении правил:
# по ней видно, по каким правилам считался рейтинг.
version: 1

# Рейтинг = 100% × 0.9 ^ (дней с последнего ответа / прочность).
# Прочность в днях — срок, за который слово опускается до 90%.
start_stability_days: 1.0
min_stability_days: 0.5

# Стадии: [нижняя граница рейтинга, шанс попасть во фразу, название для ученика]
stages:
  - [0, 90, "Почти забыто"]
  - [20, 85, "Забывается"]
  - [30, 80, "Слабое"]
  - [40, 70, "Неустойчивое"]
  - [50, 60, "Знакомое"]
  - [60, 45, "Почти знаю"]
  - [70, 30, "Знаю"]
  - [80, 15, "Хорошо знаю"]
  - [90, 10, "Прочно"]
  - [95, 5, "Закреплено"]

# Подписи ступеней прочности (дней до 90%): 0 → 1 день … 8 → 1 год
strength_steps_days: [1, 3, 7, 14, 30, 60, 120, 240, 365]

# Верный ответ: прочность × (1 + k × √(1 − R)), R — рейтинг перед ответом (0…1).
# Растёт не чаще раза в календарный день.
growth_k:
  full: 1.0          # с полной подсказкой
  partial: 2.0       # с частичной подсказкой (упражнение урока с вариантами)
  independent: 4.7   # самостоятельно
  transfer: 5.5      # в другом семействе фраз

# Ошибка: прочность × множитель
error_multiplier:
  typo: 0.95
  form: 0.85
  wrong: 0.5
  dontknow: 0.5

# До 80% и выше — только при верных ответах в 3 разных днях и 2 разных семействах
mastery:
  threshold: 80
  days: 3
  families: 2

# Подпись для ученика не выше, чем позволяет число дней с верными ответами:
# сразу после ответа вероятность вспомнить почти 100%, но «Знаю» после одного дня — неправда.
# На выбор фраз не влияет (расписание — по рейтингу).
display_cap_by_days:
  1: 49
  2: 69

# После 3 ошибок подряд — 2 следующие фразы с этим словом идут с подсказкой
hint_after_errors: 3
hint_phrases: 2

# Тренировка
session:
  min_phrases: 20
  max_phrases: 80
  words_per_phrase: 3      # целевое + 2 знакомых
  due_below: 90            # слово «пора повторить», если рейтинг ниже
  share_low: 0.65          # доля фраз со словами ниже 80%
  share_mid: 0.25          # доля фраз со словами 80–94%
  per_word_max: 4          # одно слово — не больше 4 раз за тренировку
  urgent_below: 40         # ниже 40% дольше 3 дней — обязательно в ближайшую тренировку
  urgent_days: 3
  familiar_from: 50        # «знакомое» слово для фразы — рейтинг от 50%

# Переопределения для уровня (ключ — код уровня из apps/curriculum/registry.py).
# Уровень без записи использует общие значения. Пример:
#   B1:
#     session: {max_phrases: 90}
levels: {}
