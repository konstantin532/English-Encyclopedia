# Быстрые проверки перед каждым коммитом. Включить один раз: uv run pre-commit install
# Ruff берётся из окружения проекта (uv.lock), поэтому версия та же, что в CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (линтер)
        entry: uv run --no-sync ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format (старые файлы из списка в pyproject.toml не трогает)
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(pnpm-lock\.yaml|\.agents/|\.claude/)
      - id: check-toml
      - id: check-json
        exclude: ^(\.devcontainer/devcontainer\.json)$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: mixed-line-ending
        args: [--fix=no]
        # Старые файлы со смешанными окончаниями: правка целиком переписала бы файл. Список только
        # сокращается (tests/test_tooling.py); исправленный файл убери отсюда.
        exclude: ^(apps/curriculum/views\.py|apps/lessons/views\.py|templates/components/week_hero\.html|templates/curriculum/week\.html|templates/lessons/detail\.html|tests/test_a1_learning_route\.py)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
