[tool.mypy]
# Проверка типов. Запуск: uv run mypy
python_version = "3.12"
files = ["apps", "config"]
exclude = ["/migrations/"]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
# Модули с ошибками типов на момент подключения mypy (2026-10-31). Список можно только
# сокращать (tests/test_tooling.py): исправил типы в модуле — убери его отсюда.
module = [
    "apps.accounts.data_rights",
    "apps.accounts.models",
    "apps.core.access",
    "apps.core.cafe_lab",
    "apps.core.management.commands.load_content",
    "apps.learning.phrase_engine.engine",
    "apps.learning.phrase_engine.lexicon",
    "apps.learning.phrase_engine.spoken",
    "apps.learning.services",
    "apps.learning.trainer_content",
    "apps.publishing.audit",
    "apps.taxonomy.markup",
    "apps.teaching.review",
    "config.settings.production",
    "scripts.audio_readiness",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.uv]
package = false
