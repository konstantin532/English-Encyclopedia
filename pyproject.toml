[project]
name = "english-encyclopedia"
version = "0.1.0"
description = "English Encyclopedia — интерактивная энциклопедия и курс американского английского A0–B2+"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<6",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "whitenoise>=6.9",
    "python-dotenv>=1.0",
    "django-axes>=8.3.1",
    "django-csp>=4,<5",
    "sentry-sdk[django]>=2.40",
    "posthog>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "numpy>=1.26",  # тесты генератора озвучки
    "tblib>=3.0",  # --parallel: передаёт подробности упавшего теста из параллельного процесса
    "ruff>=0.14",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "pre-commit>=4.3",
    "types-pyyaml>=6.0",
]

audio = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "apps"]
markers = ["slow: long-running course integration or smoke check"]

[tool.ruff]
# Линтер и форматтер. Запуск: uv run ruff check . && uv run ruff format --check .
target-version = "py312"
line-length = 120
extend-exclude = [
    ".agents", ".claude", "docs", "graphify-out", "Lib", "models", "node_modules", "media", "static", "staticfiles",
]

[tool.ruff.lint]
# Правила, которые ловят настоящие ошибки: синтаксис, неопределённые и неиспользуемые имена,
# опасные значения по умолчанию. Стилистику (длина строк, порядок импортов) не включаем:
# её исправление переписало бы сотни файлов.
select = ["E9", "F", "B006", "B012", "B018", "W605"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.format]
# Файлы, написанные до появления форматтера. Список можно только сокращать
# (tests/test_tooling.py): отформатировал файл целиком — убери его отсюда.
