[project]
name = "english-encyclopedia"
version = "0.1.0"
description = "English Encyclopedia — интерактивная энциклопедия и курс американского английского A0–B2+"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<6",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "whitenoise>=6.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

audio = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests", "apps"]

[tool.uv]
package = false
